<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WFM Tycoon - Monday Jeffrey</title>
  <link rel="stylesheet" href="../assets/win95.css">
  <style>
    .window { width: 820px; max-width: 96vw; }
    .wfm-body { padding: 8px; background: #c0c0c0; }

    /* ---------- HUD ---------- */
    .hud {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr 1fr 1.6fr;
      gap: 4px;
      margin-bottom: 8px;
    }
    .hud-cell {
      background: #c0c0c0;
      border-top: 2px solid #404040;
      border-left: 2px solid #404040;
      border-bottom: 2px solid #ffffff;
      border-right: 2px solid #ffffff;
      padding: 4px 6px;
    }
    .hud-cell .k { font-size: 10px; color: #000080; text-transform: uppercase; letter-spacing: .5px; }
    .hud-cell .v { font-size: 16px; font-weight: bold; }
    .hud-cell .v.sla { font-size: 22px; }
    .hud-sub { font-size: 10px; color: #404040; }
    .trust-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; }
    .trust-row { display: flex; align-items: center; gap: 4px; font-size: 10px; }
    .trust-row .tl { width: 46px; }
    .meter { flex: 1; height: 9px; background: #fff; border-top: 1px solid #404040; border-left: 1px solid #404040; border-bottom: 1px solid #fff; border-right: 1px solid #fff; position: relative; }
    .meter > i { position: absolute; left: 0; top: 0; bottom: 0; display: block; background: #000080; }
    .meter.eng > i { background: #008000; }
    .meter.bad > i { background: #a80000; }
    .meter.warn > i { background: #b8860b; }

    /* ---------- generic screen ---------- */
    .screen { background: #c0c0c0; }
    .panel {
      background: #c0c0c0;
      border-top: 2px solid #ffffff; border-left: 2px solid #ffffff;
      border-bottom: 2px solid #404040; border-right: 2px solid #404040;
      padding: 10px; margin-bottom: 8px;
    }
    .panel h3 { font-size: 13px; margin-bottom: 6px; border-bottom: 1px solid #808080; padding-bottom: 3px; }
    .panel h4 { font-size: 12px; margin: 8px 0 4px; }
    .muted { color: #404040; }
    .small { font-size: 11px; }
    .center { text-align: center; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .spacer { flex: 1; }
    .pill { display: inline-block; padding: 1px 6px; border:1px solid #808080; background:#fff; font-size:11px; }
    .good { color: #006400; font-weight: bold; }
    .bad  { color: #a80000; font-weight: bold; }
    .warn { color: #8a6d00; font-weight: bold; }

    /* advisor / clippy */
    .advisor {
      display: flex; gap: 8px; align-items: flex-start;
      background: #ffffe1; border: 1px solid #000; padding: 8px; margin-bottom: 8px; font-size: 11px;
    }
    .advisor .face { font-size: 22px; line-height: 1; }

    /* options (meeting) */
    .opt { display: block; padding: 5px 8px; margin: 3px 0; background:#fff;
      border-top: 1px solid #404040; border-left: 1px solid #404040; border-bottom: 1px solid #fff; border-right: 1px solid #fff;
      cursor: pointer; font-size: 11px; }
    .opt input { margin-right: 6px; }
    .opt.disabled { color:#808080; cursor: not-allowed; background:#d8d8d8; }
    .cost { font-size:10px; color:#404040; }
    .fx-reveal { margin-top: 6px; padding: 5px 8px; background: #e8e8ff; border: 1px solid #000080; font-size: 11px; min-height: 1.5em; }

    /* tables */
    table.grid { width: 100%; border-collapse: collapse; font-size: 11px; }
    table.grid th, table.grid td { border: 1px solid #808080; padding: 3px 5px; text-align: center; }
    table.grid th { background: #000080; color:#fff; font-weight: bold; }
    table.grid td.day { text-align: left; white-space: nowrap; }
    table.grid tr.hol td { background: #fff3d6; }
    table.grid tr.avg td { background: #e0e0e0; font-style: italic; }
    table.grid tr.cul td { background: #ffd6d6; }
    .num-in { width: 46px; font-size: 12px; text-align: center; font-family: Arial; }
    .fc-in { width: 90px; font-size: 15px; text-align: center; font-family: Arial; font-weight: bold; }
    .cov { height: 12px; background:#fff; border:1px solid #808080; position: relative; min-width: 70px; }
    .cov > i { position:absolute; left:0; top:0; bottom:0; background:#008000; }
    .cov.under > i { background:#a80000; }
    .cov .lab { position: relative; z-index: 2; font-size: 9px; line-height: 12px; }

    .kpi-strip { display:flex; gap:6px; flex-wrap: wrap; }
    .kpi { flex:1; min-width: 96px; background:#fff; border-top:2px solid #404040;border-left:2px solid #404040;border-bottom:2px solid #fff;border-right:2px solid #fff; padding:6px; text-align:center; }
    .kpi .k { font-size:10px; color:#000080; text-transform:uppercase; }
    .kpi .v { font-size:18px; font-weight:bold; }

    .log { font-size:11px; line-height:1.55; }
    .log .li { padding:2px 0; border-bottom:1px dotted #aaa; }
    .delta-up { color:#006400; } .delta-dn { color:#a80000; }

    .big-btn { min-width: 200px; padding: 8px 16px; font-weight: bold; }

    @media (max-width: 760px){
      .hud { grid-template-columns: 1fr 1fr; }
      .hud-cell.trust { grid-column: span 2; }
    }
  </style>
</head>
<body>
  <div class="desktop"></div>

  <div class="window" data-title="WFM Tycoon" data-icon="📞" data-close-href="../index.html">
    <div class="title-bar">
      <div class="title-bar-text">
        <span>📞</span><span>WFM Tycoon — Service Level 80</span>
      </div>
      <div class="title-bar-buttons">
        <div class="title-btn minimize">_</div>
        <div class="title-btn maximize">□</div>
        <div class="title-btn close">×</div>
      </div>
    </div>

    <div class="menu-bar">
      <div class="menu-item" id="m-new"><u>N</u>ew Game</div>
      <div class="menu-item" id="m-help"><u>H</u>ow to Play</div>
      <div class="menu-item" id="m-about">About</div>
    </div>

    <div class="wfm-body">
      <div class="hud" id="hud"></div>
      <div class="screen" id="screen"></div>
    </div>

    <div class="status-bar">
      <div class="status-cell" id="status-left">Ready.</div>
      <div class="status-cell" id="status-right">WFM Tycoon</div>
    </div>
  </div>

  <!-- Win95 dialog -->
  <div id="dlg" style="position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;align-items:center;justify-content:center;z-index:3000;">
    <div style="background:#c0c0c0;border-top:2px solid #fff;border-left:2px solid #fff;border-bottom:2px solid #404040;border-right:2px solid #404040;min-width:320px;max-width:460px;box-shadow:2px 2px 0 #000;">
      <div id="dlg-title" style="background:linear-gradient(90deg,#000080,#1084d0);color:#fff;padding:3px 6px;font-weight:bold;">Message</div>
      <div id="dlg-body" style="padding:14px;font-size:12px;line-height:1.5;max-height:60vh;overflow:auto;"></div>
      <div id="dlg-actions" style="padding:6px 14px 14px;display:flex;justify-content:center;gap:8px;"></div>
    </div>
  </div>

  <div class="taskbar">
    <a href="../index.html" class="start-btn"><span>⊞</span> Start</a>
    <div class="taskbar-divider"></div>
    <div class="taskbar-apps"></div>
    <div class="clock"></div>
  </div>

  <script src="../assets/win95.js"></script>
  <script>
  (function () {
    'use strict';

    /* =======================================================================
       CONFIG — the iteration knobs. Tweak these to rebalance the game.
       ======================================================================= */
    var CFG = {
      WEEKS: 52,
      SLA_TARGET: 0.80,
      SLA_T: 20,
      OPEN_SECONDS: 10 * 3600,
      BASE_CALLS: 3000,          // baseline Wed weekday daily calls
      AHT: 300,

      START_HC: 44,
      START_BUDGET: 120000,
      DAY_COST: 240,
      OT_MULT: 1.5,
      OT_CAP_FRAC: 0.15,

      HIRE_COHORT: 4,
      HIRE_COST_EACH: 1500,
      TRAIN_WEEKS: 4,
      TRAINEE_WK_COST: 1200,

      WEEK_REVENUE: 58000,
      PENALTY_SCALE: 180000,
      BONUS_SCALE: 90000,
      BONUS_CAP: 6000,

      BASE_SHRINK: 0.18,
      COACH_SHRINK: 0.04,
      TRAIN_SHRINK: 0.06,
      BASE_ABSENCE: 0.05,
      WINTER_ABSENCE: 0.02,
      HOLIDAY_ABSENCE: 0.04,

      DODGY_START: 0.10,
      DODGY_AHT_MAX: 0.30,
      DODGY_AVAIL_MAX: 0.10,

      CAPITAL: 3,
      ENG_START: 70,

      BANKRUPT: -60000,
      CLIENT_FLOOR: 8,
      MIN_HC: 22,

      // Mon–Fri only (business closed weekends). Volume multiplier per weekday.
      DOW: [1.15, 1.05, 1.00, 0.95, 0.90],
      HOLIDAY_VOL: 0.40,
      HOLIDAY_PAY: 2.0,

      // 52 weekly seasonal volume multipliers (Week 1 = early Jul). AU-shaped.
      SEASON: [
        1.00,1.00,1.01,1.02, 1.02,1.03,1.03,1.04,1.05,
        1.06,1.07,1.08,1.08,
        1.09,1.10,1.10,1.11,
        1.13,1.16,1.20,1.25,
        1.30,1.36,1.30,0.80,
        0.72,0.78,
        1.26,1.22,1.14,
        1.08,1.07,1.06,1.06,
        1.05,1.05,1.04,1.03,1.02,
        1.00,0.98,1.00,1.02,
        1.04,1.05,1.06,1.07,
        1.08,1.10,1.12,1.12,1.10
      ]
    };

    // AU public holidays across FY 2026/27 (national + widely-observed weekday dates).
    var HOLIDAYS = {
      '2026-10-05': 'Labour Day',
      '2026-11-03': 'Melbourne Cup',
      '2026-12-25': 'Christmas Day',
      '2026-12-28': 'Boxing Day (obs.)',
      '2027-01-01': "New Year's Day",
      '2027-01-26': 'Australia Day',
      '2027-03-26': 'Good Friday',
      '2027-03-29': 'Easter Monday',
      '2027-04-26': 'Anzac Day (obs.)',
      '2027-06-14': "King's Birthday"
    };

    var START = new Date(2026, 6, 6); // Mon 6 Jul 2026 (FY 2026/27)
    var DOW = ['Mon','Tue','Wed','Thu','Fri']; // operating days
    var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var AGENT_NAMES = ['Jess R.','Tom H.','Aisha K.','Dylan P.','Mia L.','Sam O.','Priya N.','Jake W.','Chloe T.','Ben F.','Zara M.','Lucas D.','Noah B.','Ava S.','Ethan C.','Ruby G.'];
    var SAVE_KEY = 'wfm_tycoon_save_v2';

    /* =======================================================================
       SMALL HELPERS
       ======================================================================= */
    function $(id) { return document.getElementById(id); }
    function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }
    function pad(n) { return String(n).padStart(2, '0'); }
    function r1(x) { return Math.round(x * 10) / 10; }
    function pct(x) { return Math.round(x * 100) + '%'; }
    function pct1(x) { return (x * 100).toFixed(1) + '%'; }
    function money(x) { return (x < 0 ? '-$' : '$') + Math.abs(Math.round(x)).toLocaleString(); }
    function rand(a, b) { return a + Math.random() * (b - a); }
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function sum(arr) { return arr.reduce(function (a, b) { return a + b; }, 0); }
    function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
    function NDAYS() { return CFG.DOW.length; }
    function weekdaySum() { return sum(CFG.DOW); }
    function dowShare(day) { return CFG.DOW[day] / weekdaySum(); }

    function dateFor(week, day) { var d = new Date(START); d.setDate(d.getDate() + week * 7 + day); return d; }
    function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
    function fmtDate(d) { return d.getDate() + ' ' + MONTHS[d.getMonth()]; }
    function holidayOn(d) { return HOLIDAYS[iso(d)] || null; }
    function monthOfWeek(week) { return dateFor(week, 2).getMonth(); }
    function weekHasHoliday(week) { for (var i = 0; i < NDAYS(); i++) if (holidayOn(dateFor(week, i))) return true; return false; }
    function shortWeek(week) { return fmtDate(dateFor(week, 0)); }
    function weekLabel(week) {
      var a = dateFor(week, 0), b = dateFor(week, NDAYS() - 1);
      return fmtDate(a) + ' – ' + fmtDate(b) + ' ' + b.getFullYear();
    }

    /* =======================================================================
       ERLANG C ENGINE
       ======================================================================= */
    function erlangB(N, A) { var B = 1; for (var k = 1; k <= N; k++) B = (A * B) / (k + A * B); return B; }
    function erlangC(N, A) {
      if (N <= 0) return 1; if (A <= 0) return 0;
      var rho = A / N; if (rho >= 1) return 1;
      var B = erlangB(N, A);
      return clamp(B / (1 - rho * (1 - B)), 0, 1);
    }
    function serviceLevel(N, A, aht, T) {
      if (A <= 0) return 1; if (N <= 0) return 0;
      if (A / N >= 1) return 0;
      var C = erlangC(N, A);
      return clamp(1 - C * Math.exp(-(N - A) * T / aht), 0, 1);
    }
    function occupancy(N, A) { return N <= 0 ? 1 : clamp(A / N, 0, 1); }
    function requiredOnPhones(A, aht, T, target) {
      var N = Math.max(1, Math.floor(A) + 1);
      while (serviceLevel(N, A, aht, T) < target) { N++; if (N > 3000) break; }
      return N;
    }

    /* =======================================================================
       GAME STATE
       ======================================================================= */
    var S = null;     // saved game state
    var plan = null;  // transient planning state (rebuilt on resume)

    function newGame() {
      S = {
        week: 0,
        budget: CFG.START_BUDGET,
        hc: CFG.START_HC,
        pipeline: [],
        engagement: CFG.ENG_START,
        dodgy: CFG.DODGY_START,
        ahtSkill: 1.0,
        trust: { ops: 60, fin: 56, client: 62, team: 58 },
        ytdCalls: 0, ytdAnswered: 0,
        committed: CFG.SLA_TARGET, ambition: 'realistic',
        lastWeek: null,
        campaign: null,
        forecastWeekly: null,
        callHistory: [],
        weekInits: { engagement: false, coaching: false, training: false },
        mods: null,
        reviewData: null,
        history: [],
        phase: 'meeting'
      };
      // seed 4 weeks of pre-FY actuals so the player has data to forecast from
      var wkSum = weekdaySum();
      for (var i = 4; i >= 1; i--) {
        S.callHistory.push({ label: 'Pre-FY −' + i, total: Math.round(CFG.BASE_CALLS * wkSum * rand(0.97, 1.03)), forecast: null });
      }
      plan = null;
      save();
      enterMeeting();
    }

    function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
    function load() { try { var raw = localStorage.getItem(SAVE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
    function ytdSLA() { return S.ytdCalls > 0 ? S.ytdAnswered / S.ytdCalls : CFG.SLA_TARGET; }
    function trainees() { return S.pipeline.reduce(function (a, c) { return a + c.size; }, 0); }
    function recentAvg(n) { var h = S.callHistory.slice(-n); if (!h.length) return CFG.BASE_CALLS * weekdaySum(); return sum(h.map(function (c) { return c.total; })) / h.length; }

    /* =======================================================================
       HUD
       ======================================================================= */
    function meterBar(val, cls) {
      var c = cls || (val < 35 ? 'bad' : val < 55 ? 'warn' : '');
      return '<span class="meter ' + c + '"><i style="width:' + clamp(val, 0, 100) + '%"></i></span>';
    }
    function renderHUD() {
      var y = ytdSLA();
      var yCls = y >= CFG.SLA_TARGET ? 'good' : (y >= CFG.SLA_TARGET - 0.05 ? 'warn' : 'bad');
      var t = S.trust;
      $('hud').innerHTML =
        '<div class="hud-cell"><div class="k">Financial Year</div>' +
          '<div class="v">Week ' + (S.week + 1) + '/' + CFG.WEEKS + '</div>' +
          '<div class="hud-sub">' + weekLabel(S.week) + '</div></div>' +
        '<div class="hud-cell"><div class="k">YTD Service Level</div>' +
          '<div class="v sla ' + yCls + '">' + pct1(y) + '</div>' +
          '<div class="hud-sub">target ' + pct(CFG.SLA_TARGET) + '</div></div>' +
        '<div class="hud-cell"><div class="k">Budget</div>' +
          '<div class="v ' + (S.budget < 0 ? 'bad' : '') + '">' + money(S.budget) + '</div>' +
          '<div class="hud-sub">contract P&amp;L</div></div>' +
        '<div class="hud-cell"><div class="k">Headcount</div>' +
          '<div class="v">' + S.hc + '</div>' +
          '<div class="hud-sub">+' + trainees() + ' in training</div></div>' +
        '<div class="hud-cell trust"><div class="k">Engagement &amp; Stakeholder Trust</div>' +
          '<div class="trust-row"><span class="tl">Team</span>' + meterBar(S.engagement, 'eng') + '<b>' + Math.round(S.engagement) + '</b></div>' +
          '<div class="trust-grid" style="margin-top:2px">' +
            '<div class="trust-row"><span class="tl">Ops</span>' + meterBar(t.ops) + '</div>' +
            '<div class="trust-row"><span class="tl">Finance</span>' + meterBar(t.fin) + '</div>' +
            '<div class="trust-row"><span class="tl">Client</span>' + meterBar(t.client) + '</div>' +
            '<div class="trust-row"><span class="tl">TLs</span>' + meterBar(t.team) + '</div>' +
          '</div></div>';
    }

    /* =======================================================================
       EVENTS
       ======================================================================= */
    function freshMods() { return { volMult: 1, ahtMult: 1, absenceAdd: 0, notes: [] }; }

    function rollEvents() {
      S.mods = freshMods();
      S.campaign = null;
      if (weekHasHoliday(S.week)) { S.mods.absenceAdd += CFG.HOLIDAY_ABSENCE; S.mods.notes.push('🗓️ Public holiday this week — expect higher leave and penalty-rate days.'); }

      if (Math.random() > 0.58) return; // ~42% of weeks get a wildcard event

      var winter = [5, 6, 7].indexOf(monthOfWeek(S.week)) >= 0;
      var bag = [];
      bag.push('flu'); if (winter) { bag.push('flu', 'flu'); }
      bag.push('outage', 'star', 'viral', 'campaign', 'kudos', 'recruit', 'payroll');
      var ev = pick(bag);

      if (ev === 'flu') { S.mods.absenceAdd += rand(0.05, 0.09); S.mods.notes.push('🤒 Flu going around — sick leave is up sharply this week.'); }
      else if (ev === 'outage') { S.mods.ahtMult *= rand(1.10, 1.20); S.mods.notes.push('💥 Phone system glitches — handle times are running long this week.'); }
      else if (ev === 'star') { S.hc = Math.max(0, S.hc - 1); S.engagement = clamp(S.engagement - 4, 0, 100); S.mods.notes.push('🏃 A senior agent resigned unexpectedly. Headcount −1, the team is rattled.'); }
      else if (ev === 'viral') { S.trust.client = clamp(S.trust.client - 5, 0, 100); S.mods.notes.push('📣 A complaint went viral on socials. The client is watching closely (Client trust −5).'); }
      else if (ev === 'campaign') { S.campaign = { claim: 1.10, real: rand(1.24, 1.34) }; S.mods.notes.push('📈 Marketing has launched a campaign — factor it into your forecast.'); }
      else if (ev === 'kudos') { S.trust.client = clamp(S.trust.client + 4, 0, 100); S.engagement = clamp(S.engagement + 3, 0, 100); S.mods.notes.push('🌟 The client sent kudos for last month. (Client trust +4, team lifted.)'); }
      else if (ev === 'recruit') { S.pipeline.push({ size: 3, weeksLeft: CFG.TRAIN_WEEKS }); S.mods.notes.push('🎁 A recruitment open-day overdelivered — 3 free recruits added to the training pipeline.'); }
      else if (ev === 'payroll') { S.budget -= 8000; S.trust.fin = clamp(S.trust.fin - 2, 0, 100); S.mods.notes.push('🧾 A payroll error cost $8,000 to fix (Finance trust −2).'); }
    }

    /* =======================================================================
       MEETING — grilling effects are hidden until an option is selected.
       Each grilling question has 4 options; one is clearly the wrong call.
       ======================================================================= */
    var GRILL_GENERAL = [
      { q: 'Finance wants the year-to-date cost story. How do you frame it?',
        opts: [
          { t: 'Show cost-per-contact trending down as volume grows.', d: { fin: 4, ops: 1 } },
          { t: 'Promise blanket cost cuts next quarter.', d: { fin: 2, team: -3 } },
          { t: 'Say service costs money — that\'s just the deal.', d: { fin: -3, client: 2 } },
          { t: 'Tell Finance to stop micromanaging your budget.', d: { fin: -8, ops: -3 } }
        ] },
      { q: 'The client asks why occupancy looks so high on the dashboards.',
        opts: [
          { t: 'Explain the occupancy vs service-level trade-off with data.', d: { client: 3, ops: 2 } },
          { t: 'Downplay it — the agents are coping fine.', d: { client: 1, team: -3 } },
          { t: 'Blame the rostering tool.', d: { client: -2, team: -1 } },
          { t: 'Tell the client to stop reading the dashboards.', d: { client: -9 } }
        ] },
      { q: 'Team Leaders say your schedules are hard to staff. Your response?',
        opts: [
          { t: 'Co-design the shift patterns with the TLs.', d: { team: 5, ops: 1 } },
          { t: 'Offer more overtime to smooth it over.', d: { team: 1, fin: -2 } },
          { t: 'Tell them to just follow the plan.', d: { team: -4, ops: 1 } },
          { t: 'Suggest the TLs are simply bad at their jobs.', d: { team: -9, ops: -2 } }
        ] },
      { q: 'Ops wants a bolder service-level commitment to impress the board.',
        opts: [
          { t: 'Commit only to what the numbers support.', d: { ops: -1, client: 3, fin: 2 } },
          { t: 'Stretch a little to keep Ops happy.', d: { ops: 3, client: -2 } },
          { t: 'Deflect — say it depends on hiring approvals.', d: { ops: 0, fin: 1 } },
          { t: 'Guarantee 95% on the spot to look good.', d: { ops: 2, client: -8, fin: -3 } }
        ] }
    ];
    var GRILL_MISS = [
      { q: 'Service level missed last week. Ops wants to know why.',
        opts: [
          { t: 'Walk them through the variance: volume, shrinkage, AHT.', d: { ops: 4, client: 2, fin: 1 } },
          { t: 'Point the finger at agents gaming their AUX time.', d: { ops: 1, team: -4 } },
          { t: 'Say it was a one-off and move on.', d: { ops: -3, client: -2 } },
          { t: 'Insist the reporting numbers must be wrong.', d: { ops: -8, fin: -3 } }
        ] },
      { q: 'The client is unhappy about the miss. How do you handle it?',
        opts: [
          { t: 'Own it and show them the recovery plan.', d: { client: 4, ops: 2 } },
          { t: 'Explain the unexpected volume spike, with data.', d: { client: 1, ops: 1 } },
          { t: 'Minimise it — you were barely under.', d: { client: -3 } },
          { t: 'Tell the client misses happen; deal with it.', d: { client: -10 } }
        ] }
    ];
    var NARR = [
      { t: 'Own the miss and present the fix.', d: { client: 3, ops: 2, team: 1 } },
      { t: 'Explain it as volume/shrinkage outside the plan (data-backed).', d: { ops: 1, client: 1 } },
      { t: 'Quietly push it onto Ops execution.', d: { ops: -4, team: -2 } }
    ];

    function enterMeeting() {
      S.phase = 'meeting'; save();
      rollEvents();
      renderHUD();
      var first = (S.week === 0);
      var prev = S.lastWeek;
      var c = [];

      c.push('<div class="advisor"><div class="face">📎</div><div><b>Clippo, your WFM advisor:</b> ' + advisorMeetingTip(first, prev) + '</div></div>');

      c.push('<div class="panel"><h3>🗓️ Monday Meeting — ' + weekLabel(S.week) + '</h3>');
      if (first) {
        c.push('<p class="small">Welcome to the chair. You are <b>Workforce Management</b> for this contact centre (open <b>Monday–Friday</b>). ' +
          'You don\'t run the floor — you <b>forecast</b>, <b>plan</b>, <b>negotiate</b> and <b>review the data</b>, then explain the results here every Monday. ' +
          'Your job all year: keep the <b>service level around ' + pct(CFG.SLA_TARGET) + '</b> without blowing the budget, burning out the team, or losing the client.</p>');
      } else {
        var hit = prev.sla >= prev.committed;
        c.push('<p class="small">Last week you committed to <b>' + pct(prev.committed) + '</b> and delivered <b class="' + (hit ? 'good' : 'bad') + '">' + pct1(prev.sla) + '</b>' +
          ' (' + (hit ? 'commitment met ✔' : 'commitment missed ✗') + '). YTD is <b>' + pct1(ytdSLA()) + '</b>.</p>');
        if (!hit) {
          c.push('<h4>The room wants an explanation. What\'s your line?</h4>');
          S._narrOrder = shuffle(NARR.map(function (_, i) { return i; }));
          for (var no = 0; no < S._narrOrder.length; no++) { var nidx = S._narrOrder[no]; c.push(optRow('narr', nidx, NARR[nidx].t)); }
          c.push('<div class="fx-reveal" id="narr-fx">Pick a response to reveal how the room reacts.</div>');
        }
      }
      c.push('</div>');

      if (S.mods.notes.length) {
        c.push('<div class="panel"><h4>📨 In the inbox this week</h4><ul class="small" style="margin-left:16px">');
        for (var mi = 0; mi < S.mods.notes.length; mi++) c.push('<li>' + S.mods.notes[mi] + '</li>');
        c.push('</ul></div>');
      }

      var pool = (!first && prev && prev.sla < prev.committed) ? GRILL_MISS : GRILL_GENERAL;
      var g = pick(pool);
      S._grill = g;
      S._grillOrder = shuffle(g.opts.map(function (_, i) { return i; }));
      c.push('<div class="panel"><h3>🎤 The grilling</h3><p class="small">' + g.q + '</p>');
      for (var go = 0; go < S._grillOrder.length; go++) { var gidx = S._grillOrder[go]; c.push(optRow('grill', gidx, g.opts[gidx].t)); }
      c.push('<div class="fx-reveal" id="grill-fx">Choose your answer — the room\'s reaction shows once you commit to a line.</div>');
      c.push('</div>');

      c.push('<div class="panel"><h3>🤝 Your asks <span class="small muted">(political capital: ' + CFG.CAPITAL + ' — spend wisely)</span></h3>');
      c.push('<p class="small muted">Each costs capital; money asks also need Finance on side.</p>');
      var finOK = S.trust.fin >= 45;
      c.push(askRow('hire', 2, '📋 Approve a hire (+' + CFG.HIRE_COHORT + ' recruits → ' + CFG.TRAIN_WEEKS + 'wk training)', money(CFG.HIRE_COST_EACH * CFG.HIRE_COHORT) + ' recruitment', !finOK, finOK ? '' : 'Finance won\'t sign off (needs trust ≥ 45)'));
      c.push(askRow('engage', 1, '🎉 Engagement initiative (recognition / incentives)', money(8000) + ' · lifts team, cuts sick &amp; churn', false, ''));
      c.push(askRow('coach', 1, '🕵️ Coaching crackdown on AUX/wrap abuse', money(5000) + ' · cuts dodgy behaviour, +shrinkage this wk', false, ''));
      c.push(askRow('train', 1, '🎓 Skills training block', money(4000) + ' · lowers AHT &amp; churn, +shrinkage this wk', false, ''));
      c.push('<div id="cap-note" class="small" style="margin-top:4px"></div></div>');

      c.push('<div class="panel"><h3>✍️ Commit to a service level for the week</h3>' +
        '<p class="small muted">Over-promise and a miss hurts more; under-promise and they lose confidence.</p>');
      var commits = [
        { id: 'cautious', t: 'Cautious — ' + pct(CFG.SLA_TARGET - 0.05), v: CFG.SLA_TARGET - 0.05 },
        { id: 'realistic', t: 'Realistic — ' + pct(CFG.SLA_TARGET), v: CFG.SLA_TARGET },
        { id: 'ambitious', t: 'Ambitious — ' + pct(CFG.SLA_TARGET + 0.05), v: CFG.SLA_TARGET + 0.05 }
      ];
      for (var ci = 0; ci < commits.length; ci++) {
        c.push('<label class="opt"><input type="radio" name="commit" value="' + commits[ci].id + '" data-v="' + commits[ci].v + '"' + (commits[ci].id === 'realistic' ? ' checked' : '') + '>' + commits[ci].t + '</label>');
      }
      c.push('</div>');

      c.push('<div class="row"><span class="spacer"></span><button class="btn big-btn" id="lock">Lock it in &amp; forecast ▶</button></div>');

      $('screen').innerHTML = c.join('');

      // reveal-on-select listeners (effects hidden until chosen)
      var gradios = $('screen').querySelectorAll('input[name="grill"]');
      for (var gi = 0; gi < gradios.length; gi++) gradios[gi].addEventListener('change', function (e) {
        $('grill-fx').innerHTML = 'The room reacts — <b>' + fxText(S._grill.opts[parseInt(e.target.value, 10)].d) + '</b>';
      });
      var nradios = $('screen').querySelectorAll('input[name="narr"]');
      for (var nj = 0; nj < nradios.length; nj++) nradios[nj].addEventListener('change', function (e) {
        $('narr-fx').innerHTML = 'The room reacts — <b>' + fxText(NARR[parseInt(e.target.value, 10)].d) + '</b>';
      });

      var cbs = $('screen').querySelectorAll('input[type="checkbox"][data-cost]');
      for (var k = 0; k < cbs.length; k++) cbs[k].addEventListener('change', updateCapNote);
      updateCapNote();
      $('lock').addEventListener('click', lockMeeting);
      setStatus('Monday meeting — answer the room, make your asks, commit a number.');
    }

    function optRow(name, i, text) {
      return '<label class="opt"><input type="radio" name="' + name + '" value="' + i + '">' + text + '</label>';
    }
    function askRow(id, cost, text, costNote, disabled, why) {
      return '<label class="opt ' + (disabled ? 'disabled' : '') + '">' +
        '<input type="checkbox" name="ask" value="' + id + '" data-cost="' + cost + '"' + (disabled ? ' disabled' : '') + '>' +
        text + ' <span class="cost">[' + cost + ' cap · ' + costNote + ']</span>' +
        (why ? '<br><span class="cost bad">' + why + '</span>' : '') + '</label>';
    }
    function fxText(d) {
      var map = { ops: 'Ops', fin: 'Finance', client: 'Client', team: 'TLs' };
      return Object.keys(d).map(function (k) { return map[k] + ' ' + (d[k] >= 0 ? '+' : '') + d[k]; }).join(', ');
    }
    function updateCapNote() {
      var used = 0, sel = $('screen').querySelectorAll('input[name="ask"]:checked');
      for (var i = 0; i < sel.length; i++) used += parseInt(sel[i].dataset.cost, 10);
      var note = $('cap-note');
      if (note) note.innerHTML = 'Capital used: <b class="' + (used > CFG.CAPITAL ? 'bad' : 'good') + '">' + used + '</b> / ' + CFG.CAPITAL;
    }
    function applyTrust(d) { if (!d) return; for (var k in d) if (S.trust[k] != null) S.trust[k] = clamp(S.trust[k] + d[k], 0, 100); }

    function lockMeeting() {
      var grillEl = document.querySelector('input[name="grill"]:checked');
      if (!grillEl) { dialog('Answer the room', 'Pick a response to the grilling question before you wrap the meeting.'); return; }
      var narrShown = !!document.querySelector('input[name="narr"]');
      var narrEl = document.querySelector('input[name="narr"]:checked');
      if (narrShown && !narrEl) { dialog('Answer the room', 'Choose how you explain last week\'s miss first.'); return; }

      var used = 0, asks = [], sel = $('screen').querySelectorAll('input[name="ask"]:checked');
      for (var i = 0; i < sel.length; i++) { used += parseInt(sel[i].dataset.cost, 10); asks.push(sel[i].value); }
      if (used > CFG.CAPITAL) { dialog('Not enough capital', 'You picked ' + used + ' capital of asks but only have ' + CFG.CAPITAL + '. Drop one.'); return; }

      if (narrEl) applyTrust(NARR[parseInt(narrEl.value, 10)].d);
      applyTrust(S._grill.opts[parseInt(grillEl.value, 10)].d);

      S.weekInits = { engagement: false, coaching: false, training: false };
      for (var a = 0; a < asks.length; a++) {
        var k = asks[a];
        if (k === 'hire') { S.pipeline.push({ size: CFG.HIRE_COHORT, weeksLeft: CFG.TRAIN_WEEKS }); S.budget -= CFG.HIRE_COST_EACH * CFG.HIRE_COHORT; S.trust.fin = clamp(S.trust.fin - 2, 0, 100); }
        else if (k === 'engage') { S.weekInits.engagement = true; S.budget -= 8000; S.trust.team = clamp(S.trust.team + 2, 0, 100); }
        else if (k === 'coach') { S.weekInits.coaching = true; S.budget -= 5000; S.dodgy = clamp(S.dodgy - 0.06, 0, 1); }
        else if (k === 'train') { S.weekInits.training = true; S.budget -= 4000; S.ahtSkill = clamp(S.ahtSkill - 0.02, 0.85, 1); }
      }

      var cEl = document.querySelector('input[name="commit"]:checked');
      S.committed = parseFloat(cEl.dataset.v);
      S.ambition = cEl.value;
      save();
      enterForecast();
    }

    /* =======================================================================
       FORECAST — the player reads historical data and sets the week's volume.
       ======================================================================= */
    function enterForecast() {
      S.phase = 'forecast'; save();
      renderHUD();
      var def = Math.round(recentAvg(3) / 50) * 50;
      if (S.forecastWeekly == null) S.forecastWeekly = def;

      var c = [];
      c.push('<div class="advisor"><div class="face">📎</div><div><b>Clippo:</b> ' + advisorForecastTip() + '</div></div>');

      // historical dataset
      c.push('<div class="panel"><h3>📚 Historical data — weekly call volume</h3>');
      c.push('<table class="grid"><thead><tr><th>Week</th><th>Forecast</th><th>Actual</th><th>Error</th></tr></thead><tbody>');
      var hist = S.callHistory.slice(-6);
      for (var i = 0; i < hist.length; i++) {
        var h = hist[i];
        var err = (h.forecast != null && h.total > 0) ? Math.abs(h.forecast - h.total) / h.total : null;
        c.push('<tr><td class="day">' + h.label + '</td>' +
          '<td>' + (h.forecast != null ? h.forecast.toLocaleString() : '—') + '</td>' +
          '<td>' + h.total.toLocaleString() + '</td>' +
          '<td class="' + (err == null ? '' : err <= 0.05 ? 'good' : err >= 0.12 ? 'bad' : 'warn') + '">' + (err == null ? '—' : pct(err)) + '</td></tr>');
      }
      c.push('</tbody></table>');
      c.push('<p class="small" style="margin-top:6px">Recent 3-week average: <span class="pill">' + Math.round(recentAvg(3)).toLocaleString() + '</span> · ' + trendNote() + '</p>');
      c.push('</div>');

      // intel
      var intel = forecastIntel();
      if (intel.length) {
        c.push('<div class="panel"><h4>🔎 Signals to weigh in</h4><ul class="small" style="margin-left:16px">');
        for (var s = 0; s < intel.length; s++) c.push('<li>' + intel[s] + '</li>');
        c.push('</ul></div>');
      }

      // input + live breakdown
      c.push('<div class="panel"><h3>✍️ Your forecast for ' + weekLabel(S.week) + '</h3>');
      c.push('<div class="row"><span class="small">Expected total calls this week:</span> ' +
        '<input class="fc-in sunken" type="number" id="fc-input" min="0" step="50" value="' + S.forecastWeekly + '">' +
        '<button class="btn" id="fc-use">Use recent avg</button></div>');
      c.push('<div id="fc-breakdown" style="margin-top:8px"></div>');
      c.push('<p class="small muted" style="margin-top:6px">This number drives your staffing. Forecast low and you\'ll under-staff; forecast high and you\'ll overspend. The actual demand won\'t be revealed until the week runs.</p>');
      c.push('</div>');

      c.push('<div class="row"><span class="spacer"></span><button class="btn big-btn" id="fc-lock">Lock forecast &amp; build the roster ▶</button></div>');

      $('screen').innerHTML = c.join('');
      $('fc-input').addEventListener('input', function () { S.forecastWeekly = Math.max(0, parseInt(this.value, 10) || 0); drawBreakdown(); });
      $('fc-use').addEventListener('click', function () { S.forecastWeekly = Math.round(recentAvg(3) / 50) * 50; $('fc-input').value = S.forecastWeekly; drawBreakdown(); });
      $('fc-lock').addEventListener('click', function () {
        if (!S.forecastWeekly || S.forecastWeekly < 100) { dialog('Forecast too low', 'Enter a realistic weekly call forecast before building the roster.'); return; }
        save(); enterPlanning();
      });
      drawBreakdown();
      setStatus('Forecast the week — read the data, weigh the signals, set your number.');
    }

    function drawBreakdown() {
      var rows = [], tot = 0;
      for (var d = 0; d < NDAYS(); d++) {
        var hol = holidayOn(dateFor(S.week, d));
        var v = Math.round(S.forecastWeekly * dowShare(d) * (hol ? CFG.HOLIDAY_VOL : 1));
        tot += v;
        rows.push('<td>' + DOW[d] + (hol ? ' 🗓️' : '') + '<br><b>' + v.toLocaleString() + '</b></td>');
      }
      $('fc-breakdown').innerHTML = '<table class="grid"><thead><tr><th colspan="' + NDAYS() + '">Forecast split across the week (≈ ' + tot.toLocaleString() + ' calls)</th></tr></thead>' +
        '<tbody><tr>' + rows.join('') + '</tr></tbody></table>';
    }

    function trendNote() {
      var h = S.callHistory;
      if (h.length < 2) return 'not enough history for a trend yet.';
      var a = h[h.length - 1].total, b = h[h.length - 2].total;
      if (a > b * 1.03) return 'volumes are <span class="warn">trending up</span>.';
      if (a < b * 0.97) return 'volumes are <span class="warn">trending down</span>.';
      return 'volumes are roughly flat week-to-week.';
    }
    function forecastIntel() {
      var out = [];
      if (S.campaign) out.push('📈 A marketing campaign is live. The business <i>claims</i> it adds ~' + pct(S.campaign.claim - 1) + ', but campaigns on this account have historically run hotter.');
      if (weekHasHoliday(S.week)) {
        var names = [];
        for (var d = 0; d < NDAYS(); d++) { var hn = holidayOn(dateFor(S.week, d)); if (hn) names.push(DOW[d] + ' (' + hn + ')'); }
        out.push('🗓️ Public holiday this week — ' + names.join(', ') + ' runs at ~' + pct(CFG.HOLIDAY_VOL) + ' of a normal day. Forecast lower.');
      }
      if (CFG.SEASON[S.week] >= 1.2) out.push('🎄 Peak trading period — seasonal demand is well above the yearly baseline right now.');
      else if (S.week > 0 && CFG.SEASON[S.week] < CFG.SEASON[S.week - 1] - 0.05) out.push('📉 Seasonal demand is easing off from recent weeks.');
      return out;
    }

    /* =======================================================================
       PLANNING
       ======================================================================= */
    function weekShrink() { return CFG.BASE_SHRINK + (S.weekInits.coaching ? CFG.COACH_SHRINK : 0) + (S.weekInits.training ? CFG.TRAIN_SHRINK : 0); }
    function expectedAbsence() {
      var a = CFG.BASE_ABSENCE;
      if ([5, 6, 7].indexOf(monthOfWeek(S.week)) >= 0) a += CFG.WINTER_ABSENCE;
      if (S.engagement < 60) a += (60 - S.engagement) / 100 * 0.08;
      return a;
    }
    // forecast calls per day = player's weekly number, split by day-of-week shape
    function forecastCalls(day) {
      var hol = holidayOn(dateFor(S.week, day));
      var base = (S.forecastWeekly || 0) * dowShare(day);
      if (hol) base *= CFG.HOLIDAY_VOL;
      return Math.round(base);
    }
    function dayNeeds(day) {
      var calls = forecastCalls(day);
      var aht = CFG.AHT * S.ahtSkill;
      var A = calls * aht / CFG.OPEN_SECONDS;
      var onPhones = requiredOnPhones(A, aht, CFG.SLA_T, CFG.SLA_TARGET);
      var grossFactor = (1 - expectedAbsence()) * (1 - weekShrink());
      var roster = Math.ceil(onPhones / Math.max(0.4, grossFactor));
      return { calls: calls, A: A, onPhones: onPhones, roster: roster };
    }
    function defaultRoster(needs) {
      var rost = needs.map(function (n) { return Math.min(n.roster, S.hc); });
      var cap = S.hc * NDAYS();
      var s = sum(rost);
      var guard = 0;
      while (s > cap && guard++ < 5000) {
        var idx = -1, lo = Infinity;
        for (var d = 0; d < NDAYS(); d++) { if (rost[d] > 0 && needs[d].calls < lo) { lo = needs[d].calls; idx = d; } }
        if (idx < 0) break;
        rost[idx] -= 1; s -= 1;
      }
      return rost;
    }

    function enterPlanning() {
      S.phase = 'planning'; save();
      renderHUD();
      var needs = [];
      for (var d = 0; d < NDAYS(); d++) needs.push(dayNeeds(d));
      plan = { needs: needs, rost: defaultRoster(needs), ot: 0, shrink: weekShrink(), expAbs: expectedAbsence() };
      drawPlanning();
    }

    function drawPlanning() {
      var c = [];
      var hol = [];
      for (var d = 0; d < NDAYS(); d++) { var h = holidayOn(dateFor(S.week, d)); if (h) hol.push(DOW[d] + ' ' + h); }
      c.push('<div class="advisor"><div class="face">📎</div><div><b>Clippo:</b> ' + advisorPlanTip() + '</div></div>');

      c.push('<div class="panel"><h3>📅 Plan the week — ' + weekLabel(S.week) + '</h3>');
      c.push('<p class="small">Your forecast <span class="pill">' + (S.forecastWeekly || 0).toLocaleString() + ' calls</span> · ' +
        'Planned shrinkage <span class="pill">' + pct(plan.shrink) + '</span> · ' +
        'Expected absence <span class="pill">' + pct(plan.expAbs) + '</span>' +
        (hol.length ? ' · <span class="warn">Holiday: ' + hol.join(', ') + '</span>' : '') + '</p>');

      c.push('<table class="grid"><thead><tr><th>Day</th><th>Forecast calls</th><th>On&nbsp;phones<br>needed</th><th>Roster needed<br>(incl. shrink)</th><th>Your roster</th><th>Coverage</th></tr></thead><tbody>');
      for (var d2 = 0; d2 < NDAYS(); d2++) {
        var n = plan.needs[d2], hday = holidayOn(dateFor(S.week, d2));
        var covRaw = n.roster > 0 ? plan.rost[d2] / n.roster : 1;
        var cov = clamp(covRaw, 0, 1.3);
        c.push('<tr class="' + (hday ? 'hol' : '') + '">' +
          '<td class="day"><b>' + DOW[d2] + '</b> ' + fmtDate(dateFor(S.week, d2)) + (hday ? ' 🗓️' : '') + '</td>' +
          '<td>' + n.calls.toLocaleString() + '</td>' +
          '<td>' + n.onPhones + '</td>' +
          '<td>' + n.roster + '</td>' +
          '<td><input class="num-in" type="number" min="0" max="' + S.hc + '" value="' + plan.rost[d2] + '" data-day="' + d2 + '"></td>' +
          '<td><div class="cov ' + (covRaw < 0.999 ? 'under' : '') + '"><i style="width:' + Math.min(100, cov * 100) + '%"></i><span class="lab">&nbsp;' + Math.round(covRaw * 100) + '%</span></div></td>' +
          '</tr>');
      }
      c.push('</tbody></table>');

      var used = sum(plan.rost);
      var capW = S.hc * NDAYS();
      var overDay = plan.rost.some(function (x) { return x > S.hc; });
      c.push('<div class="row" style="margin-top:6px">' +
        '<button class="btn" id="auto">Auto-roster</button>' +
        '<span class="small">Capacity used: <b class="' + (used > capW ? 'bad' : '') + '">' + used + '</b> / ' + capW + ' agent-days (HC ' + S.hc + ' × ' + NDAYS() + ')</span></div>');
      var otCap = Math.round(capW * CFG.OT_CAP_FRAC);
      c.push('<div class="row" style="margin-top:6px"><span class="small">Overtime: </span>' +
        '<input type="range" id="ot" min="0" max="' + otCap + '" value="' + plan.ot + '" style="flex:1">' +
        '<span class="small" id="ot-lab"></span></div></div>');

      c.push('<div class="panel" id="proj"></div>');

      var warn = (used > capW) ? 'You\'re over weekly capacity — hire, use OT, or cut a day.' : overDay ? 'A day exceeds your headcount — can\'t roster more agents than you have.' : '';
      c.push('<div class="row"><span class="bad small" id="run-warn">' + warn + '</span><span class="spacer"></span>' +
        '<button class="btn big-btn" id="run"' + (used > capW || overDay ? ' disabled' : '') + '>Run the week ▶</button></div>');

      $('screen').innerHTML = c.join('');
      var inputs = $('screen').querySelectorAll('.num-in');
      for (var ii = 0; ii < inputs.length; ii++) inputs[ii].addEventListener('input', onRosterInput);
      $('auto').addEventListener('click', function () { plan.rost = defaultRoster(plan.needs); plan.ot = 0; drawPlanning(); });
      $('ot').addEventListener('input', function (e) { plan.ot = parseInt(e.target.value, 10) || 0; refreshProjection(); });
      $('run').addEventListener('click', runWeek);
      refreshProjection();
      setStatus('Distribute your workforce across Mon–Fri, then run it. Actuals will vary from forecast.');
    }

    function onRosterInput(e) {
      var d = parseInt(e.target.dataset.day, 10);
      var v = parseInt(e.target.value, 10); if (isNaN(v) || v < 0) v = 0;
      plan.rost[d] = v;
      var n = plan.needs[d];
      var covRaw = n.roster > 0 ? v / n.roster : 1;
      var cell = e.target.closest('tr').querySelector('.cov');
      cell.classList.toggle('under', covRaw < 0.999);
      cell.querySelector('i').style.width = Math.min(100, clamp(covRaw, 0, 1.3) * 100) + '%';
      cell.querySelector('.lab').innerHTML = '&nbsp;' + Math.round(covRaw * 100) + '%';
      refreshProjection();
    }

    function allocateOT(rost, needs, otTotal) {
      var ot = []; for (var z = 0; z < NDAYS(); z++) ot.push(0);
      var left = otTotal;
      while (left > 0) {
        var idx = -1, worst = -1;
        for (var d = 0; d < NDAYS(); d++) { var gap = needs[d].roster - (rost[d] + ot[d]); if (gap > worst) { worst = gap; idx = d; } }
        if (idx < 0 || worst <= 0) break;
        ot[idx] += 1; left -= 1;
      }
      return ot;
    }
    function laborCost(baseDays, otDays) {
      var holSurcharge = 0;
      for (var d = 0; d < NDAYS(); d++) if (holidayOn(dateFor(S.week, d))) holSurcharge += plan.rost[d] * CFG.DAY_COST * (CFG.HOLIDAY_PAY - 1);
      return baseDays * CFG.DAY_COST + otDays * CFG.DAY_COST * CFG.OT_MULT + holSurcharge;
    }

    function projectWeek() {
      var otDays = allocateOT(plan.rost, plan.needs, plan.ot);
      var calls = 0, answered = 0, occSum = 0, occN = 0;
      for (var d = 0; d < NDAYS(); d++) {
        var n = plan.needs[d];
        var phones = (plan.rost[d] + otDays[d]) * (1 - plan.expAbs) * (1 - plan.shrink) * (1 - S.dodgy * CFG.DODGY_AVAIL_MAX);
        var aht = CFG.AHT * S.ahtSkill * (1 + S.dodgy * CFG.DODGY_AHT_MAX);
        var A = n.calls * aht / CFG.OPEN_SECONDS;
        var sl = serviceLevel(phones, A, aht, CFG.SLA_T);
        calls += n.calls; answered += sl * n.calls;
        if (n.calls > 50) { occSum += occupancy(phones, A); occN++; }
      }
      var baseDays = sum(plan.rost);
      var otTotal = sum(otDays);
      return { sla: calls > 0 ? answered / calls : 1, cost: laborCost(baseDays, otTotal), occ: occN ? occSum / occN : 0, otTotal: otTotal, baseDays: baseDays };
    }

    function refreshProjection() {
      var otCap = Math.round(S.hc * NDAYS() * CFG.OT_CAP_FRAC);
      if ($('ot-lab')) $('ot-lab').textContent = plan.ot + ' / ' + otCap + ' agent-days (+' + money(plan.ot * CFG.DAY_COST * CFG.OT_MULT) + ')';
      var p = projectWeek();
      var slaCls = p.sla >= S.committed ? 'good' : (p.sla >= S.committed - 0.04 ? 'warn' : 'bad');
      var trainee = trainees() * CFG.TRAINEE_WK_COST;
      var net = CFG.WEEK_REVENUE - p.cost - trainee;
      var used = sum(plan.rost), capW = S.hc * NDAYS(), overDay = plan.rost.some(function (x) { return x > S.hc; });
      if ($('run')) $('run').disabled = (used > capW || overDay);
      if ($('run-warn')) $('run-warn').textContent = (used > capW) ? 'Over weekly capacity — hire, use OT, or cut a day.' : (overDay ? 'A day exceeds headcount.' : '');
      $('proj').innerHTML = '<h3>📈 Projected (on your forecast — reality will differ)</h3><div class="kpi-strip">' +
        '<div class="kpi"><div class="k">Proj. service level</div><div class="v ' + slaCls + '">' + pct1(p.sla) + '</div><div class="small muted">commit ' + pct(S.committed) + '</div></div>' +
        '<div class="kpi"><div class="k">Avg occupancy</div><div class="v ' + (p.occ > 0.9 ? 'bad' : p.occ > 0.85 ? 'warn' : 'good') + '">' + pct(p.occ) + '</div><div class="small muted">burnout &gt; 88%</div></div>' +
        '<div class="kpi"><div class="k">Labour cost</div><div class="v">' + money(p.cost + trainee) + '</div><div class="small muted">incl. trainees</div></div>' +
        '<div class="kpi"><div class="k">Proj. weekly P&amp;L</div><div class="v ' + (net >= 0 ? 'good' : 'bad') + '">' + money(net) + '</div><div class="small muted">rev − cost</div></div></div>';
    }

    /* =======================================================================
       RUN THE WEEK
       ======================================================================= */
    function trueDaily(day) {
      var hol = holidayOn(dateFor(S.week, day));
      var m = CFG.DOW[day] * CFG.SEASON[S.week];
      if (hol) m *= CFG.HOLIDAY_VOL;
      if (S.campaign) m *= S.campaign.real;
      m *= rand(0.94, 1.06);
      return Math.max(0, Math.round(CFG.BASE_CALLS * m));
    }

    function runWeek() {
      if (!S.mods) S.mods = freshMods();
      var otDays = allocateOT(plan.rost, plan.needs, plan.ot);
      var dayRes = [], calls = 0, answered = 0, occSum = 0, occN = 0, abandoned = 0;
      var realAbs = clamp(plan.expAbs + (S.mods.absenceAdd || 0), 0, 0.6);

      for (var d = 0; d < NDAYS(); d++) {
        var hol = holidayOn(dateFor(S.week, d));
        var dCalls = Math.round(trueDaily(d) * (S.mods.volMult || 1));

        var absToday = clamp(realAbs * rand(0.8, 1.2), 0, 0.7);
        var phones = (plan.rost[d] + otDays[d]) * (1 - absToday) * (1 - plan.shrink) * (1 - S.dodgy * CFG.DODGY_AVAIL_MAX);
        var aht = CFG.AHT * S.ahtSkill * (1 + S.dodgy * CFG.DODGY_AHT_MAX) * (S.mods.ahtMult || 1);
        var A = dCalls * aht / CFG.OPEN_SECONDS;
        var sl = serviceLevel(phones, A, aht, CFG.SLA_T);
        var occ = occupancy(phones, A);
        var aband = A >= phones ? Math.round(dCalls * clamp((A - phones) / Math.max(A, 1), 0, 0.5)) : Math.round(dCalls * (1 - sl) * 0.06);

        calls += dCalls; answered += sl * dCalls; abandoned += aband;
        if (dCalls > 50) { occSum += occ; occN++; }
        dayRes.push({ d: d, hol: hol, calls: dCalls, sl: sl, occ: occ });
      }

      var sla = calls > 0 ? answered / calls : 1;
      var occAvg = occN ? occSum / occN : 0;
      var baseDays = sum(plan.rost), otTotal = sum(otDays);
      var cost = laborCost(baseDays, otTotal);
      var traineeCost = trainees() * CFG.TRAINEE_WK_COST;
      var otFrac = baseDays > 0 ? otTotal / baseDays : 0;

      // forecast accuracy
      var fcast = S.forecastWeekly || 0;
      var fErr = calls > 0 ? Math.abs(fcast - calls) / calls : 0;

      var penalty = 0, bonus = 0;
      if (sla < CFG.SLA_TARGET) penalty = (CFG.SLA_TARGET - sla) * CFG.PENALTY_SCALE;
      else bonus = Math.min(CFG.BONUS_CAP, (sla - CFG.SLA_TARGET) * CFG.BONUS_SCALE);
      var pnl = CFG.WEEK_REVENUE + bonus - cost - traineeCost - penalty;
      var budgetBefore = S.budget;
      S.budget += pnl;

      var engBefore = S.engagement, eDelta = 0;
      if (occAvg > 0.88) eDelta -= (occAvg - 0.88) * 60;
      else if (occAvg < 0.78) eDelta += (0.78 - occAvg) * 18;
      eDelta -= otFrac * 18;
      if (S.weekInits.engagement) eDelta += 8;
      if (S.trust.team < 45) eDelta -= 2;
      eDelta += (65 - S.engagement) * 0.05;
      S.engagement = clamp(S.engagement + eDelta, 0, 100);

      var dodgyTarget = clamp(0.30 - S.engagement / 400 - S.trust.team / 500, 0.04, 0.45);
      S.dodgy = clamp(S.dodgy + (dodgyTarget - S.dodgy) * 0.35, 0, 1);

      var burnout = 1 + Math.max(0, occAvg - 0.85) * 4 + Math.max(0, 60 - S.engagement) / 100 * 2 + otFrac * 1.5;
      var expQuits = S.hc * 0.008 * burnout;
      if (S.engagement < 35) expQuits += 1;
      var quits = Math.floor(expQuits) + (Math.random() < (expQuits % 1) ? 1 : 0);
      quits = Math.min(quits, Math.max(0, S.hc - 1));
      var quitNames = [];
      for (var q = 0; q < quits && q < 3; q++) quitNames.push(pick(AGENT_NAMES));
      S.hc -= quits;

      var graduated = 0;
      for (var p2 = 0; p2 < S.pipeline.length; p2++) S.pipeline[p2].weeksLeft -= 1;
      S.pipeline = S.pipeline.filter(function (c) { if (c.weeksLeft <= 0) { graduated += c.size; return false; } return true; });
      S.hc += graduated;

      var tBefore = { ops: S.trust.ops, fin: S.trust.fin, client: S.trust.client, team: S.trust.team };
      var hit = sla >= S.committed;
      var reward = S.ambition === 'ambitious' ? 7 : S.ambition === 'realistic' ? 4 : 2;
      var punish = S.ambition === 'ambitious' ? 9 : S.ambition === 'realistic' ? 5 : 3;
      var cd = hit ? reward : -punish;
      applyTrust({ client: cd, ops: Math.round(cd * 0.6) });
      if (sla >= CFG.SLA_TARGET + 0.03) applyTrust({ client: 1, ops: 1 });
      if (sla < CFG.SLA_TARGET - 0.10) applyTrust({ client: -2, ops: -2 });
      applyTrust({ fin: pnl >= 0 ? 1 : -2 });
      if (occAvg < 0.55 && calls > 0) applyTrust({ fin: -1 });
      if (fErr <= 0.05) applyTrust({ ops: 1 });           // accurate forecasting builds credibility
      else if (fErr >= 0.20) applyTrust({ ops: -1 });
      applyTrust({ team: (S.engagement >= engBefore ? 1 : -1) + (quits >= 2 ? -2 : 0) });

      S.ytdCalls += calls; S.ytdAnswered += answered;
      S.callHistory.push({ label: shortWeek(S.week), total: calls, forecast: fcast });
      if (S.callHistory.length > 12) S.callHistory = S.callHistory.slice(-12);
      S.history.push({ week: S.week, sla: sla, ytd: ytdSLA(), budget: S.budget, eng: S.engagement, hc: S.hc });
      S.lastWeek = { sla: sla, committed: S.committed, occ: occAvg };
      S.reviewData = makeReview(dayRes);

      S.lastResult = { dayRes: dayRes, sla: sla, occ: occAvg, calls: calls, abandoned: abandoned, cost: cost + traineeCost, pnl: pnl, penalty: penalty, bonus: bonus,
        engBefore: engBefore, engAfter: S.engagement, quits: quits, quitNames: quitNames, graduated: graduated, budgetBefore: budgetBefore,
        tBefore: tBefore, tAfter: { ops: S.trust.ops, fin: S.trust.fin, client: S.trust.client, team: S.trust.team }, hit: hit, otTotal: otTotal,
        forecast: fcast, fErr: fErr };

      // forecast carries forward as a sensible default next week
      S.forecastWeekly = null;
      save();
      renderHUD();
      drawResults(S.lastResult);
    }

    /* =======================================================================
       RESULTS
       ======================================================================= */
    function drawResults(res) {
      S.phase = 'results'; save();
      var c = [];
      c.push('<div class="advisor"><div class="face">📎</div><div><b>Clippo:</b> ' + advisorResultTip(res) + '</div></div>');

      c.push('<div class="panel"><h3>📊 Week ' + (S.week + 1) + ' results — ' + weekLabel(S.week) + '</h3>');
      var slaCls = res.sla >= CFG.SLA_TARGET ? 'good' : (res.sla >= CFG.SLA_TARGET - 0.05 ? 'warn' : 'bad');
      c.push('<div class="kpi-strip">' +
        '<div class="kpi"><div class="k">Service level</div><div class="v ' + slaCls + '">' + pct1(res.sla) + '</div><div class="small ' + (res.hit ? 'good' : 'bad') + '">committed ' + pct(S.committed) + ' ' + (res.hit ? '✔' : '✗') + '</div></div>' +
        '<div class="kpi"><div class="k">YTD service</div><div class="v ' + (ytdSLA() >= CFG.SLA_TARGET ? 'good' : 'bad') + '">' + pct1(ytdSLA()) + '</div></div>' +
        '<div class="kpi"><div class="k">Avg occupancy</div><div class="v ' + (res.occ > 0.9 ? 'bad' : res.occ > 0.85 ? 'warn' : 'good') + '">' + pct(res.occ) + '</div></div>' +
        '<div class="kpi"><div class="k">Forecast error</div><div class="v ' + (res.fErr <= 0.05 ? 'good' : res.fErr >= 0.12 ? 'bad' : 'warn') + '">' + pct(res.fErr) + '</div><div class="small muted">fc ' + res.forecast.toLocaleString() + ' · act ' + res.calls.toLocaleString() + '</div></div>' +
        '<div class="kpi"><div class="k">Weekly P&amp;L</div><div class="v ' + (res.pnl >= 0 ? 'good' : 'bad') + '">' + money(res.pnl) + '</div></div></div>');

      c.push('<table class="grid" style="margin-top:8px"><thead><tr><th>Day</th><th>Forecast</th><th>Actual calls</th><th>Service level</th><th>Occupancy</th></tr></thead><tbody>');
      for (var i = 0; i < res.dayRes.length; i++) {
        var dr = res.dayRes[i];
        c.push('<tr class="' + (dr.hol ? 'hol' : '') + '"><td class="day"><b>' + DOW[dr.d] + '</b> ' + fmtDate(dateFor(S.week, dr.d)) + (dr.hol ? ' 🗓️' : '') + '</td>' +
          '<td>' + forecastCallsRetro(dr.d).toLocaleString() + '</td>' +
          '<td>' + dr.calls.toLocaleString() + '</td>' +
          '<td class="' + (dr.sl >= CFG.SLA_TARGET ? 'good' : 'bad') + '">' + pct1(dr.sl) + '</td>' +
          '<td class="' + (dr.occ > 0.9 ? 'bad' : '') + '">' + pct(dr.occ) + '</td></tr>');
      }
      c.push('</tbody></table></div>');

      var dT = function (k) { var v = Math.round(res.tAfter[k] - res.tBefore[k]); return v === 0 ? '' : ' <span class="' + (v > 0 ? 'delta-up' : 'delta-dn') + '">(' + (v > 0 ? '+' : '') + v + ')</span>'; };
      c.push('<div class="panel"><h4>🧾 Ledger</h4><div class="log">' +
        '<div class="li">Contract revenue: <span class="delta-up">' + money(CFG.WEEK_REVENUE) + '</span></div>' +
        (res.bonus > 0 ? '<div class="li">SLA bonus: <span class="delta-up">' + money(res.bonus) + '</span></div>' : '') +
        '<div class="li">Labour (incl. trainees): <span class="delta-dn">-' + money(res.cost) + '</span></div>' +
        (res.penalty > 0 ? '<div class="li">SLA penalty: <span class="delta-dn">-' + money(res.penalty) + '</span></div>' : '') +
        '<div class="li"><b>Net: ' + money(res.pnl) + '</b> → budget ' + money(res.budgetBefore) + ' → <b>' + money(S.budget) + '</b></div></div></div>');

      var log = [];
      log.push('Engagement ' + Math.round(res.engBefore) + ' → <b>' + Math.round(res.engAfter) + '</b> ' + (res.engAfter >= res.engBefore ? '<span class="delta-up">▲</span>' : '<span class="delta-dn">▼</span>'));
      if (res.quits > 0) log.push('<span class="delta-dn">Attrition:</span> ' + res.quits + ' agent' + (res.quits > 1 ? 's' : '') + ' resigned' + (res.quitNames.length ? ' (' + res.quitNames.join(', ') + ')' : '') + ' → HC ' + S.hc);
      else log.push('No resignations this week.');
      if (res.graduated > 0) log.push('<span class="delta-up">' + res.graduated + ' trainee' + (res.graduated > 1 ? 's' : '') + ' graduated</span> to the floor → HC ' + S.hc);
      if (trainees() > 0) log.push(trainees() + ' still in training.');
      log.push('Trust — Ops' + dT('ops') + ' · Finance' + dT('fin') + ' · Client' + dT('client') + ' · TLs' + dT('team'));
      c.push('<div class="panel"><h4>👥 People &amp; stakeholders</h4><div class="log">');
      for (var l = 0; l < log.length; l++) c.push('<div class="li">' + log[l] + '</div>');
      c.push('</div></div>');

      c.push('<div class="row"><span class="spacer"></span><button class="btn big-btn" id="toreview">Review the week\'s data 🔍 ▶</button></div>');

      $('screen').innerHTML = c.join('');
      $('toreview').addEventListener('click', enterReview);
      setStatus('Week ' + (S.week + 1) + ' done. Now dig into the data before next Monday.');
    }
    // recompute a day's forecast for the results table (forecastWeekly is cleared post-run, so use the stored result)
    function forecastCallsRetro(day) {
      var hol = holidayOn(dateFor(S.week, day));
      var base = (S.lastResult.forecast || 0) * dowShare(day);
      if (hol) base *= CFG.HOLIDAY_VOL;
      return Math.round(base);
    }

    /* =======================================================================
       DATA REVIEW — investigate agent behaviour & arrival patterns.
       ======================================================================= */
    function makeReview(dayRes) {
      var names = shuffle(AGENT_NAMES).slice(0, 6);
      var teamAht = Math.round(CFG.AHT * S.ahtSkill);
      var agents = [];
      for (var i = 0; i < 6; i++) {
        agents.push({ name: names[i], calls: Math.round(rand(380, 520)), aht: Math.round(teamAht * rand(0.92, 1.08)), aux: r1(rand(6, 12)), hold: r1(rand(2, 6)), culprit: false });
      }
      var ci = Math.floor(Math.random() * 6);
      var dim = pick(['aux', 'aht', 'hold']);
      var a = agents[ci]; a.culprit = true; a.dim = dim;
      if (dim === 'aux') { a.aux = r1(rand(24, 34)); a.calls = Math.round(a.calls * 0.6); }
      else if (dim === 'aht') { a.aht = Math.round(teamAht * rand(1.4, 1.65)); a.calls = Math.round(a.calls * 0.7); }
      else { a.hold = r1(rand(18, 26)); a.calls = Math.round(a.calls * 0.75); }

      // arrival-pattern insight (informational — helps next week's forecast)
      var peakDay = DOW[dayRes.reduce(function (best, dr, idx, arr) { return dr.calls > arr[best].calls ? idx : best; }, 0)];
      var arrivals = [
        'Volume peaked on <b>' + peakDay + '</b> this week — front-load your roster earlier in the week.',
        'Calls arrived heaviest in the late morning; mid-afternoon ran quieter than the daily average.',
        'A short, sharp spike hit after lunch most days — brief understaffing drove a chunk of the abandonment.',
        'Mornings ran hotter than the forecast shape assumed — consider weighting earlier intervals.'
      ];
      return { agents: agents, culprit: ci, dim: dim, teamAht: teamAht, arrival: pick(arrivals), resolved: false, outcome: '' };
    }

    function enterReview() {
      S.phase = 'review'; save();
      var R = S.reviewData;
      var c = [];
      c.push('<div class="advisor"><div class="face">📎</div><div><b>Clippo:</b> ' +
        (R.resolved ? 'Reviewing the data every week is how you catch problems before the client does.' :
          'Read the agent stats against the team average. Someone gaming AUX, wrap or hold will stick out — flag them to a Team Leader to act.') + '</div></div>');

      // arrival insight
      c.push('<div class="panel"><h4>📞 How &amp; when calls arrived</h4><p class="small">' + R.arrival + '</p></div>');

      // agent audit
      c.push('<div class="panel"><h3>🕵️ Agent behaviour audit</h3>' +
        '<p class="small">' + (R.resolved ? 'Audit closed.' : 'Spot the agent whose numbers are out of line with the team, then escalate to their Team Leader.') + '</p>');
      c.push('<table class="grid"><thead><tr><th>Agent</th><th>Calls<br>handled</th><th>AHT</th><th>Not-ready<br>(AUX) %</th><th>Hold %</th>' + (R.resolved ? '' : '<th>Action</th>') + '</tr></thead><tbody>');
      for (var i = 0; i < R.agents.length; i++) {
        var a = R.agents[i];
        var rowCls = (R.resolved && i === R.culprit) ? 'cul' : '';
        c.push('<tr class="' + rowCls + '"><td class="day">' + a.name + (R.resolved && i === R.culprit ? ' ⚠️' : '') + '</td>' +
          '<td>' + a.calls + '</td><td>' + a.aht + 's</td><td>' + a.aux + '%</td><td>' + a.hold + '%</td>' +
          (R.resolved ? '' : '<td><button class="btn" data-coach="' + i + '" style="min-width:64px;padding:2px 8px">Coach</button></td>') + '</tr>');
      }
      // team average row
      var avgAht = Math.round(sum(R.agents.map(function (x) { return x.aht; })) / R.agents.length);
      var avgAux = r1(sum(R.agents.map(function (x) { return x.aux; })) / R.agents.length);
      var avgHold = r1(sum(R.agents.map(function (x) { return x.hold; })) / R.agents.length);
      var avgCalls = Math.round(sum(R.agents.map(function (x) { return x.calls; })) / R.agents.length);
      c.push('<tr class="avg"><td class="day">Team average</td><td>' + avgCalls + '</td><td>' + avgAht + 's</td><td>' + avgAux + '%</td><td>' + avgHold + '%</td>' + (R.resolved ? '' : '<td>—</td>') + '</tr>');
      c.push('</tbody></table>');

      if (R.resolved) {
        c.push('<div class="fx-reveal" style="margin-top:8px">' + R.outcome + '</div>');
      } else {
        c.push('<div class="row" style="margin-top:8px"><button class="btn" id="noaction">No issues — take no action</button>' +
          '<span class="small muted">Flagging the wrong person dents team morale, so read the numbers carefully.</span></div>');
      }
      c.push('</div>');

      c.push('<div class="row"><span class="spacer"></span><button class="btn big-btn" id="next">' +
        (S.week + 1 >= CFG.WEEKS ? 'Finish the year ▶' : 'Continue to Monday, Week ' + (S.week + 2) + ' ▶') + '</button></div>');

      $('screen').innerHTML = c.join('');
      if (!R.resolved) {
        var btns = $('screen').querySelectorAll('button[data-coach]');
        for (var b = 0; b < btns.length; b++) btns[b].addEventListener('click', function (e) { resolveReview(parseInt(e.target.dataset.coach, 10)); });
        $('noaction').addEventListener('click', function () { resolveReview(-1); });
      }
      $('next').addEventListener('click', nextWeek);
      setStatus('Data review — investigate the week and act on what you find.');
    }

    function resolveReview(idx) {
      var R = S.reviewData;
      if (R.resolved) return;
      R.resolved = true;
      var culpritName = R.agents[R.culprit].name;
      var dimText = { aux: 'excessive not-ready (AUX) time', aht: 'inflated handle times', hold: 'parking callers on hold' }[R.dim];
      if (idx === -1) {
        R.outcome = '🤷 You let it slide. ' + culpritName + ' was quietly ' + dimText + ' — the dodgy-behaviour index stays where it is.';
      } else if (idx === R.culprit) {
        S.dodgy = clamp(S.dodgy - 0.05, 0, 1);
        S.trust.team = clamp(S.trust.team + 2, 0, 100);
        R.outcome = '✅ Good catch — ' + culpritName + ' was ' + dimText + '. Escalated to their TL and coached. Dodgy-behaviour index drops to <b>' + pct(S.dodgy) + '</b> and the TLs respect the data-driven call (Team +2).';
      } else {
        S.trust.team = clamp(S.trust.team - 1, 0, 100);
        R.outcome = '❌ ' + R.agents[idx].name + '\'s numbers were within normal range — the real culprit was <b>' + culpritName + '</b> (' + dimText + '). Singling out the wrong person stung morale (Team −1).';
      }
      save();
      renderHUD();
      enterReview();
    }

    function nextWeek() {
      if (S.budget < CFG.BANKRUPT) return gameOver('finance');
      if (S.trust.client <= CFG.CLIENT_FLOOR) return gameOver('client');
      if (S.hc < CFG.MIN_HC) return gameOver('ops');
      S.week++;
      if (S.week >= CFG.WEEKS) return yearEnd();
      save();
      enterMeeting();
    }

    /* =======================================================================
       END STATES
       ======================================================================= */
    function gameOver(kind) {
      S.phase = 'over'; save();
      var map = {
        finance: ['💸 Funding pulled', 'The budget ran too deep into the red (' + money(S.budget) + '). Finance has pulled the plug on the operation.'],
        client: ['📞 Account lost', 'After chronic service-level misses, client trust hit rock bottom and they\'ve taken the contract elsewhere.'],
        ops: ['🏚️ Operational collapse', 'Headcount fell to ' + S.hc + ' — there aren\'t enough agents left to run the floor. The wheels came off.']
      };
      var msg = map[kind];
      $('screen').innerHTML = '<div class="panel center"><h3>' + msg[0] + '</h3><p>' + msg[1] + '</p>' +
        '<p class="small muted">You reached Week ' + (S.week + 1) + ' with a YTD service level of <b>' + pct1(ytdSLA()) + '</b>.</p>' +
        '<p style="margin-top:12px"><button class="btn big-btn" id="restart">Start a new financial year</button></p></div>';
      $('restart').addEventListener('click', confirmNew);
      setStatus('Game over.');
    }

    function yearEnd() {
      S.phase = 'over'; save();
      var y = ytdSLA(), budgetOK = S.budget >= 0, grade, blurb;
      if (y >= CFG.SLA_TARGET && budgetOK && S.trust.client >= 60) { grade = 'A — WFM Analyst of the Year'; blurb = 'You held the line all year, kept the books black and the client delighted. Textbook workforce management.'; }
      else if (y >= CFG.SLA_TARGET - 0.01) { grade = budgetOK ? 'B — Target met' : 'B− — Target met, over budget'; blurb = 'You delivered the service level. ' + (budgetOK ? 'Solid year.' : 'It cost more than it should have, but the number is the number.'); }
      else if (y >= CFG.SLA_TARGET - 0.05) { grade = 'C — Near miss'; blurb = 'So close. A few better-planned weeks and you\'d have held 80.'; }
      else { grade = 'D — Below standard'; blurb = 'The year-to-date service level slipped well under target. Tough year in the chair.'; }
      if (y > bestSLA()) saveBest(y);

      $('screen').innerHTML = '<div class="panel center"><h3>🎓 Financial year complete!</h3>' +
        '<div class="kpi-strip" style="margin:10px 0">' +
          '<div class="kpi"><div class="k">Final YTD service</div><div class="v ' + (y >= CFG.SLA_TARGET ? 'good' : 'bad') + '">' + pct1(y) + '</div></div>' +
          '<div class="kpi"><div class="k">Budget</div><div class="v ' + (budgetOK ? 'good' : 'bad') + '">' + money(S.budget) + '</div></div>' +
          '<div class="kpi"><div class="k">Headcount</div><div class="v">' + S.hc + '</div></div>' +
          '<div class="kpi"><div class="k">Client trust</div><div class="v">' + Math.round(S.trust.client) + '</div></div></div>' +
        '<h3 style="margin-top:8px">' + grade + '</h3><p>' + blurb + '</p>' +
        '<p class="small muted">Best YTD service level on this machine: ' + pct1(bestSLA()) + '</p>' +
        '<p style="margin-top:12px"><button class="btn big-btn" id="restart">Play another year</button></p></div>';
      $('restart').addEventListener('click', confirmNew);
      setStatus('Year complete — ' + grade);
    }

    function bestSLA() { try { return parseFloat(localStorage.getItem('wfm_best') || CFG.SLA_TARGET); } catch (e) { return CFG.SLA_TARGET; } }
    function saveBest(v) { try { localStorage.setItem('wfm_best', String(v)); } catch (e) {} }

    /* =======================================================================
       ADVISOR (Clippo)
       ======================================================================= */
    function advisorMeetingTip(first, prev) {
      if (first) return 'You start mildly under-staffed on purpose. Weekdays carry all the volume now — Monday is your biggest day.';
      if (prev && prev.sla < prev.committed) return 'You missed your commitment. Owning it costs less trust long-term than spin the data later contradicts.';
      if (S.engagement < 50) return 'Engagement is low — that\'s feeding sick leave, AUX abuse and attrition all at once. An engagement initiative is cheaper than constant rehiring.';
      if (S.trust.fin < 45) return 'Finance trust is low, so they won\'t approve hires. Run a tight, profitable week or two to win them back before you ask.';
      return 'Watch the grilling answers — the room\'s reaction is hidden until you commit to a line, so think before you pick.';
    }
    function advisorForecastTip() {
      if (S.campaign) return 'The business says the campaign adds ~10%. Your historical campaigns ran hotter — trust your data over their optimism, or you\'ll under-staff.';
      if (weekHasHoliday(S.week)) return 'Holiday week: a public holiday runs at a fraction of normal volume, so your weekly total should come in lower than a standard week.';
      if (CFG.SEASON[S.week] >= 1.2) return 'Peak season — the recent average will lag the climb. Forecast above last week, not at it.';
      return 'The recent average is your anchor; then adjust for the trend, the season and anything in the signals box.';
    }
    function advisorPlanTip() {
      if (CFG.SEASON[S.week] >= 1.2) return 'Heavy week — if you didn\'t hire weeks ago, lean on overtime and accept some occupancy pain.';
      if (weekHasHoliday(S.week)) return 'Holiday week: volume drops but so does your available staff (leave), and rostering the holiday costs penalty rates. Plan light, not absent.';
      return '"Roster needed" already grosses up for shrinkage — that\'s why it\'s bigger than "on phones needed". You staff bodies, not just seats.';
    }
    function advisorResultTip(res) {
      if (res.fErr >= 0.15) return 'Your forecast was off by ' + pct(res.fErr) + ' — that\'s most of why the staffing missed. Forecasting accurately is the whole foundation.';
      if (res.occ > 0.9) return 'Occupancy over 90% hits SLA today and burns the team for next month. High occupancy is borrowed against future attrition.';
      if (!res.hit && res.sla >= CFG.SLA_TARGET) return 'You beat the 80% target but missed your own commitment — calibration matters as much as performance in that room.';
      if (res.quits >= 2) return 'That attrition spike will bite in 4 weeks when you\'re short again. Engagement now is cheaper than recruitment later.';
      if (res.sla < CFG.SLA_TARGET) return 'Under target. Was it the forecast, shrinkage or AHT? The data review will help you find out.';
      return 'Clean week. Now review the data — catching a dodgy agent compounds over the year.';
    }

    /* =======================================================================
       DIALOGS / MENU
       ======================================================================= */
    function dialog(title, bodyHTML, actions) {
      $('dlg-title').textContent = title;
      $('dlg-body').innerHTML = bodyHTML;
      var act = $('dlg-actions'); act.innerHTML = '';
      (actions || [{ t: 'OK', f: closeDialog }]).forEach(function (a) {
        var b = document.createElement('button'); b.className = 'btn'; b.textContent = a.t;
        b.addEventListener('click', a.f); act.appendChild(b);
      });
      $('dlg').style.display = 'flex';
    }
    function closeDialog() { $('dlg').style.display = 'none'; }

    function confirmNew() {
      dialog('New game', 'Start a fresh financial year? Your current game will be erased.', [
        { t: 'Start fresh', f: function () { closeDialog(); newGame(); } },
        { t: 'Cancel', f: closeDialog }
      ]);
    }
    function showHelp() {
      dialog('How to Play — WFM Tycoon',
        '<p>You are <b>Workforce Management</b> for a contact centre open <b>Monday–Friday</b>. Survive a 52-week financial year keeping the <b>service level near ' + pct(CFG.SLA_TARGET) + '</b>.</p>' +
        '<p style="margin-top:8px"><b>Each week:</b></p><ol style="margin-left:18px">' +
        '<li><b>Monday meeting</b> — answer the grilling (effects are hidden until you pick — one option is a trap), spend <b>political capital</b> on asks, then <b>commit</b> to a number.</li>' +
        '<li><b>Forecast</b> — study the historical data and signals, then <b>set the week\'s expected call volume yourself</b>. Your number drives staffing.</li>' +
        '<li><b>Plan</b> — spread your workforce across Mon–Fri to cover your forecast.</li>' +
        '<li><b>Run</b> — reality hits (sick leave, dodgy AUX/wrap, volume swings) and the actuals land.</li>' +
        '<li><b>Review the data</b> — investigate agent behaviour and arrival patterns; catch the agent gaming the system and coach them via their TL.</li>' +
        '</ol>' +
        '<p style="margin-top:8px"><b>You lose if:</b> the budget collapses, the client walks, or the floor empties through attrition.</p>' +
        '<p style="margin-top:8px" class="muted">Tips: forecast accuracy is everything — under-forecast and you under-staff; training takes ' + CFG.TRAIN_WEEKS + ' weeks so hire ahead of the December peak; high occupancy = future burnout. Progress autosaves.</p>',
        [{ t: 'Got it', f: closeDialog }]);
    }
    function showAbout() {
      dialog('About', '<p><b>WFM Tycoon — Service Level 80</b></p><p>A workforce-management sim: player-driven forecasting, Erlang staffing, shrinkage, data review, and the politics of the Monday meeting. Built for mondayjeffrey.com.</p><p class="small muted">Erlang C engine, AU public-holiday calendar, Mon–Fri operation, FY26/27.</p>', [{ t: 'Close', f: closeDialog }]);
    }

    function setStatus(s) { $('status-left').textContent = s; $('status-right').textContent = 'YTD ' + pct1(ytdSLA()) + ' · ' + money(S.budget); }

    /* =======================================================================
       BOOT
       ======================================================================= */
    function resume() {
      renderHUD();
      if (S.phase === 'forecast') enterForecast();
      else if (S.phase === 'planning') enterPlanning();
      else if (S.phase === 'results' && S.lastResult) drawResults(S.lastResult);
      else if (S.phase === 'review' && S.reviewData) enterReview();
      else if (S.phase === 'over') { if (S.week >= CFG.WEEKS) yearEnd(); else enterMeeting(); }
      else enterMeeting();
    }

    $('m-new').addEventListener('click', confirmNew);
    $('m-help').addEventListener('click', showHelp);
    $('m-about').addEventListener('click', showAbout);

    var saved = load();
    if (saved && typeof saved.week === 'number') {
      S = saved;
      if (!S.trust) S.trust = { ops: 60, fin: 56, client: 62, team: 58 };
      if (S.ahtSkill == null) S.ahtSkill = 1.0;
      if (!S.weekInits) S.weekInits = { engagement: false, coaching: false, training: false };
      if (!S.callHistory) S.callHistory = [];
      if (!S.history) S.history = [];
      resume();
    } else {
      renderHUDPlaceholder();
      $('screen').innerHTML = '<div class="panel center"><h3>📞 WFM Tycoon — Service Level 80</h3>' +
        '<p>Run workforce management for a contact centre across one financial year.</p>' +
        '<p class="small muted">Forecast the calls yourself from real data, staff with Erlang, fight shrinkage, sick leave, dodgy phone behaviour, attrition and the budget — review the data each week and front up to the business every Monday. Hold the service level at <b>' + pct(CFG.SLA_TARGET) + '</b> (open Mon–Fri).</p>' +
        '<p style="margin-top:14px"><button class="btn big-btn" id="start">Start the financial year ▶</button></p>' +
        '<p class="small"><a href="#" id="howto">How to play</a></p></div>';
      $('start').addEventListener('click', newGame);
      $('howto').addEventListener('click', function (e) { e.preventDefault(); showHelp(); });
      setStatusBoot();
    }

    function renderHUDPlaceholder() { $('hud').innerHTML = '<div class="hud-cell" style="grid-column:1/-1"><div class="k">Welcome</div><div class="v">WFM Tycoon</div><div class="hud-sub">Press start to begin FY26/27</div></div>'; }
    function setStatusBoot() { $('status-left').textContent = 'Ready. Press start to begin.'; $('status-right').textContent = 'Best YTD ' + pct1(bestSLA()); }

  })();
  </script>
</body>
</html>
