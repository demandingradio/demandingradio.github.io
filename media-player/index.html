<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Player - Monday Jeffrey</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #008080;
      font-family: 'Arial', sans-serif;
      font-size: 12px;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: 40px;
    }

    /* The Window */
    .window {
      width: 420px;
      background-color: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-bottom: 2px solid #404040;
      border-right: 2px solid #404040;
      box-shadow: 1px 1px 0 #000000;
    }

    /* Title bar */
    .title-bar {
      background: linear-gradient(90deg, #000080 0%, #1084d0 100%);
      color: white;
      padding: 3px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: bold;
      font-size: 12px;
    }

    .title-bar-text {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .title-bar-buttons {
      display: flex;
      gap: 2px;
    }

    .title-btn {
      width: 16px;
      height: 14px;
      background-color: #c0c0c0;
      border-top: 1px solid #ffffff;
      border-left: 1px solid #ffffff;
      border-bottom: 1px solid #404040;
      border-right: 1px solid #404040;
      color: black;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-family: 'Marlett', sans-serif;
      font-weight: bold;
    }

    .title-btn:active {
      border-top: 1px solid #404040;
      border-left: 1px solid #404040;
      border-bottom: 1px solid #ffffff;
      border-right: 1px solid #ffffff;
    }

    /* Menu bar */
    .menu-bar {
      background-color: #c0c0c0;
      padding: 2px 4px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #808080;
    }

    .menu-item {
      padding: 1px 6px;
      cursor: pointer;
    }

    .menu-item:hover {
      background-color: #000080;
      color: white;
    }

    .menu-item u {
      text-decoration: underline;
    }

    /* Main content */
    .content {
      padding: 8px;
    }

    /* Display screen */
    .display {
      background-color: #000000;
      color: #00ff00;
      padding: 8px;
      border-top: 2px solid #404040;
      border-left: 2px solid #404040;
      border-bottom: 2px solid #ffffff;
      border-right: 2px solid #ffffff;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .display-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    .now-playing {
      font-weight: bold;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 4px;
    }

    /* Progress bar */
    .progress-container {
      background-color: #000000;
      height: 12px;
      border-top: 2px solid #404040;
      border-left: 2px solid #404040;
      border-bottom: 2px solid #ffffff;
      border-right: 2px solid #ffffff;
      margin-bottom: 8px;
      cursor: pointer;
      position: relative;
    }

    .progress-bar {
      background-color: #000080;
      height: 100%;
      width: 0%;
      transition: width 0.1s linear;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 4px;
      justify-content: center;
      margin-bottom: 8px;
    }

    .control-btn {
      width: 36px;
      height: 28px;
      background-color: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-bottom: 2px solid #404040;
      border-right: 2px solid #404040;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-family: Arial, sans-serif;
    }

    .control-btn:active,
    .control-btn.active {
      border-top: 2px solid #404040;
      border-left: 2px solid #404040;
      border-bottom: 2px solid #ffffff;
      border-right: 2px solid #ffffff;
    }

    /* Playlist */
    .playlist-label {
      font-size: 11px;
      margin-bottom: 4px;
    }

    .playlist {
      background-color: #ffffff;
      border-top: 2px solid #404040;
      border-left: 2px solid #404040;
      border-bottom: 2px solid #ffffff;
      border-right: 2px solid #ffffff;
      height: 120px;
      overflow-y: auto;
      font-size: 12px;
    }

    .playlist-item {
      padding: 3px 6px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }

    .playlist-item:hover {
      background-color: #d4d4d4;
    }

    .playlist-item.playing {
      background-color: #000080;
      color: white;
    }

    .playlist-item .duration {
      color: #606060;
    }

    .playlist-item.playing .duration {
      color: #c0c0c0;
    }

    /* Status bar */
    .status-bar {
      background-color: #c0c0c0;
      padding: 2px 4px;
      border-top: 1px solid #ffffff;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-top: 8px;
    }

    .status-cell {
      padding: 1px 6px;
      border-top: 1px solid #404040;
      border-left: 1px solid #404040;
      border-bottom: 1px solid #ffffff;
      border-right: 1px solid #ffffff;
    }

    /* Back link as taskbar icon */
    #taskbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40px;
      background-color: #c0c0c0;
      border-top: 2px solid #ffffff;
      display: flex;
      align-items: center;
      padding: 0 4px;
      gap: 4px;
    }

    #start-btn {
      height: 30px;
      padding: 0 8px;
      background-color: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-bottom: 2px solid #404040;
      border-right: 2px solid #404040;
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      color: black;
    }

    .taskbar-app {
      height: 30px;
      padding: 0 8px;
      background-color: #c0c0c0;
      border-top: 2px solid #404040;
      border-left: 2px solid #404040;
      border-bottom: 2px solid #ffffff;
      border-right: 2px solid #ffffff;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
    }

    #clock {
      margin-left: auto;
      height: 30px;
      padding: 0 8px;
      background-color: #c0c0c0;
      border-top: 2px solid #404040;
      border-left: 2px solid #404040;
      border-bottom: 2px solid #ffffff;
      border-right: 2px solid #ffffff;
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="window">
    <div class="title-bar">
      <div class="title-bar-text">
        <span>♪</span>
        <span>Media Player</span>
      </div>
      <div class="title-bar-buttons">
        <div class="title-btn">_</div>
        <div class="title-btn">□</div>
        <a href="../index.html" style="text-decoration:none;color:black;"><div class="title-btn">×</div></a>
      </div>
    </div>

    <div class="menu-bar">
      <div class="menu-item"><u>F</u>ile</div>
      <div class="menu-item"><u>E</u>dit</div>
      <div class="menu-item"><u>D</u>evice</div>
      <div class="menu-item"><u>S</u>cale</div>
      <div class="menu-item"><u>H</u>elp</div>
    </div>

    <div class="content">
      <div class="display">
        <div class="now-playing" id="now-playing">No track selected</div>
        <div class="display-row">
          <span id="current-time">00:00</span>
          <span id="total-time">00:00</span>
        </div>
      </div>

      <div class="progress-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="controls">
        <button class="control-btn" id="prev-btn" title="Previous">|◄◄</button>
        <button class="control-btn" id="play-btn" title="Play/Pause">►</button>
        <button class="control-btn" id="stop-btn" title="Stop">■</button>
        <button class="control-btn" id="next-btn" title="Next">►►|</button>
      </div>

      <div class="playlist-label">Playlist:</div>
      <div class="playlist" id="playlist"></div>

      <div class="status-bar">
        <div class="status-cell" id="status-text">Ready</div>
        <div class="status-cell" id="track-count">0 / 0</div>
      </div>
    </div>
  </div>

  <audio id="audio"></audio>

  <div id="taskbar">
    <a href="../index.html" id="start-btn">
      <span>⊞</span> Start
    </a>
    <div class="taskbar-app">
      <span>♪</span> Media Player
    </div>
    <div id="clock"></div>
  </div>

  <script>
    const tracks = [
      { title: "LLM - Busters Song", file: "songs/LLM%20-%20Busters%20Song.mp3" },
      { title: "God - Have mercy on me, O God", file: "songs/God%20-%20Have%20mercy%20on%20me,%20O%20God.mp3" },
      { title: "No thing", file: "songs/No%20thing.mp3" }
    ];

    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play-btn');
    const stopBtn = document.getElementById('stop-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const nowPlaying = document.getElementById('now-playing');
    const currentTime = document.getElementById('current-time');
    const totalTime = document.getElementById('total-time');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const playlist = document.getElementById('playlist');
    const statusText = document.getElementById('status-text');
    const trackCount = document.getElementById('track-count');

    let currentTrack = 0;
    let isPlaying = false;

    function formatTime(seconds) {
      if (isNaN(seconds)) return '00:00';
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = Math.floor(seconds % 60).toString().padStart(2, '0');
      return m + ':' + s;
    }

    function renderPlaylist() {
      playlist.innerHTML = '';
      tracks.forEach((track, i) => {
        const item = document.createElement('div');
        item.className = 'playlist-item' + (i === currentTrack ? ' playing' : '');
        item.innerHTML = '<span>' + (i + 1) + '. ' + track.title + '</span><span class="duration"></span>';
        item.addEventListener('click', () => {
          currentTrack = i;
          loadTrack();
          play();
        });
        playlist.appendChild(item);
      });
      trackCount.textContent = (currentTrack + 1) + ' / ' + tracks.length;
    }

    function loadTrack() {
      audio.src = tracks[currentTrack].file;
      nowPlaying.textContent = '♪ ' + tracks[currentTrack].title;
      renderPlaylist();
    }

    function play() {
      audio.play();
      isPlaying = true;
      playBtn.textContent = '❚❚';
      statusText.textContent = 'Playing';
    }

    function pause() {
      audio.pause();
      isPlaying = false;
      playBtn.textContent = '►';
      statusText.textContent = 'Paused';
    }

    function stop() {
      audio.pause();
      audio.currentTime = 0;
      isPlaying = false;
      playBtn.textContent = '►';
      statusText.textContent = 'Stopped';
    }

    function next() {
      currentTrack = (currentTrack + 1) % tracks.length;
      loadTrack();
      if (isPlaying) play();
    }

    function prev() {
      currentTrack = (currentTrack - 1 + tracks.length) % tracks.length;
      loadTrack();
      if (isPlaying) play();
    }

    playBtn.addEventListener('click', () => {
      if (!audio.src) loadTrack();
      isPlaying ? pause() : play();
    });

    stopBtn.addEventListener('click', stop);
    nextBtn.addEventListener('click', next);
    prevBtn.addEventListener('click', prev);

    audio.addEventListener('timeupdate', () => {
      currentTime.textContent = formatTime(audio.currentTime);
      if (audio.duration) {
        progressBar.style.width = (audio.currentTime / audio.duration * 100) + '%';
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      totalTime.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', next);

    progressContainer.addEventListener('click', (e) => {
      if (!audio.duration) return;
      const rect = progressContainer.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pct * audio.duration;
    });

    function updateClock() {
      const now = new Date();
      const h = now.getHours().toString().padStart(2, '0');
      const m = now.getMinutes().toString().padStart(2, '0');
      document.getElementById('clock').textContent = h + ':' + m;
    }
    updateClock();
    setInterval(updateClock, 10000);

    renderPlaylist();
    loadTrack();
  </script>

</body>
</html>
