<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Player - Monday Jeffrey</title>
  <link rel="stylesheet" href="../assets/win95.css">
  <style>
    /* Media-player-specific styles */
    .window { width: 420px; }

    .content { padding: 8px; }

    .display {
      background-color: #000000;
      color: #00ff00;
      padding: 8px;
      border-top: 2px solid #404040;
      border-left: 2px solid #404040;
      border-bottom: 2px solid #ffffff;
      border-right: 2px solid #ffffff;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .display-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    .now-playing {
      font-weight: bold;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 4px;
    }

    .progress-container {
      background-color: #000000;
      height: 12px;
      border-top: 2px solid #404040;
      border-left: 2px solid #404040;
      border-bottom: 2px solid #ffffff;
      border-right: 2px solid #ffffff;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .progress-bar {
      background-color: #000080;
      height: 100%;
      width: 0%;
      transition: width 0.1s linear;
    }

    .controls {
      display: flex;
      gap: 4px;
      justify-content: center;
      margin-bottom: 8px;
    }

    .control-btn {
      width: 36px;
      height: 28px;
      background-color: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-bottom: 2px solid #404040;
      border-right: 2px solid #404040;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-family: Arial, sans-serif;
    }

    .control-btn:active {
      border-top: 2px solid #404040;
      border-left: 2px solid #404040;
      border-bottom: 2px solid #ffffff;
      border-right: 2px solid #ffffff;
    }

    .playlist-label {
      font-size: 11px;
      margin-bottom: 4px;
    }

    .playlist {
      background-color: #ffffff;
      border-top: 2px solid #404040;
      border-left: 2px solid #404040;
      border-bottom: 2px solid #ffffff;
      border-right: 2px solid #ffffff;
      height: 120px;
      overflow-y: auto;
      font-size: 12px;
    }

    .playlist-item {
      padding: 3px 6px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }

    .playlist-item:hover {
      background-color: #d4d4d4;
    }

    .playlist-item.playing {
      background-color: #000080;
      color: white;
    }
  </style>
</head>
<body>

  <div class="window" data-title="Media Player" data-icon="&#9835;" data-close-href="../index.html">
    <div class="title-bar">
      <div class="title-bar-text">
        <span>&#9835;</span>
        <span>Media Player</span>
      </div>
      <div class="title-bar-buttons">
        <div class="title-btn minimize">_</div>
        <div class="title-btn maximize">&#9633;</div>
        <div class="title-btn close">&times;</div>
      </div>
    </div>

    <div class="menu-bar">
      <div class="menu-item"><u>F</u>ile</div>
      <div class="menu-item"><u>E</u>dit</div>
      <div class="menu-item"><u>D</u>evice</div>
      <div class="menu-item"><u>S</u>cale</div>
      <div class="menu-item"><u>H</u>elp</div>
    </div>

    <div class="content">
      <div class="display">
        <div class="now-playing" id="now-playing">No track selected</div>
        <div class="display-row">
          <span id="current-time">00:00</span>
          <span id="total-time">00:00</span>
        </div>
      </div>

      <div class="progress-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="controls">
        <button class="control-btn" id="prev-btn" title="Previous">|&#9664;&#9664;</button>
        <button class="control-btn" id="play-btn" title="Play/Pause">&#9658;</button>
        <button class="control-btn" id="stop-btn" title="Stop">&#9632;</button>
        <button class="control-btn" id="next-btn" title="Next">&#9654;&#9654;|</button>
      </div>

      <div class="playlist-label">Playlist:</div>
      <div class="playlist" id="playlist"></div>

      <div class="status-bar" style="margin-top: 8px;">
        <div class="status-cell" id="status-text">Ready</div>
        <div class="status-cell" id="track-count" style="flex: 0 0 auto;">0 / 0</div>
      </div>
    </div>
  </div>

  <audio id="audio"></audio>

  <div class="taskbar">
    <a href="../index.html" class="start-btn">
      <span>&#8862;</span> Start
    </a>
    <div class="taskbar-divider"></div>
    <div class="taskbar-apps"></div>
    <div class="clock"></div>
  </div>

  <script src="../assets/win95.js"></script>
  <script>
    const tracks = [
      { title: "LLM - Busters Song", file: "songs/LLM%20-%20Busters%20Song.mp3" },
      { title: "God - Have mercy on me, O God", file: "songs/God%20-%20Have%20mercy%20on%20me,%20O%20God.mp3" },
      { title: "No thing", file: "songs/No%20thing.mp3" }
    ];

    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play-btn');
    const stopBtn = document.getElementById('stop-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const nowPlaying = document.getElementById('now-playing');
    const currentTime = document.getElementById('current-time');
    const totalTime = document.getElementById('total-time');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const playlist = document.getElementById('playlist');
    const statusText = document.getElementById('status-text');
    const trackCount = document.getElementById('track-count');

    let currentTrack = 0;
    let isPlaying = false;

    function formatTime(seconds) {
      if (isNaN(seconds)) return '00:00';
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = Math.floor(seconds % 60).toString().padStart(2, '0');
      return m + ':' + s;
    }

    function renderPlaylist() {
      playlist.innerHTML = '';
      tracks.forEach((track, i) => {
        const item = document.createElement('div');
        item.className = 'playlist-item' + (i === currentTrack ? ' playing' : '');
        item.textContent = (i + 1) + '. ' + track.title;
        item.addEventListener('click', () => {
          currentTrack = i;
          loadTrack();
          play();
        });
        playlist.appendChild(item);
      });
      trackCount.textContent = (currentTrack + 1) + ' / ' + tracks.length;
    }

    function loadTrack() {
      audio.src = tracks[currentTrack].file;
      nowPlaying.textContent = '♪ ' + tracks[currentTrack].title;
      renderPlaylist();
    }

    function play() {
      audio.play();
      isPlaying = true;
      playBtn.innerHTML = '&#10074;&#10074;';
      statusText.textContent = 'Playing';
    }

    function pause() {
      audio.pause();
      isPlaying = false;
      playBtn.innerHTML = '&#9658;';
      statusText.textContent = 'Paused';
    }

    function stop() {
      audio.pause();
      audio.currentTime = 0;
      isPlaying = false;
      playBtn.innerHTML = '&#9658;';
      statusText.textContent = 'Stopped';
    }

    function next() {
      currentTrack = (currentTrack + 1) % tracks.length;
      loadTrack();
      if (isPlaying) play();
    }

    function prev() {
      currentTrack = (currentTrack - 1 + tracks.length) % tracks.length;
      loadTrack();
      if (isPlaying) play();
    }

    playBtn.addEventListener('click', () => {
      if (!audio.src) loadTrack();
      isPlaying ? pause() : play();
    });

    stopBtn.addEventListener('click', stop);
    nextBtn.addEventListener('click', next);
    prevBtn.addEventListener('click', prev);

    audio.addEventListener('timeupdate', () => {
      currentTime.textContent = formatTime(audio.currentTime);
      if (audio.duration) {
        progressBar.style.width = (audio.currentTime / audio.duration * 100) + '%';
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      totalTime.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', next);

    progressContainer.addEventListener('click', (e) => {
      if (!audio.duration) return;
      const rect = progressContainer.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pct * audio.duration;
    });

    renderPlaylist();
    loadTrack();
  </script>

</body>
</html>
