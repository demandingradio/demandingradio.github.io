<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WFM Tycoon Y - Monday Jeffrey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ===================================================================
       WFM TYCOON Y — modern "Game Dev Tycoon"-style skin.
       Same game engine; this is a full-page reskin. All class/ID hooks
       below match what the shared game JS renders.
       =================================================================== */
    :root {
      --bg: #0f1420; --bg2: #161d2e; --panel: #1b2335; --panel2: #212c42; --panel3: #28344e;
      --line: #313e5c; --line2: #3d4d72; --txt: #e6ecf7; --txt-dim: #9aa8c4; --txt-mute: #6b7896;
      --accent: #4f8cff; --accent2: #7c5cff; --good: #34d399; --bad: #f87171; --warn: #fbbf24; --gold: #ffcf5c;
      --shadow: 0 8px 24px rgba(0,0,0,.35); --radius: 14px; --radius-sm: 9px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(124,92,255,.18), transparent 60%),
        radial-gradient(900px 500px at -10% 110%, rgba(79,140,255,.16), transparent 55%),
        var(--bg);
      color: var(--txt); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow-y: scroll;
    }
    .app { max-width: 1080px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
    .topbar {
      position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 14px; padding: 12px 20px;
      background: rgba(15,20,32,.82); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -.3px; }
    .brand .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: grid; place-items: center; font-size: 18px; box-shadow: 0 4px 14px rgba(79,140,255,.45); }
    .brand small { display: block; font-size: 10px; font-weight: 600; color: var(--txt-mute); letter-spacing: 2px; text-transform: uppercase; }
    .topbar .menu { margin-left: auto; display: flex; gap: 6px; }
    .menu-btn { padding: 7px 13px; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--txt-dim); background: transparent; border: 1px solid transparent; transition: .15s; }
    .menu-btn:hover { color: var(--txt); background: var(--panel2); border-color: var(--line); }
    .wfm-body { padding: 18px 20px 60px; flex: 1; }

    .hud { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr 1.7fr; gap: 12px; margin-bottom: 18px; }
    .hud-cell { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
    .hud-cell::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); opacity: .7; }
    .hud-cell .k { font-size: 10.5px; color: var(--txt-mute); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .hud-cell .v { font-size: 22px; font-weight: 800; letter-spacing: -.5px; margin-top: 2px; }
    .hud-cell .v.sla { font-size: 30px; }
    .hud-sub { font-size: 11px; color: var(--txt-dim); margin-top: 1px; }
    .trust-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 12px; }
    .trust-row { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--txt-dim); }
    .trust-row .tl { width: 50px; font-weight: 600; }
    .trust-row b { color: var(--txt); margin-left: 2px; }
    .meter { flex: 1; height: 7px; background: #0d1320; border-radius: 99px; position: relative; overflow: hidden; border: 1px solid var(--line); }
    .meter > i { position: absolute; left: 0; top: 0; bottom: 0; display: block; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .4s ease; }
    .meter.eng > i { background: linear-gradient(90deg, #34d399, #10b981); }
    .meter.bad > i { background: linear-gradient(90deg, #f87171, #ef4444); }
    .meter.warn > i { background: linear-gradient(90deg, #fbbf24, #f59e0b); }

    .screen { display: flex; flex-direction: column; gap: 14px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
    .panel h3 { font-size: 16px; font-weight: 700; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); letter-spacing: -.2px; }
    .panel h4 { font-size: 13px; font-weight: 700; margin: 14px 0 7px; color: var(--txt-dim); text-transform: uppercase; letter-spacing: .5px; }
    .muted { color: var(--txt-mute); }
    .small { font-size: 12.5px; color: var(--txt-dim); }
    .center { text-align: center; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .spacer { flex: 1; }
    .pill { display: inline-block; padding: 2px 10px; border-radius: 99px; background: var(--panel3); border: 1px solid var(--line2); font-size: 12px; font-weight: 600; color: var(--txt); }
    .good { color: var(--good); font-weight: 700; }
    .bad { color: var(--bad); font-weight: 700; }
    .warn { color: var(--warn); font-weight: 700; }

    .btn { font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 9px 16px; border-radius: 10px; color: var(--txt); background: var(--panel3); border: 1px solid var(--line2); transition: .15s; }
    .btn:hover { background: #32426a; border-color: #5570a0; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn.pressed { background: var(--accent); border-color: var(--accent); color: #fff; }
    .big-btn { min-width: 230px; padding: 13px 22px; font-size: 15px; font-weight: 700; border-radius: 12px; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; box-shadow: 0 6px 20px rgba(79,140,255,.4); }
    .big-btn:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 8px 26px rgba(79,140,255,.5); }
    .sunken { background: #0d1320; border: 1px solid var(--line2); border-radius: 8px; color: var(--txt); }

    .advisor { display: flex; gap: 12px; align-items: flex-start; background: linear-gradient(180deg, rgba(124,92,255,.14), rgba(79,140,255,.08)); border: 1px solid var(--line2); border-radius: var(--radius); padding: 13px 15px; font-size: 13px; color: var(--txt-dim); box-shadow: var(--shadow); }
    .advisor b { color: var(--txt); }
    .advisor .face { font-size: 26px; line-height: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,.4)); }

    .opt { display: block; padding: 11px 14px; margin: 7px 0; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); cursor: pointer; font-size: 13.5px; transition: .14s; }
    .opt:hover { border-color: var(--accent); background: var(--panel3); }
    .opt input { margin-right: 9px; accent-color: var(--accent); transform: translateY(1px); }
    .opt.disabled { color: var(--txt-mute); cursor: not-allowed; background: #131a28; border-style: dashed; }
    .opt.disabled:hover { border-color: var(--line); }
    .cost { font-size: 11.5px; color: var(--txt-mute); }
    .fx-reveal { margin-top: 10px; padding: 11px 14px; border-radius: 10px; font-size: 13px; background: rgba(79,140,255,.1); border: 1px dashed var(--accent); color: var(--txt-dim); min-height: 1.5em; }

    table.grid { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
    table.grid th, table.grid td { padding: 8px 10px; text-align: center; border-bottom: 1px solid var(--line); }
    table.grid th { background: var(--panel3); color: var(--txt-dim); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
    table.grid tbody tr:last-child td { border-bottom: none; }
    table.grid tbody tr:nth-child(odd) td { background: rgba(255,255,255,.012); }
    table.grid td.day { text-align: left; white-space: nowrap; font-weight: 600; }
    table.grid tr.hol td { background: rgba(251,191,36,.12) !important; }
    table.grid tr.avg td { background: var(--panel3) !important; font-weight: 700; color: var(--txt); }
    table.grid tr.cul td { background: rgba(248,113,113,.16) !important; }
    table.grid tr.team-sep td { background: var(--panel3) !important; text-align: left; font-weight: 700; color: var(--accent); }
    table.audit td, table.audit th { padding: 6px 8px; }
    table.audit th.sortable { cursor: pointer; user-select: none; }
    table.audit th.sortable:hover { background: var(--accent); color: #fff; }
    .scroll-x { overflow-x: auto; border-radius: 10px; }
    input.num-in, input.fc-in, input.fc-tot { background: #0d1320; border: 1px solid var(--line2); border-radius: 7px; color: var(--txt); font-family: inherit; text-align: center; font-weight: 700; padding: 5px 4px; outline: none; }
    input.num-in:focus, input.fc-in:focus, input.fc-tot:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79,140,255,.25); }
    .num-in { width: 52px; font-size: 13px; }
    .fc-in { width: 80px; font-size: 14px; }
    .fc-tot { width: 100px; font-size: 16px; }

    .cov { height: 16px; background: #0d1320; border: 1px solid var(--line); border-radius: 99px; position: relative; min-width: 70px; overflow: hidden; }
    .cov > i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #34d399, #10b981); border-radius: 99px; transition: width .3s; }
    .cov.under > i { background: linear-gradient(90deg, #f87171, #ef4444); }
    .cov .lab { position: relative; z-index: 2; font-size: 10px; line-height: 16px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }

    .bar { height: 14px; background: #0d1320; border: 1px solid var(--line); border-radius: 99px; position: relative; min-width: 60px; overflow: hidden; }
    .bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; }

    .kpi-strip { display: flex; gap: 12px; flex-wrap: wrap; }
    .kpi { flex: 1; min-width: 110px; background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 10px; text-align: center; box-shadow: var(--shadow); }
    .kpi .k { font-size: 10.5px; color: var(--txt-mute); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .kpi .v { font-size: 26px; font-weight: 800; letter-spacing: -.5px; margin: 3px 0; }

    .tabs { display: flex; gap: 8px; margin-bottom: 0; }
    .tab { padding: 10px 18px; border-radius: 11px 11px 0 0; background: var(--panel2); border: 1px solid var(--line); border-bottom: none; cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--txt-dim); transition: .14s; margin-bottom: -1px; }
    .tab:hover { color: var(--txt); }
    .tab.active { background: var(--panel); color: var(--txt); position: relative; z-index: 2; box-shadow: 0 -3px 0 var(--accent) inset; }

    .log { font-size: 13px; line-height: 1.7; }
    .log .li { padding: 5px 0; border-bottom: 1px solid var(--line); }
    .log .li:last-child { border-bottom: none; }
    .delta-up { color: var(--good); }
    .delta-dn { color: var(--bad); }

    #dlg { position: fixed; inset: 0; background: rgba(8,11,18,.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 3000; padding: 20px; }
    .dlg-card { background: var(--panel); border: 1px solid var(--line2); border-radius: var(--radius); min-width: 320px; max-width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,.5); overflow: hidden; }
    #dlg-title { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; padding: 13px 18px; font-weight: 700; font-size: 15px; }
    #dlg-body { padding: 18px; font-size: 13.5px; line-height: 1.6; color: var(--txt-dim); max-height: 62vh; overflow: auto; }
    #dlg-body b { color: var(--txt); }
    #dlg-body a { color: var(--accent); }
    #dlg-actions { padding: 0 18px 18px; display: flex; justify-content: flex-end; gap: 10px; }

    .statusbar { display: flex; justify-content: space-between; gap: 10px; padding: 9px 20px; font-size: 12px; color: var(--txt-mute); border-top: 1px solid var(--line); background: rgba(15,20,32,.6); }

    /* ---------- real-time inbox ---------- */
    .inbox-fab { position: fixed; right: 22px; bottom: 22px; z-index: 2500; width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 8px 24px rgba(79,140,255,.5); color: #fff; font-size: 25px; display: flex; align-items: center; justify-content: center; transition: transform .18s; }
    .inbox-fab:hover { transform: translateY(-2px) scale(1.05); }
    .inbox-fab .inbox-count { position: absolute; top: -4px; right: -4px; min-width: 23px; height: 23px; padding: 0 5px; border-radius: 12px; background: var(--bad); color: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg); }
    .inbox-fab.empty .inbox-count { display: none; }
    .inbox-fab.empty { background: linear-gradient(135deg, #39455f, #2c3550); box-shadow: 0 6px 18px rgba(0,0,0,.4); }
    .inbox-fab.urgent { animation: fabpulse 1s infinite; }
    @keyframes fabpulse { 0%,100% { box-shadow: 0 8px 24px rgba(248,113,113,.5); } 50% { box-shadow: 0 8px 36px rgba(248,113,113,.95); } }
    .inbox-panel { position: fixed; right: 22px; bottom: 92px; z-index: 2500; width: 390px; max-width: calc(100vw - 44px); max-height: 72vh; background: var(--panel); border: 1px solid var(--line2); border-radius: var(--radius); box-shadow: 0 22px 60px rgba(0,0,0,.6); display: flex; flex-direction: column; overflow: hidden; }
    .inbox-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--panel2); font-size: 15px; }
    .inbox-head .btn { padding: 4px 10px; min-width: 0; }
    .inbox-flash { padding: 9px 14px; font-size: 12.5px; background: rgba(79,140,255,.12); border-bottom: 1px solid var(--line); color: var(--txt-dim); }
    .inbox-list { overflow-y: auto; padding: 11px; display: flex; flex-direction: column; gap: 11px; }
    .mail { background: var(--panel2); border: 1px solid var(--line); border-radius: 11px; padding: 11px 12px; }
    .mail.urgent { border-color: var(--bad); box-shadow: 0 0 0 1px rgba(248,113,113,.4); }
    .mail-top { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; }
    .mail-from { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; padding: 2px 8px; border-radius: 99px; }
    .mail-from.client { background: rgba(124,92,255,.25); color: #cbb9ff; }
    .mail-from.ops { background: rgba(79,140,255,.22); color: #a9c7ff; }
    .mail-from.finance { background: rgba(52,211,153,.2); color: #86efc5; }
    .mail-from.hr { background: rgba(251,191,36,.2); color: #fcd56b; }
    .mail-from.tl { background: rgba(248,113,113,.2); color: #fca5a5; }
    .mail-subj { font-weight: 700; font-size: 13.5px; }
    .mail-body { font-size: 12.5px; color: var(--txt-dim); margin: 4px 0 8px; line-height: 1.5; }
    .mailbar { height: 5px; border-radius: 99px; background: #0d1320; overflow: hidden; margin-bottom: 9px; }
    .mailbar > i { display: block; height: 100%; border-radius: 99px; transition: width .4s linear; }
    .mail-replies { display: flex; flex-direction: column; gap: 5px; }
    .mail-rep { text-align: left; font-family: inherit; font-size: 12.5px; padding: 8px 11px; border-radius: 8px; background: var(--panel3); border: 1px solid var(--line2); color: var(--txt); cursor: pointer; transition: .12s; }
    .mail-rep:hover { border-color: var(--accent); background: #32426a; }
    .inbox-empty { padding: 26px 16px; text-align: center; color: var(--txt-mute); font-size: 13px; }

    @media (max-width: 820px) { .hud { grid-template-columns: 1fr 1fr; } .hud-cell.trust { grid-column: span 2; } }
    @media (max-width: 520px) { .hud { grid-template-columns: 1fr; } .hud-cell.trust { grid-column: span 1; } .brand small { display: none; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">&#128242;</span>
        <span>WFM Tycoon Y<small>Service Level 80</small></span>
      </div>
      <nav class="menu">
        <div class="menu-btn" id="m-new">New Game</div>
        <div class="menu-btn" id="m-help">How to Play</div>
        <div class="menu-btn" id="m-about">About</div>
        <a class="menu-btn" href="../index.html" style="text-decoration:none">&#10005; Exit</a>
      </nav>
    </header>

    <main class="wfm-body">
      <div class="hud" id="hud"></div>
      <div class="screen" id="screen"></div>
    </main>

    <footer class="statusbar">
      <div id="status-left">Ready.</div>
      <div id="status-right">WFM Tycoon Y</div>
    </footer>
  </div>

  <!-- Real-time inbox overlay (independent of the phase screens) -->
  <button id="inbox-fab" class="inbox-fab empty" style="display:none" title="Inbox">
    <span class="ic">✉️</span>
    <span class="inbox-count" id="inbox-count">0</span>
  </button>
  <div id="inbox-panel" class="inbox-panel" style="display:none">
    <div class="inbox-head"><span>📥</span><b>Inbox</b><span class="small muted" id="inbox-sub"></span><span class="spacer"></span><button class="btn" id="inbox-close">✕</button></div>
    <div class="inbox-flash" id="inbox-flash" style="display:none"></div>
    <div class="inbox-list" id="inbox-list"></div>
  </div>

  <div id="dlg">
    <div class="dlg-card">
      <div id="dlg-title">Message</div>
      <div id="dlg-body"></div>
      <div id="dlg-actions"></div>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    /* =======================================================================
       CONFIG — the iteration knobs.
       ======================================================================= */
    var CFG = {
      WEEKS: 52,
      SLA_TARGET: 0.80,
      SLA_T: 20,
      OPEN_SECONDS: 10 * 3600,
      BASE_CALLS: 3000,
      AHT: 300,

      START_HC: 44,
      START_BUDGET: 120000,
      DAY_COST: 240,
      OT_MULT: 1.5,
      OT_CAP_FRAC: 0.15,

      HIRE_COHORT: 4,
      HIRE_COST_EACH: 1500,
      TRAIN_WEEKS: 4,
      TRAINEE_WK_COST: 1200,

      WEEK_REVENUE: 58000,
      PENALTY_SCALE: 180000,
      BONUS_SCALE: 90000,
      BONUS_CAP: 6000,

      BASE_SHRINK: 0.18,
      COACH_SHRINK: 0.04,
      TRAIN_SHRINK: 0.06,
      BASE_ABSENCE: 0.05,
      WINTER_ABSENCE: 0.02,
      HOLIDAY_ABSENCE: 0.04,

      DODGY_START: 0.10,
      DODGY_AHT_MAX: 0.30,
      DODGY_AVAIL_MAX: 0.10,

      CAPITAL: 3,
      ENG_START: 70,

      BANKRUPT: -60000,
      CLIENT_FLOOR: 8,
      MIN_HC: 22,

      // Real-time inbox: emails land while you play and must be cleared before
      // they expire (ignoring one costs the sender's trust meter). All seconds.
      INBOX: { TICK_MS: 500, TICK: 0.5, FIRST: 22, MIN_GAP: 28, MAX_GAP: 55, TTL: 75, MAX_ACTIVE: 5, EXPIRE: 5 },

      DOW: [1.15, 1.05, 1.00, 0.95, 0.90], // Mon–Fri volume multipliers
      HOLIDAY_VOL: 0.40,
      HOLIDAY_PAY: 2.0,

      // intraday arrival shape (per operating hour, 08:00–18:00). Bimodal, mild.
      OPEN_HOURS: ['08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'],
      INTRADAY: [0.07,0.10,0.12,0.115,0.09,0.085,0.10,0.11,0.105,0.105],

      SEASON: [
        1.00,1.00,1.01,1.02, 1.02,1.03,1.03,1.04,1.05,
        1.06,1.07,1.08,1.08,
        1.09,1.10,1.10,1.11,
        1.13,1.16,1.20,1.25,
        1.30,1.36,1.30,0.80,
        0.72,0.78,
        1.26,1.22,1.14,
        1.08,1.07,1.06,1.06,
        1.05,1.05,1.04,1.03,1.02,
        1.00,0.98,1.00,1.02,
        1.04,1.05,1.06,1.07,
        1.08,1.10,1.12,1.12,1.10
      ]
    };

    var HOLIDAYS = {
      '2026-10-05': 'Labour Day', '2026-11-03': 'Melbourne Cup',
      '2026-12-25': 'Christmas Day', '2026-12-28': 'Boxing Day (obs.)',
      '2027-01-01': "New Year's Day", '2027-01-26': 'Australia Day',
      '2027-03-26': 'Good Friday', '2027-03-29': 'Easter Monday',
      '2027-04-26': 'Anzac Day (obs.)', '2027-06-14': "King's Birthday"
    };

    var START = new Date(2026, 6, 6);
    var DOW = ['Mon','Tue','Wed','Thu','Fri'];
    var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var TEAMS = ['Alpha', 'Bravo', 'Charlie'];
    var AGENT_NAMES = ['Jess R.','Tom H.','Aisha K.','Dylan P.','Mia L.','Sam O.','Priya N.','Jake W.','Chloe T.','Ben F.','Zara M.','Lucas D.','Noah B.','Ava S.','Ethan C.','Ruby G.','Liam K.','Sophie M.','Mason J.','Ivy R.','Oscar P.','Grace L.','Leo T.','Hana W.'];
    var SAVE_KEY = 'wfm_y_tycoon_save_v3';

    /* =======================================================================
       HELPERS
       ======================================================================= */
    function $(id) { return document.getElementById(id); }
    function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }
    function pad(n) { return String(n).padStart(2, '0'); }
    function pct(x) { return Math.round(x * 100) + '%'; }
    function pct1(x) { return (x * 100).toFixed(1) + '%'; }
    function money(x) { return (x < 0 ? '-$' : '$') + Math.abs(Math.round(x)).toLocaleString(); }
    function rand(a, b) { return a + Math.random() * (b - a); }
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function sum(arr) { return arr.reduce(function (a, b) { return a + b; }, 0); }
    function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
    function NDAYS() { return CFG.DOW.length; }
    function weekdaySum() { return sum(CFG.DOW); }
    function dowShare(day) { return CFG.DOW[day] / weekdaySum(); }

    function dateFor(week, day) { var d = new Date(START); d.setDate(d.getDate() + week * 7 + day); return d; }
    function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
    function fmtDate(d) { return d.getDate() + ' ' + MONTHS[d.getMonth()]; }
    function holidayOn(d) { return HOLIDAYS[iso(d)] || null; }
    function monthOfWeek(week) { return dateFor(week, 2).getMonth(); }
    function weekHasHoliday(week) { for (var i = 0; i < NDAYS(); i++) if (holidayOn(dateFor(week, i))) return true; return false; }
    function shortWeek(week) { return fmtDate(dateFor(week, 0)); }
    function weekLabel(week) { var a = dateFor(week, 0), b = dateFor(week, NDAYS() - 1); return fmtDate(a) + ' – ' + fmtDate(b) + ' ' + b.getFullYear(); }

    /* =======================================================================
       ERLANG + INTRADAY
       ======================================================================= */
    function erlangB(N, A) { var B = 1; for (var k = 1; k <= N; k++) B = (A * B) / (k + A * B); return B; }
    function erlangC(N, A) { if (N <= 0) return 1; if (A <= 0) return 0; var rho = A / N; if (rho >= 1) return 1; var B = erlangB(N, A); return clamp(B / (1 - rho * (1 - B)), 0, 1); }
    function serviceLevel(N, A, aht, T) { if (A <= 0) return 1; if (N <= 0) return 0; if (A / N >= 1) return 0; var C = erlangC(N, A); return clamp(1 - C * Math.exp(-(N - A) * T / aht), 0, 1); }
    function occupancy(N, A) { return N <= 0 ? 1 : clamp(A / N, 0, 1); }
    function requiredOnPhones(A, aht, T, target) { var N = Math.max(1, Math.floor(A) + 1); while (serviceLevel(N, A, aht, T) < target) { N++; if (N > 3000) break; } return N; }

    // intraday breakdown for a day: distributes calls across hours; staffing flat.
    function intervalsFor(dayCalls, phones, aht) {
      var n = CFG.INTRADAY.length, iSec = CFG.OPEN_SECONDS / n, arr = [], wsum = sum(CFG.INTRADAY);
      for (var h = 0; h < n; h++) {
        var iCalls = dayCalls * (CFG.INTRADAY[h] / wsum);
        var iA = iCalls * aht / iSec;
        var sl = serviceLevel(phones, iA, aht, CFG.SLA_T);
        var aband = iA >= phones ? iCalls * clamp((iA - phones) / Math.max(iA, 1), 0, 0.6) : iCalls * (1 - sl) * 0.06;
        arr.push({ h: h, calls: iCalls, A: iA, phones: phones, sl: sl, aband: aband });
      }
      return arr;
    }
    // day SL = call-weighted average of interval SLs (so call-flow view agrees with headline)
    function dayServiceLevel(dayCalls, phones, aht) {
      if (dayCalls <= 0) return 1;
      var iv = intervalsFor(dayCalls, phones, aht), ans = 0;
      for (var k = 0; k < iv.length; k++) ans += iv[k].sl * iv[k].calls;
      return ans / dayCalls;
    }
    function dayAbandoned(dayCalls, phones, aht) {
      var iv = intervalsFor(dayCalls, phones, aht), ab = 0;
      for (var k = 0; k < iv.length; k++) ab += iv[k].aband;
      return ab;
    }

    /* =======================================================================
       GAME STATE
       ======================================================================= */
    var S = null, plan = null;

    function newGame() {
      S = {
        week: 0, budget: CFG.START_BUDGET, hc: CFG.START_HC, pipeline: [],
        engagement: CFG.ENG_START, dodgy: CFG.DODGY_START, ahtSkill: 1.0,
        trust: { ops: 60, fin: 56, client: 62, team: 58 },
        ytdCalls: 0, ytdAnswered: 0, committed: CFG.SLA_TARGET, ambition: 'realistic',
        lastWeek: null, campaign: null, forecastDays: null, callHistory: [],
        weekInits: { engagement: false, coaching: false, training: false },
        mods: null, reviewData: null, reviewTab: 'audit', reviewDay: 0,
        lastResult: null, history: [], phase: 'meeting',
        inbox: [], inboxSeq: 1, inboxOpen: false, gameSeconds: 0, nextEmailAt: CFG.INBOX.FIRST,
        emailsHandled: 0, emailsExpired: 0
      };
      for (var i = 4; i >= 1; i--) {
        var tot = Math.round(CFG.BASE_CALLS * weekdaySum() * rand(0.97, 1.03));
        S.callHistory.push({ label: 'Pre-FY −' + i, total: tot, forecast: null, days: dowSplit(tot, false) });
      }
      plan = null; save(); enterMeeting();
    }
    function dowSplit(total, withHoliday) {
      var w = [], days = [];
      for (var d = 0; d < NDAYS(); d++) w.push(CFG.DOW[d]);
      var ws = sum(w);
      for (var d2 = 0; d2 < NDAYS(); d2++) days.push(Math.round(total * w[d2] / ws));
      return days;
    }
    function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
    function load() { try { var raw = localStorage.getItem(SAVE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
    function ytdSLA() { return S.ytdCalls > 0 ? S.ytdAnswered / S.ytdCalls : CFG.SLA_TARGET; }
    function trainees() { return S.pipeline.reduce(function (a, c) { return a + c.size; }, 0); }
    function recentAvg(n) { var h = S.callHistory.slice(-n); if (!h.length) return CFG.BASE_CALLS * weekdaySum(); return sum(h.map(function (c) { return c.total; })) / h.length; }
    function histWithDays() { return S.callHistory.filter(function (c) { return c.days; }); }
    function dowAvg(d) { var h = histWithDays().slice(-4); if (!h.length) return Math.round(CFG.BASE_CALLS * CFG.DOW[d]); return Math.round(sum(h.map(function (c) { return c.days[d]; })) / h.length); }

    /* =======================================================================

    function meterBar(val, cls) { var c = cls || (val < 35 ? 'bad' : val < 55 ? 'warn' : ''); return '<span class="meter ' + c + '"><i style="width:' + clamp(val, 0, 100) + '%"></i></span>'; }
    function renderHUD() {
      var y = ytdSLA(), yCls = y >= CFG.SLA_TARGET ? 'good' : (y >= CFG.SLA_TARGET - 0.05 ? 'warn' : 'bad'), t = S.trust;

        '<div class="hud-cell"><div class="k">YTD Service Level</div><div class="v sla ' + yCls + '">' + pct1(y) + '</div><div class="hud-sub">target ' + pct(CFG.SLA_TARGET) + '</div></div>' +
        '<div class="hud-cell"><div class="k">Budget</div><div class="v ' + (S.budget < 0 ? 'bad' : '') + '">' + money(S.budget) + '</div><div class="hud-sub">contract P&amp;L</div></div>' +
        '<div class="hud-cell"><div class="k">Headcount</div><div class="v">' + S.hc + '</div><div class="hud-sub">+' + trainees() + ' in training</div></div>' +

    /* =======================================================================
       EVENTS
       ======================================================================= */
    function freshMods() { return { volMult: 1, ahtMult: 1, absenceAdd: 0, notes: [] }; }
    function rollEvents() {
      S.mods = freshMods(); S.campaign = null;
      if (weekHasHoliday(S.week)) { S.mods.absenceAdd += CFG.HOLIDAY_ABSENCE; S.mods.notes.push('🗓️ Public holiday this week — expect higher leave and penalty-rate days.'); }
      if (Math.random() > 0.58) return;
      var winter = [5, 6, 7].indexOf(monthOfWeek(S.week)) >= 0;
      var bag = []; bag.push('flu'); if (winter) { bag.push('flu', 'flu'); }
      bag.push('outage', 'star', 'viral', 'campaign', 'kudos', 'recruit', 'payroll');
      var ev = pick(bag);
      if (ev === 'flu') { S.mods.absenceAdd += rand(0.05, 0.09); S.mods.notes.push('🤒 Flu going around — sick leave is up sharply this week.'); }
      else if (ev === 'outage') { S.mods.ahtMult *= rand(1.10, 1.20); S.mods.notes.push('💥 Phone system glitches — handle times are running long this week.'); }
      else if (ev === 'star') { S.hc = Math.max(0, S.hc - 1); S.engagement = clamp(S.engagement - 4, 0, 100); S.mods.notes.push('🏃 A senior agent resigned unexpectedly. Headcount −1, the team is rattled.'); }
      else if (ev === 'viral') { S.trust.client = clamp(S.trust.client - 5, 0, 100); S.mods.notes.push('📣 A complaint went viral on socials. The client is watching closely (Client trust −5).'); }
      else if (ev === 'campaign') { S.campaign = { claim: 1.10, real: rand(1.24, 1.34) }; S.mods.notes.push('📈 Marketing has launched a campaign — factor it into your forecast.'); }
      else if (ev === 'kudos') { S.trust.client = clamp(S.trust.client + 4, 0, 100); S.engagement = clamp(S.engagement + 3, 0, 100); S.mods.notes.push('🌟 The client sent kudos for last month. (Client trust +4, team lifted.)'); }
      else if (ev === 'recruit') { S.pipeline.push({ size: 3, weeksLeft: CFG.TRAIN_WEEKS }); S.mods.notes.push('🎁 A recruitment open-day overdelivered — 3 free recruits added to the training pipeline.'); }
      else if (ev === 'payroll') { S.budget -= 8000; S.trust.fin = clamp(S.trust.fin - 2, 0, 100); S.mods.notes.push('🧾 A payroll error cost $8,000 to fix (Finance trust −2).'); }
    }

    /* =======================================================================
       MEETING (hidden grilling effects; 4 options, one a trap)
       ======================================================================= */
    var GRILL_GENERAL = [
      { q: 'Finance wants the year-to-date cost story. How do you frame it?', opts: [
        { t: 'Show cost-per-contact trending down as volume grows.', d: { fin: 4, ops: 1 } },
        { t: 'Promise blanket cost cuts next quarter.', d: { fin: 2, team: -3 } },
        { t: 'Say service costs money — that\'s just the deal.', d: { fin: -3, client: 2 } },
        { t: 'Tell Finance to stop micromanaging your budget.', d: { fin: -8, ops: -3 } } ] },
      { q: 'The client asks why occupancy looks so high on the dashboards.', opts: [
        { t: 'Explain the occupancy vs service-level trade-off with data.', d: { client: 3, ops: 2 } },
        { t: 'Downplay it — the agents are coping fine.', d: { client: 1, team: -3 } },
        { t: 'Blame the rostering tool.', d: { client: -2, team: -1 } },
        { t: 'Tell the client to stop reading the dashboards.', d: { client: -9 } } ] },
      { q: 'Team Leaders say your schedules are hard to staff. Your response?', opts: [

      { q: 'Ops wants a bolder service-level commitment to impress the board.', opts: [
        { t: 'Commit only to what the numbers support.', d: { ops: -1, client: 3, fin: 2 } },

        { t: 'Deflect — say it depends on hiring approvals.', d: { ops: 0, fin: 1 } },
        { t: 'Guarantee 95% on the spot to look good.', d: { ops: 2, client: -8, fin: -3 } } ] }
    ];
    var GRILL_MISS = [
      { q: 'Service level missed last week. Ops wants to know why.', opts: [
        { t: 'Walk them through the variance: volume, shrinkage, AHT.', d: { ops: 4, client: 2, fin: 1 } },
        { t: 'Point the finger at agents gaming their AUX time.', d: { ops: 1, team: -4 } },
        { t: 'Say it was a one-off and move on.', d: { ops: -3, client: -2 } },
        { t: 'Insist the reporting numbers must be wrong.', d: { ops: -8, fin: -3 } } ] },
      { q: 'The client is unhappy about the miss. How do you handle it?', opts: [
        { t: 'Own it and show them the recovery plan.', d: { client: 4, ops: 2 } },
        { t: 'Explain the unexpected volume spike, with data.', d: { client: 1, ops: 1 } },
        { t: 'Minimise it — you were barely under.', d: { client: -3 } },
        { t: 'Tell the client misses happen; deal with it.', d: { client: -10 } } ] }
    ];
    var NARR = [
      { t: 'Own the miss and present the fix.', d: { client: 3, ops: 2, team: 1 } },
      { t: 'Explain it as volume/shrinkage outside the plan (data-backed).', d: { ops: 1, client: 1 } },
      { t: 'Quietly push it onto Ops execution.', d: { ops: -4, team: -2 } }
    ];

    function enterMeeting() {
      S.phase = 'meeting'; save(); rollEvents(); renderHUD();
      var first = (S.week === 0), prev = S.lastWeek, c = [];
      c.push('<div class="advisor"><div class="face">📎</div><div><b>Clippo, your WFM advisor:</b> ' + advisorMeetingTip(first, prev) + '</div></div>');

      c.push('<div class="panel"><h3>🗓️ Monday Meeting — ' + weekLabel(S.week) + '</h3>');
      if (first) {
        c.push('<p class="small">Welcome to the chair. You are <b>Workforce Management</b> for this contact centre (open <b>Monday–Friday</b>). ' +
          'You don\'t run the floor — you <b>forecast</b>, <b>plan</b>, <b>negotiate</b> and <b>review the data</b>, then explain the results here every Monday. ' +
          'Your job all year: keep the <b>service level around ' + pct(CFG.SLA_TARGET) + '</b> without blowing the budget, burning out the team, or losing the client.</p>');
      } else {
        var hit = prev.sla >= prev.committed;
        c.push('<p class="small">Last week you committed to <b>' + pct(prev.committed) + '</b> and delivered <b class="' + (hit ? 'good' : 'bad') + '">' + pct1(prev.sla) + '</b> (' + (hit ? 'met ✔' : 'missed ✗') + '). YTD is <b>' + pct1(ytdSLA()) + '</b>.</p>');
        if (!hit) {
          c.push('<h4>The room wants an explanation. What\'s your line?</h4>');
          S._narrOrder = shuffle(NARR.map(function (_, i) { return i; }));
          for (var no = 0; no < S._narrOrder.length; no++) c.push(optRow('narr', S._narrOrder[no], NARR[S._narrOrder[no]].t));
          c.push('<div class="fx-reveal" id="narr-fx">Pick a response to reveal how the room reacts.</div>');
        }
      }
      c.push('</div>');

      if (S.mods.notes.length) {
        c.push('<div class="panel"><h4>📨 In the inbox this week</h4><ul class="small" style="margin-left:16px">');
        for (var mi = 0; mi < S.mods.notes.length; mi++) c.push('<li>' + S.mods.notes[mi] + '</li>');
        c.push('</ul></div>');
      }

      var pool = (!first && prev && prev.sla < prev.committed) ? GRILL_MISS : GRILL_GENERAL;
      var g = pick(pool); S._grill = g; S._grillOrder = shuffle(g.opts.map(function (_, i) { return i; }));
      c.push('<div class="panel"><h3>🎤 The grilling</h3><p class="small">' + g.q + '</p>');
      for (var go = 0; go < S._grillOrder.length; go++) c.push(optRow('grill', S._grillOrder[go], g.opts[S._grillOrder[go]].t));
      c.push('<div class="fx-reveal" id="grill-fx">Choose your answer — the room\'s reaction shows once you commit to a line.</div></div>');

      c.push('<div class="panel"><h3>🤝 Your asks <span class="small muted">(political capital: ' + CFG.CAPITAL + ')</span></h3><p class="small muted">Each costs capital; money asks also need Finance on side.</p>');
      var finOK = S.trust.fin >= 45;
      c.push(askRow('hire', 2, '📋 Approve a hire (+' + CFG.HIRE_COHORT + ' recruits → ' + CFG.TRAIN_WEEKS + 'wk training)', money(CFG.HIRE_COST_EACH * CFG.HIRE_COHORT) + ' recruitment', !finOK, finOK ? '' : 'Finance won\'t sign off (needs trust ≥ 45)'));
      c.push(askRow('engage', 1, '🎉 Engagement initiative (recognition / incentives)', money(8000) + ' · lifts team, cuts sick &amp; churn', false, ''));
      c.push(askRow('coach', 1, '🕵️ Coaching crackdown on AUX/wrap abuse', money(5000) + ' · cuts dodgy behaviour, +shrinkage this wk', false, ''));
      c.push(askRow('train', 1, '🎓 Skills training block', money(4000) + ' · lowers AHT &amp; churn, +shrinkage this wk', false, ''));
      c.push('<div id="cap-note" class="small" style="margin-top:4px"></div></div>');

      c.push('<div class="panel"><h3>✍️ Commit to a service level for the week</h3><p class="small muted">Over-promise and a miss hurts more; under-promise and they lose confidence.</p>');
      var commits = [{ id: 'cautious', t: 'Cautious — ' + pct(CFG.SLA_TARGET - 0.05), v: CFG.SLA_TARGET - 0.05 }, { id: 'realistic', t: 'Realistic — ' + pct(CFG.SLA_TARGET), v: CFG.SLA_TARGET }, { id: 'ambitious', t: 'Ambitious — ' + pct(CFG.SLA_TARGET + 0.05), v: CFG.SLA_TARGET + 0.05 }];
      for (var ci = 0; ci < commits.length; ci++) c.push('<label class="opt"><input type="radio" name="commit" value="' + commits[ci].id + '" data-v="' + commits[ci].v + '"' + (commits[ci].id === 'realistic' ? ' checked' : '') + '>' + commits[ci].t + '</label>');
      c.push('</div>');

      c.push('<div class="row"><span class="spacer"></span><button class="btn big-btn" id="lock">Lock it in &amp; forecast ▶</button></div>');
      $('screen').innerHTML = c.join('');

      var gradios = $('screen').querySelectorAll('input[name="grill"]');
      for (var gi = 0; gi < gradios.length; gi++) gradios[gi].addEventListener('change', function (e) { $('grill-fx').innerHTML = 'The room reacts — <b>' + fxText(S._grill.opts[parseInt(e.target.value, 10)].d) + '</b>'; });
      var nradios = $('screen').querySelectorAll('input[name="narr"]');
      for (var nj = 0; nj < nradios.length; nj++) nradios[nj].addEventListener('change', function (e) { $('narr-fx').innerHTML = 'The room reacts — <b>' + fxText(NARR[parseInt(e.target.value, 10)].d) + '</b>'; });
      var cbs = $('screen').querySelectorAll('input[type="checkbox"][data-cost]');
      for (var k = 0; k < cbs.length; k++) cbs[k].addEventListener('change', updateCapNote);
      updateCapNote();
      $('lock').addEventListener('click', lockMeeting);
      setStatus('Monday meeting — answer the room, make your asks, commit a number.');
    }

    function optRow(name, i, text) { return '<label class="opt"><input type="radio" name="' + name + '" value="' + i + '">' + text + '</label>'; }
    function askRow(id, cost, text, costNote, disabled, why) {
      return '<label class="opt ' + (disabled ? 'disabled' : '') + '"><input type="checkbox" name="ask" value="' + id + '" data-cost="' + cost + '"' + (disabled ? ' disabled' : '') + '>' + text + ' <span class="cost">[' + cost + ' cap · ' + costNote + ']</span>' + (why ? '<br><span class="cost bad">' + why + '</span>' : '') + '</label>';
    }
    function fxText(d) { var map = { ops: 'Ops', fin: 'Finance', client: 'Client', team: 'TLs' }; return Object.keys(d).map(function (k) { return map[k] + ' ' + (d[k] >= 0 ? '+' : '') + d[k]; }).join(', '); }
    function updateCapNote() { var used = 0, sel = $('screen').querySelectorAll('input[name="ask"]:checked'); for (var i = 0; i < sel.length; i++) used += parseInt(sel[i].dataset.cost, 10); var note = $('cap-note'); if (note) note.innerHTML = 'Capital used: <b class="' + (used > CFG.CAPITAL ? 'bad' : 'good') + '">' + used + '</b> / ' + CFG.CAPITAL; }
    function applyTrust(d) { if (!d) return; for (var k in d) if (S.trust[k] != null) S.trust[k] = clamp(S.trust[k] + d[k], 0, 100); }

    function lockMeeting() {
      var grillEl = document.querySelector('input[name="grill"]:checked');
      if (!grillEl) { dialog('Answer the room', 'Pick a response to the grilling question before you wrap the meeting.'); return; }
      var narrShown = !!document.querySelector('input[name="narr"]'), narrEl = document.querySelector('input[name="narr"]:checked');
      if (narrShown && !narrEl) { dialog('Answer the room', 'Choose how you explain last week\'s miss first.'); return; }
      var used = 0, asks = [], sel = $('screen').querySelectorAll('input[name="ask"]:checked');
      for (var i = 0; i < sel.length; i++) { used += parseInt(sel[i].dataset.cost, 10); asks.push(sel[i].value); }
      if (used > CFG.CAPITAL) { dialog('Not enough capital', 'You picked ' + used + ' capital of asks but only have ' + CFG.CAPITAL + '. Drop one.'); return; }

      if (narrEl) applyTrust(NARR[parseInt(narrEl.value, 10)].d);
      applyTrust(S._grill.opts[parseInt(grillEl.value, 10)].d);

      S.weekInits = { engagement: false, coaching: false, training: false };
      for (var a = 0; a < asks.length; a++) {
        var k = asks[a];
        if (k === 'hire') { S.pipeline.push({ size: CFG.HIRE_COHORT, weeksLeft: CFG.TRAIN_WEEKS }); S.budget -= CFG.HIRE_COST_EACH * CFG.HIRE_COHORT; S.trust.fin = clamp(S.trust.fin - 2, 0, 100); }
        else if (k === 'engage') { S.weekInits.engagement = true; S.budget -= 8000; S.trust.team = clamp(S.trust.team + 2, 0, 100); }
        else if (k === 'coach') { S.weekInits.coaching = true; S.budget -= 5000; S.dodgy = clamp(S.dodgy - 0.06, 0, 1); }

      S.committed = parseFloat(cEl.dataset.v); S.ambition = cEl.value;

    }

    /* =======================================================================
       FORECAST — daily-level, player-entered.
       ======================================================================= */
    function initForecastDays() {

      return arr;
    }
    function redistributeTotal(total) {

        var hol2 = holidayOn(dateFor(S.week, dd));
        c.push('<tr class="' + (hol2 ? 'hol' : '') + '"><td class="day"><b>' + DOW[dd] + '</b> ' + fmtDate(dateFor(S.week, dd)) + (hol2 ? ' 🗓️' : '') + '</td>' +
          '<td>' + dowAvg(dd).toLocaleString() + '</td>' +

      }
      c.push('<tr class="avg"><td class="day">Weekly total</td><td>—</td><td><input class="fc-tot sunken" type="number" min="0" step="50" id="fc-total" value="' + sum(S.forecastDays) + '"></td></tr>');
      c.push('</tbody></table>');
      c.push('<div class="row" style="margin-top:6px"><button class="btn" id="fc-avg">Fill from weekday averages</button></div>');
      c.push('</div>');

      c.push('<div class="row"><span class="spacer"></span><button class="btn big-btn" id="fc-lock">Lock forecast &amp; build the roster ▶</button></div>');
      $('screen').innerHTML = c.join('');

      var dayInputs = $('screen').querySelectorAll('input[data-fd]');
      for (var di = 0; di < dayInputs.length; di++) dayInputs[di].addEventListener('input', function (e) {
        var idx = parseInt(e.target.dataset.fd, 10); S.forecastDays[idx] = Math.max(0, parseInt(e.target.value, 10) || 0);

      });
      $('fc-total').addEventListener('input', function (e) {
        var t = Math.max(0, parseInt(e.target.value, 10) || 0); S.forecastDays = redistributeTotal(t);
        var ins = $('screen').querySelectorAll('input[data-fd]'); for (var z = 0; z < ins.length; z++) ins[z].value = S.forecastDays[z];
      });
      $('fc-avg').addEventListener('click', function () {
        S.forecastDays = initForecastDays();
        var ins = $('screen').querySelectorAll('input[data-fd]'); for (var z = 0; z < ins.length; z++) ins[z].value = S.forecastDays[z];
        $('fc-total').value = sum(S.forecastDays);
      });
      $('fc-lock').addEventListener('click', function () {

        save(); enterPlanning();
      });
      setStatus('Forecast each day from the data, then build the roster.');
    }

    function forecastIntel() {
      var out = [];
      if (S.campaign) out.push('📈 A marketing campaign is live. The business <i>claims</i> it adds ~' + pct(S.campaign.claim - 1) + ', but campaigns on this account have historically run hotter.');
      if (weekHasHoliday(S.week)) { var names = []; for (var d = 0; d < NDAYS(); d++) { var hn = holidayOn(dateFor(S.week, d)); if (hn) names.push(DOW[d] + ' (' + hn + ')'); } out.push('🗓️ Public holiday this week — ' + names.join(', ') + ' runs at ~' + pct(CFG.HOLIDAY_VOL) + ' of a normal day.'); }
      if (CFG.SEASON[S.week] >= 1.2) out.push('🎄 Peak trading period — seasonal demand is well above the yearly baseline right now.');
      else if (S.week > 0 && CFG.SEASON[S.week] < CFG.SEASON[S.week - 1] - 0.05) out.push('📉 Seasonal demand is easing off from recent weeks.');
      return out;
    }

    /* =======================================================================
       PLANNING
       ======================================================================= */
    function weekShrink() { return CFG.BASE_SHRINK + (S.weekInits.coaching ? CFG.COACH_SHRINK : 0) + (S.weekInits.training ? CFG.TRAIN_SHRINK : 0); }
    function expectedAbsence() { var a = CFG.BASE_ABSENCE; if ([5, 6, 7].indexOf(monthOfWeek(S.week)) >= 0) a += CFG.WINTER_ABSENCE; if (S.engagement < 60) a += (60 - S.engagement) / 100 * 0.08; return a; }
    function forecastCalls(day) { return (S.forecastDays && S.forecastDays[day]) || 0; }
    function dayNeeds(day) {
      var calls = forecastCalls(day), aht = CFG.AHT * S.ahtSkill;
      var A = calls * aht / CFG.OPEN_SECONDS;
      var onPhones = requiredOnPhones(A, aht, CFG.SLA_T, CFG.SLA_TARGET);
      var grossFactor = (1 - expectedAbsence()) * (1 - weekShrink());

    }
    function defaultRoster(needs) {

      while (s > cap && guard++ < 5000) { var idx = -1, lo = Infinity; for (var d = 0; d < NDAYS(); d++) { if (rost[d] > 0 && needs[d].calls < lo) { lo = needs[d].calls; idx = d; } } if (idx < 0) break; rost[idx] -= 1; s -= 1; }
      return rost;
    }
    function enterPlanning() {
      S.phase = 'planning'; save(); renderHUD();
      var needs = []; for (var d = 0; d < NDAYS(); d++) needs.push(dayNeeds(d));
      plan = { needs: needs, rost: defaultRoster(needs), ot: 0, shrink: weekShrink(), expAbs: expectedAbsence() };
      drawPlanning();
    }
    function drawPlanning() {
      var c = [], hol = [];
      for (var d = 0; d < NDAYS(); d++) { var h = holidayOn(dateFor(S.week, d)); if (h) hol.push(DOW[d] + ' ' + h); }
      c.push('<div class="advisor"><div class="face">📎</div><div><b>Clippo:</b> ' + advisorPlanTip() + '</div></div>');
      c.push('<div class="panel"><h3>📅 Plan the week — ' + weekLabel(S.week) + '</h3>');
      c.push('<p class="small">Your forecast <span class="pill">' + sum(S.forecastDays).toLocaleString() + ' calls</span> · Planned shrinkage <span class="pill">' + pct(plan.shrink) + '</span> · Expected absence <span class="pill">' + pct(plan.expAbs) + '</span>' + (hol.length ? ' · <span class="warn">Holiday: ' + hol.join(', ') + '</span>' : '') + '</p>');
      c.push('<table class="grid"><thead><tr><th>Day</th><th>Forecast calls</th><th>On&nbsp;phones<br>needed</th><th>Roster needed<br>(incl. shrink)</th><th>Your roster</th><th>Coverage</th></tr></thead><tbody>');
      for (var d2 = 0; d2 < NDAYS(); d2++) {
        var n = plan.needs[d2], hday = holidayOn(dateFor(S.week, d2)), covRaw = n.roster > 0 ? plan.rost[d2] / n.roster : 1, cov = clamp(covRaw, 0, 1.3);
        c.push('<tr class="' + (hday ? 'hol' : '') + '"><td class="day"><b>' + DOW[d2] + '</b> ' + fmtDate(dateFor(S.week, d2)) + (hday ? ' 🗓️' : '') + '</td><td>' + n.calls.toLocaleString() + '</td><td>' + n.onPhones + '</td><td>' + n.roster + '</td><td><input class="num-in" type="number" min="0" max="' + S.hc + '" value="' + plan.rost[d2] + '" data-day="' + d2 + '"></td><td><div class="cov ' + (covRaw < 0.999 ? 'under' : '') + '"><i style="width:' + Math.min(100, cov * 100) + '%"></i><span class="lab">&nbsp;' + Math.round(covRaw * 100) + '%</span></div></td></tr>');
      }
      c.push('</tbody></table>');
      var used = sum(plan.rost), capW = S.hc * NDAYS(), overDay = plan.rost.some(function (x) { return x > S.hc; });
      c.push('<div class="row" style="margin-top:6px"><button class="btn" id="auto">Auto-roster</button><span class="small">Capacity used: <b class="' + (used > capW ? 'bad' : '') + '">' + used + '</b> / ' + capW + ' agent-days (HC ' + S.hc + ' × ' + NDAYS() + ')</span></div>');
      var otCap = Math.round(capW * CFG.OT_CAP_FRAC);
      c.push('<div class="row" style="margin-top:6px"><span class="small">Overtime: </span><input type="range" id="ot" min="0" max="' + otCap + '" value="' + plan.ot + '" style="flex:1"><span class="small" id="ot-lab"></span></div></div>');
      c.push('<div class="panel" id="proj"></div>');
      var warn = (used > capW) ? 'You\'re over weekly capacity — hire, use OT, or cut a day.' : overDay ? 'A day exceeds your headcount.' : '';
      c.push('<div class="row"><span class="bad small" id="run-warn">' + warn + '</span><span class="spacer"></span><button class="btn big-btn" id="run"' + (used > capW || overDay ? ' disabled' : '') + '>Run the week ▶</button></div>');
      $('screen').innerHTML = c.join('');
      var inputs = $('screen').querySelectorAll('.num-in'); for (var ii = 0; ii < inputs.length; ii++) inputs[ii].addEventListener('input', onRosterInput);
      $('auto').addEventListener('click', function () { plan.rost = defaultRoster(plan.needs); plan.ot = 0; drawPlanning(); });
      $('ot').addEventListener('input', function (e) { plan.ot = parseInt(e.target.value, 10) || 0; refreshProjection(); });
      $('run').addEventListener('click', runWeek);
      refreshProjection();
      setStatus('Distribute your workforce across Mon–Fri, then run it.');
    }
    function onRosterInput(e) {
      var d = parseInt(e.target.dataset.day, 10), v = parseInt(e.target.value, 10); if (isNaN(v) || v < 0) v = 0;
      plan.rost[d] = v;
      var n = plan.needs[d], covRaw = n.roster > 0 ? v / n.roster : 1, cell = e.target.closest('tr').querySelector('.cov');
      cell.classList.toggle('under', covRaw < 0.999); cell.querySelector('i').style.width = Math.min(100, clamp(covRaw, 0, 1.3) * 100) + '%'; cell.querySelector('.lab').innerHTML = '&nbsp;' + Math.round(covRaw * 100) + '%';
      refreshProjection();
    }
    function allocateOT(rost, needs, otTotal) {
      var ot = []; for (var z = 0; z < NDAYS(); z++) ot.push(0);
      var left = otTotal;
      while (left > 0) { var idx = -1, worst = -1; for (var d = 0; d < NDAYS(); d++) { var gap = needs[d].roster - (rost[d] + ot[d]); if (gap > worst) { worst = gap; idx = d; } } if (idx < 0 || worst <= 0) break; ot[idx] += 1; left -= 1; }
      return ot;
    }
    function laborCost(baseDays, otDays) { var holSurcharge = 0; for (var d = 0; d < NDAYS(); d++) if (holidayOn(dateFor(S.week, d))) holSurcharge += plan.rost[d] * CFG.DAY_COST * (CFG.HOLIDAY_PAY - 1); return baseDays * CFG.DAY_COST + otDays * CFG.DAY_COST * CFG.OT_MULT + holSurcharge; }
    function projectWeek() {
      var otDays = allocateOT(plan.rost, plan.needs, plan.ot), calls = 0, answered = 0, occSum = 0, occN = 0;
      for (var d = 0; d < NDAYS(); d++) {
        var n = plan.needs[d], phones = (plan.rost[d] + otDays[d]) * (1 - plan.expAbs) * (1 - plan.shrink) * (1 - S.dodgy * CFG.DODGY_AVAIL_MAX), aht = CFG.AHT * S.ahtSkill * (1 + S.dodgy * CFG.DODGY_AHT_MAX), A = n.calls * aht / CFG.OPEN_SECONDS;
        var sl = dayServiceLevel(n.calls, phones, aht);
        calls += n.calls; answered += sl * n.calls; if (n.calls > 50) { occSum += occupancy(phones, A); occN++; }
      }
      var baseDays = sum(plan.rost), otTotal = sum(otDays);
      return { sla: calls > 0 ? answered / calls : 1, cost: laborCost(baseDays, otTotal), occ: occN ? occSum / occN : 0, otTotal: otTotal, baseDays: baseDays };
    }
    function refreshProjection() {
      var otCap = Math.round(S.hc * NDAYS() * CFG.OT_CAP_FRAC);
      if ($('ot-lab')) $('ot-lab').textContent = plan.ot + ' / ' + otCap + ' agent-days (+' + money(plan.ot * CFG.DAY_COST * CFG.OT_MULT) + ')';
      var p = projectWeek(), slaCls = p.sla >= S.committed ? 'good' : (p.sla >= S.committed - 0.04 ? 'warn' : 'bad'), trainee = trainees() * CFG.TRAINEE_WK_COST, net = CFG.WEEK_REVENUE - p.cost - trainee;
      var used = sum(plan.rost), capW = S.hc * NDAYS(), overDay = plan.rost.some(function (x) { return x > S.hc; });
      if ($('run')) $('run').disabled = (used > capW || overDay);
      if ($('run-warn')) $('run-warn').textContent = (used > capW) ? 'Over weekly capacity — hire, use OT, or cut a day.' : (overDay ? 'A day exceeds headcount.' : '');
      $('proj').innerHTML = '<h3>📈 Projected (on your forecast — reality will differ)</h3><div class="kpi-strip">' +
        '<div class="kpi"><div class="k">Proj. service level</div><div class="v ' + slaCls + '">' + pct1(p.sla) + '</div><div class="small muted">commit ' + pct(S.committed) + '</div></div>' +
        '<div class="kpi"><div class="k">Avg occupancy</div><div class="v ' + (p.occ > 0.9 ? 'bad' : p.occ > 0.85 ? 'warn' : 'good') + '">' + pct(p.occ) + '</div><div class="small muted">burnout &gt; 88%</div></div>' +
        '<div class="kpi"><div class="k">Labour cost</div><div class="v">' + money(p.cost + trainee) + '</div><div class="small muted">incl. trainees</div></div>' +
        '<div class="kpi"><div class="k">Proj. weekly P&amp;L</div><div class="v ' + (net >= 0 ? 'good' : 'bad') + '">' + money(net) + '</div><div class="small muted">rev − cost</div></div></div>';
    }

    /* =======================================================================
       RUN THE WEEK
       ======================================================================= */
    function trueDaily(day) {
      var hol = holidayOn(dateFor(S.week, day)), m = CFG.DOW[day] * CFG.SEASON[S.week];
      if (hol) m *= CFG.HOLIDAY_VOL; if (S.campaign) m *= S.campaign.real; m *= rand(0.94, 1.06);
      return Math.max(0, Math.round(CFG.BASE_CALLS * m));
    }
    function runWeek() {
      if (!S.mods) S.mods = freshMods();
      var otDays = allocateOT(plan.rost, plan.needs, plan.ot), dayRes = [], calls = 0, answered = 0, occSum = 0, occN = 0, abandoned = 0;
      var realAbs = clamp(plan.expAbs + (S.mods.absenceAdd || 0), 0, 0.6);
      for (var d = 0; d < NDAYS(); d++) {
        var hol = holidayOn(dateFor(S.week, d)), dCalls = Math.round(trueDaily(d) * (S.mods.volMult || 1));
        var absToday = clamp(realAbs * rand(0.8, 1.2), 0, 0.7);
        var phones = (plan.rost[d] + otDays[d]) * (1 - absToday) * (1 - plan.shrink) * (1 - S.dodgy * CFG.DODGY_AVAIL_MAX);
        var aht = CFG.AHT * S.ahtSkill * (1 + S.dodgy * CFG.DODGY_AHT_MAX) * (S.mods.ahtMult || 1);
        var A = dCalls * aht / CFG.OPEN_SECONDS;
        var sl = dayServiceLevel(dCalls, phones, aht), occ = occupancy(phones, A), aband = dayAbandoned(dCalls, phones, aht);
        calls += dCalls; answered += sl * dCalls; abandoned += aband; if (dCalls > 50) { occSum += occ; occN++; }
        dayRes.push({ d: d, hol: hol, calls: dCalls, sl: sl, occ: occ, phones: phones, aht: aht });
      }
      var sla = calls > 0 ? answered / calls : 1, occAvg = occN ? occSum / occN : 0, baseDays = sum(plan.rost), otTotal = sum(otDays);
      var cost = laborCost(baseDays, otTotal), traineeCost = trainees() * CFG.TRAINEE_WK_COST, otFrac = baseDays > 0 ? otTotal / baseDays : 0;
      var fcastDays = S.forecastDays.slice(), fcast = sum(fcastDays), fErr = calls > 0 ? Math.abs(fcast - calls) / calls : 0;

      var penalty = 0, bonus = 0;
      if (sla < CFG.SLA_TARGET) penalty = (CFG.SLA_TARGET - sla) * CFG.PENALTY_SCALE; else bonus = Math.min(CFG.BONUS_CAP, (sla - CFG.SLA_TARGET) * CFG.BONUS_SCALE);
      var pnl = CFG.WEEK_REVENUE + bonus - cost - traineeCost - penalty, budgetBefore = S.budget; S.budget += pnl;

      var engBefore = S.engagement, eDelta = 0;
      if (occAvg > 0.88) eDelta -= (occAvg - 0.88) * 60; else if (occAvg < 0.78) eDelta += (0.78 - occAvg) * 18;
      eDelta -= otFrac * 18; if (S.weekInits.engagement) eDelta += 8; if (S.trust.team < 45) eDelta -= 2; eDelta += (65 - S.engagement) * 0.05;
      S.engagement = clamp(S.engagement + eDelta, 0, 100);
      var dodgyTarget = clamp(0.30 - S.engagement / 400 - S.trust.team / 500, 0.04, 0.45); S.dodgy = clamp(S.dodgy + (dodgyTarget - S.dodgy) * 0.35, 0, 1);

      var burnout = 1 + Math.max(0, occAvg - 0.85) * 4 + Math.max(0, 60 - S.engagement) / 100 * 2 + otFrac * 1.5, expQuits = S.hc * 0.008 * burnout;
      if (S.engagement < 35) expQuits += 1;
      var quits = Math.floor(expQuits) + (Math.random() < (expQuits % 1) ? 1 : 0); quits = Math.min(quits, Math.max(0, S.hc - 1));
      var quitNames = []; for (var q = 0; q < quits && q < 3; q++) quitNames.push(pick(AGENT_NAMES)); S.hc -= quits;

      var graduated = 0; for (var p2 = 0; p2 < S.pipeline.length; p2++) S.pipeline[p2].weeksLeft -= 1;
      S.pipeline = S.pipeline.filter(function (c) { if (c.weeksLeft <= 0) { graduated += c.size; return false; } return true; }); S.hc += graduated;

      var tBefore = { ops: S.trust.ops, fin: S.trust.fin, client: S.trust.client, team: S.trust.team };
      var hit = sla >= S.committed, reward = S.ambition === 'ambitious' ? 7 : S.ambition === 'realistic' ? 4 : 2, punish = S.ambition === 'ambitious' ? 9 : S.ambition === 'realistic' ? 5 : 3, cd = hit ? reward : -punish;
      applyTrust({ client: cd, ops: Math.round(cd * 0.6) });
      if (sla >= CFG.SLA_TARGET + 0.03) applyTrust({ client: 1, ops: 1 });
      if (sla < CFG.SLA_TARGET - 0.10) applyTrust({ client: -2, ops: -2 });
      applyTrust({ fin: pnl >= 0 ? 1 : -2 }); if (occAvg < 0.55 && calls > 0) applyTrust({ fin: -1 });
      if (fErr <= 0.05) applyTrust({ ops: 1 }); else if (fErr >= 0.20) applyTrust({ ops: -1 });
      applyTrust({ team: (S.engagement >= engBefore ? 1 : -1) + (quits >= 2 ? -2 : 0) });

      S.ytdCalls += calls; S.ytdAnswered += answered;
      S.callHistory.push({ label: shortWeek(S.week), total: calls, forecast: fcast, days: dayRes.map(function (x) { return x.calls; }) });
      if (S.callHistory.length > 12) S.callHistory = S.callHistory.slice(-12);
      S.history.push({ week: S.week, sla: sla, ytd: ytdSLA(), budget: S.budget, eng: S.engagement, hc: S.hc });

      // default the call-flow view to the worst day

      S.forecastDays = null;
