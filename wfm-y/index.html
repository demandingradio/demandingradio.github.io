    }

    /* =======================================================================
       RESULTS
       ======================================================================= */
    function drawResults(res) {
      S.phase = 'results'; save();
      var c = [];
      c.push('<div class="advisor"><div class="face">📎</div><div><b>Clippo:</b> ' + advisorResultTip(res) + '</div></div>');
      c.push('<div class="panel"><h3>📊 Week ' + (S.week + 1) + ' results — ' + weekLabel(S.week) + '</h3>');
      var slaCls = res.sla >= CFG.SLA_TARGET ? 'good' : (res.sla >= CFG.SLA_TARGET - 0.05 ? 'warn' : 'bad');
      c.push('<div class="kpi-strip">' +
        '<div class="kpi"><div class="k">Service level</div><div class="v ' + slaCls + '">' + pct1(res.sla) + '</div><div class="small ' + (res.hit ? 'good' : 'bad') + '">committed ' + pct(S.committed) + ' ' + (res.hit ? '✔' : '✗') + '</div></div>' +
        '<div class="kpi"><div class="k">YTD service</div><div class="v ' + (ytdSLA() >= CFG.SLA_TARGET ? 'good' : 'bad') + '">' + pct1(ytdSLA()) + '</div></div>' +
        '<div class="kpi"><div class="k">Avg occupancy</div><div class="v ' + (res.occ > 0.9 ? 'bad' : res.occ > 0.85 ? 'warn' : 'good') + '">' + pct(res.occ) + '</div></div>' +
        '<div class="kpi"><div class="k">Forecast error</div><div class="v ' + (res.fErr <= 0.05 ? 'good' : res.fErr >= 0.12 ? 'bad' : 'warn') + '">' + pct(res.fErr) + '</div><div class="small muted">fc ' + res.forecast.toLocaleString() + ' · act ' + res.calls.toLocaleString() + '</div></div>' +
        '<div class="kpi"><div class="k">Weekly P&amp;L</div><div class="v ' + (res.pnl >= 0 ? 'good' : 'bad') + '">' + money(res.pnl) + '</div></div></div>');
      c.push('<table class="grid" style="margin-top:8px"><thead><tr><th>Day</th><th>Forecast</th><th>Actual calls</th><th>Service level</th><th>Occupancy</th></tr></thead><tbody>');
      for (var i = 0; i < res.dayRes.length; i++) {
        var dr = res.dayRes[i];
        c.push('<tr class="' + (dr.hol ? 'hol' : '') + '"><td class="day"><b>' + DOW[dr.d] + '</b> ' + fmtDate(dateFor(S.week, dr.d)) + (dr.hol ? ' 🗓️' : '') + '</td><td>' + (res.forecastDays[dr.d] || 0).toLocaleString() + '</td><td>' + dr.calls.toLocaleString() + '</td><td class="' + (dr.sl >= CFG.SLA_TARGET ? 'good' : 'bad') + '">' + pct1(dr.sl) + '</td><td class="' + (dr.occ > 0.9 ? 'bad' : '') + '">' + pct(dr.occ) + '</td></tr>');
      }
      c.push('</tbody></table></div>');

      var dT = function (k) { var v = Math.round(res.tAfter[k] - res.tBefore[k]); return v === 0 ? '' : ' <span class="' + (v > 0 ? 'delta-up' : 'delta-dn') + '">(' + (v > 0 ? '+' : '') + v + ')</span>'; };
      c.push('<div class="panel"><h4>🧾 Ledger</h4><div class="log">' +
        '<div class="li">Contract revenue: <span class="delta-up">' + money(CFG.WEEK_REVENUE) + '</span></div>' +
        (res.bonus > 0 ? '<div class="li">SLA bonus: <span class="delta-up">' + money(res.bonus) + '</span></div>' : '') +
        '<div class="li">Labour (incl. trainees): <span class="delta-dn">-' + money(res.cost) + '</span></div>' +
        (res.penalty > 0 ? '<div class="li">SLA penalty: <span class="delta-dn">-' + money(res.penalty) + '</span></div>' : '') +
        '<div class="li"><b>Net: ' + money(res.pnl) + '</b> → budget ' + money(res.budgetBefore) + ' → <b>' + money(S.budget) + '</b></div></div></div>');

      var log = [];
      log.push('Engagement ' + Math.round(res.engBefore) + ' → <b>' + Math.round(res.engAfter) + '</b> ' + (res.engAfter >= res.engBefore ? '<span class="delta-up">▲</span>' : '<span class="delta-dn">▼</span>'));
      if (res.quits > 0) log.push('<span class="delta-dn">Attrition:</span> ' + res.quits + ' agent' + (res.quits > 1 ? 's' : '') + ' resigned' + (res.quitNames.length ? ' (' + res.quitNames.join(', ') + ')' : '') + ' → HC ' + S.hc);
      else log.push('No resignations this week.');
      if (res.graduated > 0) log.push('<span class="delta-up">' + res.graduated + ' trainee' + (res.graduated > 1 ? 's' : '') + ' graduated</span> to the floor → HC ' + S.hc);
      if (trainees() > 0) log.push(trainees() + ' still in training.');
      log.push('Trust — Ops' + dT('ops') + ' · Finance' + dT('fin') + ' · Client' + dT('client') + ' · TLs' + dT('team'));
      c.push('<div class="panel"><h4>👥 People &amp; stakeholders</h4><div class="log">');
      for (var l = 0; l < log.length; l++) c.push('<div class="li">' + log[l] + '</div>');
      c.push('</div></div>');
      c.push('<div class="row"><span class="spacer"></span><button class="btn big-btn" id="toreview">Review the week\'s data 🔍 ▶</button></div>');
      $('screen').innerHTML = c.join('');
      $('toreview').addEventListener('click', enterReview);
      setStatus('Week ' + (S.week + 1) + ' done. Now dig into the data before next Monday.');
    }

    /* =======================================================================
       DATA REVIEW — call-flow drill-down + 24-agent / 3-team audit.
       ======================================================================= */
    function makeReview(dayRes) {
      var pool = shuffle(AGENT_NAMES).slice(0, 24), teamAht = CFG.AHT * S.ahtSkill, agents = [];
      for (var i = 0; i < 24; i++) {
        agents.push({
          id: i, name: pool[i], team: TEAMS[Math.floor(i / 8)],
          calls: Math.round(rand(420, 520)),
          aht: Math.round(teamAht * rand(0.92, 1.08)),
          aux: Math.round(rand(6, 12) * 10) / 10,
          acw: Math.round(rand(5, 10) * 10) / 10,
          hold: Math.round(rand(2, 6) * 10) / 10,
          adh: Math.round(rand(92, 99) * 10) / 10,
          issue: null
        });
      }
      // number of real issues: almost always >=1, scales mildly with dodgy index
      var r = Math.random(), extra = S.dodgy > 0.22 ? 1 : 0, nIssues;
      if (r < 0.07) nIssues = 0; else if (r < 0.45) nIssues = 1 + extra; else if (r < 0.80) nIssues = 2 + extra; else nIssues = 3 + extra;
      nIssues = Math.min(nIssues, 5);
      var idxs = shuffle(agents.map(function (_, i) { return i; })).slice(0, nIssues);
      for (var j = 0; j < idxs.length; j++) {
        var a = agents[idxs[j]], dim = pick(['aux', 'aht', 'hold', 'acw', 'adh']); a.issue = dim;
        if (dim === 'aux') { a.aux = Math.round(rand(16, 24) * 10) / 10; a.calls = Math.round(a.calls * 0.78); }
        else if (dim === 'aht') { a.aht = Math.round(teamAht * rand(1.22, 1.45)); a.calls = Math.round(a.calls * 0.82); }
        else if (dim === 'hold') { a.hold = Math.round(rand(11, 17) * 10) / 10; a.calls = Math.round(a.calls * 0.88); }
        else if (dim === 'acw') { a.acw = Math.round(rand(15, 22) * 10) / 10; a.calls = Math.round(a.calls * 0.85); }
        else { a.adh = Math.round(rand(80, 88) * 10) / 10; }
      }
      return { agents: agents, sortKey: 'team', sortDir: 1, submitted: false, flagged: {}, outcome: '' };
    }

    function enterReview() {
      S.phase = 'review'; save();
      var c = [];
      c.push('<div class="advisor"><div class="face">📎</div><div><b>Clippo:</b> ' + advisorReviewTip() + '</div></div>');
      c.push('<div class="tabs"><div class="tab ' + (S.reviewTab === 'audit' ? 'active' : '') + '" id="tab-audit">🕵️ Agent audit</div><div class="tab ' + (S.reviewTab === 'flow' ? 'active' : '') + '" id="tab-flow">📞 Call flow</div></div>');
      c.push('<div class="panel">' + (S.reviewTab === 'flow' ? renderCallFlow() : renderAudit()) + '</div>');
      c.push('<div class="row"><span class="spacer"></span><button class="btn big-btn" id="next">' + (S.week + 1 >= CFG.WEEKS ? 'Finish the year ▶' : 'Continue to Monday, Week ' + (S.week + 2) + ' ▶') + '</button></div>');
      $('screen').innerHTML = c.join('');

      $('tab-audit').addEventListener('click', function () { S.reviewTab = 'audit'; save(); enterReview(); });
      $('tab-flow').addEventListener('click', function () { S.reviewTab = 'flow'; save(); enterReview(); });
      $('next').addEventListener('click', nextWeek);

      if (S.reviewTab === 'flow') {
        var dbtns = $('screen').querySelectorAll('button[data-rday]');
        for (var i = 0; i < dbtns.length; i++) dbtns[i].addEventListener('click', function (e) { S.reviewDay = parseInt(e.target.dataset.rday, 10); save(); enterReview(); });
      } else {
        var R = S.reviewData;
        var heads = $('screen').querySelectorAll('th.sortable');
        for (var hh = 0; hh < heads.length; hh++) heads[hh].addEventListener('click', function (e) {
          var k = e.target.dataset.sort; if (R.sortKey === k) R.sortDir *= -1; else { R.sortKey = k; R.sortDir = (k === 'name' || k === 'team') ? 1 : -1; } save(); enterReview();
        });
        if (!R.submitted) {
          var fbtn = $('submit-find'); if (fbtn) fbtn.addEventListener('click', submitFindings);
          var cbx = $('screen').querySelectorAll('input[data-flag]');
          for (var b = 0; b < cbx.length; b++) cbx[b].addEventListener('change', function () {
            var n = $('screen').querySelectorAll('input[data-flag]:checked').length; var fc = $('flag-count'); if (fc) fc.textContent = n;
          });
        }
      }
      setStatus('Data review — drill into the call flow and audit the agents.');
    }

    function renderCallFlow() {
      var dr = S.lastResult.dayRes[S.reviewDay], iv = intervalsFor(dr.calls, dr.phones, dr.aht);
      var c = [];
      c.push('<h3>📞 Call flow — intraday detail</h3>');
      c.push('<div class="row" style="margin-bottom:6px">');
      for (var d = 0; d < S.lastResult.dayRes.length; d++) {
        var ddr = S.lastResult.dayRes[d];
        c.push('<button class="btn ' + (d === S.reviewDay ? 'pressed' : '') + '" data-rday="' + d + '" style="min-width:auto;padding:3px 8px">' + DOW[d] + ' <span class="' + (ddr.sl >= CFG.SLA_TARGET ? 'good' : 'bad') + '">' + Math.round(ddr.sl * 100) + '%</span></button>');
      }
      c.push('</div>');
      c.push('<p class="small">' + DOW[dr.d] + ' ' + fmtDate(dateFor(S.week, dr.d)) + ' — ' + dr.calls.toLocaleString() + ' calls, ~' + Math.round(dr.phones) + ' agents on phones, day SL <b class="' + (dr.sl >= CFG.SLA_TARGET ? 'good' : 'bad') + '">' + pct1(dr.sl) + '</b>.</p>');
      var maxCalls = 0; for (var m = 0; m < iv.length; m++) maxCalls = Math.max(maxCalls, iv[m].calls);
      var worstH = 0; for (var w = 1; w < iv.length; w++) if (iv[w].sl < iv[worstH].sl) worstH = w;
      c.push('<table class="grid"><thead><tr><th>Time</th><th>Calls offered</th><th>Arrivals</th><th>Agents</th><th>Service level</th><th>Abandoned</th></tr></thead><tbody>');
      for (var h = 0; h < iv.length; h++) {
        var it = iv[h], barW = maxCalls > 0 ? (it.calls / maxCalls) * 100 : 0;
        c.push('<tr class="' + (h === worstH && it.sl < CFG.SLA_TARGET ? 'cul' : '') + '"><td class="day">' + CFG.OPEN_HOURS[h] + '</td><td>' + Math.round(it.calls).toLocaleString() + '</td><td><div class="bar"><i style="width:' + barW + '%"></i></div></td><td>' + Math.round(it.phones) + '</td><td class="' + (it.sl >= CFG.SLA_TARGET ? 'good' : 'bad') + '">' + pct1(it.sl) + '</td><td>' + Math.round(it.aband) + '</td></tr>');
      }
      c.push('</tbody></table>');
      c.push('<p class="small" style="margin-top:6px">' + flowInsight(dr, iv, worstH) + '</p>');
      return c.join('');
    }
    function flowInsight(dr, iv, worstH) {
      if (dr.sl >= CFG.SLA_TARGET + 0.02) return '✅ This day held up well across every interval — staffing matched the arrival curve.';
      if (iv[worstH].sl < CFG.SLA_TARGET) return '🔎 Service dipped hardest around <b>' + CFG.OPEN_HOURS[worstH] + '</b> — the arrival peak outran your agents. Front-loading the roster toward the busy intervals would lift this.';
      return 'ℹ️ Coverage was broadly even; the shortfall was spread across the day rather than one peak.';
    }

    function renderAudit() {
      var R = S.reviewData;
      var cols = [
        { k: 'name', label: 'Agent', fmt: function (a) { return a.name; } },
        { k: 'team', label: 'Team', fmt: function (a) { return a.team; } },
        { k: 'calls', label: 'Calls', fmt: function (a) { return a.calls; } },
        { k: 'aht', label: 'AHT', fmt: function (a) { return a.aht + 's'; } },
        { k: 'aux', label: 'AUX%', fmt: function (a) { return a.aux + '%'; } },
        { k: 'acw', label: 'Wrap%', fmt: function (a) { return a.acw + '%'; } },
        { k: 'hold', label: 'Hold%', fmt: function (a) { return a.hold + '%'; } },
        { k: 'adh', label: 'Adh%', fmt: function (a) { return a.adh + '%'; } }
      ];
      var rows = R.agents.slice().sort(function (x, y) {
        var a = x[R.sortKey], b = y[R.sortKey];
        if (typeof a === 'string') return a < b ? -R.sortDir : a > b ? R.sortDir : 0;
        return (a - b) * R.sortDir;
      });
      var c = [];
      c.push('<h3>🕵️ Agent behaviour audit — 24 agents, 3 teams</h3>');
      c.push('<p class="small">' + (R.submitted ? 'Audit submitted. ⚠️ marks the agents who were genuinely out of line.' : 'Compare each agent against the <i>team average</i> row. Click a column header to sort and surface outliers. Tick anyone gaming the system, then submit — <b>flagging someone who\'s fine costs morale</b>, so be sure.') + '</p>');
      c.push('<div class="scroll-x"><table class="grid audit"><thead><tr>');
      for (var ci = 0; ci < cols.length; ci++) { var act = R.sortKey === cols[ci].k ? (R.sortDir > 0 ? ' ▲' : ' ▼') : ''; c.push('<th class="sortable" data-sort="' + cols[ci].k + '">' + cols[ci].label + act + '</th>'); }
      c.push(R.submitted ? '<th>Verdict</th>' : '<th>Flag</th>');
      c.push('</tr></thead><tbody>');
      for (var ri = 0; ri < rows.length; ri++) {
        var a = rows[ri], rowCls = (R.submitted && a.issue) ? 'cul' : '';
        c.push('<tr class="' + rowCls + '">');
        for (var cj = 0; cj < cols.length; cj++) c.push('<td' + (cols[cj].k === 'name' ? ' class="day"' : '') + '>' + cols[cj].fmt(a) + (cols[cj].k === 'name' && R.submitted && a.issue ? ' ⚠️' : '') + '</td>');
        if (R.submitted) {
          var flagged = !!R.flagged[a.id], mark;
          if (flagged && a.issue) mark = '<span class="good">✓ caught</span>'; else if (flagged && !a.issue) mark = '<span class="bad">✗ false flag</span>'; else if (!flagged && a.issue) mark = '<span class="warn">⚠ missed</span>'; else mark = '<span class="muted">—</span>';
          c.push('<td>' + mark + '</td>');
        } else {
          c.push('<td><input type="checkbox" data-flag="' + a.id + '"' + (R.flagged[a.id] ? ' checked' : '') + '></td>');
        }
        c.push('</tr>');
      }
      // team average row
      var avg = function (k) { return Math.round(sum(R.agents.map(function (x) { return x[k]; })) / R.agents.length * 10) / 10; };
      c.push('<tr class="avg"><td class="day">Team average</td><td>—</td><td>' + Math.round(avg('calls')) + '</td><td>' + Math.round(avg('aht')) + 's</td><td>' + avg('aux') + '%</td><td>' + avg('acw') + '%</td><td>' + avg('hold') + '%</td><td>' + avg('adh') + '%</td><td>—</td></tr>');
      c.push('</tbody></table></div>');

      if (R.submitted) {
        c.push('<div class="fx-reveal" style="margin-top:8px">' + R.outcome + '</div>');
      } else {
        c.push('<div class="row" style="margin-top:8px"><button class="btn" id="submit-find">Submit findings</button><span class="small muted">Flagged: <b id="flag-count">' + Object.keys(R.flagged).filter(function (k) { return R.flagged[k]; }).length + '</b> · coaching the right people cuts the dodgy-behaviour index.</span></div>');
      }
      return c.join('');
    }

    function submitFindings() {
      var R = S.reviewData; if (R.submitted) return;
      var cbx = $('screen').querySelectorAll('input[data-flag]'); R.flagged = {};
      for (var i = 0; i < cbx.length; i++) if (cbx[i].checked) R.flagged[parseInt(cbx[i].dataset.flag, 10)] = true;
      var correct = 0, fp = 0, missed = 0, totalIssues = 0;
      for (var j = 0; j < R.agents.length; j++) {
        var a = R.agents[j], flagged = !!R.flagged[a.id];
        if (a.issue) totalIssues++;
        if (flagged && a.issue) correct++; else if (flagged && !a.issue) fp++; else if (!flagged && a.issue) missed++;
      }
      if (correct > 0) { S.dodgy = clamp(S.dodgy - Math.min(0.10, correct * 0.025), 0, 1); S.trust.team = clamp(S.trust.team + Math.min(4, correct), 0, 100); }
      if (fp > 0) S.trust.team = clamp(S.trust.team - fp * 2, 0, 100);
      var parts = [];
      if (totalIssues === 0 && fp === 0) parts.push('🧐 A clean week — no agents were genuinely out of line, and you didn\'t flag anyone. Good judgement.');
      else {
        if (correct > 0) parts.push('✅ <b>' + correct + '</b> correctly coached — dodgy-behaviour index now <b>' + pct(S.dodgy) + '</b>, TLs respect the data-driven calls (Team +' + Math.min(4, correct) + ').');
        if (fp > 0) parts.push('❌ <b>' + fp + '</b> false flag' + (fp > 1 ? 's' : '') + ' — those agents were within normal range; singling them out stung morale (Team −' + (fp * 2) + ').');
        if (missed > 0) parts.push('⚠ <b>' + missed + '</b> real issue' + (missed > 1 ? 's' : '') + ' slipped through — they\'re marked now; that behaviour keeps leaking capacity.');
        if (totalIssues === 0 && fp === 0) {}
      }
      R.outcome = parts.join(' '); R.submitted = true;
      save(); renderHUD(); enterReview();
    }

    function nextWeek() {
      if (S.budget < CFG.BANKRUPT) return gameOver('finance');
      if (S.trust.client <= CFG.CLIENT_FLOOR) return gameOver('client');
      if (S.hc < CFG.MIN_HC) return gameOver('ops');
      S.week++; if (S.week >= CFG.WEEKS) return yearEnd();
      save(); enterMeeting();
    }

    /* =======================================================================
       END STATES
       ======================================================================= */
    function gameOver(kind) {
      S.phase = 'over'; save();
      var map = {
        finance: ['💸 Funding pulled', 'The budget ran too deep into the red (' + money(S.budget) + '). Finance has pulled the plug on the operation.'],
        client: ['📞 Account lost', 'After chronic service-level misses, client trust hit rock bottom and they\'ve taken the contract elsewhere.'],
        ops: ['🏚️ Operational collapse', 'Headcount fell to ' + S.hc + ' — there aren\'t enough agents left to run the floor.']
      };
      var msg = map[kind];
      $('screen').innerHTML = '<div class="panel center"><h3>' + msg[0] + '</h3><p>' + msg[1] + '</p><p class="small muted">You reached Week ' + (S.week + 1) + ' with a YTD service level of <b>' + pct1(ytdSLA()) + '</b>.</p><p style="margin-top:12px"><button class="btn big-btn" id="restart">Start a new financial year</button></p></div>';
      $('restart').addEventListener('click', confirmNew); setStatus('Game over.');
    }
    function yearEnd() {
      S.phase = 'over'; save();
      var y = ytdSLA(), budgetOK = S.budget >= 0, grade, blurb;
      if (y >= CFG.SLA_TARGET && budgetOK && S.trust.client >= 60) { grade = 'A — WFM Analyst of the Year'; blurb = 'You held the line all year, kept the books black and the client delighted.'; }
      else if (y >= CFG.SLA_TARGET - 0.01) { grade = budgetOK ? 'B — Target met' : 'B− — Target met, over budget'; blurb = 'You delivered the service level. ' + (budgetOK ? 'Solid year.' : 'It cost more than it should have.'); }
      else if (y >= CFG.SLA_TARGET - 0.05) { grade = 'C — Near miss'; blurb = 'So close. A few better-planned weeks and you\'d have held 80.'; }
      else { grade = 'D — Below standard'; blurb = 'The year-to-date service level slipped well under target.'; }
      if (y > bestSLA()) saveBest(y);
      $('screen').innerHTML = '<div class="panel center"><h3>🎓 Financial year complete!</h3><div class="kpi-strip" style="margin:10px 0"><div class="kpi"><div class="k">Final YTD service</div><div class="v ' + (y >= CFG.SLA_TARGET ? 'good' : 'bad') + '">' + pct1(y) + '</div></div><div class="kpi"><div class="k">Budget</div><div class="v ' + (budgetOK ? 'good' : 'bad') + '">' + money(S.budget) + '</div></div><div class="kpi"><div class="k">Headcount</div><div class="v">' + S.hc + '</div></div><div class="kpi"><div class="k">Client trust</div><div class="v">' + Math.round(S.trust.client) + '</div></div></div><h3 style="margin-top:8px">' + grade + '</h3><p>' + blurb + '</p><p class="small muted">Best YTD on this machine: ' + pct1(bestSLA()) + '</p><p style="margin-top:12px"><button class="btn big-btn" id="restart">Play another year</button></p></div>';
      $('restart').addEventListener('click', confirmNew); setStatus('Year complete — ' + grade);
    }
    function bestSLA() { try { return parseFloat(localStorage.getItem('wfm_y_best') || CFG.SLA_TARGET); } catch (e) { return CFG.SLA_TARGET; } }
    function saveBest(v) { try { localStorage.setItem('wfm_y_best', String(v)); } catch (e) {} }

    /* =======================================================================
       ADVISOR
       ======================================================================= */
    function advisorMeetingTip(first, prev) {
      if (first) return 'Weekdays carry all the volume now — Monday is your biggest day. The grilling answers hide their effect until you pick, so think before you commit.';
      if (prev && prev.sla < prev.committed) return 'You missed your commitment. Owning it costs less trust long-term than spin the data later contradicts.';
      if (S.engagement < 50) return 'Engagement is low — that\'s feeding sick leave, AUX abuse and attrition. An engagement initiative is cheaper than constant rehiring.';
      if (S.trust.fin < 45) return 'Finance trust is low, so they won\'t approve hires. Run a tight, profitable week to win them back.';
      return 'Catching dodgy agents in the data review compounds — every one you coach drags the whole floor\'s behaviour back toward the average.';
    }
    function advisorForecastTip() {
      if (S.campaign) return 'The business says the campaign adds ~10%. Your historical campaigns ran hotter — trust your data, or you\'ll under-staff every day this week.';
      if (weekHasHoliday(S.week)) return 'Holiday week: drop the holiday\'s day right down — a public holiday runs at a fraction of normal volume.';
      if (CFG.SEASON[S.week] >= 1.2) return 'Peak season — the weekday averages will lag the climb. Forecast above them, especially Monday.';
      return 'Set each day from its own weekday average, then nudge for the trend and any signals. Monday runs hottest, Friday lightest.';
    }
    function advisorPlanTip() {
      if (CFG.SEASON[S.week] >= 1.2) return 'Heavy week — if you didn\'t hire weeks ago, lean on overtime and accept some occupancy pain.';
      if (weekHasHoliday(S.week)) return 'Holiday week: volume drops but so does available staff (leave), and rostering the holiday costs penalty rates.';
      return '"Roster needed" already grosses up for shrinkage — that\'s why it\'s bigger than "on phones needed".';
    }
    function advisorResultTip(res) {
      if (res.fErr >= 0.15) return 'Your forecast was off by ' + pct(res.fErr) + ' — that\'s most of why the staffing missed. Accurate forecasting is the foundation.';
      if (res.occ > 0.9) return 'Occupancy over 90% hits SLA today and burns the team next month. High occupancy is borrowed against future attrition.';
      if (!res.hit && res.sla >= CFG.SLA_TARGET) return 'You beat 80% but missed your own commitment — calibration matters as much as performance.';
      if (res.sla < CFG.SLA_TARGET) return 'Under target. Use the call-flow view to see which intervals broke, and the audit to find behaviour leaking capacity.';
      return 'Clean week. Now review the data — the call flow shows where time was lost, the audit shows who.';
    }
    function advisorReviewTip() {
      if (S.reviewData && S.reviewData.submitted) return 'Reviewing the data every week is how you catch problems before the client does.';
      if (S.reviewTab === 'flow') return 'Find the intervals where service dipped — that\'s where your roster and the arrival curve came apart.';
      return 'Sort by AUX%, Wrap%, Hold%, AHT and Adherence in turn — a real outlier floats to the top of one of them. The team-average row is your benchmark.';
    }

    /* =======================================================================
       DIALOGS / MENU
       ======================================================================= */
    function dialog(title, bodyHTML, actions) {
      $('dlg-title').textContent = title; $('dlg-body').innerHTML = bodyHTML;
      var act = $('dlg-actions'); act.innerHTML = '';
      (actions || [{ t: 'OK', f: closeDialog }]).forEach(function (a) { var b = document.createElement('button'); b.className = 'btn'; b.textContent = a.t; b.addEventListener('click', a.f); act.appendChild(b); });
      $('dlg').style.display = 'flex';
    }
    function closeDialog() { $('dlg').style.display = 'none'; }
    function confirmNew() { dialog('New game', 'Start a fresh financial year? Your current game will be erased.', [{ t: 'Start fresh', f: function () { closeDialog(); newGame(); } }, { t: 'Cancel', f: closeDialog }]); }
    function showHelp() {
      dialog('How to Play — WFM Tycoon Y',
        '<p>You are <b>Workforce Management</b> for a contact centre open <b>Monday–Friday</b>. Survive a 52-week financial year keeping the <b>service level near ' + pct(CFG.SLA_TARGET) + '</b>.</p>' +
        '<p style="margin-top:8px"><b>Each week:</b></p><ol style="margin-left:18px">' +
        '<li><b>Monday meeting</b> — answer the grilling (effects hidden until you pick; one option is a trap), spend <b>capital</b> on asks, then <b>commit</b> to a number.</li>' +
        '<li><b>Forecast</b> — read the weekly &amp; daily history and signals, then <b>set each day\'s expected calls yourself</b>.</li>' +
        '<li><b>Plan</b> — spread your workforce across Mon–Fri to cover your forecast.</li>' +
        '<li><b>Run</b> — reality hits and the actuals land.</li>' +
        '<li><b>Review</b> — drill into the <b>call flow</b> (hour-by-hour) to see where service broke, and audit <b>24 agents across 3 teams</b> to catch anyone gaming AUX/wrap/hold/AHT/adherence. Coach the right ones; false flags cost morale.</li>' +
        '</ol>' +
        '<p style="margin-top:8px"><b>📥 The inbox (real time):</b> emails land throughout play and sit in the floating ✉️ corner button. Each has a countdown — open it and pick <b>1 of 4 replies</b> (effects hidden until you choose; one is usually a trap). <b>Ignore one and it expires, costing that stakeholder\'s trust.</b> The clock pauses when you switch tabs.</p>' +
        '<p style="margin-top:8px"><b>You lose if:</b> the budget collapses, the client walks, or the floor empties through attrition.</p>' +
        '<p style="margin-top:8px" class="muted">Tips: forecast accuracy is everything; keep the inbox clear so trust doesn\'t bleed; sort the audit columns to surface outliers against the team average; training takes ' + CFG.TRAIN_WEEKS + ' weeks so hire ahead of the peak. Progress autosaves.</p>',
        [{ t: 'Got it', f: closeDialog }]);
    }
    function showAbout() { dialog('About', '<p><b>WFM Tycoon Y — Service Level 80</b></p><p>A workforce-management sim: daily forecasting, Erlang staffing, intraday call-flow analysis, a 24-agent behaviour audit, and the politics of the Monday meeting. Built for mondayjeffrey.com.</p><p class="small muted">Erlang C engine, AU public-holiday calendar, Mon–Fri operation, FY26/27.</p>', [{ t: 'Close', f: closeDialog }]); }
    function setStatus(s) { $('status-left').textContent = s; $('status-right').textContent = 'YTD ' + pct1(ytdSLA()) + ' · ' + money(S.budget); }

    /* =======================================================================
       INBOX — real-time email pressure. Ticks in real seconds while the tab is
       visible and a game is in play; an ignored email costs the sender's trust.
       The widget is a fixed overlay independent of the phase screens, so it
       never disturbs in-progress selections.
       ======================================================================= */
    var EMAIL_BANK = [
      { from: 'Client', subj: 'Escalation: furious customer', body: 'A customer has escalated to us directly after a 40-minute wait. They want someone senior to respond today.',
        opts: [
          { t: 'Personally call them to apologise and explain the fix.', d: { client: 4 } },
          { t: 'Ask the Team Leader to call them back.', d: { client: 1, team: -1 } },
          { t: 'Send a templated apology email.', d: { client: 0 } },
          { t: 'Reply that wait times aren\'t a WFM issue.', d: { client: -7 } } ] },
      { from: 'Ops', subj: 'Board needs SLA numbers — now', body: 'The exec board meets in an hour and wants this week\'s service-level position. Can you send it through?',
        opts: [
          { t: 'Send the verified figures with a one-line summary.', d: { ops: 3 } },
          { t: 'Send rough numbers fast, caveat them.', d: { ops: 1 } },
          { t: 'Ask them to push the item to next week.', d: { ops: -1 } },
          { t: 'Ignore it — they have dashboards.', d: { ops: -6 } } ] },
      { from: 'Finance', subj: 'Overtime spend is over plan', body: 'OT is tracking above budget again. Finance wants to understand why before sign-off.',
        opts: [
          { t: 'Justify it with the coverage and SLA data.', d: { fin: 3 } },
          { t: 'Commit to trimming OT next week.', d: { fin: 1, team: -1 } },
          { t: 'Say it\'s simply necessary, no detail.', d: { fin: -2 } },
          { t: 'Tell them to just approve it.', d: { fin: -6 } } ] },
      { from: 'HR', subj: 'Agent grievance lodged', body: 'An agent has formally complained that their roster keeps changing at short notice.',
        opts: [
          { t: 'Meet the agent with their TL to talk it through.', d: { team: 4, eng: 1 } },
          { t: 'Forward it to the Team Leader to own.', d: { team: 1 } },
          { t: 'Commit to a roster-stability review.', d: { team: 2 } },
          { t: 'Dismiss it — rosters change, that\'s the job.', d: { team: -6, eng: -2 } } ] },
      { from: 'Team Leader', subj: 'Move team huddle to 10am?', body: 'The TLs want to run the weekly huddle at 10am — right in the morning call peak.',
        opts: [
          { t: 'No — protect peak coverage; reschedule to a lull.', d: { ops: 2 } },
          { t: 'Allow it, but add overtime to cover.', d: { fin: -2, team: 1 } },
          { t: 'Allow it just this once.', d: { ops: -2 } },
          { t: 'Sure, whenever suits the team.', d: { ops: -4, team: 1 } } ] },
      { from: 'Client', subj: 'Can we get a custom report?', body: 'The client wants a bespoke weekly breakdown of contact reasons. New format.',
        opts: [
          { t: 'Build it properly and walk them through it.', d: { client: 3 } },
          { t: 'Send the closest existing report.', d: { client: 1 } },
          { t: 'Delegate it to an analyst to produce.', d: { client: 2 } },
          { t: 'Decline — we\'re too busy for extras.', d: { client: -5 } } ] },
      { from: 'Ops', subj: 'Occupancy looks brutal today', body: 'Ops has noticed occupancy sitting above 90% and is worried about the team.',
        opts: [
          { t: 'Explain the occupancy/SLA trade-off with data.', d: { ops: 2 } },
          { t: 'Agree and promise to add staff where you can.', d: { ops: 1, fin: -1 } },
          { t: 'Brush it off — they\'ll be fine.', d: { ops: -2, team: -1 } },
          { t: 'Say occupancy is meaningless anyway.', d: { ops: -6 } } ] },
      { from: 'Finance', subj: 'Budget review — Thursday', body: 'Finance wants a half-hour to walk the line items of your cost centre.',
        opts: [
          { t: 'Prepare a clean cost breakdown beforehand.', d: { fin: 3 } },
          { t: 'Send a deputy with the numbers.', d: { fin: 0 } },
          { t: 'Turn up and wing it.', d: { fin: -2 } },
          { t: 'Decline the meeting.', d: { fin: -5 } } ] },
      { from: 'HR', subj: 'Sick leave spiking', body: 'Absence is well up this fortnight and HR is flagging possible burnout.',
        opts: [
          { t: 'Launch a wellbeing check-in across teams.', d: { team: 3, eng: 2, budget: -2000 } },
          { t: 'Note it for the next people review.', d: { team: 1 } },
          { t: 'Tell agents to return to work sooner.', d: { team: -3, eng: -1 } },
          { t: 'Ignore it — people get sick.', d: { team: -5 } } ] },
      { from: 'Team Leader', subj: 'Star agent might quit', body: 'One of your best agents has hinted they\'re interviewing elsewhere.',
        opts: [
          { t: 'Fast-track a retention conversation today.', d: { team: 3, eng: 2 } },
          { t: 'Offer a small retention bonus.', d: { budget: -1500, team: 2 } },
          { t: 'Let the TL quietly handle it.', d: { team: 0 } },
          { t: 'Shrug — everyone\'s replaceable.', d: { team: -7, eng: -3 } } ] },
      { from: 'Client', subj: 'Thank you — great week!', body: 'The client emailed praise for last week\'s turnaround. Even good news wants a reply.',
        opts: [
          { t: 'Thank them and share the credit with the team.', d: { client: 2, eng: 2 } },
          { t: 'Acknowledge it briefly.', d: { client: 1 } },
          { t: 'Forward it to the team only.', d: { eng: 1 } },
          { t: 'Leave it on read.', d: { client: -2 } } ] },
      { from: 'Ops', subj: 'Media asking about wait times', body: 'A local journalist is asking about our hold times for a story.',
        opts: [
          { t: 'Loop in Comms with accurate context.', d: { ops: 2, client: 1 } },
          { t: 'Give a careful quick quote yourself.', d: { client: -2 } },
          { t: 'Decline to comment.', d: { ops: 0 } },
          { t: 'Wing an off-the-cuff answer to the reporter.', d: { client: -6 } } ] },
      { from: 'Finance', subj: 'Invoice needs approval today', body: 'A supplier invoice is sitting in your queue and is due for payment.',
        opts: [
          { t: 'Review the line items and approve.', d: { fin: 2 } },
          { t: 'Query one charge that looks off.', d: { fin: 1 } },
          { t: 'Approve it without reading.', d: { fin: -1 } },
          { t: 'Sit on it past the due date.', d: { fin: -4 } } ] },
      { from: 'Team Leader', subj: 'Morale dipping after a hard week', body: 'The floor took a battering this week and the TLs say spirits are low.',
        opts: [
          { t: 'Shout the team a lunch to reset.', d: { budget: -1500, eng: 3, team: 2 } },
          { t: 'Send a genuine thank-you note.', d: { eng: 1 } },
          { t: 'Acknowledge it to the TLs.', d: { team: 1 } },
          { t: 'Tell them to toughen up.', d: { eng: -3, team: -4 } } ] }
    ];

    function senderClass(from) { return { Client: 'client', Ops: 'ops', Finance: 'finance', HR: 'hr', 'Team Leader': 'tl' }[from] || 'ops'; }
    function senderTrustKey(from) { return { Client: 'client', Ops: 'ops', Finance: 'fin', HR: 'team', 'Team Leader': 'team' }[from] || 'ops'; }
    function running() { return S && ['meeting', 'forecast', 'planning', 'results', 'review'].indexOf(S.phase) >= 0; }

    function applyEmailFx(d) {
      if (!d) return;
      for (var k in d) {
        if (k === 'eng') S.engagement = clamp(S.engagement + d[k], 0, 100);
        else if (k === 'budget') S.budget += d[k];
        else if (S.trust[k] != null) S.trust[k] = clamp(S.trust[k] + d[k], 0, 100);
      }
    }
    function emailFxText(d) {
      var map = { ops: 'Ops', fin: 'Finance', client: 'Client', team: 'TLs', eng: 'Team' };
      var keys = Object.keys(d);
      if (!keys.length) return 'no impact';
      return keys.map(function (k) { if (k === 'budget') return (d[k] >= 0 ? '+' : '') + money(d[k]); return map[k] + ' ' + (d[k] >= 0 ? '+' : '') + d[k]; }).join(', ');
    }
    function barColor(u) { return u > 0.5 ? 'linear-gradient(90deg,#34d399,#10b981)' : u > 0.25 ? 'linear-gradient(90deg,#fbbf24,#f59e0b)' : 'linear-gradient(90deg,#f87171,#ef4444)'; }
    function urgency(m) { return clamp(1 - (S.gameSeconds - m.landed) / m.ttl, 0, 1); }

    function spawnEmail() {
      if (S.inbox.length >= CFG.INBOX.MAX_ACTIVE) return false;
      var active = S.inbox.map(function (m) { return m.tpl; });
      var choices = [];
      for (var i = 0; i < EMAIL_BANK.length; i++) if (active.indexOf(i) < 0) choices.push(i);
      if (!choices.length) return false;
      var idx = pick(choices), tpl = EMAIL_BANK[idx];
      S.inbox.push({ id: S.inboxSeq++, tpl: idx, from: tpl.from, subj: tpl.subj, body: tpl.body, opts: tpl.opts, order: shuffle(tpl.opts.map(function (_, i) { return i; })), landed: S.gameSeconds, ttl: tpl.ttl || CFG.INBOX.TTL });
      return true;
    }
    function answerEmail(id, optIdx) {
      var m = null, i; for (i = 0; i < S.inbox.length; i++) if (S.inbox[i].id === id) { m = S.inbox[i]; break; }
      if (!m) return;
      applyEmailFx(m.opts[optIdx].d);
      S.inbox.splice(i, 1); S.emailsHandled++;
      flashInbox('✉️ Replied to ' + m.from + ' — ' + emailFxText(m.opts[optIdx].d));
      save(); renderHUD(); renderInboxFab(); if (S.inboxOpen) renderInboxList();
    }
    function expireEmail(m) {
      var key = senderTrustKey(m.from), d = {}; d[key] = -CFG.INBOX.EXPIRE;
      applyEmailFx(d); S.emailsExpired++;
      flashInbox('⏰ Ignored email from ' + m.from + ' — ' + emailFxText(d), true);
    }
    function flashInbox(msg, bad) {
      S._inboxFlash = { msg: msg, bad: !!bad, at: S.gameSeconds };
      var f = $('inbox-flash'); if (f && S.inboxOpen) { f.style.display = 'block'; f.innerHTML = (bad ? '<span class="bad">' : '') + msg + (bad ? '</span>' : ''); }
    }

    function inboxTick() {
      if (!running()) { renderInboxFab(); return; }
      if (document.hidden) return;
      S.gameSeconds += CFG.INBOX.TICK;
      if (S.gameSeconds >= S.nextEmailAt) {
        if (spawnEmail()) { S.nextEmailAt = S.gameSeconds + rand(CFG.INBOX.MIN_GAP, CFG.INBOX.MAX_GAP); if (S.inboxOpen) renderInboxList(); }
        else { S.nextEmailAt = S.gameSeconds + 8; }
      }
      var changed = false;
      for (var i = S.inbox.length - 1; i >= 0; i--) { var m = S.inbox[i]; if (S.gameSeconds - m.landed >= m.ttl) { expireEmail(m); S.inbox.splice(i, 1); changed = true; } }
      if (changed) { renderHUD(); save(); if (S.inboxOpen) renderInboxList(); }
      if (S._inboxFlash && S.gameSeconds - S._inboxFlash.at > 4) { S._inboxFlash = null; var f = $('inbox-flash'); if (f) f.style.display = 'none'; }
      renderInboxFab();
      if (S.inboxOpen) updateCountdowns();
    }

    function renderInboxFab() {
      var fab = $('inbox-fab'); if (!fab) return;
      if (!running()) { fab.style.display = 'none'; var p = $('inbox-panel'); if (p) p.style.display = 'none'; return; }
      fab.style.display = 'flex';
      var n = S.inbox.length;
      $('inbox-count').textContent = n;
      fab.classList.toggle('empty', n === 0);
      fab.classList.toggle('urgent', S.inbox.some(function (m) { return urgency(m) < 0.34; }));
    }
    function openInbox() { S.inboxOpen = true; var p = $('inbox-panel'); if (p) p.style.display = 'flex'; renderInboxList(); }
    function closeInbox() { S.inboxOpen = false; var p = $('inbox-panel'); if (p) p.style.display = 'none'; }
    function toggleInbox() { if (S.inboxOpen) closeInbox(); else openInbox(); }

    function renderInboxList() {
      var list = $('inbox-list'); if (!list) return;
      var f = $('inbox-flash');
      if (f) { if (S._inboxFlash) { f.style.display = 'block'; f.innerHTML = (S._inboxFlash.bad ? '<span class="bad">' : '') + S._inboxFlash.msg + (S._inboxFlash.bad ? '</span>' : ''); } else f.style.display = 'none'; }
      $('inbox-sub').textContent = S.inbox.length ? '· ' + S.inbox.length + ' to clear' : '';
      if (!S.inbox.length) { list.innerHTML = '<div class="inbox-empty">📭 Inbox zero. Nice — keep it that way.</div>'; return; }
      var c = [];
      for (var i = 0; i < S.inbox.length; i++) {
        var m = S.inbox[i], u = urgency(m);
        c.push('<div class="mail ' + (u < 0.34 ? 'urgent' : '') + '" id="mail-' + m.id + '">');
        c.push('<div class="mail-top"><span class="mail-from ' + senderClass(m.from) + '">' + m.from + '</span><span class="mail-subj">' + m.subj + '</span></div>');
        c.push('<div class="mailbar"><i id="mailbar-' + m.id + '" style="width:' + (u * 100) + '%;background:' + barColor(u) + '"></i></div>');
        c.push('<div class="mail-body">' + m.body + '</div>');
        c.push('<div class="mail-replies">');
        for (var j = 0; j < m.order.length; j++) { var oi = m.order[j]; c.push('<button class="mail-rep" data-mail="' + m.id + '" data-opt="' + oi + '">' + m.opts[oi].t + '</button>'); }
        c.push('</div></div>');
      }
      list.innerHTML = c.join('');
      var btns = list.querySelectorAll('.mail-rep');
      for (var b = 0; b < btns.length; b++) btns[b].addEventListener('click', function (e) { answerEmail(parseInt(e.currentTarget.dataset.mail, 10), parseInt(e.currentTarget.dataset.opt, 10)); });
    }
    function updateCountdowns() {
      for (var i = 0; i < S.inbox.length; i++) {
        var m = S.inbox[i], u = urgency(m);
        var bar = $('mailbar-' + m.id); if (bar) { bar.style.width = (u * 100) + '%'; bar.style.background = barColor(u); }
        var card = $('mail-' + m.id); if (card) card.classList.toggle('urgent', u < 0.34);
      }
    }

    /* =======================================================================
       BOOT
       ======================================================================= */
    function resume() {
      renderHUD();
      if (S.phase === 'forecast') enterForecast();
      else if (S.phase === 'planning') enterPlanning();
      else if (S.phase === 'results' && S.lastResult) drawResults(S.lastResult);
      else if (S.phase === 'review' && S.reviewData) enterReview();
      else if (S.phase === 'over') { if (S.week >= CFG.WEEKS) yearEnd(); else enterMeeting(); }
      else enterMeeting();
    }
    $('m-new').addEventListener('click', confirmNew);
    $('m-help').addEventListener('click', showHelp);
    $('m-about').addEventListener('click', showAbout);

    var saved = load();
    if (saved && typeof saved.week === 'number') {
      S = saved;
      if (!S.trust) S.trust = { ops: 60, fin: 56, client: 62, team: 58 };
      if (S.ahtSkill == null) S.ahtSkill = 1.0;
      if (!S.weekInits) S.weekInits = { engagement: false, coaching: false, training: false };
      if (!S.callHistory) S.callHistory = [];
      if (!S.history) S.history = [];
      if (S.reviewTab == null) S.reviewTab = 'audit';
      if (S.reviewDay == null) S.reviewDay = 0;
      if (!S.inbox) S.inbox = [];
      if (S.inboxSeq == null) S.inboxSeq = 1;
      if (S.gameSeconds == null) S.gameSeconds = 0;
      if (S.nextEmailAt == null) S.nextEmailAt = S.gameSeconds + CFG.INBOX.FIRST;
      if (S.emailsHandled == null) S.emailsHandled = 0;
      if (S.emailsExpired == null) S.emailsExpired = 0;
      S.inboxOpen = false;
      resume();
    } else {
      renderHUDPlaceholder();
      $('screen').innerHTML = '<div class="panel center"><h3>📲 WFM Tycoon Y — Service Level 80</h3><p>Run workforce management for a contact centre across one financial year.</p><p class="small muted">Forecast each day from real data, staff with Erlang, fight shrinkage, sick leave, dodgy phone behaviour, attrition and the budget — drill into the call flow and audit the floor each week, and front up to the business every Monday. Hold the service level at <b>' + pct(CFG.SLA_TARGET) + '</b> (open Mon–Fri).</p><p style="margin-top:14px"><button class="btn big-btn" id="start">Start the financial year ▶</button></p><p class="small"><a href="#" id="howto">How to play</a></p></div>';
      $('start').addEventListener('click', newGame);
      $('howto').addEventListener('click', function (e) { e.preventDefault(); showHelp(); });
      setStatusBoot();
    }
    function renderHUDPlaceholder() { $('hud').innerHTML = '<div class="hud-cell" style="grid-column:1/-1"><div class="k">Welcome</div><div class="v">WFM Tycoon Y</div><div class="hud-sub">Press start to begin FY26/27</div></div>'; }
    function setStatusBoot() { $('status-left').textContent = 'Ready. Press start to begin.'; $('status-right').textContent = 'Best YTD ' + pct1(bestSLA()); }

    // Inbox wiring + real-time ticker
    $('inbox-fab').addEventListener('click', toggleInbox);
    $('inbox-close').addEventListener('click', closeInbox);
    setInterval(inboxTick, CFG.INBOX.TICK_MS);
    renderInboxFab();

    // debug hook (mirrors footy's window.__footy) — harmless console helper
    window.__wfmy = {
      state: function () { return S; },
      spawn: function (n) { var k = n || 1, r = 0; for (var i = 0; i < k; i++) if (spawnEmail()) r++; renderInboxFab(); if (S && S.inboxOpen) renderInboxList(); return r; },
      fwd: function (s) { if (S) { S.gameSeconds += (s || 30); } return S ? S.gameSeconds : null; },
      tick: inboxTick
    };
  })();
  </script>
</body>
