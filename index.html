<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monday Jeffrey</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #008080;
      font-family: 'Arial', sans-serif;
      font-size: 12px;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* Desktop area */
    #desktop {
      width: 100%;
      height: calc(100vh - 40px);
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 16px;
    }

    /* Desktop icons */
    .icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 80px;
      cursor: pointer;
      text-decoration: none;
      color: white;
      padding: 4px;
      border: 1px solid transparent;
      text-align: center;
      gap: 4px;
    }

    .icon:hover {
      border: 1px dotted white;
      background-color: rgba(255,255,255,0.1);
    }

    .icon:active .icon-img {
      filter: brightness(0.7);
    }

    .icon-img {
      width: 48px;
      height: 48px;
      image-rendering: pixelated;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }

    .icon-label {
      font-size: 11px;
      color: white;
      text-shadow: 1px 1px 1px black;
      word-break: break-word;
      line-height: 1.2;
    }

    /* Taskbar */
    #taskbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40px;
      background-color: #c0c0c0;
      border-top: 2px solid #ffffff;
      display: flex;
      align-items: center;
      padding: 0 4px;
      gap: 4px;
    }

    /* Start button */
    #start-btn {
      height: 30px;
      padding: 0 8px;
      background-color: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-bottom: 2px solid #404040;
      border-right: 2px solid #404040;
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      font-family: Arial, sans-serif;
    }

    #start-btn:active {
      border-top: 2px solid #404040;
      border-left: 2px solid #404040;
      border-bottom: 2px solid #ffffff;
      border-right: 2px solid #ffffff;
    }

    #start-btn .win-logo {
      font-size: 16px;
    }

    /* Clock */
    #clock {
      margin-left: auto;
      height: 30px;
      padding: 0 8px;
      background-color: #c0c0c0;
      border-top: 2px solid #404040;
      border-left: 2px solid #404040;
      border-bottom: 2px solid #ffffff;
      border-right: 2px solid #ffffff;
      display: flex;
      align-items: center;
      font-size: 12px;
      font-family: Arial, sans-serif;
    }

    /* Taskbar divider */
    .taskbar-divider {
      width: 2px;
      height: 28px;
      border-left: 1px solid #808080;
      border-right: 1px solid #ffffff;
    }
  </style>
</head>
<body>

  <div id="desktop">

    <!-- Add project icons here. Copy/paste a block to add a new one. -->

    <a class="icon" href="#" title="Coming soon">
      <div class="icon-img">🎮</div>
      <div class="icon-label">Game</div>
    </a>

    <a class="icon" href="#" title="Coming soon">
      <div class="icon-img">🎵</div>
      <div class="icon-label">Song</div>
    </a>

    <a class="icon" href="#" title="Coming soon">
      <div class="icon-img">🏏</div>
      <div class="icon-label">Cricket Sim</div>
    </a>

  </div>

  <!-- Taskbar -->
  <div id="taskbar">
    <div id="start-btn">
      <span class="win-logo">⊞</span> Start
    </div>
    <div class="taskbar-divider"></div>
    <div id="clock"></div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const h = now.getHours().toString().padStart(2, '0');
      const m = now.getMinutes().toString().padStart(2, '0');
      document.getElementById('clock').textContent = h + ':' + m;
    }
    updateClock();
    setInterval(updateClock, 10000);
  </script>

</body>
</html>
