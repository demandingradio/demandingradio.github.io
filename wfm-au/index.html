<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WFM Tycoon AU - Monday Jeffrey</title>
  <link rel="icon" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="82" font-size="84">🦘</text></svg>'>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ===================================================================
       WFM TYCOON AU — modern "Game Dev Tycoon"-style skin.
       Same game engine; this is a full-page reskin. All class/ID hooks
       below match what the shared game JS renders.
       =================================================================== */
    :root {
      --bg: #0f1420; --bg2: #161d2e; --panel: #1b2335; --panel2: #212c42; --panel3: #28344e;
      --line: #313e5c; --line2: #3d4d72; --txt: #e6ecf7; --txt-dim: #9aa8c4; --txt-mute: #6b7896;
      --accent: #4f8cff; --accent2: #7c5cff; --good: #34d399; --bad: #f87171; --warn: #fbbf24; --gold: #ffcf5c;
      --shadow: 0 8px 24px rgba(0,0,0,.35); --radius: 14px; --radius-sm: 9px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(124,92,255,.18), transparent 60%),
        radial-gradient(900px 500px at -10% 110%, rgba(79,140,255,.16), transparent 55%),
        var(--bg);
      color: var(--txt); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow-y: scroll;
    }
    .app { max-width: 1080px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
    .topbar {
      position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 14px; padding: 12px 20px;
      background: rgba(15,20,32,.82); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -.3px; }
    .brand .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: grid; place-items: center; font-size: 18px; box-shadow: 0 4px 14px rgba(79,140,255,.45); }
    .brand small { display: block; font-size: 10px; font-weight: 600; color: var(--txt-mute); letter-spacing: 2px; text-transform: uppercase; }
    .topbar .menu { margin-left: auto; display: flex; gap: 6px; }
    .menu-btn { padding: 7px 13px; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--txt-dim); background: transparent; border: 1px solid transparent; transition: .15s; }
    .menu-btn:hover { color: var(--txt); background: var(--panel2); border-color: var(--line); }
    .wfm-body { padding: 18px 20px 60px; flex: 1; }

    .hud { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr 1.7fr; gap: 12px; margin-bottom: 18px; }
    .hud-cell { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
    .hud-cell::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); opacity: .7; }
    .hud-cell .k { font-size: 10.5px; color: var(--txt-mute); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .hud-cell .v { font-size: 22px; font-weight: 800; letter-spacing: -.5px; margin-top: 2px; }
    .hud-cell .v.sla { font-size: 30px; }
    .hud-sub { font-size: 11px; color: var(--txt-dim); margin-top: 1px; }
    .trust-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 12px; }
    .trust-row { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--txt-dim); }
    .trust-row .tl { width: 50px; font-weight: 600; }
    .trust-row b { color: var(--txt); margin-left: 2px; }
    .meter { flex: 1; height: 7px; background: #0d1320; border-radius: 99px; position: relative; overflow: hidden; border: 1px solid var(--line); }
    .meter > i { position: absolute; left: 0; top: 0; bottom: 0; display: block; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .4s ease; }
    .meter.eng > i { background: linear-gradient(90deg, #34d399, #10b981); }
    .meter.bad > i { background: linear-gradient(90deg, #f87171, #ef4444); }
    .meter.warn > i { background: linear-gradient(90deg, #fbbf24, #f59e0b); }

    .screen { display: flex; flex-direction: column; gap: 14px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
    .panel h3 { font-size: 16px; font-weight: 700; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); letter-spacing: -.2px; }
    .panel h4 { font-size: 13px; font-weight: 700; margin: 14px 0 7px; color: var(--txt-dim); text-transform: uppercase; letter-spacing: .5px; }
    .muted { color: var(--txt-mute); }
    .small { font-size: 12.5px; color: var(--txt-dim); }
    .center { text-align: center; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .spacer { flex: 1; }
    .pill { display: inline-block; padding: 2px 10px; border-radius: 99px; background: var(--panel3); border: 1px solid var(--line2); font-size: 12px; font-weight: 600; color: var(--txt); }
    .good { color: var(--good); font-weight: 700; }
    .bad { color: var(--bad); font-weight: 700; }
    .warn { color: var(--warn); font-weight: 700; }

    .btn { font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 9px 16px; border-radius: 10px; color: var(--txt); background: var(--panel3); border: 1px solid var(--line2); transition: .15s; }
    .btn:hover { background: #32426a; border-color: #5570a0; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn.pressed { background: var(--accent); border-color: var(--accent); color: #fff; }
    .big-btn { min-width: 230px; padding: 13px 22px; font-size: 15px; font-weight: 700; border-radius: 12px; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; box-shadow: 0 6px 20px rgba(79,140,255,.4); }
    .big-btn:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 8px 26px rgba(79,140,255,.5); }
    .sunken { background: #0d1320; border: 1px solid var(--line2); border-radius: 8px; color: var(--txt); }

    .advisor { display: flex; gap: 12px; align-items: flex-start; background: linear-gradient(180deg, rgba(124,92,255,.14), rgba(79,140,255,.08)); border: 1px solid var(--line2); border-radius: var(--radius); padding: 13px 15px; font-size: 13px; color: var(--txt-dim); box-shadow: var(--shadow); }
    .advisor b { color: var(--txt); }
    .advisor .face { font-size: 26px; line-height: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,.4)); }

    .opt { display: block; padding: 11px 14px; margin: 7px 0; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); cursor: pointer; font-size: 13.5px; transition: .14s; }
    .opt:hover { border-color: var(--accent); background: var(--panel3); }
    .opt input { margin-right: 9px; accent-color: var(--accent); transform: translateY(1px); }
    .opt.disabled { color: var(--txt-mute); cursor: not-allowed; background: #131a28; border-style: dashed; }
    .opt.disabled:hover { border-color: var(--line); }
    .cost { font-size: 11.5px; color: var(--txt-mute); }
    .fx-reveal { margin-top: 10px; padding: 11px 14px; border-radius: 10px; font-size: 13px; background: rgba(79,140,255,.1); border: 1px dashed var(--accent); color: var(--txt-dim); min-height: 1.5em; }

    table.grid { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
    table.grid th, table.grid td { padding: 8px 10px; text-align: center; border-bottom: 1px solid var(--line); }
    table.grid th { background: var(--panel3); color: var(--txt-dim); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
    table.grid tbody tr:last-child td { border-bottom: none; }
    table.grid tbody tr:nth-child(odd) td { background: rgba(255,255,255,.012); }
    table.grid td.day { text-align: left; white-space: nowrap; font-weight: 600; }
    table.grid tr.hol td { background: rgba(251,191,36,.12) !important; }
    table.grid tr.avg td { background: var(--panel3) !important; font-weight: 700; color: var(--txt); }
    table.grid tr.cul td { background: rgba(248,113,113,.16) !important; }
    table.grid tr.team-sep td { background: var(--panel3) !important; text-align: left; font-weight: 700; color: var(--accent); }
    table.audit td, table.audit th { padding: 6px 8px; }
    table.audit th.sortable { cursor: pointer; user-select: none; }
    table.audit th.sortable:hover { background: var(--accent); color: #fff; }
    .scroll-x { overflow-x: auto; border-radius: 10px; }
    input.num-in, input.fc-in, input.fc-tot { background: #0d1320; border: 1px solid var(--line2); border-radius: 7px; color: var(--txt); font-family: inherit; text-align: center; font-weight: 700; padding: 5px 4px; outline: none; }
    input.num-in:focus, input.fc-in:focus, input.fc-tot:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79,140,255,.25); }
    .num-in { width: 52px; font-size: 13px; }
    .fc-in { width: 80px; font-size: 14px; }
    .fc-tot { width: 100px; font-size: 16px; }

    .cov { height: 16px; background: #0d1320; border: 1px solid var(--line); border-radius: 99px; position: relative; min-width: 70px; overflow: hidden; }
    .cov > i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #34d399, #10b981); border-radius: 99px; transition: width .3s; }
    .cov.under > i { background: linear-gradient(90deg, #f87171, #ef4444); }
    .cov .lab { position: relative; z-index: 2; font-size: 10px; line-height: 16px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }

    .bar { height: 14px; background: #0d1320; border: 1px solid var(--line); border-radius: 99px; position: relative; min-width: 60px; overflow: hidden; }
    .bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; }

    .kpi-strip { display: flex; gap: 12px; flex-wrap: wrap; }
    .kpi { flex: 1; min-width: 110px; background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 10px; text-align: center; box-shadow: var(--shadow); }
    .kpi .k { font-size: 10.5px; color: var(--txt-mute); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .kpi .v { font-size: 26px; font-weight: 800; letter-spacing: -.5px; margin: 3px 0; }

    .tabs { display: flex; gap: 8px; margin-bottom: 0; }
    .tab { padding: 10px 18px; border-radius: 11px 11px 0 0; background: var(--panel2); border: 1px solid var(--line); border-bottom: none; cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--txt-dim); transition: .14s; margin-bottom: -1px; }
    .tab:hover { color: var(--txt); }
    .tab.active { background: var(--panel); color: var(--txt); position: relative; z-index: 2; box-shadow: 0 -3px 0 var(--accent) inset; }

    .log { font-size: 13px; line-height: 1.7; }
    .log .li { padding: 5px 0; border-bottom: 1px solid var(--line); }
    .log .li:last-child { border-bottom: none; }
    .delta-up { color: var(--good); }
    .delta-dn { color: var(--bad); }

    #dlg { position: fixed; inset: 0; background: rgba(8,11,18,.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 3000; padding: 20px; }
    .dlg-card { background: var(--panel); border: 1px solid var(--line2); border-radius: var(--radius); min-width: 320px; max-width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,.5); overflow: hidden; }
    #dlg-title { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; padding: 13px 18px; font-weight: 700; font-size: 15px; }
    #dlg-body { padding: 18px; font-size: 13.5px; line-height: 1.6; color: var(--txt-dim); max-height: 62vh; overflow: auto; }
    #dlg-body b { color: var(--txt); }
    #dlg-body a { color: var(--accent); }
    #dlg-actions { padding: 0 18px 18px; display: flex; justify-content: flex-end; gap: 10px; }

    .statusbar { display: flex; justify-content: space-between; gap: 10px; padding: 9px 20px; font-size: 12px; color: var(--txt-mute); border-top: 1px solid var(--line); background: rgba(15,20,32,.6); }

    /* ---------- real-time inbox ---------- */
    .inbox-fab { position: fixed; right: 22px; bottom: 22px; z-index: 2500; width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 8px 24px rgba(79,140,255,.5); color: #fff; font-size: 25px; display: flex; align-items: center; justify-content: center; transition: transform .18s; }
    .inbox-fab:hover { transform: translateY(-2px) scale(1.05); }
    .inbox-fab .inbox-count { position: absolute; top: -4px; right: -4px; min-width: 23px; height: 23px; padding: 0 5px; border-radius: 12px; background: var(--bad); color: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg); }
    .inbox-fab.empty .inbox-count { display: none; }
    .inbox-fab.empty { background: linear-gradient(135deg, #39455f, #2c3550); box-shadow: 0 6px 18px rgba(0,0,0,.4); }
    .inbox-fab.urgent { animation: fabpulse 1s infinite; }
    .inbox-fab.idle-tick:not(.urgent):not(.empty) { animation: fab-idle 2.6s ease-in-out infinite; }
    @keyframes fabpulse { 0%,100% { box-shadow: 0 8px 24px rgba(248,113,113,.5); } 50% { box-shadow: 0 8px 36px rgba(248,113,113,.95); } }
    @keyframes fab-idle { 0%,100% { box-shadow: 0 8px 24px rgba(79,140,255,.5); } 50% { box-shadow: 0 8px 28px rgba(79,140,255,.85); } }
    .ach-toast { position: fixed; top: 78px; right: 22px; z-index: 3000; padding: 12px 18px; border-radius: 11px; background: linear-gradient(135deg, #f0b400, #b8860b); color: #fff; max-width: 290px; box-shadow: 0 12px 36px rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.22); animation: ach-slide .42s ease-out; }
    .ach-toast .ach-cap { font-size: 11px; font-weight: 800; opacity: .9; letter-spacing: .06em; text-transform: uppercase; }
    .ach-toast .ach-name { font-size: 15px; font-weight: 700; margin-top: 3px; }
    @keyframes ach-slide { from { transform: translateX(125%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .ach-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; margin-top: 10px; text-align: left; }
    .ach-card { padding: 11px 13px; border-radius: 10px; font-size: 13px; line-height: 1.45; transition: transform .18s ease, box-shadow .18s ease; }
    .ach-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.35); }
    .ach-card .ach-meta { font-size: 11px; opacity: .78; margin-top: 3px; font-weight: 500; }
    .ach-card.unlocked { background: linear-gradient(135deg, rgba(240,180,0,.14), rgba(184,134,11,.16)); border: 1px solid rgba(240,180,0,.55); color: #ffd86a; }
    .ach-card.locked { background: var(--panel2); border: 1px dashed var(--line2); color: var(--txt-dim); opacity: .68; }
    .inbox-panel { position: fixed; right: 22px; bottom: 92px; z-index: 2500; width: 390px; max-width: calc(100vw - 44px); max-height: 72vh; background: var(--panel); border: 1px solid var(--line2); border-radius: var(--radius); box-shadow: 0 22px 60px rgba(0,0,0,.6); display: flex; flex-direction: column; overflow: hidden; }
    .inbox-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--panel2); font-size: 15px; }
    .inbox-head .btn { padding: 4px 10px; min-width: 0; }
    .inbox-flash { padding: 9px 14px; font-size: 12.5px; background: rgba(79,140,255,.12); border-bottom: 1px solid var(--line); color: var(--txt-dim); }
    .inbox-list { overflow-y: auto; padding: 11px; display: flex; flex-direction: column; gap: 11px; }
    .mail { background: var(--panel2); border: 1px solid var(--line); border-radius: 11px; padding: 11px 12px; }
    .mail.urgent { border-color: var(--bad); box-shadow: 0 0 0 1px rgba(248,113,113,.4); }
    .mail-top { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; }
    .mail-from { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; padding: 2px 8px; border-radius: 99px; }
    .mail-from.client { background: rgba(124,92,255,.25); color: #cbb9ff; }
    .mail-from.ops { background: rgba(79,140,255,.22); color: #a9c7ff; }
    .mail-from.finance { background: rgba(52,211,153,.2); color: #86efc5; }
    .mail-from.hr { background: rgba(251,191,36,.2); color: #fcd56b; }
    .mail-from.tl { background: rgba(248,113,113,.2); color: #fca5a5; }
    .mail-subj { font-weight: 700; font-size: 13.5px; }
    .mail-body { font-size: 12.5px; color: var(--txt-dim); margin: 4px 0 8px; line-height: 1.5; }
    .mailbar { height: 5px; border-radius: 99px; background: #0d1320; overflow: hidden; margin-bottom: 9px; }
    .mailbar > i { display: block; height: 100%; border-radius: 99px; transition: width .4s linear; }
    .mailrem { margin: 2px 0 4px; font-size: 11.5px; }
    .mailrem.urgent { color: var(--bad); font-weight: 600; }
    .mail-replies { display: flex; flex-direction: column; gap: 5px; }
    .mail-rep { text-align: left; font-family: inherit; font-size: 12.5px; padding: 8px 11px; border-radius: 8px; background: var(--panel3); border: 1px solid var(--line2); color: var(--txt); cursor: pointer; transition: .12s; }
    .mail-rep:hover { border-color: var(--accent); background: #32426a; }
    .inbox-empty { padding: 26px 16px; text-align: center; color: var(--txt-mute); font-size: 13px; }

    @media (max-width: 820px) { .hud { grid-template-columns: 1fr 1fr; } .hud-cell.trust { grid-column: span 2; } table.grid { font-size: 12px; } table.grid th, table.grid td { padding: 6px 7px; } }
    @media (max-width: 520px) {
      .hud { grid-template-columns: 1fr; } .hud-cell.trust { grid-column: span 1; } .brand small { display: none; }
      .ach-grid { grid-template-columns: 1fr; }
      table.grid { font-size: 11px; } table.grid th, table.grid td { padding: 5px 6px; }
      .kpi { padding: 10px 6px; min-width: 90px; } .kpi-strip { gap: 8px; }
      .hud-cell .v { font-size: 18px; } .hud-cell .v.sla { font-size: 24px; }
      .inbox-fab { width: 52px; height: 52px; font-size: 22px; right: 14px; bottom: 14px; }
      .inbox-panel { right: 10px; left: 10px; width: auto; bottom: 78px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">&#128242;</span>
        <span>WFM Tycoon AU<small>Service Level 80</small></span>
      </div>
      <nav class="menu">
        <div class="menu-btn" id="m-new" title="Start a fresh financial year — your current run will be erased.">New Game</div>
        <div class="menu-btn" id="m-help" title="Quick mechanics + keyboard shortcuts (or press ?)">How to Play</div>
        <div class="menu-btn" id="m-about" title="Credits, sound toggle (m), save / load.">About</div>
        <a class="menu-btn" href="../index.html" style="text-decoration:none" title="Back to mondayjeffrey.com — your progress autosaves to your browser.">&#10005; Exit</a>
      </nav>
    </header>

    <main class="wfm-body">
      <div class="hud" id="hud"></div>
      <div class="screen" id="screen"></div>
    </main>

    <footer class="statusbar">
      <div id="status-left">Ready.</div>
      <div id="status-right">WFM Tycoon AU</div>
    </footer>
  </div>

  <!-- Real-time inbox overlay (independent of the phase screens) -->
  <button id="inbox-fab" class="inbox-fab empty" style="display:none" title="Inbox — emails arrive throughout the week; each expires if ignored. Click or press i to toggle.">
    <span class="ic">✉️</span>
    <span class="inbox-count" id="inbox-count">0</span>
  </button>
  <div id="inbox-panel" class="inbox-panel" style="display:none">
    <div class="inbox-head"><span>📥</span><b>Inbox</b><span class="small muted" id="inbox-sub"></span><span class="spacer"></span><button class="btn" id="inbox-close" title="Close the inbox (or press Esc / i). Open emails keep their countdown running.">✕</button></div>
    <div class="inbox-flash" id="inbox-flash" style="display:none"></div>
    <div class="inbox-list" id="inbox-list"></div>
  </div>

  <div id="dlg">
    <div class="dlg-card">
      <div id="dlg-title">Message</div>
      <div id="dlg-body"></div>
      <div id="dlg-actions"></div>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    /* =======================================================================
       CONFIG — the iteration knobs.
       ======================================================================= */
    var CFG = {
      WEEKS: 52,
      SLA_TARGET: 0.80,
      SLA_T: 20,
      OPEN_SECONDS: 10 * 3600,
      BASE_CALLS: 3000,
      AHT: 300,

      START_HC: 44,
      START_BUDGET: 120000,
      DAY_COST: 240,
      OT_MULT: 1.5,
      OT_CAP_FRAC: 0.15,

      HIRE_COHORT: 4,
      HIRE_COST_EACH: 1500,
      TRAIN_WEEKS: 4,
      TRAINEE_WK_COST: 1200,

    /* =======================================================================

       ======================================================================= */
    function initForecastDays() {
      var arr = [];
      for (var d = 0; d < NDAYS(); d++) {
        var hol = holidayOn(dateFor(S.week, d));
        var base = dowAvg(d) * (hol ? CFG.HOLIDAY_VOL : 1);

      }
      return arr;
    }
    function redistributeTotal(total) {
      var w = [];
      for (var d = 0; d < NDAYS(); d++) { var hol = holidayOn(dateFor(S.week, d)); w.push(CFG.DOW[d] * (hol ? CFG.HOLIDAY_VOL : 1)); }
      var ws = sum(w), out = [];
      for (var d2 = 0; d2 < NDAYS(); d2++) out.push(Math.round(total * w[d2] / ws));
      return out;
    }

      iSvg += '<text x="4" y="37" font-size="9" fill="rgba(255,255,255,.55)">08</text><text x="216" y="37" text-anchor="end" font-size="9" fill="rgba(255,255,255,.55)">17</text></svg>';

        c.push('<tr class="' + (hday ? 'hol' : '') + '"><td class="day"><b>' + DOW[d2] + '</b> ' + fmtDate(dateFor(S.week, d2)) + (hday ? ' 🗓️' : '') + '</td><td>' + n.calls.toLocaleString() + '</td><td>' + n.onPhones + '</td><td>' + n.roster + '</td><td><input class="num-in" type="number" min="0" max="' + S.hc + '" value="' + plan.rost[d2] + '" data-day="' + d2 + '"></td><td><div class="cov ' + (covRaw < 0.999 ? 'under' : '') + '"><i style="width:' + Math.min(100, cov * 100) + '%"></i><span class="lab">&nbsp;' + Math.round(covRaw * 100) + '%</span></div></td></tr>');

      if (!S.peekRevealed) {

      } else {

        c.push('<div class="panel"><h4>🔮 Mid-week peek <span class="small muted">— Mon &amp; Tue revealed</span></h4>');

        c.push('<span class="spacer"></span><button class="btn" id="peek-apply" title="Save your Wed/Thu/Fri forecast edits + re-calculate roster needs.">Apply</button></div></div>');
      }

    function onRosterInput(e) {

    }

    function laborCost(baseDays, otDays) { var holSurcharge = 0; for (var d = 0; d < NDAYS(); d++) if (holidayOn(dateFor(S.week, d))) holSurcharge += plan.rost[d] * CFG.DAY_COST * (CFG.HOLIDAY_PAY - 1); return baseDays * CFG.DAY_COST + otDays * CFG.DAY_COST * CFG.OT_MULT + holSurcharge; }
    function projectWeek() {
      var otDays = allocateOT(plan.rost, plan.needs, plan.ot), calls = 0, answered = 0, occSum = 0, occN = 0;

    function refreshProjection() {

        '<div class="kpi"><div class="k">Avg occupancy</div><div class="v ' + (p.occ > 0.9 ? 'bad' : p.occ > 0.85 ? 'warn' : 'good') + '">' + pct(p.occ) + '</div><div class="small muted">burnout &gt; 88%</div></div>' +

        '<div class="kpi"><div class="k">Proj. weekly P&amp;L</div><div class="v ' + (net >= 0 ? 'good' : 'bad') + '">' + money(net) + '</div><div class="small muted">rev − cost</div></div></div>';
    }

    /* =======================================================================
       RUN THE WEEK
       ======================================================================= */
    function trueDaily(day) {
      var hol = holidayOn(dateFor(S.week, day)), m = CFG.DOW[day] * CFG.SEASON[S.week];
      if (hol) m *= CFG.HOLIDAY_VOL; if (S.campaign) m *= S.campaign.real; m *= rand(0.94, 1.06);
      return Math.max(0, Math.round(CFG.BASE_CALLS * m));
    }
    function takePeek() {
      if (S.peekRevealed) return;
      if (S.budget < CFG.BANKRUPT + 500) { dialog('No budget for that', 'A peek costs $500 and you can\'t spare it right now.', [{ t: 'OK', f: closeDialog }]); return; }
      if (!S.mods) S.mods = freshMods();
      var mon = Math.round(trueDaily(0) * (S.mods.volMult || 1));
      var tue = Math.round(trueDaily(1) * (S.mods.volMult || 1));
      S.peekActuals = [mon, tue];
      S.peekRevealed = true;
      S.budget -= 500;
      save(); renderHUD(); drawPlanning();
    }
    function applyPeek() {
      var inputs = $('screen').querySelectorAll('input[data-fc-day]');
      var changed = false;
      for (var i = 0; i < inputs.length; i++) {
        var d = parseInt(inputs[i].dataset.fcDay, 10), v = parseInt(inputs[i].value, 10);
        if (!isNaN(v) && v > 0) { S.forecastDays[d] = v; changed = true; }
      }
      if (changed) { save(); drawPlanning(); }
    }
    function runWeek() {
      if (!S.mods) S.mods = freshMods();
      var otDays = allocateOT(plan.rost, plan.needs, plan.ot), dayRes = [], calls = 0, answered = 0, occSum = 0, occN = 0, abandoned = 0;
      var realAbs = clamp(plan.expAbs + (S.mods.absenceAdd || 0), 0, 0.6);
      var absSum = 0, absN = 0, dodgyAtRun = S.dodgy;
      var ssRaw = S.skillSplit || { voice: 1, chat: 0, email: 0 };
      var ssSum = (ssRaw.voice || 0) + (ssRaw.chat || 0) + (ssRaw.email || 0);
      var ssN = ssSum > 0 ? { voice: (ssRaw.voice || 0) / ssSum, chat: (ssRaw.chat || 0) / ssSum, email: (ssRaw.email || 0) / ssSum } : { voice: 1, chat: 0, email: 0 };
      var byChannel = { voice: { calls: 0, ans: 0, occSum: 0, occN: 0 }, chat: { calls: 0, ans: 0, occSum: 0, occN: 0 }, email: { calls: 0, ans: 0, occSum: 0, occN: 0 } };
      for (var d = 0; d < NDAYS(); d++) {
        var hol = holidayOn(dateFor(S.week, d)), dCalls = (S.peekRevealed && S.peekActuals && d < 2) ? S.peekActuals[d] : Math.round(trueDaily(d) * (S.mods.volMult || 1));

          var cCalls = Math.round(dCalls * frac * C.volMult);
          var cPhones = phones * frac;
          var cAht = baseAht * C.ahtMult;
          var cSl = dayServiceLevel(cCalls, cPhones, cAht);
          var cOcc = occupancy(cPhones, cCalls * cAht / CFG.OPEN_SECONDS);
          var cAband = dayAbandoned(cCalls, cPhones, cAht);
          dayCh[C.key] = { calls: cCalls, sl: cSl, occ: cOcc };
          dayCallsAggr += cCalls; dayAnsAggr += cSl * cCalls; dayAbandAggr += cAband;
          if (cCalls > 30) { dayOccW += cOcc * cCalls; dayOccN += cCalls; }
          byChannel[C.key].calls += cCalls; byChannel[C.key].ans += cSl * cCalls;
          if (cCalls > 30) { byChannel[C.key].occSum += cOcc * cCalls; byChannel[C.key].occN += cCalls; }
        }
        var sl = dayCallsAggr > 0 ? dayAnsAggr / dayCallsAggr : 1;
        var occ = dayOccN > 0 ? dayOccW / dayOccN : 0;
        calls += dayCallsAggr; answered += dayAnsAggr; abandoned += dayAbandAggr;
        if (dayCallsAggr > 50) { occSum += occ; occN++; }
        dayRes.push({ d: d, hol: hol, calls: dayCallsAggr, sl: sl, occ: occ, phones: phones, aht: baseAht, byChannel: dayCh });
      }
      var byChannelSummary = {};
      for (var ck in byChannel) { var bc = byChannel[ck]; byChannelSummary[ck] = { calls: bc.calls, sl: bc.calls > 0 ? bc.ans / bc.calls : 1, occ: bc.occN > 0 ? bc.occSum / bc.occN : 0 }; }
      var sla = calls > 0 ? answered / calls : 1, occAvg = occN ? occSum / occN : 0, baseDays = sum(plan.rost), otTotal = sum(otDays);
      var cost = laborCost(baseDays, otTotal), traineeCost = trainees() * CFG.TRAINEE_WK_COST, otFrac = baseDays > 0 ? otTotal / baseDays : 0;
      var fcastDays = S.forecastDays.slice(), fcast = sum(fcastDays), fErr = calls > 0 ? Math.abs(fcast - calls) / calls : 0;

      var penalty = 0, bonus = 0;
      if (sla < CFG.SLA_TARGET) penalty = (CFG.SLA_TARGET - sla) * CFG.PENALTY_SCALE; else bonus = Math.min(CFG.BONUS_CAP, (sla - CFG.SLA_TARGET) * CFG.BONUS_SCALE);
      var pnl = CFG.WEEK_REVENUE + bonus - cost - traineeCost - penalty, budgetBefore = S.budget; S.budget += pnl;

      if (occAvg > 0.88) eDelta -= (occAvg - 0.88) * 60; else if (occAvg < 0.78) eDelta += (0.78 - occAvg) * 18;

      var burnout = 1 + Math.max(0, occAvg - 0.85) * 4 + Math.max(0, 60 - S.engagement) / 100 * 2 + otFrac * 1.5, expQuits = S.hc * 0.008 * burnout;

    /* =======================================================================
       RESULTS

      if (streakNow >= 10) unlock('streak_10');
      var c = [];
      c.push('<div class="advisor"><div class="face">📎</div><div><b>Clippo:</b> ' + advisorResultTip(res) + '</div></div>');
      if (res.byChannel) {

    /* =======================================================================
       DATA REVIEW — call-flow drill-down + 24-agent / 3-team audit.
       ======================================================================= */
    /* =======================================================================
       HANDOVER — the game opens on the post step. You inherit the chair and
       review a pre-played week run by the previous (slightly flawed) analyst,
       so you have real data before you make a single decision. Doesn't score.
       ======================================================================= */
    function enterHandover() {
      S.handover = true; S.phase = 'handover'; save();
      var aht = CFG.AHT * S.ahtSkill * (1 + S.dodgy * CFG.DODGY_AHT_MAX);
      var shrink = CFG.BASE_SHRINK, absc = CFG.BASE_ABSENCE;
      // predecessor's forecast: solid, but under-cooked the Monday peak
      var fdays = [], roster = [], dayRes = [];
      for (var d = 0; d < NDAYS(); d++) {
        var base = dowAvg(d);
        var fc = Math.round(base * (d === 0 ? 0.84 : rand(0.97, 1.02)) / 10) * 10; // Mon under-forecast
        fdays.push(fc);
        // they staffed to their own (low) forecast
        var fA = fc * aht / CFG.OPEN_SECONDS;
        var onPh = requiredOnPhones(fA, aht, CFG.SLA_T, CFG.SLA_TARGET);
        roster.push(Math.ceil(onPh / Math.max(0.4, (1 - absc) * (1 - shrink))));
      }
      var calls = 0, answered = 0, occSum = 0, occN = 0, abandoned = 0;
      for (var d2 = 0; d2 < NDAYS(); d2++) {
        var actual = Math.round(dowAvg(d2) * (d2 === 0 ? 1.04 : rand(0.97, 1.03))); // Monday actually ran hot
        var phones = roster[d2] * (1 - absc) * (1 - shrink) * (1 - S.dodgy * CFG.DODGY_AVAIL_MAX);
        var A = actual * aht / CFG.OPEN_SECONDS;
        var sl = dayServiceLevel(actual, phones, aht), occ = occupancy(phones, A), ab = dayAbandoned(actual, phones, aht);
        calls += actual; answered += sl * actual; abandoned += ab;
        if (actual > 50) { occSum += occ; occN++; }
        dayRes.push({ d: d2, hol: holidayOn(dateFor(-1, d2)), calls: actual, sl: sl, occ: occ, phones: phones, aht: aht });
      }
      var sla = calls > 0 ? answered / calls : 1, occAvg = occN ? occSum / occN : 0;
      var fcast = sum(fdays), fErr = calls > 0 ? Math.abs(fcast - calls) / calls : 0;
      S.lastResult = { dayRes: dayRes, sla: sla, occ: occAvg, calls: calls, abandoned: Math.round(abandoned), forecast: fcast, forecastDays: fdays, fErr: fErr };
      S.reviewData = makeReview(dayRes, 1); S.reviewTab = 'audit';
      var worst = 0; for (var w = 1; w < dayRes.length; w++) if (dayRes[w].sl < dayRes[worst].sl) worst = w; S.reviewDay = worst;
      // seed the handover week as the freshest row of forecasting history
      S.callHistory.push({ label: shortWeek(-1), total: calls, forecast: fcast, days: dayRes.map(function (x) { return x.calls; }) });
      if (S.callHistory.length > 12) S.callHistory = S.callHistory.slice(-12);
      save(); renderHUD(); drawHandoverResults();
    }

    function drawHandoverResults() {
      var res = S.lastResult, c = [];
      c.push('<div class="advisor"><div class="face">📎</div><div><b>Clippo:</b> G\'day. You\'ve inherited the WFM chair. Before you decide anything, here\'s how the centre ran <b>last week</b> under the previous analyst — study it, then take over for Week 1. This week\'s on them; your scorecard starts Monday.</div></div>');
      c.push('<div class="panel"><h3>📋 Handover — week of ' + weekLabel(-1) + '</h3>' +
        '<p class="small">You are <b>Workforce Management</b> for this contact centre (open <b>Monday–Friday</b>). You don\'t run the floor — you <b>forecast</b>, <b>plan</b>, <b>negotiate</b> and <b>review the data</b>, then front up at the Monday meeting. Your job all year: hold the <b>service level near ' + pct(CFG.SLA_TARGET) + '</b>. Here\'s last week\'s result to ground you.</p>');
      var slaCls = res.sla >= CFG.SLA_TARGET ? 'good' : (res.sla >= CFG.SLA_TARGET - 0.05 ? 'warn' : 'bad');
      c.push('<div class="kpi-strip">' +
        '<div class="kpi"><div class="k">Service level</div><div class="v ' + slaCls + '">' + pct1(res.sla) + '</div><div class="small muted">target ' + pct(CFG.SLA_TARGET) + '</div></div>' +
        '<div class="kpi"><div class="k">Avg occupancy</div><div class="v ' + (res.occ > 0.9 ? 'bad' : res.occ > 0.85 ? 'warn' : 'good') + '">' + pct(res.occ) + '</div></div>' +
        '<div class="kpi"><div class="k">Forecast error</div><div class="v ' + (res.fErr <= 0.05 ? 'good' : res.fErr >= 0.12 ? 'bad' : 'warn') + '">' + pct(res.fErr) + '</div><div class="small muted">fc ' + res.forecast.toLocaleString() + ' · act ' + res.calls.toLocaleString() + '</div></div>' +
        '<div class="kpi"><div class="k">Abandoned</div><div class="v">' + res.abandoned.toLocaleString() + '</div></div></div>');
      c.push('<table class="grid" style="margin-top:8px"><thead><tr><th>Day</th><th>Their forecast</th><th>Actual calls</th><th>Service level</th><th>Occupancy</th></tr></thead><tbody>');
      for (var i = 0; i < res.dayRes.length; i++) {
        var dr = res.dayRes[i];
        c.push('<tr class="' + (dr.hol ? 'hol' : '') + '"><td class="day"><b>' + DOW[dr.d] + '</b> ' + fmtDate(dateFor(-1, dr.d)) + '</td><td>' + (res.forecastDays[dr.d] || 0).toLocaleString() + '</td><td>' + dr.calls.toLocaleString() + '</td><td class="' + (dr.sl >= CFG.SLA_TARGET ? 'good' : 'bad') + '">' + pct1(dr.sl) + '</td><td class="' + (dr.occ > 0.9 ? 'bad' : '') + '">' + pct(dr.occ) + '</td></tr>');
      }
      c.push('</tbody></table>');
      c.push('<p class="small muted" style="margin-top:8px">Notice anything? The data review is where you dig in — find <i>where</i> the week went sideways (the call flow) and <i>who</i> might be gaming the system (the agent audit). It\'s how you\'ll spot what to fix once you\'re in charge.</p></div>');
      c.push('<div class="row"><span class="spacer"></span><button class="btn big-btn" id="toreview" title="Drill into the handover week\'s call flow + agent audit. Risk-free — flagging in handover doesn\'t count against your score.">Review the handover data 🔍 ▶</button></div>');
      $('screen').innerHTML = c.join('');
      $('toreview').addEventListener('click', enterReview);
      setStatus('Handover — study last week\'s result, then take the chair.');
    }

    function takeTheChair() {
      S.handover = false; S.phase = 'meeting';
      S.lastResult = null; S.reviewData = null; S.reviewTab = 'audit';
      S.gameSeconds = 0; S.nextEmailAt = CFG.INBOX.FIRST; // inbox pressure begins now
      save(); renderHUD(); renderInboxFab(); enterMeeting();
    }

    function makeReview(dayRes, forceN) {
      var pool = shuffle(AGENT_NAMES).slice(0, 24), teamAht = CFG.AHT * S.ahtSkill, agents = [];
      for (var i = 0; i < 24; i++) {
        agents.push({
          id: i, name: pool[i], team: TEAMS[Math.floor(i / 8)],
          calls: Math.round(rand(420, 520)),
          aht: Math.round(teamAht * rand(0.92, 1.08)),
          aux: Math.round(rand(6, 12) * 10) / 10,
          acw: Math.round(rand(5, 10) * 10) / 10,
          hold: Math.round(rand(2, 6) * 10) / 10,
          adh: Math.round(rand(92, 99) * 10) / 10,
          issue: null
        });
      }
      // number of real issues: almost always >=1, scales mildly with dodgy index
      var r = Math.random(), extra = S.dodgy > 0.22 ? 1 : 0, nIssues;
      if (r < 0.07) nIssues = 0; else if (r < 0.45) nIssues = 1 + extra; else if (r < 0.80) nIssues = 2 + extra; else nIssues = 3 + extra;
      nIssues = Math.min(nIssues, 5);
      if (forceN != null) nIssues = forceN;
      var idxs = shuffle(agents.map(function (_, i) { return i; })).slice(0, nIssues);
      for (var j = 0; j < idxs.length; j++) {
        var a = agents[idxs[j]], dim = pick(['aux', 'aht', 'hold', 'acw', 'adh']); a.issue = dim;
        if (dim === 'aux') { a.aux = Math.round(rand(16, 24) * 10) / 10; a.calls = Math.round(a.calls * 0.78); }
        else if (dim === 'aht') { a.aht = Math.round(teamAht * rand(1.22, 1.45)); a.calls = Math.round(a.calls * 0.82); }
        else if (dim === 'hold') { a.hold = Math.round(rand(11, 17) * 10) / 10; a.calls = Math.round(a.calls * 0.88); }
        else if (dim === 'acw') { a.acw = Math.round(rand(15, 22) * 10) / 10; a.calls = Math.round(a.calls * 0.85); }
        else { a.adh = Math.round(rand(80, 88) * 10) / 10; }
      }
      return { agents: agents, sortKey: 'team', sortDir: 1, submitted: false, flagged: {}, outcome: '' };
    }

    function enterReview() {
      S.phase = 'review'; save();
      var c = [];
      c.push('<div class="advisor"><div class="face">📎</div><div><b>Clippo:</b> ' + advisorReviewTip() + '</div></div>');
      c.push('<div class="tabs"><div class="tab ' + (S.reviewTab === 'audit' ? 'active' : '') + '" id="tab-audit">🕵️ Agent audit</div><div class="tab ' + (S.reviewTab === 'flow' ? 'active' : '') + '" id="tab-flow">📞 Call flow</div></div>');
      c.push('<div class="panel">' + (S.reviewTab === 'flow' ? renderCallFlow() : renderAudit()) + '</div>');
      var nextLabel = S.handover ? 'Take the chair — start Week 1 ▶' : (S.week + 1 >= CFG.WEEKS ? 'Finish the year ▶' : 'Continue to Monday, Week ' + (S.week + 2) + ' ▶');
      var nextTip = S.handover ? 'You\'re now in charge. Your scorecard starts Monday — pick your battles carefully.' : (S.week + 1 >= CFG.WEEKS ? 'Wrap the FY and see your grade + sparkline + achievements.' : 'Save + advance the clock to next Monday\'s meeting.');
      c.push('<div class="row"><span class="spacer"></span><button class="btn big-btn" id="next" title="' + nextTip + '">' + nextLabel + '</button></div>');
      $('screen').innerHTML = c.join('');

      $('tab-audit').addEventListener('click', function () { S.reviewTab = 'audit'; save(); enterReview(); });
      $('tab-flow').addEventListener('click', function () { S.reviewTab = 'flow'; save(); enterReview(); });
      $('next').addEventListener('click', S.handover ? takeTheChair : nextWeek);

      if (S.reviewTab === 'flow') {
        var dbtns = $('screen').querySelectorAll('button[data-rday]');
        for (var i = 0; i < dbtns.length; i++) dbtns[i].addEventListener('click', function (e) { S.reviewDay = parseInt(e.target.dataset.rday, 10); save(); enterReview(); });
      } else {
        var R = S.reviewData;
        var heads = $('screen').querySelectorAll('th.sortable');
        for (var hh = 0; hh < heads.length; hh++) heads[hh].addEventListener('click', function (e) {
          var k = e.target.dataset.sort; if (R.sortKey === k) R.sortDir *= -1; else { R.sortKey = k; R.sortDir = (k === 'name' || k === 'team') ? 1 : -1; } save(); enterReview();
        });
        if (!R.submitted) {
          var fbtn = $('submit-find'); if (fbtn) fbtn.addEventListener('click', submitFindings);
          var cbx = $('screen').querySelectorAll('input[data-flag]');
          for (var b = 0; b < cbx.length; b++) cbx[b].addEventListener('change', function () {
            var n = $('screen').querySelectorAll('input[data-flag]:checked').length; var fc = $('flag-count'); if (fc) fc.textContent = n;
          });
        } else {
          var cbtns = $('screen').querySelectorAll('button[data-coach]');
          for (var cb = 0; cb < cbtns.length; cb++) cbtns[cb].addEventListener('click', function (e) { openCoachingDialog(parseInt(e.currentTarget.dataset.coach, 10)); });
        }
      }
      setStatus('Data review — drill into the call flow and audit the agents.');
    }

    function renderCallFlow() {
      var dr = S.lastResult.dayRes[S.reviewDay], iv = intervalsFor(dr.calls, dr.phones, dr.aht);
      var c = [];
      c.push('<h3>📞 Call flow — intraday detail</h3>');
      c.push('<div class="row" style="margin-bottom:6px">');
      for (var d = 0; d < S.lastResult.dayRes.length; d++) {
        var ddr = S.lastResult.dayRes[d];
        c.push('<button class="btn ' + (d === S.reviewDay ? 'pressed' : '') + '" data-rday="' + d + '" style="min-width:auto;padding:3px 8px">' + DOW[d] + ' <span class="' + (ddr.sl >= CFG.SLA_TARGET ? 'good' : 'bad') + '">' + Math.round(ddr.sl * 100) + '%</span></button>');
      }
      c.push('</div>');
      c.push('<p class="small">' + DOW[dr.d] + ' ' + fmtDate(dateFor(S.handover ? -1 : S.week, dr.d)) + ' — ' + dr.calls.toLocaleString() + ' calls, ~' + Math.round(dr.phones) + ' agents on phones, day SL <b class="' + (dr.sl >= CFG.SLA_TARGET ? 'good' : 'bad') + '">' + pct1(dr.sl) + '</b>.</p>');
      var maxCalls = 0; for (var m = 0; m < iv.length; m++) maxCalls = Math.max(maxCalls, iv[m].calls);
      var worstH = 0; for (var w = 1; w < iv.length; w++) if (iv[w].sl < iv[worstH].sl) worstH = w;
      c.push('<table class="grid"><thead><tr><th title="Hourly interval — the call centre opens 08:00 and closes at 17:00.">Time</th><th title="Calls that arrived in this hourly interval.">Calls offered</th><th title="Relative arrival curve — bar shows how loaded this hour is vs the day\'s busiest.">Arrivals</th><th title="Agents actually on phones during this interval (post-shrinkage).">Agents</th><th title="% of calls answered within the target wait (20s). Red = below ' + pct(CFG.SLA_TARGET) + '.">Service level</th><th title="Calls where the customer hung up before being answered.">Abandoned</th></tr></thead><tbody>');
      for (var h = 0; h < iv.length; h++) {
        var it = iv[h], barW = maxCalls > 0 ? (it.calls / maxCalls) * 100 : 0;
        var isCul = h === worstH && it.sl < CFG.SLA_TARGET;
        c.push('<tr class="' + (isCul ? 'cul' : '') + '"' + (isCul ? ' title="Worst interval — arrival peak outran your agents. This is where SL bled the most."' : '') + '><td class="day">' + CFG.OPEN_HOURS[h] + '</td><td>' + Math.round(it.calls).toLocaleString() + '</td><td><div class="bar"><i style="width:' + barW + '%"></i></div></td><td>' + Math.round(it.phones) + '</td><td class="' + (it.sl >= CFG.SLA_TARGET ? 'good' : 'bad') + '">' + pct1(it.sl) + '</td><td>' + Math.round(it.aband) + '</td></tr>');
      }
      c.push('</tbody></table>');
      c.push('<p class="small" style="margin-top:6px">' + flowInsight(dr, iv, worstH) + '</p>');
      return c.join('');
    }
    function flowInsight(dr, iv, worstH) {
      if (dr.sl >= CFG.SLA_TARGET + 0.02) return '✅ This day held up well across every interval — staffing matched the arrival curve.';
      if (iv[worstH].sl < CFG.SLA_TARGET) return '🔎 Service dipped hardest around <b>' + CFG.OPEN_HOURS[worstH] + '</b> — the arrival peak outran your agents. Front-loading the roster toward the busy intervals would lift this.';
      return 'ℹ️ Coverage was broadly even; the shortfall was spread across the day rather than one peak.';
    }

    function renderAudit() {
      var R = S.reviewData;
      var cols = [
        { k: 'name', label: 'Agent', tip: 'Agent\'s name. Sort A–Z / Z–A.', fmt: function (a) { return a.name; } },
        { k: 'team', label: 'Team', tip: 'Wallabies / Magpies / Crows allocation.', fmt: function (a) { return a.team; } },
        { k: 'calls', label: 'Calls', tip: 'Calls answered this week.', fmt: function (a) { return a.calls; } },
        { k: 'aht', label: 'AHT', tip: 'Average Handle Time — talk + hold + wrap, in seconds per call. Lower = more efficient.', fmt: function (a) { return a.aht + 's'; } },
        { k: 'aux', label: 'AUX%', tip: 'AUX time as % of logged-in — non-call states (breaks, lunch, coaching, training, system issues). Healthy ≈ 10–15%.', fmt: function (a) { return a.aux + '%'; } },
        { k: 'acw', label: 'Wrap%', tip: 'After-call work as % of handle time. Healthy ≈ 8–12%.', fmt: function (a) { return a.acw + '%'; } },
        { k: 'hold', label: 'Hold%', tip: 'Time customers spent on hold during a call. Healthy ≈ 3–7%.', fmt: function (a) { return a.hold + '%'; } },
        { k: 'adh', label: 'Adh%', tip: 'Adherence — % of scheduled time the agent was actually available. Aim ≥ 95%.', fmt: function (a) { return a.adh + '%'; } }
      ];
      var rows = R.agents.slice().sort(function (x, y) {
        var a = x[R.sortKey], b = y[R.sortKey];
        if (typeof a === 'string') return a < b ? -R.sortDir : a > b ? R.sortDir : 0;
        return (a - b) * R.sortDir;
      });
      var c = [];
      c.push('<h3>🕵️ Agent behaviour audit — 24 agents, 3 teams</h3>');
      c.push('<p class="small">' + (R.submitted ? 'Audit submitted. ⚠️ marks the agents who were genuinely out of line.' : 'Compare each agent against the <i>team average</i> row. Click a column header to sort and surface outliers. Tick anyone gaming the system, then submit — <b>flagging someone who\'s fine costs morale</b>, so be sure.') + '</p>');
      c.push('<div class="scroll-x"><table class="grid audit"><thead><tr>');
      for (var ci = 0; ci < cols.length; ci++) { var act = R.sortKey === cols[ci].k ? (R.sortDir > 0 ? ' ▲' : ' ▼') : ''; c.push('<th class="sortable" data-sort="' + cols[ci].k + '" title="' + (cols[ci].tip || '') + '">' + cols[ci].label + act + '</th>'); }
      c.push(R.submitted ? '<th>Verdict</th>' : '<th>Flag</th>');
      c.push('</tr></thead><tbody>');
      for (var ri = 0; ri < rows.length; ri++) {
        var a = rows[ri], rowCls = (R.submitted && a.issue) ? 'cul' : '';
        c.push('<tr class="' + rowCls + '">');
        for (var cj = 0; cj < cols.length; cj++) c.push('<td' + (cols[cj].k === 'name' ? ' class="day"' : '') + '>' + cols[cj].fmt(a) + (cols[cj].k === 'name' && R.submitted && a.issue ? ' ⚠️' : '') + '</td>');
        if (R.submitted) {
          var flagged = !!R.flagged[a.id], mark;
          var alreadyCoached = (S.coachingPlans || []).some(function (p) { return p.agentId === a.id; });
          if (flagged && a.issue) mark = '<span class="good" title="Correctly flagged. Issue was: ' + a.issue + '.">✓ caught</span>' + (alreadyCoached ? ' <span class="small muted" title="Active coaching plan — finishes in a few weeks and improves their behaviour.">📓 plan active</span>' : ' <button class="btn" data-coach="' + a.id + '" style="padding:2px 8px;font-size:11px;margin-left:4px" title="Start a coaching plan for ' + a.name + ' — 3 weeks, costs shrinkage, then drops dodgy index.">+ Coach</button>'); else if (flagged && !a.issue) mark = '<span class="bad" title="False flag — this agent was clean. Costs morale.">✗ false flag</span>'; else if (!flagged && a.issue) mark = '<span class="warn" title="You missed this one. They were gaming ' + a.issue + '.">⚠ missed</span>'; else mark = '<span class="muted" title="Clean record + you didn\'t flag. No action.">—</span>';
          c.push('<td>' + mark + '</td>');
        } else {
          c.push('<td><input type="checkbox" data-flag="' + a.id + '"' + (R.flagged[a.id] ? ' checked' : '') + ' title="Flag ' + a.name + ' as gaming a metric. Correct flag → lifts TL trust + reduces dodgy index. False flag → costs morale."></td>');
        }
        c.push('</tr>');
      }
      // team average row
      var avg = function (k) { return Math.round(sum(R.agents.map(function (x) { return x[k]; })) / R.agents.length * 10) / 10; };
      c.push('<tr class="avg" title="Benchmark row — outliers float above/below these numbers. Compare each agent\'s row against this to spot drift."><td class="day">Team average</td><td>—</td><td>' + Math.round(avg('calls')) + '</td><td>' + Math.round(avg('aht')) + 's</td><td>' + avg('aux') + '%</td><td>' + avg('acw') + '%</td><td>' + avg('hold') + '%</td><td>' + avg('adh') + '%</td><td>—</td></tr>');
      c.push('</tbody></table></div>');

      if (R.submitted) {
        c.push('<div class="fx-reveal" style="margin-top:8px">' + R.outcome + '</div>');
      } else {
        c.push('<div class="row" style="margin-top:8px"><button class="btn" id="submit-find" title="Lock in your flagged agents. Correct flags shrink the dodgy-behaviour index + lift TL trust. Wrong flags cost morale.">Submit findings</button><span class="small muted">Flagged: <b id="flag-count">' + Object.keys(R.flagged).filter(function (k) { return R.flagged[k]; }).length + '</b> · coaching the right people cuts the dodgy-behaviour index.</span></div>');
      }
      return c.join('');
    }

    function openCoachingDialog(agentId) {
      if (!S.reviewData) return;
      var a = null;
      for (var i = 0; i < S.reviewData.agents.length; i++) if (S.reviewData.agents[i].id === agentId) { a = S.reviewData.agents[i]; break; }
      if (!a) return;
      var dim = a.issue || '?';
      var dimLabel = ({ aux: 'AUX abuse (' + a.aux + '%)', aht: 'AHT bloat (' + Math.round(a.aht) + 's)', hold: 'Hold time (' + a.hold + '%)', acw: 'Wrap (' + a.acw + '%)', adh: 'Low adherence (' + a.adh + '%)' })[dim] || 'behaviour drift';
      dialog('📓 Coaching plan: ' + a.name,
        '<p>Issue: <b>' + dimLabel + '</b></p><p class="small muted">Pick a plan — it rolls forward over weeks and quietly drops their drift.</p>',
        [
          { t: '🤝 Quick 1-on-1 ($0 · 1 wk)', f: function () { S.coachingPlans.push({ agentId: a.id, agentName: a.name, weeksLeft: 1, severity: 'light', dim: dim, addedWeek: S.week }); save(); closeDialog(); renderHUD(); enterReview(); } },
          { t: '📓 2-week plan ($1k · 2 wks)', f: function () { S.coachingPlans.push({ agentId: a.id, agentName: a.name, weeksLeft: 2, severity: 'standard', dim: dim, addedWeek: S.week }); S.budget -= 1000; save(); closeDialog(); renderHUD(); enterReview(); } },
          { t: 'Skip — note for next week', f: closeDialog }
        ]);
    }

    function submitFindings() {
      var R = S.reviewData; if (R.submitted) return;
      var cbx = $('screen').querySelectorAll('input[data-flag]'); R.flagged = {};
      for (var i = 0; i < cbx.length; i++) if (cbx[i].checked) R.flagged[parseInt(cbx[i].dataset.flag, 10)] = true;
      var correct = 0, fp = 0, missed = 0, totalIssues = 0;
      for (var j = 0; j < R.agents.length; j++) {
        var a = R.agents[j], flagged = !!R.flagged[a.id];
        if (a.issue) totalIssues++;
        if (flagged && a.issue) correct++; else if (flagged && !a.issue) fp++; else if (!flagged && a.issue) missed++;
      }
      if (correct > 0) { S.dodgy = clamp(S.dodgy - Math.min(0.10, correct * 0.025), 0, 1); S.trust.team = clamp(S.trust.team + Math.min(4, correct), 0, 100); unlock('first_blood'); }
      if (fp > 0) S.trust.team = clamp(S.trust.team - fp * 2, 0, 100);
      var parts = [];
      if (totalIssues === 0 && fp === 0) parts.push('🧐 A clean week — no agents were genuinely out of line, and you didn\'t flag anyone. Good judgement.');
      else {
        if (correct > 0) parts.push('✅ <b>' + correct + '</b> correctly coached — dodgy-behaviour index now <b>' + pct(S.dodgy) + '</b>, TLs respect the data-driven calls (Team +' + Math.min(4, correct) + ').');

      if (prev && prev.sla < prev.committed) return 'You missed the commitment. Wear it now — long-term it costs you less than spin the data\'ll contradict next week.';

      return 'Catching dodgy agents in the review compounds — every one you coach drags the whole floor\'s behaviour back toward the average.';
    }
    function advisorForecastTip() {

      if (weekHasHoliday(S.week)) return 'Public hol week — drop the holiday day right down, it\'ll run at a fraction of normal volume.';

      return 'Heads up — "Roster needed" already grosses up for shrinkage. That\'s why it\'s bigger than "on phones needed".';
    }
    function advisorResultTip(res) {
      if (res.fErr >= 0.15) return 'Forecast was off by ' + pct(res.fErr) + ' — that\'s most of why staffing missed. Get the forecast right and the rest follows.';
      if (res.occ > 0.9) return 'Occ over 90 hits SL today and cooks the team next month. High occupancy\'s borrowed against future attrition.';
      if (!res.hit && res.sla >= CFG.SLA_TARGET) return 'Beat 80 but missed your own commitment — calibration matters as much as performance.';
      if (res.sla < CFG.SLA_TARGET) return 'Under target. Use call-flow to see which intervals broke, and the audit to find behaviour leaking capacity.';
      return 'Cracker week. Review the data — call flow shows where time was lost, the audit shows who.';
    }
    function knockoffLines(res) {
      var L = [];
      if (res.hit && res.sla >= CFG.SLA_TARGET) L.push('Cracker week, mate. First round\'s on you.');
      else if (res.sla >= CFG.SLA_TARGET && !res.hit) L.push('Beat the target but under your own number — she\'ll be right.');
      else if (res.sla < CFG.SLA_TARGET - 0.05) L.push('Rough one. Monday meeting\'s gonna be a long chinwag.');
      else L.push('Solid enough. Living to fight another week.');
      if (res.occ > 0.9) L.push('Floor\'s cooked — they\'ll be desperate for a sleep-in Saturday.');
      if (res.fErr <= 0.05) L.push('Forecast was bang on. Have a beer on that.');
      else if (res.fErr >= 0.15) L.push('Forecast was rubbish. Pour yourself a stiff drink.');
      if (res.bonus > 0) L.push('SLA bonus banked — Greg in Finance owes you a coffee.');
      if (res.penalty > 0) L.push('SLA penalty hit the books — Finance\'ll have words on Monday.');
      if (res.quits > 0) L.push(res.quits + ' agent' + (res.quits > 1 ? 's' : '') + ' walked. Suss out why before they take mates with \'em.');
      if (res.graduated > 0) L.push('Trainees on the floor — shout \'em a round if they survive next week.');
      if (res.coachingExpired > 0) L.push(res.coachingExpired + ' coaching plan' + (res.coachingExpired > 1 ? 's' : '') + ' wrapped — the floor should ride a touch cleaner from here.');
      if (res.engAfter >= 80) L.push('🔥 Engagement\'s humming at ' + Math.round(res.engAfter) + ' — floor\'s genuinely happy to be there.');
      else if (res.engAfter < 40) L.push('💧 Engagement\'s at ' + Math.round(res.engAfter) + ' — that\'s a leading indicator of attrition. Have a yarn with the TLs.');
      if (res.tBefore && res.tAfter) {
        var labels = { ops: 'Ops', fin: 'Finance', client: 'Client', team: 'TLs' }, biggest = null;
        for (var k in labels) {
          var d = Math.round(res.tAfter[k] - res.tBefore[k]);
          if (!biggest || Math.abs(d) > Math.abs(biggest.d)) biggest = { k: k, d: d };
        }
        if (biggest && Math.abs(biggest.d) >= 4) L.push('📈 Biggest trust mover this week: <b>' + labels[biggest.k] + '</b> ' + (biggest.d > 0 ? '+' : '') + biggest.d + ' → ' + Math.round(res.tAfter[biggest.k]) + '.');
      }
      if (S.reviewData && S.reviewData.agents) {
        var top = S.reviewData.agents.slice().filter(function (a) { return !a.issue && a.adh >= 96 && a.aux <= 10; }).sort(function (a, b) { return b.calls - a.calls; })[0];
        if (top) L.push('🏅 Top of the floor: <b>' + top.name + '</b> (' + top.team + ') — ' + top.calls + ' calls handled clean. Shout-out at the huddle.');
      }
      if (S.week + 1 < CFG.WEEKS && weekHasHoliday(S.week + 1)) {
        var nextHols = []; for (var nd = 0; nd < NDAYS(); nd++) { var nh = holidayOn(dateFor(S.week + 1, nd)); if (nh) nextHols.push(DOW[nd] + ' (' + nh + ')'); }
        L.push('🗓️ Heads-up: public holiday next week — ' + nextHols.join(', ') + '. Short week — plan accordingly.');
      }
      if (res.sla >= CFG.SLA_TARGET) {
        var streak = 0; if (S.history) for (var sh = S.history.length - 1; sh >= 0; sh--) { if (S.history[sh].sla >= CFG.SLA_TARGET) streak++; else break; }
        if (streak >= 4) L.push('🔥 That\'s <b>' + streak + ' weeks straight</b> on target. Floor\'s on a hot streak — don\'t jinx it.');
      } else {
        var slump = 0; if (S.history) for (var smh = S.history.length - 1; smh >= 0; smh--) { if (S.history[smh].sla < CFG.SLA_TARGET) slump++; else break; }
        if (slump >= 3) L.push('🧊 That\'s <b>' + slump + ' in a row</b> under target. Monday meeting\'s gonna be a tough one — bring data.');
      }
      return L;
    }

          { t: 'Yes — formal swap, paperwork through HR.', d: { team: 2, ops: 1 } },
          { t: 'Yes — informal handshake, no paperwork.', d: { team: 3, ops: -2 } },
          { t: 'No — roster\'s set, EBA reasons.', d: { team: -1, ops: 1 } },
          { t: 'Bring him in Thursday, no RDO replacement.', d: { team: -5, ops: -1 } } ] },
      { from: 'HR', fromName: 'Bec from HR', subj: 'Pulse survey results dropped — eNPS down 12pts', body: 'Quarterly pulse came back. eNPS is down 12pts vs last quarter — biggest hits are around roster fairness and workload visibility. Exec wants a response by EOW.',
        opts: [
          { t: 'Honest write-up + 3-point action plan with TLs.', d: { team: 4, ops: 2 } },
          { t: 'Acknowledge + commit to a comms refresh.', d: { team: 1 } },
          { t: 'Frame it as a transient — busy quarter.', d: { team: -2, ops: -1 } },
          { t: 'Push back — survey methodology was dodgy.', d: { team: -6, ops: -2 } } ] },
      { from: 'Ops', fromName: 'Facilities (via Big Kev)', subj: 'Fire drill Thursday 10:30 — non-negotiable', body: 'Building manager\'s called a fire drill Thursday at 10:30, smack in the peak hour. Mandatory. How do we handle it?',
        opts: [
          { t: 'Brief the floor early + queue holding message for the 8 min.', d: { ops: 3, client: 1 } },
          { t: 'Stagger teams in waves so queues never fully drop.', d: { ops: 4, client: 2 } },
          { t: 'Just take the SL hit — it\'s only 8 minutes.', d: { ops: -2, client: -2 } },
          { t: 'Tell facilities to move it to off-peak.', d: { ops: -1, team: 1 } } ] }
    ];

    function senderClass(from) { return { Client: 'client', Ops: 'ops', Finance: 'finance', HR: 'hr', 'Team Leader': 'tl', Union: 'tl', NOC: 'ops' }[from] || 'ops'; }
    function senderTrustKey(from) { return { Client: 'client', Ops: 'ops', Finance: 'fin', HR: 'team', 'Team Leader': 'team', Union: 'team', NOC: 'ops' }[from] || 'ops'; }
    function running() { return S && !S.handover && ['meeting', 'forecast', 'planning', 'results', 'review'].indexOf(S.phase) >= 0; }

    function applyEmailFx(d) {
      if (!d) return;
      for (var k in d) {
        if (k === 'eng') S.engagement = clamp(S.engagement + d[k], 0, 100);
        else if (k === 'budget') S.budget += d[k];
        else if (S.trust[k] != null) S.trust[k] = clamp(S.trust[k] + d[k], 0, 100);
      }
    }
    function emailFxText(d) {
      var map = { ops: 'Ops', fin: 'Finance', client: 'Client', team: 'TLs', eng: 'Team' };
      var keys = Object.keys(d);
      if (!keys.length) return 'no impact';
      return keys.map(function (k) { if (k === 'budget') return (d[k] >= 0 ? '+' : '') + money(d[k]); return map[k] + ' ' + (d[k] >= 0 ? '+' : '') + d[k]; }).join(', ');
    }
    function barColor(u) { return u > 0.5 ? 'linear-gradient(90deg,#34d399,#10b981)' : u > 0.25 ? 'linear-gradient(90deg,#fbbf24,#f59e0b)' : 'linear-gradient(90deg,#f87171,#ef4444)'; }
    function urgency(m) { return clamp(1 - (S.gameSeconds - m.landed) / m.ttl, 0, 1); }

    function spawnEmail() {
      if (S.inbox.length >= CFG.INBOX.MAX_ACTIVE) return false;
      var active = S.inbox.map(function (m) { return m.tpl; });
      var choices = [];
      for (var i = 0; i < EMAIL_BANK.length; i++) if (active.indexOf(i) < 0) choices.push(i);
      if (!choices.length) return false;
      var bias = (S.clientCo && CLIENT_BIAS[S.clientCo]) || [];
      var weights = choices.map(function (ci) {
        var t = EMAIL_BANK[ci], txt = t.subj + ' ' + (t.fromName || t.from) + ' ' + t.body;
        var w = 1; for (var bi = 0; bi < bias.length; bi++) if (txt.indexOf(bias[bi]) >= 0) w += 2;
        return w;
      });
      var totW = weights.reduce(function (a, b) { return a + b; }, 0);
      var r = Math.random() * totW, acc = 0, idx = choices[0];
      for (var ci2 = 0; ci2 < choices.length; ci2++) { acc += weights[ci2]; if (r < acc) { idx = choices[ci2]; break; } }
      var tpl = EMAIL_BANK[idx];
      S.inbox.push({ id: S.inboxSeq++, tpl: idx, from: tpl.from, fromName: tpl.fromName, subj: tpl.subj, body: tpl.body, opts: tpl.opts, order: shuffle(tpl.opts.map(function (_, i) { return i; })), landed: S.gameSeconds, ttl: tpl.ttl || CFG.INBOX.TTL });
      playChime('email');
      return true;
    }
    function answerEmail(id, optIdx) {
      var m = null, i; for (i = 0; i < S.inbox.length; i++) if (S.inbox[i].id === id) { m = S.inbox[i]; break; }
      if (!m) return;
      applyEmailFx(m.opts[optIdx].d);
      S.inbox.splice(i, 1); S.emailsHandled++;
      flashInbox('✉️ Replied to ' + (m.fromName || m.from) + ' — ' + emailFxText(m.opts[optIdx].d));
      var chosenT = m.opts[optIdx].t || '';
      for (var ti = 0; ti < ACH_EMAIL_TRIGGERS.length; ti++) {
        var tr = ACH_EMAIL_TRIGGERS[ti];
        if (m.subj.indexOf(tr.subjStart) === 0 && chosenT.indexOf(tr.optStart) === 0) { unlock(tr.achId); break; }
      }
      if (S.emailsHandled >= 50) unlock('knockoff_legend');
      if (hasBlunder(m.opts[optIdx].d, -5)) S.weekBlunders++;
      save(); renderHUD(); renderInboxFab(); if (S.inboxOpen) renderInboxList();
    }
    function expireEmail(m) {
      var key = senderTrustKey(m.from), d = {}; d[key] = -CFG.INBOX.EXPIRE;
      applyEmailFx(d); S.emailsExpired++;
      flashInbox('⏰ Ignored email from ' + (m.fromName || m.from) + ' — ' + emailFxText(d), true);
    }
    function flashInbox(msg, bad) {
      S._inboxFlash = { msg: msg, bad: !!bad, at: S.gameSeconds };
      var f = $('inbox-flash'); if (f && S.inboxOpen) { f.style.display = 'block'; f.innerHTML = (bad ? '<span class="bad">' : '') + msg + (bad ? '</span>' : ''); }
    }

    function inboxTick() {
      if (!running()) { renderInboxFab(); return; }
      if (document.hidden) return;
      S.gameSeconds += CFG.INBOX.TICK;
      if (S.gameSeconds >= S.nextEmailAt) {
        if (spawnEmail()) { S.nextEmailAt = S.gameSeconds + rand(CFG.INBOX.MIN_GAP, CFG.INBOX.MAX_GAP); if (S.inboxOpen) renderInboxList(); }
        else { S.nextEmailAt = S.gameSeconds + 8; }
      }
      var changed = false;
      for (var i = S.inbox.length - 1; i >= 0; i--) { var m = S.inbox[i]; if (S.gameSeconds - m.landed >= m.ttl) { expireEmail(m); S.inbox.splice(i, 1); changed = true; } }
      if (changed) { renderHUD(); save(); if (S.inboxOpen) renderInboxList(); }
      if (S._inboxFlash && S.gameSeconds - S._inboxFlash.at > 4) { S._inboxFlash = null; var f = $('inbox-flash'); if (f) f.style.display = 'none'; }
      renderInboxFab();
      if (S.inboxOpen) updateCountdowns();
    }

    function renderInboxFab() {
      var fab = $('inbox-fab'); if (!fab) return;
      if (!running()) { fab.style.display = 'none'; var p = $('inbox-panel'); if (p) p.style.display = 'none'; return; }
      fab.style.display = 'flex';
      var n = S.inbox.length;
      $('inbox-count').textContent = n;
      fab.classList.toggle('empty', n === 0);
      var urgentN = 0; for (var i = 0; i < S.inbox.length; i++) if (urgency(S.inbox[i]) < 0.34) urgentN++;
      var hasUrgent = urgentN > 0;
      fab.classList.toggle('urgent', hasUrgent);
      fab.classList.toggle('idle-tick', n > 0 && !hasUrgent);
      var tt;
      if (n === 0) tt = 'Inbox empty — emails arrive through the week. Click or press i.';
      else if (hasUrgent) tt = 'Inbox — ' + n + ' email' + (n === 1 ? '' : 's') + ', ' + urgentN + ' urgent ⚠️. Click or press i.';
      else tt = 'Inbox — ' + n + ' email' + (n === 1 ? '' : 's') + '. Click or press i.';
      fab.title = tt;
    }
    function openInbox() { S.inboxOpen = true; var p = $('inbox-panel'); if (p) p.style.display = 'flex'; renderInboxList(); }
    function closeInbox() { S.inboxOpen = false; var p = $('inbox-panel'); if (p) p.style.display = 'none'; }
    function toggleInbox() { if (S.inboxOpen) closeInbox(); else openInbox(); }

    function renderInboxList() {
      var list = $('inbox-list'); if (!list) return;
      var f = $('inbox-flash');
      if (f) { if (S._inboxFlash) { f.style.display = 'block'; f.innerHTML = (S._inboxFlash.bad ? '<span class="bad">' : '') + S._inboxFlash.msg + (S._inboxFlash.bad ? '</span>' : ''); } else f.style.display = 'none'; }
      $('inbox-sub').textContent = (S.inbox.length ? '· ' + S.inbox.length + ' to clear ' : '') + '· ' + (S.emailsHandled || 0) + ' cleared FYTD' + ((S.emailsExpired || 0) > 0 ? ' · ' + S.emailsExpired + ' expired' : '');
      if (!S.inbox.length) {
        var EMPTY_MSGS = [
          '📭 Inbox zero. Nice — keep it that way.',
          '📭 Quiet as a Sunday smoko.',
          '📭 No fires. Have a chinwag while you can.',
          '📭 Inbox zero. Stick the kettle on.',
          '📭 All clear. Macca\'ll be in any second now.',
          '📭 Empty. She\'ll be right. Probably.',
          '📭 Bloody beautiful. Five minutes of peace.',
          '📭 No drama. Take a lap of the floor.',
          '📭 Tumbleweeds. Don\'t jinx it.',
          '📭 Inbox zero. Sammo says that\'s a sign.',
          '📭 Empty. Touch wood, mate.',
          '📭 Inbox zero. Big Kev\'s out — make hay.',
          '📭 Nada. Reckon the queue\'s gone bush.',
          '📭 No emails. Floor\'s humming. Don\'t look up.'
        ];
        var idx = (S.emailsHandled || 0) % EMPTY_MSGS.length;
        list.innerHTML = '<div class="inbox-empty">' + EMPTY_MSGS[idx] + '</div>'; return;
      }
      var c = [];
      for (var i = 0; i < S.inbox.length; i++) {
        var m = S.inbox[i], u = urgency(m);
        c.push('<div class="mail ' + (u < 0.34 ? 'urgent' : '') + '" id="mail-' + m.id + '">');
        c.push('<div class="mail-top"><span class="mail-from ' + senderClass(m.from) + '">' + (m.fromName || m.from) + '</span><span class="mail-subj">' + m.subj + '</span></div>');
        var remain = Math.max(0, Math.round(m.ttl - (S.gameSeconds - m.landed))), remLab = remain >= 60 ? (Math.floor(remain / 60) + 'm ' + (remain % 60) + 's') : (remain + 's');
        c.push('<div class="mailrem small ' + (u < 0.34 ? 'urgent' : 'muted') + '" id="mailrem-' + m.id + '" title="Time remaining before this email expires + costs you sender trust">⏳ Expires in ' + remLab + '</div>');
        c.push('<div class="mailbar"><i id="mailbar-' + m.id + '" style="width:' + (u * 100) + '%;background:' + barColor(u) + '"></i></div>');
        c.push('<div class="mail-body">' + m.body + '</div>');
        c.push('<div class="mail-replies">');
        for (var j = 0; j < m.order.length; j++) { var oi = m.order[j]; c.push('<button class="mail-rep" data-mail="' + m.id + '" data-opt="' + oi + '">' + m.opts[oi].t + '</button>'); }
        c.push('</div></div>');
      }
      list.innerHTML = c.join('');
      var btns = list.querySelectorAll('.mail-rep');
      for (var b = 0; b < btns.length; b++) btns[b].addEventListener('click', function (e) { answerEmail(parseInt(e.currentTarget.dataset.mail, 10), parseInt(e.currentTarget.dataset.opt, 10)); });
    }
    function updateCountdowns() {
      for (var i = 0; i < S.inbox.length; i++) {
        var m = S.inbox[i], u = urgency(m);
        var bar = $('mailbar-' + m.id); if (bar) { bar.style.width = (u * 100) + '%'; bar.style.background = barColor(u); }
        var card = $('mail-' + m.id); if (card) card.classList.toggle('urgent', u < 0.34);
        var rem = Math.max(0, Math.round(m.ttl - (S.gameSeconds - m.landed))), remLab = rem >= 60 ? (Math.floor(rem / 60) + 'm ' + (rem % 60) + 's') : (rem + 's');
        var remEl = $('mailrem-' + m.id); if (remEl) { remEl.textContent = '⏳ Expires in ' + remLab; remEl.classList.toggle('urgent', u < 0.34); remEl.classList.toggle('muted', u >= 0.34); }
      }
    }

    /* =======================================================================
       BOOT
       ======================================================================= */
    function resume() {
      renderHUD();
      if (S.phase === 'handover' && S.lastResult) drawHandoverResults();
      else if (S.phase === 'forecast') enterForecast();
      else if (S.phase === 'planning') enterPlanning();
      else if (S.phase === 'results' && S.lastResult) drawResults(S.lastResult);
      else if (S.phase === 'review' && S.reviewData) enterReview();
      else if (S.phase === 'over') { if (S.week >= CFG.WEEKS) yearEnd(); else enterMeeting(); }
      else enterMeeting();
    }
    $('m-new').addEventListener('click', confirmNew);
    $('m-help').addEventListener('click', showHelp);
    $('m-about').addEventListener('click', showAbout);

    var saved = load();
    if (saved && typeof saved.week === 'number') {
      S = saved;
      if (!S.trust) S.trust = { ops: 60, fin: 56, client: 62, team: 58 };
      if (S.ahtSkill == null) S.ahtSkill = 1.0;
      if (!S.weekInits) S.weekInits = { engagement: false, coaching: false, training: false };
      if (!S.callHistory) S.callHistory = [];
      if (!S.history) S.history = [];
      if (S.reviewTab == null) S.reviewTab = 'audit';
      if (S.reviewDay == null) S.reviewDay = 0;
      if (S.handover == null) S.handover = false;
      if (!S.inbox) S.inbox = [];
      if (S.inboxSeq == null) S.inboxSeq = 1;
      if (S.gameSeconds == null) S.gameSeconds = 0;
      if (S.nextEmailAt == null) S.nextEmailAt = S.gameSeconds + CFG.INBOX.FIRST;
      if (S.emailsHandled == null) S.emailsHandled = 0;
      if (S.emailsExpired == null) S.emailsExpired = 0;
      if (!S.achievements) S.achievements = {};
      if (S.weekBlunders == null) S.weekBlunders = 0;
      if (!S.site || SITES.indexOf(S.site) < 0) S.site = 'VIC';
      if (!S.coachingPlans) S.coachingPlans = [];
      if (!S.clientCo || CLIENTS.indexOf(S.clientCo) < 0) S.clientCo = pick(CLIENTS);
      if (S.peekRevealed == null) S.peekRevealed = false;
      if (S.peekActuals === undefined) S.peekActuals = null;
      if (!S.skillSplit || typeof S.skillSplit.voice !== 'number') S.skillSplit = { voice: 0.80, chat: 0.15, email: 0.05 };
      if (typeof S.muted !== 'boolean') S.muted = false;
      S.inboxOpen = false;
      resume();
    } else {
      renderHUDPlaceholder();
      $('screen').innerHTML = '<div class="panel center"><h3>🦘 WFM Tycoon AU — Service Level 80</h3><p>G\'day. You\'re the WFM analyst for an Aussie contact centre running one full FY (Jul 2026 – Jun 2027). Twelve months to hold the line on service level, keep Finance off your back, and dodge the suits.</p><p class="small muted">Forecast each day, staff with Erlang, fight sickies, dodgy AUX, attrition, and the budget. Drill into the call flow, audit the floor (Wallabies / Magpies / Crows) every week, front up to the Monday meeting, and clear the inbox before Macca starts asking awkward questions. Hold the service level at <b>' + pct(CFG.SLA_TARGET) + '</b> Mon–Fri.</p><p style="margin-top:14px"><button class="btn big-btn" id="start">Start the financial year ▶</button></p><p class="small"><a href="#" id="howto">How to play</a></p></div>';
      $('start').addEventListener('click', newGame);
      $('howto').addEventListener('click', function (e) { e.preventDefault(); showHelp(); });
      setStatusBoot();
    }
    function renderHUDPlaceholder() { $('hud').innerHTML = '<div class="hud-cell" style="grid-column:1/-1"><div class="k">Welcome</div><div class="v">WFM Tycoon AU</div><div class="hud-sub">Press start to begin FY26/27</div></div>'; }
    function setStatusBoot() { $('status-left').textContent = 'Ready. Press start to begin.'; var hasBest = false; try { hasBest = localStorage.getItem('wfm_au_best') !== null; } catch (e) {} $('status-right').textContent = hasBest ? 'Best YTD ' + pct1(bestSLA()) : 'First run — set the record.'; }

    // Inbox wiring + real-time ticker
    $('inbox-fab').addEventListener('click', toggleInbox);
    document.addEventListener('click', function (e) { if (e.target && e.target.id === 'ach-badge') showAchievementsGallery(); });
    $('inbox-close').addEventListener('click', closeInbox);
    setInterval(inboxTick, CFG.INBOX.TICK_MS);
    renderInboxFab();

    document.addEventListener('keydown', function (e) {
      var t = e.target, tag = t && t.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      var dlgOpen = $('dlg') && $('dlg').style.display === 'flex';
      if (e.key === 'Escape') {
        if (dlgOpen) { closeDialog(); e.preventDefault(); return; }
        if (S && S.inboxOpen) { closeInbox(); e.preventDefault(); return; }
      }
      if (dlgOpen) return;
      if (e.key === 'i' || e.key === 'I') { var fab = $('inbox-fab'); if (fab && fab.style.display !== 'none') { toggleInbox(); e.preventDefault(); } return; }
      if ((e.key === 'a' || e.key === 'A') && S && S.achievements) { showAchievementsGallery(); e.preventDefault(); return; }
      if (e.key === '?' || e.key === '/') { showHelp(); e.preventDefault(); return; }
      if ((e.key === 'm' || e.key === 'M') && S) { S.muted = !S.muted; save(); setStatus($('status-left').textContent); if (!S.muted) playChime(); e.preventDefault(); return; }
      if (e.key === 'Enter') {
        var primary = $('lock') || $('run') || $('toreview') || $('next') || $('start') || $('submit-find') || $('toplan') || $('toforecast') || $('restart');
        if (primary && !primary.disabled) { primary.click(); e.preventDefault(); }
        return;
      }
      var n = parseInt(e.key, 10);
      if (n >= 1 && n <= 4) {
        var radios = document.querySelectorAll('input[name="grill"]');
        if (radios.length >= n) {
          radios[n - 1].checked = true;
          radios[n - 1].dispatchEvent(new Event('change', { bubbles: true }));
          e.preventDefault();
        }
      }
    });

    // debug hook (mirrors footy's window.__footy) — harmless console helper
    window.__wfmau = {
      state: function () { return S; },
      spawn: function (n) { var k = n || 1, r = 0; for (var i = 0; i < k; i++) if (spawnEmail()) r++; renderInboxFab(); if (S && S.inboxOpen) renderInboxList(); return r; },
      fwd: function (s) { if (S) { S.gameSeconds += (s || 30); } return S ? S.gameSeconds : null; },
      tick: inboxTick,
      unlock: unlock,
      ach: ACHIEVEMENTS,
      hol: function (iso) { return HOLIDAYS_NAT[iso] || (HOLIDAYS_STATE[(S && S.site) || 'VIC'] && HOLIDAYS_STATE[(S && S.site) || 'VIC'][iso]) || null; }
    };
  })();
  </script>
</body>
