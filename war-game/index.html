<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>War Game - Monday Jeffrey</title>
  <link rel="stylesheet" href="../assets/win95.css">
  <style>
    .window { width: min(960px, 96vw); }

    .game-area {
      position: relative;
      background: #0e1626;
      overflow: hidden;
    }

    canvas {
      display: block;
      cursor: grab;
      width: 100%;
      height: 62vh;
      min-height: 380px;
      background: #0e1626;
      touch-action: none;
    }
    canvas.dragging { cursor: grabbing; }

    .hud {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(192, 192, 192, 0.94);
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-bottom: 2px solid #404040;
      border-right: 2px solid #404040;
      padding: 6px 8px;
      font-family: 'MS Sans Serif', Arial, sans-serif;
      font-size: 11px;
      pointer-events: none;
      min-width: 250px;
    }
    .hud .title { font-weight: bold; margin-bottom: 4px; }
    .hud table { border-collapse: collapse; width: 100%; }
    .hud th { font-weight: normal; opacity: 0.75; text-align: right; padding: 0 4px 2px; }
    .hud th.left { text-align: left; }
    .hud td { padding: 1px 4px; font-variant-numeric: tabular-nums; }
    .hud td.right { text-align: right; }
    .hud td.army { font-weight: bold; }
    .hud .swatch { display: inline-block; width: 10px; height: 10px; border: 1px solid #000; vertical-align: middle; margin-right: 4px; }
    .hud tr.dead { text-decoration: line-through; opacity: 0.45; }
    .hud tr.you td { color: #003a80; }

    .controls {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .controls .btn {
      min-width: 110px;
      text-align: center;
      cursor: pointer;
      font-size: 11px;
      padding: 4px 8px;
    }

    .toast {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.82);
      color: #fff;
      padding: 6px 14px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    .game-over {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .game-over.show { display: flex; }
    .game-over .modal {
      background: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-bottom: 2px solid #404040;
      border-right: 2px solid #404040;
      padding: 16px 24px;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 13px;
      min-width: 220px;
    }
    .game-over h2 { margin: 0 0 8px; font-size: 16px; }
    .game-over button {
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="desktop"></div>

  <div class="window" data-title="War Game" data-icon="⚔️" data-close-href="../index.html">
    <div class="title-bar">
      <div class="title-bar-text">
        <span>⚔️</span><span>War Game</span>
      </div>
      <div class="title-bar-buttons">
        <div class="title-btn minimize">_</div>
        <div class="title-btn maximize">□</div>
        <div class="title-btn close">×</div>
      </div>
    </div>
    <div class="menu-bar">
      <span style="padding: 1px 4px;">Drag to pan &middot; Scroll/pinch to zoom &middot; Click your hex then any hex to march &middot; B = build road &middot; Eliminate all factions</span>
    </div>
    <div class="game-area">
      <canvas id="game"></canvas>
      <div class="hud" id="hud"></div>
      <div class="controls">
        <button class="btn" id="center-btn">Center on Home</button>
        <button class="btn" id="build-btn" title="Toggle road-building mode (B)">Build Road (5)</button>
        <button class="btn" id="restart-btn">New Game</button>
      </div>
      <div class="toast" id="toast"></div>
      <div class="game-over" id="game-over">
        <div class="modal">
          <h2 id="game-over-title">Victory!</h2>
          <div id="game-over-text"></div>
          <button class="btn" id="play-again">Play Again</button>
        </div>
      </div>
    </div>
    <div class="status-bar">
      <span class="status-cell" id="status-text">Ready</span>
    </div>
  </div>

  <div class="taskbar">
    <a href="../index.html" class="start-btn"><span>⊞</span> Start</a>
    <div class="taskbar-divider"></div>
    <div class="taskbar-apps"></div>
    <div class="clock"></div>
  </div>

  <script src="../assets/win95.js"></script>
  <script>
  (function () {
    // ===== Constants =====
    const HEX_SIZE = 30;
    const SQRT3 = Math.sqrt(3);
    const TROOP_TICK_MS = 1500;
    const AI_TICK_MS = 2400;

    const STEP_MS_BASE = 2200;  // ms per hex on plains
    const ROAD_SPEEDUP = 2.5;   // road divides terrain step time
    const MAX_PATH_LEN = 30;    // max hex distance per march
    const ROAD_BUILD_COST = 5;
    const MOUNTAIN_PRODUCE_EVERY = 5;  // mountains produce 1 troop every N ticks

    // Terrain
    const T_PLAINS = 'plains';
    const T_MOUNTAINS = 'mountains';
    const T_LAKES = 'lakes';
    const T_OCEANS = 'oceans';
    const TERRAIN_SPEED = {
      plains: 1.0,
      mountains: 2.6
    };
    const TERRAIN_FILL = {
      plains: '#6a7a4a',
      mountains: '#6e6e76',
      lakes: '#3a6da3',
      oceans: '#1c3358'
    };
    const TERRAIN_EDGE = {
      plains: '#3a4426',
      mountains: '#3e3e46',
      lakes: '#26467a',
      oceans: '#0e2040'
    };
    function isPassable(terrain) { return terrain === T_PLAINS || terrain === T_MOUNTAINS; }

    const NEUTRAL = -1;
    const FACTIONS = [
      { id: 0, name: 'You',     color: '#4d8fd6', dark: '#2d5a8c' },
      { id: 1, name: 'Crimson', color: '#d24a4a', dark: '#8c2d2d' },
      { id: 2, name: 'Verdant', color: '#4ab85e', dark: '#2d6e3a' },
      { id: 3, name: 'Violet',  color: '#a05cc8', dark: '#5e348c' }
    ];
    const ROAD_COLOR = '#d6b985';
    const ROAD_EDGE = '#5e4a2c';

    // ===== Hex math (pointy-top, axial coords) =====
    const NEIGHBORS = [
      [+1, 0], [+1, -1], [0, -1], [-1, 0], [-1, +1], [0, +1]
    ];

    function hexToPixel(q, r) {
      return {
        x: HEX_SIZE * SQRT3 * (q + r / 2),
        y: HEX_SIZE * 1.5 * r
      };
    }

    function roundHex(qf, rf) {
      const sf = -qf - rf;
      let q = Math.round(qf);
      let r = Math.round(rf);
      let s = Math.round(sf);
      const dq = Math.abs(q - qf);
      const dr = Math.abs(r - rf);
      const ds = Math.abs(s - sf);
      if (dq > dr && dq > ds) q = -r - s;
      else if (dr > ds) r = -q - s;
      return { q, r };
    }

    function pixelToHex(x, y) {
      const qf = (SQRT3 / 3 * x - y / 3) / HEX_SIZE;
      const rf = (2 / 3 * y) / HEX_SIZE;
      return roundHex(qf, rf);
    }

    function hexKey(q, r) { return q + ',' + r; }
    function neighbors(q, r) { return NEIGHBORS.map(([dq, dr]) => ({ q: q + dq, r: r + dr })); }
    function hexDist(q, r) { return (Math.abs(q) + Math.abs(r) + Math.abs(q + r)) / 2; }
    function hexDistBetween(a, b) { return hexDist(a.q - b.q, a.r - b.r); }

    // ===== Seeded RNG =====
    function hash2d(q, r, seed) {
      let h = seed | 0;
      h = Math.imul(h ^ (q | 0), 2654435761);
      h = Math.imul(h ^ (r | 0), 1597334677);
      h ^= h >>> 16;
      h = Math.imul(h, 2246822519);
      h ^= h >>> 13;
      h = Math.imul(h, 3266489917);
      h ^= h >>> 16;
      return (h >>> 0) / 4294967295;
    }

    // ===== Game state =====
    const territories = new Map();
    const marches = [];
    const roads = new Set();
    let camera = { x: 0, y: 0 };
    let zoom = 0.7;
    const ZOOM_MIN = 0.35;
    const ZOOM_MAX = 1.8;
    let canvas, ctx;
    let selected = null;
    let hover = null;
    let mode = 'move'; // 'move' | 'build'
    let worldSeed = (Math.random() * 1e9) | 0;
    let gameOver = false;
    let lastTroopTick = 0;
    let lastAiTick = 0;
    let toastTimer = null;
    let statusText = 'Select one of your territories.';

    // Multi-octave value noise for smoother terrain clumps
    function terrainAt(q, r) {
      const a = hash2d(Math.floor(q / 6), Math.floor(r / 6), worldSeed ^ 0xA5A5A5);
      const b = hash2d(Math.floor(q / 3), Math.floor(r / 3), worldSeed ^ 0x5A5A5A);
      const c = hash2d(q, r, worldSeed ^ 0x3C3C3C);
      const v = a * 0.55 + b * 0.30 + c * 0.15;
      if (v < 0.50) return T_PLAINS;
      if (v < 0.72) return T_MOUNTAINS;
      if (v < 0.85) return T_LAKES;
      return T_OCEANS;
    }

    function ensureTerritory(q, r) {
      const k = hexKey(q, r);
      let t = territories.get(k);
      if (!t) {
        const terrain = terrainAt(q, r);
        let troops = 0;
        if (isPassable(terrain)) {
          const dist = hexDist(q, r);
          const base = 2 + Math.floor(hash2d(q, r, worldSeed) * 4);
          troops = base + Math.floor(dist * dist / 24);
          if (terrain === T_MOUNTAINS) troops = Math.max(3, Math.floor(troops * 1.1));
        }
        t = { q, r, owner: NEUTRAL, troops, terrain };
        territories.set(k, t);
      }
      return t;
    }

    // ===== Pathfinding =====
    function findPath(from, to) {
      if (from.q === to.q && from.r === to.r) return [];
      const destT = ensureTerritory(to.q, to.r);
      if (!isPassable(destT.terrain)) return null;
      const maxRadius = MAX_PATH_LEN + 2;
      const came = new Map();
      came.set(hexKey(from.q, from.r), null);
      const queue = [{ q: from.q, r: from.r }];
      let head = 0;
      while (head < queue.length) {
        const cur = queue[head++];
        if (cur.q === to.q && cur.r === to.r) {
          const path = [];
          let n = cur;
          while (n && (n.q !== from.q || n.r !== from.r)) {
            path.unshift({ q: n.q, r: n.r });
            n = came.get(hexKey(n.q, n.r));
          }
          return path;
        }
        const nbs = neighbors(cur.q, cur.r);
        for (const nb of nbs) {
          const k = hexKey(nb.q, nb.r);
          if (came.has(k)) continue;
          if (hexDistBetween(nb, from) > maxRadius) continue;
          const nbT = ensureTerritory(nb.q, nb.r);
          if (!isPassable(nbT.terrain)) continue;
          came.set(k, cur);
          queue.push(nb);
        }
      }
      return null;
    }

    // ===== Marches =====
    function stepDurationFor(prev, next) {
      const nextT = ensureTerritory(next.q, next.r);
      const slow = TERRAIN_SPEED[nextT.terrain] || 1.0;
      const fast = roads.has(hexKey(prev.q, prev.r)) && roads.has(hexKey(next.q, next.r));
      return STEP_MS_BASE * slow / (fast ? ROAD_SPEEDUP : 1);
    }

    function makeMarch(owner, troops, from, path, now) {
      if (!path || path.length === 0 || troops < 1) return;
      marches.push({
        owner,
        troops,
        from: { q: from.q, r: from.r },
        path,
        step: 0,
        stepStartTime: now,
        stepDuration: stepDurationFor(from, path[0])
      });
    }

    function resolveCombat(attackerTroops, defenderTroops, defenderTerrain) {
      const defMult = (defenderTerrain === T_MOUNTAINS) ? 1.35 : 1.0;
      const atk = attackerTroops * (0.75 + Math.random() * 0.5);
      const def = defenderTroops * defMult * (0.95 + Math.random() * 0.5);
      if (atk > def) {
        return { winner: 'a', survivors: Math.max(1, Math.floor((atk - def) * 0.85)) };
      }
      return { winner: 'd', survivors: Math.max(1, Math.floor((def - atk) * 0.85 / defMult)) };
    }

    function processMarches(now) {
      for (let i = marches.length - 1; i >= 0; i--) {
        const m = marches[i];
        // Process as many completed steps as time allows
        let removed = false;
        while (!removed && now - m.stepStartTime >= m.stepDuration) {
          const next = m.path[m.step];
          const target = ensureTerritory(next.q, next.r);
          const isFinal = m.step === m.path.length - 1;

          if (target.owner === m.owner) {
            if (isFinal) {
              target.troops += m.troops;
              marches.splice(i, 1);
              removed = true;
              break;
            }
            // pass through friendly hex
          } else {
            const r = resolveCombat(m.troops, target.troops, target.terrain);
            if (r.winner === 'a') {
              target.owner = m.owner;
              if (isFinal) {
                target.troops = r.survivors;
                marches.splice(i, 1);
                removed = true;
                break;
              }
              // Leave 1 troop garrison, continue with the rest
              target.troops = 1;
              m.troops = Math.max(0, r.survivors - 1);
              if (m.troops <= 0) {
                marches.splice(i, 1);
                removed = true;
                break;
              }
            } else {
              target.troops = r.survivors;
              marches.splice(i, 1);
              removed = true;
              break;
            }
          }

          // Advance to next step
          m.step++;
          if (m.step >= m.path.length) {
            marches.splice(i, 1);
            removed = true;
            break;
          }
          const prev = next;
          const upcoming = m.path[m.step];
          m.stepStartTime = now;
          m.stepDuration = stepDurationFor(prev, upcoming);
        }
      }
    }

    // ===== Init =====
    function forceLandAround(center, radius) {
      // Make sure the start cluster + breathing room is passable
      for (let dq = -radius; dq <= radius; dq++) {
        for (let dr = -radius; dr <= radius; dr++) {
          if (Math.abs(dq + dr) > radius) continue;
          const q = center.q + dq;
          const r = center.r + dr;
          const t = ensureTerritory(q, r);
          if (!isPassable(t.terrain)) {
            t.terrain = T_PLAINS;
            const dist = hexDist(q, r);
            const base = 2 + Math.floor(hash2d(q, r, worldSeed) * 4);
            t.troops = base + Math.floor(dist * dist / 24);
          }
        }
      }
    }

    function initGame() {
      territories.clear();
      marches.length = 0;
      roads.clear();
      worldSeed = (Math.random() * 1e9) | 0;
      tickCount = 0;
      selected = null;
      hover = null;
      mode = 'move';
      gameOver = false;
      lastTroopTick = 0;
      lastAiTick = 0;
      zoom = 0.7;
      statusText = 'Select one of your territories. Scroll to zoom.';

      // Ensure starting regions have passable land + room to grow
      forceLandAround({ q: 0, r: 0 }, 2);

      const playerStart = [
        { q: 0, r: 0 },
        { q: 1, r: 0 },
        { q: 0, r: 1 },
        { q: -1, r: 1 }
      ];
      playerStart.forEach(({ q, r }) => {
        const t = ensureTerritory(q, r);
        t.terrain = T_PLAINS;
        t.owner = 0;
        t.troops = 12;
      });

      const aiStarts = [
        { q: 20, r: -40 },  // north
        { q: 20, r:  20 },  // south-east
        { q: -40, r: 20 }   // south-west
      ];
      aiStarts.forEach((center, idx) => {
        const fid = idx + 1;
        forceLandAround(center, 2);
        const cells = [center].concat(neighbors(center.q, center.r).slice(0, 2));
        cells.forEach(({ q, r }) => {
          const t = ensureTerritory(q, r);
          t.terrain = T_PLAINS;
          t.owner = fid;
          t.troops = 12;
        });
      });

      updateBuildButton();
      centerOnHome();
      hideGameOver();
    }

    function centerOnHome() {
      const owned = [];
      territories.forEach(t => { if (t.owner === 0) owned.push(t); });
      if (owned.length === 0) return;
      let sx = 0, sy = 0;
      owned.forEach(t => {
        const p = hexToPixel(t.q, t.r);
        sx += p.x; sy += p.y;
      });
      camera.x = sx / owned.length;
      camera.y = sy / owned.length;
    }

    // ===== Rendering =====
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawHex(cx, cy, fill, stroke, lineWidth) {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const angle = Math.PI / 180 * (60 * i - 30);
        const px = cx + HEX_SIZE * Math.cos(angle);
        const py = cy + HEX_SIZE * Math.sin(angle);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.lineWidth = lineWidth;
      ctx.strokeStyle = stroke;
      ctx.stroke();
    }

    function render(now) {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;

      ctx.fillStyle = '#0e1626';
      ctx.fillRect(0, 0, w, h);

      const halfW = w / (2 * zoom);
      const halfH = h / (2 * zoom);
      const xUnit = HEX_SIZE * SQRT3;
      const yUnit = HEX_SIZE * 1.5;
      const left   = camera.x - halfW - HEX_SIZE * 2;
      const right  = camera.x + halfW + HEX_SIZE * 2;
      const top    = camera.y - halfH - HEX_SIZE * 2;
      const bottom = camera.y + halfH + HEX_SIZE * 2;

      const rMin = Math.floor(top / yUnit) - 1;
      const rMax = Math.ceil(bottom / yUnit) + 1;

      ctx.save();
      ctx.translate(w / 2, h / 2);
      ctx.scale(zoom, zoom);
      ctx.translate(-camera.x, -camera.y);

      const showText = zoom >= 0.55;

      // Hexes
      for (let r = rMin; r <= rMax; r++) {
        const qMin = Math.floor(left / xUnit - r / 2) - 1;
        const qMax = Math.ceil(right / xUnit - r / 2) + 1;
        for (let q = qMin; q <= qMax; q++) {
          const t = ensureTerritory(q, r);
          const { x, y } = hexToPixel(q, r);
          const passable = isPassable(t.terrain);

          let fill, stroke, lw = 1;
          if (t.owner === NEUTRAL) {
            fill = TERRAIN_FILL[t.terrain];
            stroke = TERRAIN_EDGE[t.terrain];
          } else {
            const f = FACTIONS[t.owner];
            fill = f.color;
            stroke = f.dark;
          }

          const isSel = selected && selected.q === q && selected.r === r;
          const isHover = hover && hover.q === q && hover.r === r;
          const buildHover = isHover && mode === 'build' && t.owner === 0;

          if (isSel) { stroke = '#ffffff'; lw = 3; }
          else if (buildHover) { stroke = '#ffd83a'; lw = 2; }
          else if (isHover && !gameOver && passable) { stroke = '#ffffff'; lw = 2; }

          drawHex(x, y, fill, stroke, lw);

          // Terrain overlay icons
          if (t.terrain === T_MOUNTAINS) {
            ctx.fillStyle = (t.owner === NEUTRAL) ? '#3e3e46' : 'rgba(0,0,0,0.45)';
            const s = HEX_SIZE * 0.42;
            ctx.beginPath();
            ctx.moveTo(x - s, y - HEX_SIZE * 0.08);
            ctx.lineTo(x - s * 0.45, y - s * 0.75);
            ctx.lineTo(x + s * 0.05, y - HEX_SIZE * 0.08);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x - s * 0.05, y - HEX_SIZE * 0.08);
            ctx.lineTo(x + s * 0.55, y - s * 0.85);
            ctx.lineTo(x + s, y - HEX_SIZE * 0.08);
            ctx.closePath();
            ctx.fill();
          } else if (t.terrain === T_LAKES || t.terrain === T_OCEANS) {
            // wavy detail
            ctx.strokeStyle = 'rgba(255,255,255,0.18)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(x - HEX_SIZE * 0.5, y + 4);
            ctx.quadraticCurveTo(x - HEX_SIZE * 0.2, y + 1, x, y + 4);
            ctx.quadraticCurveTo(x + HEX_SIZE * 0.2, y + 7, x + HEX_SIZE * 0.5, y + 4);
            ctx.stroke();
          }

          // Troop count — only for passable hexes
          if (showText && passable && (t.owner !== NEUTRAL || t.troops > 0)) {
            const txt = String(t.troops);
            const fs = txt.length >= 4 ? 11 : 13;
            ctx.font = 'bold ' + fs + 'px Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const ty = (t.terrain === T_MOUNTAINS) ? y + 8 : y;
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillText(txt, x + 1, ty + 1);
            ctx.fillStyle = '#ffffff';
            ctx.fillText(txt, x, ty);
          }
        }
      }

      // Roads — draw on top of hexes
      ctx.lineCap = 'round';
      roads.forEach(key => {
        const [q, r] = key.split(',').map(Number);
        const pos = hexToPixel(q, r);
        let connected = false;
        NEIGHBORS.forEach(([dq, dr]) => {
          const nbKey = hexKey(q + dq, r + dr);
          if (!roads.has(nbKey)) return;
          connected = true;
          if (key >= nbKey) return; // draw each edge once
          const nbPos = hexToPixel(q + dq, r + dr);
          ctx.strokeStyle = ROAD_EDGE;
          ctx.lineWidth = 7;
          ctx.beginPath();
          ctx.moveTo(pos.x, pos.y);
          ctx.lineTo(nbPos.x, nbPos.y);
          ctx.stroke();
          ctx.strokeStyle = ROAD_COLOR;
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(pos.x, pos.y);
          ctx.lineTo(nbPos.x, nbPos.y);
          ctx.stroke();
        });
        if (!connected) {
          ctx.fillStyle = ROAD_EDGE;
          ctx.beginPath();
          ctx.arc(pos.x, pos.y - 9, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = ROAD_COLOR;
          ctx.beginPath();
          ctx.arc(pos.x, pos.y - 9, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      });
      ctx.lineCap = 'butt';

      // Marching armies
      marches.forEach(m => {
        const prev = m.step === 0 ? m.from : m.path[m.step - 1];
        const next = m.path[m.step];
        const prevPos = hexToPixel(prev.q, prev.r);
        const nextPos = hexToPixel(next.q, next.r);
        const t = Math.max(0, Math.min(1, (now - m.stepStartTime) / m.stepDuration));
        const px = prevPos.x + (nextPos.x - prevPos.x) * t;
        const py = prevPos.y + (nextPos.y - prevPos.y) * t;
        const f = FACTIONS[m.owner];
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath();
        ctx.arc(px + 1, py + 2, 12, 0, Math.PI * 2);
        ctx.fill();
        // Body
        ctx.fillStyle = f.color;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(px, py, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        // Number
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(m.troops), px, py);
      });

      ctx.restore();
    }

    // ===== HUD =====
    function updateHud() {
      const counts = [0, 0, 0, 0];
      const troops = [0, 0, 0, 0];
      const plains = [0, 0, 0, 0];
      const mtns = [0, 0, 0, 0];
      territories.forEach(t => {
        if (t.owner === NEUTRAL) return;
        counts[t.owner]++;
        troops[t.owner] += t.troops;
        if (t.terrain === T_PLAINS) plains[t.owner]++;
        else if (t.terrain === T_MOUNTAINS) mtns[t.owner]++;
      });
      marches.forEach(m => { troops[m.owner] += m.troops; });
      const tickPerSec = 1000 / TROOP_TICK_MS;
      const hud = document.getElementById('hud');
      let html = '<div class="title">Factions</div>' +
        '<table><thead><tr>' +
        '<th class="left">&nbsp;</th>' +
        '<th>Hexes</th>' +
        '<th>Army</th>' +
        '<th>+/s</th>' +
        '</tr></thead><tbody>';
      FACTIONS.forEach(f => {
        const dead = counts[f.id] === 0;
        // Per-tick: 1 per plain + 1/5 per mountain (avg) + floor(total/4) empire bonus
        const perTick = plains[f.id] + mtns[f.id] / MOUNTAIN_PRODUCE_EVERY + Math.floor(counts[f.id] / 4);
        const perSec = perTick * tickPerSec;
        const rateStr = dead ? '–' : ('+' + (perSec >= 10 ? perSec.toFixed(0) : perSec.toFixed(1)));
        const cls = (dead ? 'dead' : '') + (f.id === 0 ? ' you' : '');
        html +=
          '<tr class="' + cls.trim() + '">' +
          '<td><span class="swatch" style="background:' + f.color + '"></span>' + f.name + '</td>' +
          '<td class="right">' + counts[f.id] + '</td>' +
          '<td class="right army">' + troops[f.id] + '</td>' +
          '<td class="right">' + rateStr + '</td>' +
          '</tr>';
      });
      html += '</tbody></table>';
      hud.innerHTML = html;
      document.getElementById('status-text').textContent = statusText;
      return counts;
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 1500);
    }

    // ===== AI =====
    function aiTick(now) {
      for (let fid = 1; fid < FACTIONS.length; fid++) {
        const owned = [];
        territories.forEach(t => { if (t.owner === fid) owned.push(t); });
        if (owned.length === 0) continue;

        const moves = [];
        owned.forEach(t => {
          if (t.troops < 4) return;
          neighbors(t.q, t.r).forEach(({ q, r }) => {
            const target = ensureTerritory(q, r);
            if (target.owner === fid) return;
            if (!isPassable(target.terrain)) return;
            const send = Math.floor(t.troops / 2);
            const defStrength = target.troops * (target.terrain === T_MOUNTAINS ? 1.35 : 1.0);
            let score = send - defStrength;
            if (target.owner === NEUTRAL) score += 2.5;
            if (target.owner === 0) score += 1.0;
            if (target.terrain === T_MOUNTAINS) score -= 0.8; // mountains less attractive
            score += (Math.random() - 0.5) * 0.5;
            moves.push({ from: t, to: target, score });
          });
        });

        if (moves.length === 0) continue;
        moves.sort((a, b) => b.score - a.score);
        for (const m of moves) {
          if (m.score < 0.5) break;
          if (m.from.troops < 4) continue;
          const send = Math.floor(m.from.troops / 2);
          m.from.troops -= send;
          makeMarch(fid, send, m.from, [{ q: m.to.q, r: m.to.r }], now);
          break;
        }
      }
    }

    // ===== Troop production =====
    let tickCount = 0;
    function troopTick() {
      tickCount++;
      const ownedByFaction = [[], [], [], []];
      territories.forEach(t => {
        if (t.owner === NEUTRAL) return;
        if (t.terrain === T_PLAINS) {
          t.troops += 1;
        } else if (t.terrain === T_MOUNTAINS && tickCount % MOUNTAIN_PRODUCE_EVERY === 0) {
          t.troops += 1;
        }
        ownedByFaction[t.owner].push(t);
      });
      // Empire bonus: extra recruits distributed to random owned plains hexes
      ownedByFaction.forEach((owned) => {
        const plains = owned.filter(t => t.terrain === T_PLAINS);
        if (plains.length === 0) return;
        const bonus = Math.floor(owned.length / 4);
        for (let i = 0; i < bonus; i++) {
          const t = plains[(Math.random() * plains.length) | 0];
          if (t) t.troops += 1;
        }
      });
    }

    // ===== Game over =====
    function checkGameOver(counts) {
      if (gameOver) return;
      if (counts[0] === 0) showGameOver('Defeat', 'Your empire has fallen.');
      else if (counts[1] === 0 && counts[2] === 0 && counts[3] === 0)
        showGameOver('Victory!', 'All rival factions eliminated.');
    }

    function showGameOver(title, text) {
      gameOver = true;
      selected = null;
      document.getElementById('game-over-title').textContent = title;
      document.getElementById('game-over-text').textContent = text;
      document.getElementById('game-over').classList.add('show');
    }

    function hideGameOver() {
      document.getElementById('game-over').classList.remove('show');
    }

    // ===== Mode toggle =====
    function setMode(m) {
      mode = m;
      selected = null;
      statusText = (mode === 'build')
        ? 'Build mode: click your hex to lay a road (costs ' + ROAD_BUILD_COST + ' troops).'
        : 'Select one of your territories, then click anywhere to march.';
      updateBuildButton();
    }

    function updateBuildButton() {
      const btn = document.getElementById('build-btn');
      if (!btn) return;
      if (mode === 'build') btn.classList.add('pressed');
      else btn.classList.remove('pressed');
    }

    // ===== Input =====
    function screenToWorld(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: ((clientX - rect.left) - rect.width / 2) / zoom + camera.x,
        y: ((clientY - rect.top) - rect.height / 2) / zoom + camera.y,
        inside: clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom
      };
    }

    function applyZoom(newZoom, anchorClientX, anchorClientY) {
      newZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newZoom));
      if (Math.abs(newZoom - zoom) < 1e-4) return;
      const rect = canvas.getBoundingClientRect();
      const ax = (anchorClientX - rect.left) - rect.width / 2;
      const ay = (anchorClientY - rect.top) - rect.height / 2;
      // World point under the anchor before/after must match
      const wx = ax / zoom + camera.x;
      const wy = ay / zoom + camera.y;
      zoom = newZoom;
      camera.x = wx - ax / zoom;
      camera.y = wy - ay / zoom;
    }

    function setupInput() {
      let dragging = false;
      let dragStart = null;
      let dragMoved = false;
      let pinch = null; // { d0, z0, cx, cy }

      const startDrag = (cx, cy) => {
        dragging = true;
        dragMoved = false;
        dragStart = { x: cx, y: cy, camX: camera.x, camY: camera.y };
        canvas.classList.add('dragging');
      };
      const moveDrag = (cx, cy) => {
        if (!dragging) return;
        const dx = cx - dragStart.x;
        const dy = cy - dragStart.y;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) dragMoved = true;
        camera.x = dragStart.camX - dx / zoom;
        camera.y = dragStart.camY - dy / zoom;
      };
      const endDrag = (cx, cy) => {
        if (!dragging) return;
        canvas.classList.remove('dragging');
        if (!dragMoved && !gameOver) handleClick(cx, cy);
        dragging = false;
      };

      canvas.addEventListener('mousedown', (e) => { startDrag(e.clientX, e.clientY); e.preventDefault(); });
      window.addEventListener('mousemove', (e) => {
        moveDrag(e.clientX, e.clientY);
        const w = screenToWorld(e.clientX, e.clientY);
        hover = w.inside ? pixelToHex(w.x, w.y) : null;
      });
      window.addEventListener('mouseup', (e) => endDrag(e.clientX, e.clientY));

      // Mouse wheel zoom
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = Math.pow(1.0015, -e.deltaY);
        applyZoom(zoom * factor, e.clientX, e.clientY);
      }, { passive: false });

      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          const t = e.touches[0]; startDrag(t.clientX, t.clientY);
        } else if (e.touches.length === 2) {
          dragging = false;
          const a = e.touches[0], b = e.touches[1];
          const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
          pinch = { d0: d, z0: zoom, cx: (a.clientX + b.clientX) / 2, cy: (a.clientY + b.clientY) / 2 };
        }
        e.preventDefault();
      }, { passive: false });
      canvas.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && !pinch) {
          const t = e.touches[0]; moveDrag(t.clientX, t.clientY);
        } else if (e.touches.length === 2 && pinch) {
          const a = e.touches[0], b = e.touches[1];
          const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
          const cx = (a.clientX + b.clientX) / 2;
          const cy = (a.clientY + b.clientY) / 2;
          applyZoom(pinch.z0 * (d / pinch.d0), cx, cy);
        }
        e.preventDefault();
      }, { passive: false });
      canvas.addEventListener('touchend', (e) => {
        if (e.touches.length === 0) {
          pinch = null;
          if (e.changedTouches.length > 0) {
            const t = e.changedTouches[0]; endDrag(t.clientX, t.clientY);
          }
        } else if (e.touches.length === 1) {
          pinch = null;
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        if (e.key === 'b' || e.key === 'B') setMode(mode === 'build' ? 'move' : 'build');
        else if (e.key === 'Escape') { selected = null; if (mode === 'build') setMode('move'); }
        else if (e.key === '+' || e.key === '=') {
          const rect = canvas.getBoundingClientRect();
          applyZoom(zoom * 1.2, rect.left + rect.width / 2, rect.top + rect.height / 2);
        } else if (e.key === '-' || e.key === '_') {
          const rect = canvas.getBoundingClientRect();
          applyZoom(zoom / 1.2, rect.left + rect.width / 2, rect.top + rect.height / 2);
        }
      });
    }

    function handleClick(clientX, clientY) {
      const w = screenToWorld(clientX, clientY);
      if (!w.inside) return;
      const { q, r } = pixelToHex(w.x, w.y);
      const t = ensureTerritory(q, r);

      // Build mode
      if (mode === 'build') {
        if (t.owner !== 0) { showToast('Can only build on your own hexes'); return; }
        if (roads.has(hexKey(q, r))) { showToast('Already has a road'); return; }
        if (t.troops <= ROAD_BUILD_COST) { showToast('Need more than ' + ROAD_BUILD_COST + ' troops here'); return; }
        t.troops -= ROAD_BUILD_COST;
        roads.add(hexKey(q, r));
        return;
      }

      // Move mode
      if (!isPassable(t.terrain)) {
        showToast(t.terrain === T_OCEANS ? 'Ocean — impassable' : 'Lake — impassable');
        return;
      }

      if (!selected) {
        if (t.owner === 0) {
          selected = { q, r };
          statusText = 'Click any hex (up to ' + MAX_PATH_LEN + ' away) to march troops there.';
        } else {
          showToast("That's not yours");
        }
        return;
      }

      // Click the same selected hex to deselect
      if (selected.q === q && selected.r === r) {
        selected = null;
        statusText = 'Select one of your territories.';
        return;
      }

      const from = ensureTerritory(selected.q, selected.r);
      if (from.owner !== 0) { selected = null; return; }

      if (from.troops < 2) {
        showToast('Need 2+ troops to march');
        selected = null;
        return;
      }

      const path = findPath(selected, { q, r });
      if (!path) { showToast('No route'); return; }
      if (path.length === 0) { selected = null; return; }
      if (path.length > MAX_PATH_LEN) { showToast('Too far (max ' + MAX_PATH_LEN + ' hexes)'); return; }

      const send = Math.max(1, Math.floor(from.troops / 2));
      from.troops -= send;
      makeMarch(0, send, from, path, performance.now());
      selected = null;
      statusText = 'Army marching. Select another hex.';
    }

    // ===== Main loop =====
    function loop(timestamp) {
      if (!lastTroopTick) lastTroopTick = timestamp;
      if (!lastAiTick) lastAiTick = timestamp;

      if (!gameOver) {
        processMarches(timestamp);
        if (timestamp - lastTroopTick >= TROOP_TICK_MS) {
          troopTick();
          lastTroopTick = timestamp;
        }
        if (timestamp - lastAiTick >= AI_TICK_MS) {
          aiTick(timestamp);
          lastAiTick = timestamp;
        }
      }

      render(timestamp);
      const counts = updateHud();
      checkGameOver(counts);

      requestAnimationFrame(loop);
    }

    // ===== Init =====
    document.addEventListener('DOMContentLoaded', () => {
      canvas = document.getElementById('game');
      ctx = canvas.getContext('2d');
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      document.getElementById('center-btn').addEventListener('click', centerOnHome);
      document.getElementById('restart-btn').addEventListener('click', initGame);
      document.getElementById('play-again').addEventListener('click', initGame);
      const buildBtn = document.getElementById('build-btn');
      if (buildBtn) buildBtn.addEventListener('click', () => setMode(mode === 'build' ? 'move' : 'build'));

      setupInput();
      initGame();
      requestAnimationFrame(loop);
    });
  })();
  </script>
</body>
</html>
