<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cortex - Brain Trainer - Monday Jeffrey</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0e1018">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cortex">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="../assets/win95.css">
  <style>
    /* ---- Cortex full-page app theme (a deliberate non-Win95 exception, like Footy/Boredom) ---- */
    :root{
      --bg:#0e1018; --bg2:#161a27; --card:#1c2233; --card2:#232a3e;
      --ink:#e8ecf6; --muted:#9aa3bd; --line:#2c3450;
      --accent:#7c5cff; --accent2:#27d3a2; --warn:#ffb547; --bad:#ff5d6c; --good:#3ddc84;
      --shadow:0 8px 30px rgba(0,0,0,.45);
      --r:14px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{
      background:radial-gradient(1200px 700px at 80% -10%, #1b2138 0%, var(--bg) 55%) fixed;
      color:var(--ink);
      font-family:"Segoe UI",Inter,system-ui,-apple-system,Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    #app{min-height:100vh;padding-bottom:48px;display:flex;flex-direction:column}
    a{color:inherit}
    button{font-family:inherit}

    /* ---- top bar ---- */
    .topbar{
      position:sticky;top:0;z-index:20;
      display:flex;align-items:center;gap:16px;flex-wrap:wrap;
      padding:12px 20px;background:rgba(14,16,24,.82);backdrop-filter:blur(8px);
      border-bottom:1px solid var(--line);
    }
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:.3px}
    .brand .logo{font-size:24px;filter:drop-shadow(0 0 10px rgba(124,92,255,.6))}
    .brand small{color:var(--muted);font-weight:600;font-size:11px;letter-spacing:2px;text-transform:uppercase}
    .top-stats{display:flex;align-items:center;gap:14px;margin-left:auto;flex-wrap:wrap}
    .pill{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
      padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px}
    .pill .sub{color:var(--muted);font-weight:600;font-size:12px}
    .xpwrap{min-width:160px}
    .xpbar{height:8px;border-radius:999px;background:#0b0e16;border:1px solid var(--line);overflow:hidden;margin-top:5px}
    .xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0}
    nav.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
    nav.tabs a{padding:6px 14px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:700;font-size:14px;cursor:pointer}
    nav.tabs a.on{background:var(--accent);color:#fff}

    /* ---- main / cards ---- */
    main{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:22px 20px 40px}
    .grid{display:grid;gap:16px}
    .cols-3{grid-template-columns:repeat(3,1fr)}
    .cols-2{grid-template-columns:repeat(2,1fr)}
    .card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);
      border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
    .card h2{margin:0 0 4px;font-size:16px}
    .card h3{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.4px;text-transform:uppercase}
    .muted{color:var(--muted)}
    .row{display:flex;align-items:center;gap:12px}
    .spread{justify-content:space-between}
    .big{font-size:34px;font-weight:800;line-height:1}

    /* hero / today */
    .hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:18px}
    .quest li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
    .quest li:last-child{border-bottom:0}
    .check{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;flex:0 0 auto}
    .check.done{background:var(--good);border-color:var(--good);color:#06210f}
    .quest .qname{font-weight:700}
    .quest .qmeta{margin-left:auto;color:var(--muted);font-size:12px}

    /* module tiles */
    .tile{display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .12s ease,border-color .12s ease;position:relative;text-decoration:none;color:inherit}
    .tile:hover{transform:translateY(-3px);border-color:var(--accent)}
    .tile .ic{font-size:30px}
    .tile .tname{font-weight:800;font-size:16px}
    .tile .tdesc{color:var(--muted);font-size:13px;line-height:1.4;flex:1}
    .tag{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
      padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
    .tag.ready{color:var(--good);border-color:rgba(61,220,132,.5);background:rgba(61,220,132,.08)}
    .tag.soon{color:var(--warn);border-color:rgba(255,181,71,.4);background:rgba(255,181,71,.08)}
    .tile .best{position:absolute;top:14px;right:14px;font-size:12px;color:var(--muted)}

    /* buttons */
    .btn-x{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card2);
      color:var(--ink);padding:10px 18px;border-radius:10px;font-weight:800;font-size:15px;cursor:pointer}
    .btn-x:hover{border-color:var(--accent)}
    .btn-x.primary{background:linear-gradient(90deg,var(--accent),#5a3fe0);border-color:transparent}
    .btn-x.ghost{background:transparent}
    .btn-x:disabled{opacity:.5;cursor:not-allowed}

    /* play area (modules) */
    .stage{min-height:360px;display:grid;place-items:center;text-align:center;gap:18px}
    .stage .huge{font-size:64px;font-weight:800}

    /* reaction module */
    .rt-pad{width:min(560px,90vw);height:300px;border-radius:18px;display:grid;place-items:center;
      font-size:22px;font-weight:800;cursor:pointer;user-select:none;border:1px solid var(--line);transition:background .05s}
    .rt-wait{background:#3a2330;color:#ffd0d8}
    .rt-go{background:var(--good);color:#06210f}
    .rt-idle{background:var(--card2)}
    .rt-early{background:var(--bad);color:#2a0710}

    table.stats{width:100%;border-collapse:collapse;font-size:14px}
    table.stats td,table.stats th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
    table.stats th{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
    table.stats td.r{text-align:right;font-variant-numeric:tabular-nums}

    .toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(20px);
      background:var(--card);border:1px solid var(--accent);padding:12px 20px;border-radius:12px;
      box-shadow:var(--shadow);font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:50}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
    .cell{aspect-ratio:1;border-radius:5px;background:#0b0e16;border:1px solid var(--line)}
    .cell.lvl1{background:rgba(124,92,255,.35)} .cell.lvl2{background:rgba(124,92,255,.7)} .cell.lvl3{background:var(--accent)}

    .ach{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card2)}
    .ach.locked{opacity:.45;filter:grayscale(1)}
    .ach .aic{font-size:26px}
    .ach .an{font-weight:800}
    .ach .ad{color:var(--muted);font-size:13px}

    .note{font-size:13px;line-height:1.6;color:var(--muted)}
    .note b{color:var(--ink)}
    code{background:#0b0e16;border:1px solid var(--line);padding:1px 6px;border-radius:6px;font-size:12px}

    @media(max-width:820px){
      .cols-3{grid-template-columns:1fr 1fr}
      .hero{grid-template-columns:1fr}
      nav.tabs{order:5;width:100%;justify-content:center}
    }
    @media(max-width:560px){.cols-3,.cols-2{grid-template-columns:1fr}}

    /* a11y: visible keyboard focus */
    a:focus-visible,button:focus-visible,input:focus-visible,.tile:focus-visible,.btn-x:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
    /* reduced motion (system pref or in-app toggle) */
    @media(prefers-reduced-motion:reduce){.tile{transition:none!important}.tile:hover{transform:none!important}}
    body.reduce-motion .tile{transition:none}
    body.reduce-motion .tile:hover{transform:none}
    /* onboarding overlay */
    .ob-overlay{position:fixed;inset:0;z-index:100;background:rgba(8,10,16,.82);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;overflow:auto}
    .ob-card{max-width:560px;width:100%;background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:26px}
    .ob-card h1{margin:0 0 6px;font-size:26px}
    .ob-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
    .ob-opt{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:12px;cursor:pointer}
    .ob-opt.sel{border-color:var(--accent);background:rgba(124,92,255,.14)}
    .ob-opt b{display:block;font-size:15px}
    .ob-opt span{color:var(--muted);font-size:12px}
    @media(max-width:480px){.ob-opts{grid-template-columns:1fr}}
    /* level-up celebration */
    .levelup{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:rgba(8,10,16,0);pointer-events:none;transition:background .3s}
    .levelup.show{background:rgba(8,10,16,.6);pointer-events:auto}
    .lu-card{transform:scale(.7);opacity:0;transition:transform .35s cubic-bezier(.2,1.5,.4,1),opacity .3s;background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--accent);border-radius:20px;padding:26px 42px;text-align:center;box-shadow:0 0 60px rgba(124,92,255,.55)}
    .levelup.show .lu-card{transform:scale(1);opacity:1}
    .lu-burst{font-size:50px;animation:luSpin .8s ease}
    .lu-title{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--accent2);font-weight:800;margin-top:4px}
    .lu-lvl{font-size:40px;font-weight:900;margin:2px 0 6px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
    @keyframes luSpin{from{transform:rotate(-30deg) scale(.4)}to{transform:rotate(0) scale(1)}}
  </style>
</head>
<body>
  <div id="app">
    <div class="topbar">
      <div class="brand"><span class="logo">🧠</span><span>Cortex</span><small>brain trainer</small></div>
      <div class="top-stats">
        <div class="pill" title="Daily streak">🔥 <span id="t-streak">0</span> <span class="sub">day streak</span></div>
        <div class="pill xpwrap" title="Experience">
          <div>
            <div class="row spread" style="gap:10px"><b>Lv <span id="t-level">1</span></b><span class="sub" id="t-xp">0 / 100 XP</span></div>
            <div class="xpbar"><i id="t-xpbar"></i></div>
          </div>
        </div>
        <nav class="tabs" id="tabs">
          <a data-go="#/home">Home</a>
          <a data-go="#/train">Train</a>
          <a data-go="#/stats">Stats</a>
          <a data-go="#/about">Science</a>
          <a data-go="#/settings">⚙</a>
        </nav>
      </div>
    </div>
    <main id="screen"></main>
  </div>

  <div class="taskbar">
    <a href="../index.html" class="start-btn"><span>⊞</span> Start</a>
    <div class="taskbar-divider"></div>
    <div class="taskbar-apps"></div>
    <div class="clock"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../assets/win95.js"></script>
  <script>
/* ===========================================================================
   CORTEX — a gamified "make me smarter" brain-training suite
   100% offline · client-side only · no frameworks · localStorage state
   Built incrementally by a /loop (every 2 min). THIS HEADER IS THE SOURCE OF
   TRUTH for the loop: read the roadmap + progress log, then build the next item.
   ---------------------------------------------------------------------------

   DESIGN PHILOSOPHY (deliberately honest — matches the site's password-test/happy style):
     The biggest real levers for "getting smarter" are (1) acquiring durable
     KNOWLEDGE and (2) CONSISTENCY. So Cortex uses game mechanics (streak, XP,
     levels, quests) to drive daily practice, and weights its "training plan"
     toward the things with the best evidence:
       • Spaced repetition (Anki/SM-2)  → strongest evidence; builds real knowledge.
       • Meditation / focused attention  → solid evidence for attention & stress.
       • Working-memory & exec-function games (Dual N-Back, Stroop, task-switch)
         → fun, measurable, train the specific skill; FAR-TRANSFER TO GENERAL IQ
         IS GENUINELY DEBATED. We say so on the Science page rather than overclaim.
     The "Cortex Score" is an in-app fitness number, NOT an IQ.

   ARCHITECTURE:
     - Single-page app. Hash router (#/home #/train #/train/<id> #/stats #/about #/settings).
     - State in localStorage key `cortex.v1` (see STATE MODEL). All saves via save().
     - Modules live in the Modules registry. Each module:
         { id, name, icon, blurb, evidence, status:'ready'|'soon',
           start(mount, finish) }   // start() runs the exercise UI inside `mount`,
                                     // calls finish({score, xp, stats}) when done.
       Adding a module = add an entry with status:'ready' + a start() fn. The grid,
       routing, XP, streak, daily-quest and stats wiring are all automatic.
     - Gamification core (XP/level/streak/daily/achievements) is module-agnostic:
       call recordSession(moduleId, {score, xp, stats}) and everything updates.

   STATE MODEL (cortex.v1):
     profile:{ xp, createdAt, lastActive }
     streak:{ current, longest, lastDay }            // lastDay = 'YYYY-MM-DD'
     daily:{ date, plan:[moduleId...], done:[moduleId...] }
     modules:{ <id>:{ sessions:int, best:number|null, last:number|null,
                       history:[{d,score,xp,stats}] (capped) } }
     srs:{ decks:{...}, cards:{...} }                // added when SRS module lands
     achievements:[ id... ]                          // unlocked ids
     settings:{ sound, reducedMotion, onboarded, focus }  // focus: all|memory|focus|knowledge
     activity:{ 'YYYY-MM-DD': sessionCount }         // for the streak calendar

   ROADMAP (build order — tick as done, keep a one-line PROGRESS LOG entry):
     [x] 0  Scaffold: theme, router, state core, XP/level/streak, daily-quest,
            dashboard, stats, Science page, settings (export/import/reset).
     [x] 1  Reaction Time module (proves the full gamification loop end-to-end).
     [x] 2  Dual N-Back  (grid position + WebAudio tones; adaptive N; A/L keys).
     [x] 3  Flashcards / Spaced Repetition (SM-2): 5 seed decks + card editor.
     [x] 4  Meditation / breath timer (box, 4-7-8, coherent, calm; WebAudio chime).
     [x] 5  Mental Math (adaptive arithmetic, combos, 60s sprint).
     [x] 6  Stroop / inhibition (name the ink colour, 45s sprint).
     [x] 7  Task-switching (cognitive flexibility, switch-cost).
     [x] 8  Vocabulary (MC definitions; auto-creates SRS cards from misses).
     --- ALL 8 EXERCISES DONE. Remaining = polish/gamification depth ---
     [x] 9  Daily-quest generator polish: balanced plan (1 Knowledge + 1 Focus + 1 Game), rotates daily.
     [x] 10 Achievements: expanded to 15 (toasts already wired).
     [x] 11 Stats: per-module sparkline charts (canvas), Cortex Score (composite 0-1000) + breakdown.
     [x] 12 Onboarding (first-run overlay + focus pick) + reduced-motion + focus-visible a11y + mobile.
     [x] 13 Science page: per-exercise honest notes + real citations + "what beats brain games".
     ============ ROADMAP COMPLETE (all 8 modules + all polish done) ============
     Optional extras: [x] SRS keyboard shortcuts  [x] level-up celebration  [x] +2 seed decks (7 total)
                      [x] PWA/installable (manifest + sw.js + icon.svg)  [x] sound pack (WebAudio)  [ ] daily reminder

   PROGRESS LOG:
     iter1 (2026-06-08): scaffold + gamification core + Reaction Time. App is
       playable end-to-end: do a session → earn XP → level up → streak ticks →
       stats record. Modules 2-8 are 'soon' tiles. NEXT: Dual N-Back (#2).
     iter2 (2026-06-08): Dual N-Back DONE — 3x3 grid (spatial) + 6 WebAudio tones
       (auditory), A/L keys + buttons, signal-detection scoring per channel,
       adaptive N (>=80%→N+1, <50%→N-1) persisted in S.modules.nback.n, leak-safe
       (cleanup on finish/navigate). NEXT: Flashcards/SRS SM-2 (#3).
     iter3 (2026-06-08): Flashcards/SRS DONE — SM-2 scheduler (ease/interval/reps,
       Again/Hard/Good/Easy with interval previews + Hard×0.8/Easy×1.3 tweaks),
       5 built-in decks (~50 cards: biases, fallacies, capitals, science, vocab)
       seeded once into S.srs, deck/card editor (add deck/card, delete, custom-deck
       delete), review queue (due+new, cap 20, Again re-drills in-session), session
       summary → recordSession. Sub-views render inside mount (no extra routing).
       NEXT: Meditation/breath timer (#4).
     iter4 (2026-06-08): Meditation DONE — animated breath circle (CSS scale per
       phase), 4 patterns (Box 4·4·4·4, Relax 4·7·8, Coherent 5·5, Calm 4·6),
       1/3/5/10-min sessions, soft WebAudio chimes (toggle→S.settings.sound),
       live countdown + cycle counter, Finish-early, ≥60s counts → recordSession
       (xp=min×8), leak-safe cleanup. NEXT: Mental Math (#5).
     iter5 (2026-06-08): TWO modules. Mental Math — 60s sprint, adaptive difficulty
       L1-5 (3-correct→up, miss→down), +/-/×/÷ generators, combo multiplier, typed
       input+Enter. Stroop — 45s sprint, 6-colour swatch pad, 70% incongruent ink,
       tap ink-colour, tracks accuracy+avg RT. Both shared timed-sprint shape,
       leak-safe. NEXT: Task-switching (#7).
     iter6 (2026-06-08): FINAL TWO modules → all 8 done. Task Switch — 45s sprint,
       parity(odd/even) vs magnitude(low/high) rules switching randomly, relabeled
       buttons, measures switch cost (avg RT switch − repeat). Vocabulary — 12-Q MC
       (20-word bank, 3 distractor defs), misses auto-add front/back cards to a
       'My Vocabulary' SRS deck (dedup by front). NEXT: polish — daily-quest balance
       (#9), achievements (#10), stats charts (#11), onboarding (#12), Science (#13).
     iter7 (2026-06-08): POLISH PASS. (#9) Daily quest = Knowledge+Focus+Game, one
       from each category, rotates by day-number. (#11) Cortex Score — composite
       0-1000 from per-module fitness vs BENCH targets (best/target capped 100,
       mean×10); shown on Home progress card + Stats with per-exercise bar
       breakdown; canvas sparkline trend per exercise in the By-exercise table.
       (#10) Achievements expanded 7→15 (octopus, streak30, lvl10, sessions100,
       nback3, zen, scholar, cortex300). NEXT: onboarding + a11y/mobile (#12), Science (#13).
     iter8 (2026-06-08): ONBOARDING + A11Y/MOBILE (#12). First-run overlay (honest
       pitch + focus pick: all/memory/focus/knowledge → S.settings.focus, sets
       onboarded flag); focus adds one extra daily-quest item via FOCUS_EXTRA.
       Settings → Preferences (Reduce-motion toggle → body.reduce-motion + applyMotionPref;
       Replay-intro). CSS: :focus-visible outlines, prefers-reduced-motion + .reduce-motion
       (kills tile hover transform; breath circle kept). Boot shows overlay if !onboarded.
       NEXT: flesh out Science page (#13) = last roadmap item.
     iter9 (2026-06-08): SCIENCE PAGE (#13) → ROADMAP COMPLETE. Rewrote /about into
       5 cards: the uncomfortable truth (Owen 2010 Nature, no far-transfer), the two
       real levers (spacing effect/Ebbinghaus + testing effect/Roediger-Karpicke;
       consistency), honest per-exercise notes w/ real refs (Jaeggi 2008, Melby-Lervåg
       meta-analyses, Goyal 2014 JAMA, Stroop 1935), "things that beat any brain game"
       (sleep/exercise/hard-learning/reading/attention), Cortex-Score-≠-IQ footer.
       FEATURE-COMPLETE vs original plan. Future = optional polish only (see roadmap).
     iter10 (2026-06-08): OPTIONAL EXTRAS. Level-up celebration (recordSession compares
       level before/after xp; .levelup overlay w/ scale-in, auto-dismiss). SRS keyboard
       shortcuts (Space/Enter=flip, 1-4=Again/Hard/Good/Easy; module-level kbReveal/kbRate
       + leak-safe srsKey listener cleaned on hashchange/mount-gone; reset in hub/manage/finish).
       +2 flashcard decks → 7 total (Mental Models, History Milestones). NEXT: still optional
       (PWA install, daily reminder, sound) — or stop/push live.
     iter11 (2026-06-08): PWA / INSTALLABLE. Added manifest.webmanifest (standalone,
       start_url/scope /cortex/, theme #0e1018), icon.svg (gradient "C" monogram, maskable),
       sw.js (network-first + offline cache fallback, scope /cortex/ ONLY, versioned cache
       cortex-v1, skipWaiting/claim). Head: manifest + theme-color + apple-touch-icon/metas.
       Boot registers SW on load (guarded). Now add-to-home-screen + works with zero
       connectivity after first load. NEXT optional: daily reminder, sound pack.
     iter12 (2026-06-08): SOUND PACK. WebAudio synth (no files) Sound={correct,wrong,
       success,levelUp,achievement,tick}, gated by S.settings.sound; lazy AudioContext
       resumed on first pointerdown. Hooked: levelUp→levelUp chord, recordSession→success,
       checkAchievements→achievement, and per-answer correct/wrong in Math/Stroop/Switch.
       Global 🔊 toggle added to Settings→Preferences (shares S.settings.sound w/ meditation).
       NEXT optional: daily reminder (last listed extra) — or stop/push live.
     iter13 (2026-06-08): QA / HARDENING PASS (no new features — fix real bugs).
       BUG 1: N-Back & Meditation each did `new AudioContext()` per session and never
       closed it → browsers cap ~6 contexts → audio would break after enough plays.
       Fixed: both now reuse the shared singleton audioCtx() (same one the sound pack uses).
       BUG 2: streak display was stale after missed days (showed old 🔥 until next train).
       Added effectiveStreak() (alive only if last trained today/yesterday, else 0) and used
       it on Home header, Home progress card, and Stats. recordSession streak logic unchanged.

   HOW THE LOOP SHOULD WORK EACH FIRE:
     1) Read this header. 2) Pick the next [ ] item (prefer user asks: N-Back, SRS,
        meditation). 3) Implement it as a Modules entry (status:'ready'+start()).
     4) Verify in the browser preview (no console errors, the exercise runs &
        calls finish()). 5) Tick the roadmap + add a PROGRESS LOG line. Keep it
        offline (no network/CDN). Small, working increments over big rewrites.
   =========================================================================== */

  'use strict';
  const KEY='cortex.v1';
  const $=(s,r=document)=>r.querySelector(s);
  const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
  const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
  const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000);

  /* ---------- state ---------- */
  function defaultState(){
    return {
      profile:{xp:0,createdAt:todayStr(),lastActive:todayStr()},
      streak:{current:0,longest:0,lastDay:null},
      daily:{date:null,plan:[],done:[]},
      modules:{},
      srs:{decks:{},cards:{}},
      achievements:[],
      settings:{sound:true,reducedMotion:false,onboarded:false,focus:'all'},
      activity:{}
    };
  }
  let S=load();
  function load(){
    try{const raw=localStorage.getItem(KEY);if(!raw)return defaultState();
      const s=Object.assign(defaultState(),JSON.parse(raw));
      return s;
    }catch(e){return defaultState();}
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

  /* ---------- leveling ---------- */
  // XP needed to go from level L to L+1 (cumulative computed by loop).
  const xpForLevelStep=L=>100+(L-1)*50;
  function levelInfo(xp){
    let lvl=1,need=xpForLevelStep(1),into=xp;
    while(into>=need){into-=need;lvl++;need=xpForLevelStep(lvl);}
    return {level:lvl,into:Math.floor(into),need,pct:Math.max(0,Math.min(1,into/need))};
  }

  /* ---------- Cortex Score: in-app cognitive-fitness composite (0-1000), NOT an IQ ---------- */
  const BENCH={reaction:90,nback:85,srs:90,breath:10,math:400,stroop:45,switch:35,vocab:11};
  function moduleFitness(id){const r=S.modules[id];const best=r&&r.best!=null?r.best:0;return Math.max(0,Math.min(100,Math.round(best/(BENCH[id]||100)*100)));}
  function cortexScore(){const ids=Object.keys(BENCH);return Math.round(ids.reduce((a,id)=>a+moduleFitness(id),0)/ids.length*10);}

  /* ---------- daily quest: one Knowledge + one Focus + one Game, rotating by day ---------- */
  const QUEST_CATS=[['srs','vocab'],['breath','nback'],['reaction','math','stroop','switch']];
  const FOCUS_EXTRA={memory:['nback','srs'],focus:['breath','stroop','switch'],knowledge:['srs','vocab']};
  function ensureDaily(){
    const t=todayStr();
    if(S.daily.date!==t){
      const ready=new Set(Modules.filter(m=>m.status==='ready').map(m=>m.id));
      const dayNum=Math.floor(new Date(t).getTime()/86400000);
      const plan=[];
      QUEST_CATS.forEach((cat,ci)=>{const avail=cat.filter(id=>ready.has(id));if(avail.length)plan.push(avail[(dayNum+ci)%avail.length]);});
      if(!plan.length)plan.push(...[...ready].slice(0,3));
      const fx=FOCUS_EXTRA[S.settings&&S.settings.focus];           // personalise: add one extra from chosen focus
      if(fx){const extra=fx.find(id=>ready.has(id)&&!plan.includes(id));if(extra)plan.push(extra);}
      S.daily={date:t,plan,done:[]};
      save();
    }
  }

  /* ---------- record a finished session ---------- */
  function recordSession(id,{score=0,xp=0,stats=null}={}){
    const t=todayStr();
    // module record
    const m=S.modules[id]||(S.modules[id]={sessions:0,best:null,last:null,history:[]});
    m.sessions++; m.last=score;
    if(m.best==null||score>m.best)m.best=score;
    m.history.push({d:t,score,xp,stats});
    if(m.history.length>200)m.history=m.history.slice(-200);

    // xp + activity (+ level-up celebration)
    const lvBefore=levelInfo(S.profile.xp).level;
    S.profile.xp+=xp; S.profile.lastActive=t;
    const lvAfter=levelInfo(S.profile.xp).level;
    if(lvAfter>lvBefore)setTimeout(()=>levelUp(lvAfter),450);
    S.activity[t]=(S.activity[t]||0)+1;

    // streak: count today once any session is logged
    if(S.streak.lastDay!==t){
      const gap=S.streak.lastDay?daysBetween(S.streak.lastDay,t):null;
      S.streak.current=(gap===1)?S.streak.current+1:1;
      if(S.streak.current>S.streak.longest)S.streak.longest=S.streak.current;
      S.streak.lastDay=t;
    }

    // daily quest progress
    ensureDaily();
    if(S.daily.plan.includes(id)&&!S.daily.done.includes(id))S.daily.done.push(id);

    save();
    Sound.success();
    checkAchievements();
    paintTop();
  }

  /* ---------- achievements ---------- */
  function totalSessions(s){return Object.values(s.modules).reduce((a,m)=>a+(m.sessions||0),0);}
  const srsReviewed=s=>(s.modules.srs&&s.modules.srs.history?s.modules.srs.history.reduce((a,h)=>a+((h.stats&&h.stats.reviewed)||0),0):0);
  const ACHS=[
    {id:'first',ic:'🌱',n:'First Rep',d:'Complete your first exercise.',test:s=>totalSessions(s)>=1},
    {id:'allrounder',ic:'🎛️',n:'All-Rounder',d:'Try 3 different exercises.',test:s=>Object.keys(s.modules).length>=3},
    {id:'octopus',ic:'🐙',n:'The Full Workout',d:'Try all 8 exercises.',test:s=>Object.keys(s.modules).filter(k=>BENCH[k]!==undefined).length>=8},
    {id:'streak3',ic:'🔥',n:'Warming Up',d:'Reach a 3-day streak.',test:s=>s.streak.longest>=3},
    {id:'streak7',ic:'⚡',n:'Habit Formed',d:'Reach a 7-day streak.',test:s=>s.streak.longest>=7},
    {id:'streak30',ic:'🌟',n:'Unbreakable',d:'Reach a 30-day streak.',test:s=>s.streak.longest>=30},
    {id:'lvl5',ic:'🧗',n:'Level 5',d:'Reach level 5.',test:s=>levelInfo(s.profile.xp).level>=5},
    {id:'lvl10',ic:'🏆',n:'Level 10',d:'Reach level 10.',test:s=>levelInfo(s.profile.xp).level>=10},
    {id:'sessions25',ic:'🏋️',n:'Gym Regular',d:'Complete 25 exercises.',test:s=>totalSessions(s)>=25},
    {id:'sessions100',ic:'💯',n:'Centurion',d:'Complete 100 exercises.',test:s=>totalSessions(s)>=100},
    {id:'quest',ic:'✅',n:'Daily Done',d:'Finish a full daily training plan.',test:s=>s.daily.plan.length>0&&s.daily.done.length>=s.daily.plan.length},
    {id:'nback3',ic:'🧠',n:'Triple Back',d:'Reach 3-back in Dual N-Back.',test:s=>((s.modules.nback&&s.modules.nback.n)||0)>=3},
    {id:'zen',ic:'🧘',n:'Inner Calm',d:'Finish 10 meditation sessions.',test:s=>((s.modules.breath&&s.modules.breath.sessions)||0)>=10},
    {id:'scholar',ic:'📚',n:'Scholar',d:'Review 100 flashcards.',test:s=>srsReviewed(s)>=100},
    {id:'cortex300',ic:'💎',n:'Sharp Mind',d:'Reach a Cortex Score of 300.',test:s=>cortexScore()>=300}
  ];
  function checkAchievements(silent){
    let unlocked=[];
    ACHS.forEach(a=>{if(!S.achievements.includes(a.id)){try{if(a.test(S)){S.achievements.push(a.id);unlocked.push(a);}}catch(e){}}});
    if(unlocked.length){save();if(!silent){Sound.achievement();unlocked.forEach((a,i)=>setTimeout(()=>toast(a.ic+' Achievement: '+a.n),i*900));}}
  }

  /* ---------- toast + level-up ---------- */
  let _toastT;
  function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(_toastT);_toastT=setTimeout(()=>t.classList.remove('show'),2200);}
  function levelUp(n){
    if(document.querySelector('.levelup'))return;
    Sound.levelUp();
    const ov=el('div','levelup');
    ov.innerHTML='<div class="lu-card"><div class="lu-burst">⭐</div><div class="lu-title">Level Up</div><div class="lu-lvl">Level '+n+'</div><div class="note" style="margin:0">Nice — keep the streak going.</div></div>';
    document.body.append(ov);
    requestAnimationFrame(()=>ov.classList.add('show'));
    const close=()=>{ov.classList.remove('show');setTimeout(()=>ov.remove(),320);};
    ov.addEventListener('click',close); setTimeout(close,2800);
  }

  /* ---------- sound pack (WebAudio synth, offline; gated by S.settings.sound) ---------- */
  let _ac=null;
  function audioCtx(){if(_ac)return _ac;try{_ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){_ac=null;}return _ac;}
  document.addEventListener('pointerdown',function _r(){const c=audioCtx();if(c&&c.state==='suspended')c.resume();},{once:true});
  function blip(freq,t0,dur,type,vol){const c=audioCtx();if(!c)return;try{const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=freq;g.gain.value=0.0001;o.connect(g);g.connect(c.destination);const t=c.currentTime+(t0||0);o.start(t);g.gain.exponentialRampToValueAtTime(vol||0.1,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.stop(t+dur+0.03);}catch(e){}}
  const Sound={
    on(){return !(S.settings&&S.settings.sound===false);},
    correct(){if(this.on()){blip(660,0,0.12,'sine',0.09);blip(990,0.05,0.12,'sine',0.07);}},
    wrong(){if(this.on())blip(160,0,0.2,'sawtooth',0.06);},
    success(){if(this.on())[523,659,784].forEach((f,i)=>blip(f,i*0.08,0.18,'sine',0.09));},
    levelUp(){if(this.on())[523,659,784,1047].forEach((f,i)=>blip(f,i*0.10,0.22,'triangle',0.11));},
    achievement(){if(this.on())[784,988,1319].forEach((f,i)=>blip(f,i*0.07,0.16,'sine',0.09));},
    tick(){if(this.on())blip(440,0,0.05,'square',0.05);}
  };

  /* ---------- header paint ---------- */
  // Streak shown to the user: alive if trained today or yesterday, else broken (0).
  function effectiveStreak(){if(!S.streak.lastDay)return 0;const gap=daysBetween(S.streak.lastDay,todayStr());return gap<=1?S.streak.current:0;}
  function paintTop(){
    const li=levelInfo(S.profile.xp);
    $('#t-streak').textContent=effectiveStreak();
    $('#t-level').textContent=li.level;
    $('#t-xp').textContent=li.into+' / '+li.need+' XP';
    $('#t-xpbar').style.width=(li.pct*100).toFixed(1)+'%';
  }

  /* =========================================================================
     MODULES REGISTRY  (the loop appends ready modules here)
     ========================================================================= */
  const Modules=[
    /* ---- #1 Reaction Time (implemented) ---- */
    {
      id:'reaction', name:'Reaction Time', icon:'⚡', status:'ready',
      blurb:'Tap the instant the screen turns green. Trains raw processing speed.',
      evidence:'Processing speed is a real, measurable cognitive dimension; this is mostly a fun baseline + warm-up.',
      start(mount,finish){
        const N=5; let i=0; const times=[]; let state='idle',t0=0,timer=null;
        const pad=el('div','rt-pad rt-idle','Click to start — then tap the moment it turns <b style="margin:0 4px">green</b>');
        const info=el('div','muted','Trial 0 / '+N);
        const wrap=el('div','stage'); wrap.append(pad,info);
        mount.innerHTML=''; mount.append(wrap);
        function arm(){
          state='wait'; pad.className='rt-pad rt-wait'; pad.innerHTML='Wait for green…';
          const delay=900+Math.random()*2200;
          timer=setTimeout(()=>{state='go';t0=performance.now();pad.className='rt-pad rt-go';pad.innerHTML='TAP!';},delay);
        }
        pad.addEventListener('pointerdown',()=>{
          if(state==='done')return;
          if(state==='idle'){i=0;times.length=0;info.textContent='Trial 1 / '+N;arm();return;}     // start session (trial 1)
          if(state==='between'){info.textContent='Trial '+(i+1)+' / '+N;arm();return;}              // next trial, keep progress
          if(state==='wait'){clearTimeout(timer);state='between';pad.className='rt-pad rt-early';pad.innerHTML='Too early! Click to retry this trial.';return;}
          if(state==='go'){
            const ms=Math.round(performance.now()-t0);times.push(ms);i++;
            if(i>=N){done();} else {state='between';pad.className='rt-pad rt-idle';pad.innerHTML='<b>'+ms+' ms</b> ✔ — click for the next trial';info.textContent='Trial '+i+' / '+N+' — last '+ms+' ms';}
          }
        });
        function done(){
          state='done';
          const avg=Math.round(times.reduce((a,b)=>a+b,0)/times.length);
          const best=Math.min(...times);
          // score: faster = higher; 600ms→~0, 200ms→~100
          const score=Math.max(0,Math.round((600-avg)/4));
          const xp=20+Math.round(score/3);
          pad.className='rt-pad rt-idle';
          pad.innerHTML='Avg <b>'+avg+' ms</b> · best '+best+' ms<br><span class="muted">+'+xp+' XP</span>';
          info.innerHTML='<button class="btn-x primary" id="rt-again">Again</button> &nbsp; <a class="btn-x ghost" data-go="#/train">Back to Train</a>';
          $('#rt-again').onclick=()=>moduleById('reaction').start(mount,finish);
          finish({score,xp,stats:{avg,best}});
          toast('+'+xp+' XP · '+avg+' ms');
        }
      }
    },
    /* ---- planned (loop fills these in) ---- */
    /* ---- #2 Dual N-Back (implemented) ---- */
    {
      id:'nback', name:'Dual N-Back', icon:'🔢', status:'ready',
      blurb:'Track position + sound N steps back. The classic working-memory workout.',
      evidence:'Trains working memory; transfer to general IQ is debated — see Science.',
      start(mount,finish){
        const rec=S.modules.nback||{};
        let n=Math.max(1,Math.min(6,rec.n||2));
        const SOA=2700, SHOW=650, scored=14, trials=scored+n;
        const TONES=[261.63,293.66,329.63,392.00,440.00,523.25];
        const POS=[0,1,2,3,5,6,7,8];           // 8 grid cells (centre = tone indicator)
        let idx=-1, running=false, tickTimer=null, hideTimer=null, ac=null;
        const seq=[], posResp=Array(trials).fill(false), sndResp=Array(trials).fill(false);
        const stt={pos:{hit:0,miss:0,fa:0,cr:0},snd:{hit:0,miss:0,fa:0,cr:0}};

        mount.innerHTML='';
        const wrap=el('div','stage'); wrap.style.gap='14px';
        const head=el('div',null,'<div class="big" style="font-size:22px">Dual <span style="color:var(--accent)">'+n+'</span>-Back</div><div class="muted" id="nb-status">Match the square <b>and</b> the tone from <b>'+n+'</b> step'+(n>1?'s':'')+' ago.</div>');
        const grid=el('div'); grid.style.cssText='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(360px,80vw);aspect-ratio:1';
        const cells=[];
        for(let k=0;k<9;k++){const c=el('div');c.style.cssText='border:1px solid var(--line);border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:26px;transition:background .08s,box-shadow .08s';grid.append(c);cells.push(c);}
        const btns=el('div','row'); btns.style.gap='12px';
        const posBtn=el('button','btn-x','◻ Position (A)'); const sndBtn=el('button','btn-x','🔊 Sound (L)');

        wrap.append(head,grid,btns,startBtn,info); mount.append(wrap);

        function tone(i){try{if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=TONES[i];g.gain.value=0.0001;o.connect(g);g.connect(ac.destination);const t=ac.currentTime;o.start(t);g.gain.exponentialRampToValueAtTime(0.18,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.32);o.stop(t+0.34);}catch(e){}}
        function flash(b){b.style.background='var(--accent)';b.style.borderColor='var(--accent)';setTimeout(()=>{b.style.background='';b.style.borderColor='';},150);}

        function cleanup(){running=false;clearTimeout(tickTimer);clearTimeout(hideTimer);document.removeEventListener('keydown',onKey);window.removeEventListener('hashchange',cleanup);}
        function genSeq(){for(let k=0;k<trials;k++){let p=POS[Math.floor(Math.random()*POS.length)],s=Math.floor(Math.random()*TONES.length);if(k>=n){if(Math.random()<0.28)p=seq[k-n].p;if(Math.random()<0.28)s=seq[k-n].s;}seq.push({p,s});}}
        function showStim(k){const cell=cells[seq[k].p];cell.style.background='var(--accent)';cell.style.boxShadow='0 0 22px rgba(124,92,255,.85)';const ctr=cells[4];ctr.textContent='🔊';ctr.style.color='var(--accent2)';tone(seq[k].s);hideTimer=setTimeout(()=>{cell.style.background='var(--card2)';cell.style.boxShadow='none';if(seq[k].p!==4)ctr.textContent='';},SHOW);}
        function evaluate(k){if(k<n)return;const pm=seq[k].p===seq[k-n].p,sm=seq[k].s===seq[k-n].s;stt.pos[pm?(posResp[k]?'hit':'miss'):(posResp[k]?'fa':'cr')]++;stt.snd[sm?(sndResp[k]?'hit':'miss'):(sndResp[k]?'fa':'cr')]++;}

          toast('+'+xp+' XP · '+score+'/100 · '+n+'-back');
        }
        startBtn.onclick=()=>{
          try{ac=audioCtx();if(ac&&ac.state==='suspended')ac.resume();}catch(e){ac=null;}
          genSeq(); running=true; idx=-1; posBtn.disabled=sndBtn.disabled=false; startBtn.style.display='none';
          document.addEventListener('keydown',onKey); window.addEventListener('hashchange',cleanup);
          $('#nb-status').textContent='Get ready…'; tickTimer=setTimeout(step,900);

    },

    const bars=el('div'); bars.style.cssText='margin-top:10px;display:grid;gap:6px';
    Object.keys(BENCH).forEach(id=>{const mod=moduleById(id);const f=moduleFitness(id);
      const row=el('div'); row.style.cssText='display:grid;grid-template-columns:130px 1fr 34px;align-items:center;gap:10px;font-size:13px';
      row.innerHTML='<span>'+(mod?mod.icon+' '+mod.name:id)+'</span><span class="xpbar" style="height:10px"><i style="width:'+f+'%"></i></span><span class="muted" style="text-align:right">'+f+'</span>';
      bars.append(row);});
    csCard.append(bars); m.append(csCard);

    // streak calendar (last 5 weeks)
    const cal=el('div','card'); cal.style.marginTop='16px'; cal.append(el('h3',null,'Last 35 days'));
    const grid=el('div','calendar');
    for(let k=34;k>=0;k--){const d=new Date();d.setDate(d.getDate()-k);
      const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      const n=S.activity[ds]||0; const cls=n>=3?'lvl3':n===2?'lvl2':n===1?'lvl1':'';
      const cell=el('div','cell '+cls); cell.title=ds+' · '+n+' session'+(n===1?'':'s'); grid.append(cell);}
    cal.append(grid); m.append(cal);

    // per-module table with trend sparklines
    function sparkline(vals,w,h){const c=el('canvas');w=w||100;h=h||26;c.width=w;c.height=h;c.style.cssText='width:'+w+'px;height:'+h+'px;vertical-align:middle';const ctx=c.getContext('2d');if(!vals||vals.length<2)return c;const mn=Math.min(...vals),mx=Math.max(...vals),rng=(mx-mn)||1;ctx.strokeStyle='#7c5cff';ctx.lineWidth=2;ctx.lineJoin='round';ctx.beginPath();vals.forEach((v,i)=>{const x=2+i/(vals.length-1)*(w-4),y=h-3-((v-mn)/rng)*(h-6);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();const lv=vals[vals.length-1],lx=w-2,ly=h-3-((lv-mn)/rng)*(h-6);ctx.fillStyle='#27d3a2';ctx.beginPath();ctx.arc(lx,ly,2.6,0,7);ctx.fill();return c;}
    const mods=Object.keys(S.modules).filter(id=>BENCH[id]!==undefined);
    const tcard=el('div','card'); tcard.style.marginTop='16px'; tcard.append(el('h3',null,'By exercise'));
    if(!mods.length){tcard.append(el('p','muted','No sessions yet — go train!'));}
    else{
      const tbl=el('table','stats');
      tbl.innerHTML='<tr><th>Exercise</th><th class="r">Plays</th><th class="r">Best</th><th class="r">Last</th><th>Trend</th></tr>';
      mods.forEach(id=>{const mod=moduleById(id);const r=S.modules[id];const tr=el('tr');
        tr.innerHTML='<td>'+(mod?mod.icon+' '+mod.name:id)+'</td><td class="r">'+r.sessions+'</td><td class="r">'+(r.best==null?'—':r.best)+'</td><td class="r">'+(r.last==null?'—':r.last)+'</td>';
        const td=el('td'); td.append(sparkline((r.history||[]).slice(-16).map(h=>h.score))); tr.append(td); tbl.append(tr);});
      tcard.append(tbl);
    }
    m.append(tcard);

    // achievements
    const ac=el('div','card'); ac.style.marginTop='16px'; ac.append(el('h3',null,'Achievements'));
    const ag=el('div','grid cols-2');
    ACHS.forEach(a=>{const got=S.achievements.includes(a.id);
      ag.append(el('div','ach '+(got?'':'locked'),'<div class="aic">'+a.ic+'</div><div><div class="an">'+a.n+'</div><div class="ad">'+a.d+'</div></div>'));});
    ac.append(ag); m.append(ac);
  }

  function screenAbout(){
    const m=$('#screen'); m.innerHTML='';
    m.append(el('h1',null,'<span style="font-size:22px">The Science (honest version)</span>'));

    const intro=el('div','card');
    intro.innerHTML='<h3>The uncomfortable truth</h3><p class="note">Most commercial “brain training” has a weak track record. The largest test of it — six weeks across <b>11,430 people</b> (Owen et al., <i>Nature</i>, 2010) — found people improved at the exact tasks they practised, but those gains <b>did not transfer</b> to general reasoning or memory. So Cortex won’t promise to raise your IQ. Instead it’s built around the few things that genuinely do compound.</p>';
    m.append(intro);

    const levers=el('div','card'); levers.style.marginTop='16px';
    levers.innerHTML='<h3>The two real levers</h3>'+
      '<p class="note"><b>1 · Durable knowledge (spaced repetition).</b> Two of the most reliable results in cognitive science: the <b>spacing effect</b> — you remember more when study is spread over time (Ebbinghaus, 1885) — and the <b>testing effect</b> — actively recalling beats re-reading (Roediger &amp; Karpicke, 2006). The Flashcards module runs an SM-2 schedule built on both. This is the part most likely to make you measurably “smarter” in a lasting way, because it builds <b>real knowledge</b>.</p>'+
      '<p class="note"><b>2 · Consistency.</b> A little, most days, beats the occasional marathon. The streak, XP, levels and daily plan are deliberate behavioural scaffolding — their only job is to get you back tomorrow.</p>';
    m.append(levers);

    const ex=el('div','card'); ex.style.marginTop='16px'; ex.append(el('h3',null,'Honest notes on each exercise'));
    const items=[
      ['🗂️ Flashcards (SRS)','<b>Strongest evidence here.</b> Spacing + retrieval practice is the closest thing to a free lunch in learning. Build your own decks for things you actually want to know — that’s where the real gains are.'],
      ['🔢 Dual N-Back','Trains <b>working memory</b> (holding and updating information). A famous study (Jaeggi et al., PNAS, 2008) reported fluid-intelligence gains, but later replications and meta-analyses (Melby-Lervåg &amp; Hulme) found it mostly improves the task itself, with little convincing transfer to general intelligence. Do it as a demanding focus workout you can measurably improve — not as an IQ pill.'],
      ['🧘 Meditation','Evidence is real but <b>moderate</b>: structured mindfulness shows small-to-moderate benefits for stress, anxiety and attention (e.g. Goyal et al., <i>JAMA Internal Medicine</i>, 2014). Best treated as attention and stress practice.'],
      ['➗ Mental Math','Arithmetic fluency is a <b>genuine, transferable skill</b>. Automating it frees working memory for harder thinking, and the practice sticks.'],
      ['🎨 Stroop','Measures <b>inhibitory control</b> — overriding the automatic urge to read the word (the Stroop effect, 1935). You’ll get faster; treat the score as a focus gauge.'],
      ['🔀 Task Switch','Measures <b>cognitive flexibility</b> via “switch cost” — you’re slower right after the rule changes. Gains are largely task-specific, but it’s a sharp attention drill.'],
      ['⚡ Reaction Time','A clean measure of <b>processing speed</b> — mostly a warm-up and a baseline to watch over time.'],
      ['📖 Vocabulary','Real knowledge, and a strong correlate of verbal ability. Words you miss become flashcards so they actually stick.']
    ];
    const ul=el('ul','note'); ul.style.cssText='margin:0;padding-left:18px';
    items.forEach(([t,d])=>{const li=el('li'); li.style.marginBottom='9px'; li.innerHTML='<b>'+t+'</b> — '+d; ul.append(li);});
    ex.append(ul); m.append(ex);

    const beats=el('div','card'); beats.style.marginTop='16px';
    beats.innerHTML='<h3>Things that beat any brain game</h3>'+
      '<p class="note">If your real goal is a sharper mind, the biggest levers aren’t games:</p>'+
      '<ul class="note" style="margin:0;padding-left:18px">'+
      '<li><b>Sleep</b> — the single most cost-effective cognitive enhancer. Memory is consolidated as you sleep; shortchanging it hits attention, learning and mood hard.</li>'+
      '<li><b>Aerobic exercise</b> — among the best-supported interventions for brain health and memory across the lifespan.</li>'+
      '<li><b>Learning genuinely hard things</b> — a language, an instrument, a craft. Difficulty and novelty drive real growth.</li>'+
      '<li><b>Reading widely</b> — builds knowledge and vocabulary, which is most of what “being smart” looks like day to day.</li>'+
      '<li><b>Protecting attention</b> — chronic stress and constant distraction quietly erode clear thinking.</li>'+
      '</ul>'+
      '<p class="note">Cortex can nudge a few of these — knowledge, a daily habit, a few minutes of calm. The rest is on you, and it matters more.</p>';
    m.append(beats);

    const foot=el('div','card'); foot.style.marginTop='16px';
    foot.innerHTML='<p class="note" style="margin:0">The <b>Cortex Score</b> is an in-app fitness number for these specific exercises. It is <b>not</b> an intelligence test and doesn’t predict one. The honest win condition: <b>train a little, most days</b>, and put the most weight on the flashcards. That’s it.</p>';
    m.append(foot);
  }

  function screenSettings(){
    const m=$('#screen'); m.innerHTML='';
    m.append(el('h1',null,'<span style="font-size:22px">Settings</span>'));
    const cp=el('div','card'); cp.style.marginBottom='16px'; cp.append(el('h3',null,'Preferences'));
    const prow=el('div','row'); prow.style.cssText='gap:10px;flex-wrap:wrap';
    const rm=el('button','btn-x',(S.settings.reducedMotion?'☑':'☐')+' Reduce motion');
    rm.onclick=()=>{S.settings.reducedMotion=!S.settings.reducedMotion;save();applyMotionPref();screenSettings();};
    const snd=el('button','btn-x',(S.settings.sound===false?'🔇 Sound off':'🔊 Sound on'));
    snd.onclick=()=>{S.settings.sound=(S.settings.sound===false);save();if(S.settings.sound!==false)Sound.tick();screenSettings();};
    const intro=el('button','btn-x ghost','↺ Replay intro'); intro.onclick=()=>showOnboarding();
    prow.append(rm,snd,intro); cp.append(prow);
    if(S.settings.focus&&S.settings.focus!=='all')cp.append(el('div','note','Current focus: <b>'+S.settings.focus+'</b> — your daily plan includes an extra '+S.settings.focus+' exercise.'));
    m.append(cp);
    const c=el('div','card');
    c.innerHTML='<h3>Your data</h3><p class="note">Everything is stored locally in this browser only — nothing is uploaded. '+
      'Export a backup or move it to another device.</p>';
    const row=el('div','row'); row.style.gap='10px'; row.style.flexWrap='wrap';
    const exp=el('button','btn-x','⬇ Export backup');
    exp.onclick=()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
      const a=el('a');a.href=URL.createObjectURL(blob);a.download='cortex-backup-'+todayStr()+'.json';a.click();};
    const imp=el('button','btn-x','⬆ Import backup');
    const file=el('input');file.type='file';file.accept='application/json';file.style.display='none';
    imp.onclick=()=>file.click();
    file.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
      r.onload=()=>{try{S=Object.assign(defaultState(),JSON.parse(r.result));checkAchievements(true);save();paintTop();go('#/home');toast('Backup imported');}catch(err){toast('Could not read that file');}};r.readAsText(f);};
    const reset=el('button','btn-x ghost','🗑 Reset everything');
    reset.onclick=()=>{if(confirm('Erase all Cortex progress on this device? This cannot be undone.')){localStorage.removeItem(KEY);S=defaultState();save();paintTop();go('#/home');toast('Progress reset');}};
    row.append(exp,imp,reset,file); c.append(row); m.append(c);

    const c2=el('div','card');c2.style.marginTop='16px';
    c2.innerHTML='<h3>About</h3><p class="note">Cortex v0.1 · part of the Monday Jeffrey desktop. '+
      'Built offline, no accounts, no tracking. New exercises are being added regularly.</p>';
    m.append(c2);
  }

  /* ---------- router ---------- */
  function go(hash){if(location.hash===hash)route();else location.hash=hash;}
  function route(){
    ensureDaily();
    const h=location.hash||'#/home';
    const parts=h.replace(/^#\//,'').split('/'); // ['train','nback']
    // tab highlight
    document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.getAttribute('data-go')==='#/'+parts[0]||(parts[0]===''&&a.getAttribute('data-go')==='#/home')));
    window.scrollTo(0,0);
    switch(parts[0]){
      case '':case 'home':return screenHome();
      case 'train':return parts[1]?screenModule(parts[1]):screenTrain();
      case 'stats':return screenStats();
      case 'about':return screenAbout();
      case 'settings':return screenSettings();
      default:return screenHome();
    }
  }

  // delegate [data-go] clicks anywhere
  document.addEventListener('click',e=>{const t=e.target.closest('[data-go]');if(t){e.preventDefault();go(t.getAttribute('data-go'));}});
  window.addEventListener('hashchange',route);

  /* ---------- preferences + onboarding (first run) ---------- */
  function applyMotionPref(){document.body.classList.toggle('reduce-motion',!!(S.settings&&S.settings.reducedMotion));}
  function showOnboarding(){
    if(document.querySelector('.ob-overlay'))return;
    const ov=el('div','ob-overlay'); const card=el('div','ob-card'); let focus='all';
    card.innerHTML='<h1>Welcome to Cortex 🧠</h1>'+
      '<p class="note">A little brain-training gym that runs entirely in your browser — 100% offline, no account.</p>'+
      '<p class="note">Straight up: most “brain games” mostly make you better at the game. So Cortex leans on the two things that genuinely compound — <b>learning real things</b> (spaced-repetition flashcards) and <b>showing up daily</b>. The XP, levels and streak exist to make the habit stick.</p>'+
      '<p class="note" style="margin-top:10px"><b>What do you want to lean into?</b></p>';
    const opts=el('div','ob-opts');
    [['all','A bit of everything','Balanced daily mix (recommended)'],['memory','Memory','Dual N-Back + flashcards'],['focus','Focus & calm','Meditation + attention games'],['knowledge','Knowledge','Flashcards + vocabulary']]
      .forEach(([k,t,d])=>{const o=el('div','ob-opt'+(k==='all'?' sel':'')); o.tabIndex=0; o.innerHTML='<b>'+t+'</b><span>'+d+'</span>';
        const sel=()=>{focus=k;[...opts.children].forEach(c=>c.classList.remove('sel'));o.classList.add('sel');};
        o.onclick=sel; o.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();sel();}}; opts.append(o);});
    card.append(opts);
    const start=el('button','btn-x primary','Start training →'); start.style.cssText='width:100%;justify-content:center;font-size:16px';
    start.onclick=()=>{S.settings.onboarded=true;S.settings.focus=focus;S.daily.date=null;save();ensureDaily();ov.remove();go('#/home');route();};
    card.append(start);
    card.append(el('div','note','You can read the honest science behind each exercise on the <b>Science</b> tab anytime.'));
    ov.append(card); document.body.append(ov); start.focus();
  }

  // boot
  applyMotionPref();
  paintTop(); ensureDaily(); checkAchievements(true); route();
  if(!(S.settings&&S.settings.onboarded)) showOnboarding();
  // register service worker → installable + works fully offline (scope /cortex/ only)
  if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
  </script>
</body>
</html>
