    function setGpsButtons(on){
      var go = document.getElementById("gpsGo"), set = document.getElementById("gpsSet");
      if (go)  go.disabled  = !on;
      if (set) set.disabled = !on;
    }
    function placePin(){
      if (!gpsMap || !pick) return;
      if (!gpsMarker) gpsMarker = new maplibregl.Marker({ color:"#f2b134" });
      gpsMarker.setLngLat([pick.lng, pick.lat]).addTo(gpsMap);
    }
    function gotoCity(ct){
      pick = { lng:ct.lng, lat:ct.lat, label:ct.n };
      if (gpsMap){ gpsMap.flyTo({ center:[ct.lng, ct.lat], zoom:12.5, speed:1.8 }); placePin(); }
      setGpsButtons(true);
      var h = document.getElementById("gpsHint"); if (h) h.textContent = ct.n + " — Drive here, or Set as destination";
    }
    function onGpsClick(e){
      pick = { lng:e.lngLat.lng, lat:e.lngLat.lat, label:"Dropped pin" };
      placePin(); setGpsButtons(true);
      var h = document.getElementById("gpsHint"); if (h) h.textContent = "Pin dropped — Drive here, or Set as destination";
    }
    function openMap(){
      mapOpen = true; keys = Object.create(null);
      var el = document.getElementById("gps"); if (el) el.style.display = "block";
      pick = null; setGpsButtons(false);
      var h = document.getElementById("gpsHint"); if (h) h.textContent = "Tap the map, or pick a city, then Drive there";
      if (gpsMarker) gpsMarker.remove();
      var here = toLngLat();
      if (!gpsMap){
        gpsMap = new maplibregl.Map({
          container:"gpsMap", style:"https://tiles.openfreemap.org/styles/liberty",
          center: here, zoom: 11.5, attributionControl: true, fadeDuration: 0
        });
        gpsMap.addControl(new maplibregl.NavigationControl({ showCompass:false }), "bottom-right");
        gpsMap.on("load", styleGps);
        gpsMap.on("styledata", styleGps);
        gpsMap.on("click", onGpsClick);
        gpsMap.on("error", function(){});
      } else {
        gpsMap.jumpTo({ center: here, zoom: 11.5 });
      }
      var m = gpsMap; setTimeout(function(){ try{ m.resize(); }catch(_){} }, 40);
    }
    function closeMap(){ mapOpen = false; var el = document.getElementById("gps"); if (el) el.style.display = "none"; }
    function toggleMap(){ if (mapOpen) closeMap(); else openMap(); }

    // dark, label-keeping style for the travel map (its own instance — new UI,
    // not the game world, so it doesn't touch the in-game graphics)
    function styleGps(){
      if (gpsStyled || !gpsMap || !gpsMap.isStyleLoaded()) return;
      var layers = (gpsMap.getStyle() && gpsMap.getStyle().layers) || []; if (!layers.length) return;
      gpsStyled = true;
      layers.forEach(function(L){
        var id=L.id, sl=L["source-layer"], t=L.type;
        try{
          if (t==="background"){ gpsMap.setPaintProperty(id,"background-color","#0b0e18"); return; }
          if (t==="fill-extrusion"){ gpsMap.setLayoutProperty(id,"visibility","none"); return; }
          if (t==="symbol"){
            if (sl==="place" || sl==="transportation_name"){
              gpsMap.setPaintProperty(id,"text-color","#dfe6f5");
              try{ gpsMap.setPaintProperty(id,"text-halo-color","#05070d"); gpsMap.setPaintProperty(id,"text-halo-width",1.4); }catch(_){}
            } else gpsMap.setLayoutProperty(id,"visibility","none");
            return;
          }
          if (t==="fill"){
            gpsMap.setPaintProperty(id,"fill-color", sl==="water" ? "#0c1a2e" : (sl==="building" ? "#161c2b" : "#10141f"));
            return;
          }
          if (t==="line"){
            if (sl==="transportation"){
              var c = /casing|outline/.test(id) ? "#05070d"
                    : /motorway|trunk|primary/.test(id) ? "#f2b134"
                    : /secondary|tertiary/.test(id) ? "#7c89aa" : "#3a445e";
              gpsMap.setPaintProperty(id,"line-color",c);
            } else gpsMap.setPaintProperty(id,"line-color","#1c2230");
          }
        }catch(_){}
      });
    }

    // rebase the whole local frame to a new lng/lat — this is what makes ALL of
    // Australia playable from a single flat-earth metre origin
    function teleportTo(lng, lat, label){
      ORIGIN.lng = lng; ORIGIN.lat = lat;
      DEG_LNG = 111320 * Math.cos(lat*Math.PI/180);
      car.x = 0; car.y = 0; car.vx = 0; car.vy = 0; car.heading = 0;
      zoomBias = 0; viewZoom = CFG.baseZoom;
      obstacles.length = 0; peds.length = 0; cops.length = 0; traffic.length = 0; marks.length = 0; lastSkid = null; buildRender.length = 0; roads.length = 0; roadBufReady = false;
      heat = 0; copLoseT = 0; setWanted(0);
      dest = null; job = null; ppmZoom = -1;
      prev.lng = lng; prev.lat = lat; prev.zoom = CFG.baseZoom;
      map.jumpTo({ center:[lng, lat], zoom:CFG.baseZoom, bearing:0 });
      if (mini) mini.jumpTo({ center:[lng, lat], zoom:CFG.miniZoom, bearing:0 });
      lastStreet = ""; var se = document.getElementById("street"); if (se) se.style.opacity = 0;
      updateGuide(); renderJob(); clearShake();
      flash("Now driving: " + (label || "new location"));
    }
    function setDestination(lng, lat, label, isJob){
      dest = { lng:lng, lat:lat, label:label || "destination", job: !!isJob };
      updateGuide();
      if (!isJob) flash("Destination set" + (label ? ": " + label : ""));
    }

    // HUD distance + bearing arrow, and a dot on the minimap, toward the dest
    function updateGuide(){
      var g = document.getElementById("gpsGuide"), md = document.getElementById("miniDest");
      if (!dest){ if (g) g.style.display="none"; if (md) md.style.display="none"; return; }
      var dEast  = (dest.lng-ORIGIN.lng)*DEG_LNG - car.x;
      var dNorth = (dest.lat-ORIGIN.lat)*DEG_LAT - car.y;
      var distM = Math.sqrt(dEast*dEast + dNorth*dNorth);
      if (distM < 28 && !dest.job){    // job deliveries clear via the mission system, not here
        flash("Destination reached" + (dest.label ? ": " + dest.label : ""));
        dest = null; if (g) g.style.display="none"; if (md) md.style.display="none"; return;
      }
      if (g){
        g.style.display = "flex";
        var ang = Math.atan2(dEast, dNorth) * 57.2958;       // 0 = north/up, +CW
        var arr = g.querySelector(".arr"); if (arr) arr.style.transform = "rotate(" + ang.toFixed(1) + "deg)";
        var d = g.querySelector(".dst"); if (d) d.textContent = distM>=1000 ? (distM/1000).toFixed(distM>=10000?0:1)+" km" : Math.round(distM)+" m";
      }
      if (md && miniOn && miniReady && mini){
        var mm = document.getElementById("minimap"), sz = mm ? mm.clientWidth : 208, cc = sz/2;
        try{
          var here = toLngLat();
          var a = mini.project(here), b = mini.project([here[0], here[1]+0.0009]);
          var ppm = Math.sqrt((b.x-a.x)*(b.x-a.x)+(b.y-a.y)*(b.y-a.y)) / (0.0009*DEG_LAT);
          var px = cc + dEast*ppm, py = cc - dNorth*ppm;
          var ex = px-cc, ey = py-cc, rr = Math.sqrt(ex*ex+ey*ey), lim = cc-9;
          if (rr > lim && rr > 0){ px = cc + ex/rr*lim; py = cc + ey/rr*lim; }   // clamp to the rim if off-view
          md.style.left = px+"px"; md.style.top = py+"px"; md.style.display = "block";
        }catch(_){ md.style.display = "none"; }
      } else if (md){ md.style.display = "none"; }
    }

    // ---------- missions (goal 6: a gameplay loop that keeps free-roam) ----------
    // Optional jobs layered on the open world — press J when idle to take one,
    // free-roam any time you don't. Two kinds for now, both reusing systems we
    // already have: DELIVERY (drive to a GPS-guided drop-off before the timer)
    // and GETAWAY (heat spikes to ~3 stars — shake the cops before the timer).
    var job = null, cash = 0, streak = 0, bestStreak = 0, totalJobs = 0;

    function jobKey(){
      if (job) flash("On the job: " + job.label);   // J while busy = re-announce (abandon via Esc menu)
      else startJob();
    }
    function startJob(){
      if (job) return;
      if (Math.random() < 0.66) startDelivery(); else startGetaway();
    }
    function startDelivery(){
      var ang = Math.random()*6.2832, d = 300 + Math.random()*600;        // 300–900 m away
      var tlng = ORIGIN.lng + (car.x + Math.cos(ang)*d)/DEG_LNG;
      var tlat = ORIGIN.lat + (car.y + Math.sin(ang)*d)/DEG_LAT;
      var reward = Math.round((130 + d*0.8)/10)*10;
      var time = Math.round(d/20 + 20);                                    // generous, but a real deadline
      job = { type:"delivery", label:"Deliver the package", tlng:tlng, tlat:tlat, timeLeft:time, timeMax:time, reward:reward };
      setDestination(tlng, tlat, "Drop-off", true);                       // isJob → guidance won't auto-clear
      flash("New job: deliver the package (" + Math.round(d) + " m)");
      renderJob();
    }
    function startGetaway(){
      if (!copsOn) setCops(true);                                         // a getaway needs cops
      heat = 3.2;                                                         // ~3 stars on you now
      job = { type:"getaway", label:"Lose the cops!", timeLeft:45, timeMax:45, reward:650 };
      flash("New job: shake the cops!");
      renderJob();
    }
    function completeJob(){
      if (!job) return;
      streak++; if (streak > bestStreak) bestStreak = streak;
      var mult = Math.min(3, 1 + (streak-1)*0.2);            // streak bonus: x1, x1.2, x1.4 … capped x3
      var pay = Math.round(job.reward * mult);
      cash += pay; totalJobs++;
      flash("Job complete!  +$" + pay + (streak > 1 ? "   streak ×" + streak : ""));
      if (job.type === "delivery"){ dest = null; updateGuide(); }
      job = null; renderJob(); renderCash(); saveGame();
    }
    function failJob(reason){
      if (!job) return;
      if (job.type === "delivery"){ dest = null; updateGuide(); }
      job = null; streak = 0; renderJob(); renderCash();      // a fail breaks the streak
      flash("Job failed" + (reason ? ": " + reason : ""));
    }
    function updateJob(dt){
      if (!job) return;
      job.timeLeft -= dt;
      if (job.timeLeft <= 0){ failJob("out of time"); return; }
      if (job.type === "delivery"){
        var dx = (job.tlng-ORIGIN.lng)*DEG_LNG - car.x;
        var dy = (job.tlat-ORIGIN.lat)*DEG_LAT - car.y;
        if (dx*dx + dy*dy < CFG.jobArriveR*CFG.jobArriveR){ completeJob(); return; }
      } else if (job.type === "getaway"){
        if (wantedFromHeat(heat) <= 0){ completeJob(); return; }          // shook them
      }
      tickJob();
    }
    function renderCash(){ var el = document.getElementById("cash"); if (el) el.innerHTML = "$" + cash + (streak > 1 ? ' <b>×' + streak + '</b>' : ''); }
    function loadSave(){
      try { var s = JSON.parse(localStorage.getItem("drive_save") || "{}");
        if (typeof s.cash === "number") cash = s.cash;
        if (typeof s.totalJobs === "number") totalJobs = s.totalJobs;
        if (typeof s.bestStreak === "number") bestStreak = s.bestStreak;
      } catch(_){}
    }
    function saveGame(){
      try { localStorage.setItem("drive_save", JSON.stringify({ cash:cash, totalJobs:totalJobs, bestStreak:bestStreak })); } catch(_){}
    }
    function renderJob(){
      var el = document.getElementById("job"); if (!el) return;
      if (!job){ el.classList.add("idle"); el.innerHTML = '<div class="jhint">Press <b>J</b> for a job &middot; free-roam anytime</div>'; return; }
      el.classList.remove("idle");
      el.innerHTML = '<div class="jtitle">' + job.label + '</div>' +
        '<div class="jbar"><i></i></div>' +
        '<div class="jmeta"><span class="jtime"></span><span>$' + job.reward + '</span></div>';
      job._bar = el.querySelector(".jbar i"); job._time = el.querySelector(".jtime");
      tickJob();
    }
    function tickJob(){                                                   // cheap per-frame update (no innerHTML churn)
      if (!job || !job._bar) return;
      job._bar.style.width = (Math.max(0, Math.min(1, job.timeLeft/job.timeMax))*100).toFixed(1) + "%";
      var t = Math.max(0, job.timeLeft), mm = Math.floor(t/60), ss = Math.floor(t%60);
      job._time.textContent = mm + ":" + (ss<10?"0":"") + ss;
    }

    // ---------- skidmarks (drift juice for goal 1: fun driving) ----------
    // Dark tyre marks laid under the rear wheels whenever the car slides sideways
    // (hard cornering / handbrake drift), fading over a few seconds. They live at
    // world positions and are redrawn each frame under the cars — no map restyle.
    function updateSkid(dt){
      for (var i=marks.length-1; i>=0; i--){ marks[i].life -= dt; if (marks[i].life <= 0) marks.splice(i,1); }
      var spd = Math.sqrt(car.vx*car.vx + car.vy*car.vy);
      var fx = Math.sin(car.heading), fy = Math.cos(car.heading), rx = Math.cos(car.heading), ry = -Math.sin(car.heading);
      if (spd > 4 && Math.abs(car.vx*rx + car.vy*ry) > CFG.skidSlip){     // sliding sideways → lay rubber
        var axc = car.x - fx*4, ayc = car.y - fy*4;                       // rear axle centre
        var lx = axc - rx*2.6, ly = ayc - ry*2.6;                         // left rear wheel
        var wx = axc + rx*2.6, wy = ayc + ry*2.6;                         // right rear wheel
        if (lastSkid){
          marks.push({ ax:lastSkid.lx, ay:lastSkid.ly, bx:lx, by:ly, life:CFG.markLife });
          marks.push({ ax:lastSkid.wx, ay:lastSkid.wy, bx:wx, by:wy, life:CFG.markLife });
          if (marks.length > CFG.maxMarks) marks.splice(0, marks.length - CFG.maxMarks);
        }
        lastSkid = { lx:lx, ly:ly, wx:wx, wy:wy };
      } else lastSkid = null;                                             // gripping again — break the trail
    }
    function drawMarks(ppm){
      if (!marks.length) return;
      var W = entCanvas.width, H = entCanvas.height, cx = W*0.5, cy = H*0.5, mar = 40;
      entCtx.lineWidth = Math.max(1.5, ppm*0.5); entCtx.lineCap = "round";
      for (var i=0; i<marks.length; i++){
        var m = marks[i];
        var ax = cx+(m.ax-car.x)*ppm, ay = cy-(m.ay-car.y)*ppm, bx = cx+(m.bx-car.x)*ppm, by = cy-(m.by-car.y)*ppm;
        if ((ax<-mar&&bx<-mar)||(ax>W+mar&&bx>W+mar)||(ay<-mar&&by<-mar)||(ay>H+mar&&by>H+mar)) continue;
        entCtx.strokeStyle = "rgba(0,0,0," + (0.55*(m.life/CFG.markLife)).toFixed(3) + ")";
        entCtx.beginPath(); entCtx.moveTo(ax,ay); entCtx.lineTo(bx,by); entCtx.stroke();
      }
      entCtx.lineCap = "butt";
    }

    // ---------- screen shake on impact (goal 1 feel) ----------
    // A sharp one-frame speed drop = a crash (braking/drag can't cancel that much
    // in 16 ms). Jitter the world layers (map + entity/skid canvas + FX) with a
    // CSS transform while the player car stays centred — reads as a camera shake.
    function applyShake(dt){
      if (shake > peakShake) peakShake = shake;
      if (shake > 0.3){
        var dx = (Math.random()*2-1)*shake, dy = (Math.random()*2-1)*shake;
        var tr = "translate(" + dx.toFixed(1) + "px," + dy.toFixed(1) + "px)";
        if (!mapEl) mapEl = document.getElementById("map");
        if (mapEl) mapEl.style.transform = tr;
        if (entCanvas) entCanvas.style.transform = tr;
        if (fxCanvas) fxCanvas.style.transform = tr;
        if (lightCanvas) lightCanvas.style.transform = tr;
        if (buildCanvas) buildCanvas.style.transform = tr;
        if (roadCanvas) roadCanvas.style.transform = tr;
        if (bloomCanvas) bloomCanvas.style.transform = tr;
        shake *= Math.exp(-CFG.shakeDecay*dt);
      } else if (shake !== 0){
        shake = 0;
        if (mapEl) mapEl.style.transform = "";
        if (entCanvas) entCanvas.style.transform = "";
        if (fxCanvas) fxCanvas.style.transform = "";
        if (lightCanvas) lightCanvas.style.transform = "";
        if (buildCanvas) buildCanvas.style.transform = "";
        if (roadCanvas) roadCanvas.style.transform = "";
        if (bloomCanvas) bloomCanvas.style.transform = "";
      }
    }
    function clearShake(){
      shake = 0; prevSpeed = 0;
      if (!mapEl) mapEl = document.getElementById("map");
      if (mapEl) mapEl.style.transform = "";
      if (entCanvas) entCanvas.style.transform = "";
      if (fxCanvas) fxCanvas.style.transform = "";
      if (lightCanvas) lightCanvas.style.transform = "";
      if (buildCanvas) buildCanvas.style.transform = "";
      if (roadCanvas) roadCanvas.style.transform = "";
      if (bloomCanvas) bloomCanvas.style.transform = "";
    }

    // ---------- road surfaces (GRAPHICS G3) ----------
    // Asphalt ribbons (width by road class) + dashed centre-line lane markings,
    // drawn from the WIDE road-centreline sample (so it can fill a margin). Rendered
    // to an OFFSCREEN buffer re-drawn only when the camera moves a chunk (RM px) or
    // zoom changes, then blitted+offset each frame → 60fps. Gated by gfxHigh.
    var roadCanvas, roadCtx, roadBuf, roadBufCtx, roadBufOX=0, roadBufOY=0, roadBufPpm=0, roadBufReady=false, roadBufCount=0, RM=256;
    function initRoad(){
      roadCanvas = document.getElementById("road"); if (!roadCanvas) return;
      roadCtx = roadCanvas.getContext("2d");
      roadBuf = document.createElement("canvas"); roadBufCtx = roadBuf.getContext("2d");
      resizeRoad();
    }
    function resizeRoad(){
      if (!roadCanvas) return;
      roadCanvas.width = window.innerWidth; roadCanvas.height = window.innerHeight;
      roadBuf.width = window.innerWidth + RM*2; roadBuf.height = window.innerHeight + RM*2;
      roadBufReady = false;
    }
    function roadVisible(r, n, bcx, bcy, ppm, BW, BH){     // bbox cull against the buffer
      var minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
      for (var i=0;i<n;i++){ var sx=bcx+(r[i*2]-car.x)*ppm, sy=bcy-(r[i*2+1]-car.y)*ppm;
        if(sx<minx)minx=sx; if(sx>maxx)maxx=sx; if(sy<miny)miny=sy; if(sy>maxy)maxy=sy; }
      return !(maxx<0||minx>BW||maxy<0||miny>BH);
    }
    function strokeRoad(ctx, r, n, bcx, bcy, ppm){
      ctx.beginPath();
      for (var i=0;i<n;i++){ var sx=bcx+(r[i*2]-car.x)*ppm, sy=bcy-(r[i*2+1]-car.y)*ppm; if(i===0)ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy); }
    }
    function renderRoadBuffer(ppm){
      var ctx=roadBufCtx, BW=roadBuf.width, BH=roadBuf.height;
      ctx.clearRect(0,0,BW,BH);
      var bcx=RM+window.innerWidth/2, bcy=RM+window.innerHeight/2;
      roadBufOX=car.x; roadBufOY=car.y; roadBufPpm=ppm; roadBufReady=true; roadBufCount=roads.length;
      var rd=roads, b, r, n;
      ctx.lineCap="round"; ctx.lineJoin="round";
      for (b=0;b<rd.length;b++){ r=rd[b].pts; n=r.length>>1; if(n<2||n>2000) continue;        // asphalt
        if(!roadVisible(r,n,bcx,bcy,ppm,BW,BH)) continue;
        strokeRoad(ctx,r,n,bcx,bcy,ppm);
        ctx.lineWidth=(rd[b].major?10:6)*ppm; ctx.strokeStyle=rd[b].major?"#293247":"#212838"; ctx.stroke();
      }
      ctx.setLineDash([Math.max(4,ppm*4), Math.max(5,ppm*6)]);                                  // dashed centre line
      ctx.strokeStyle="#c7a94e"; ctx.lineWidth=Math.max(1,ppm*0.42);
      for (b=0;b<rd.length;b++){ if(!rd[b].major) continue; r=rd[b].pts; n=r.length>>1; if(n<2||n>2000) continue;
        if(!roadVisible(r,n,bcx,bcy,ppm,BW,BH)) continue;
        strokeRoad(ctx,r,n,bcx,bcy,ppm); ctx.stroke();
      }
      ctx.setLineDash([]);
    }
    function drawRoads(ppm){
      if (!roadCtx) return;
      var W=roadCanvas.width, H=roadCanvas.height;
      if (!roadBufReady || Math.abs(ppm-roadBufPpm)>1e-3 ||
          Math.abs(car.x-roadBufOX)*ppm > RM-40 || Math.abs(car.y-roadBufOY)*ppm > RM-40) renderRoadBuffer(ppm);
      var sx=RM+(car.x-roadBufOX)*ppm, sy=RM-(car.y-roadBufOY)*ppm;
      roadCtx.clearRect(0,0,W,H);
      roadCtx.drawImage(roadBuf, sx, sy, W, H, 0, 0, W, H);
    }

    // ---------- pseudo-3D buildings (GRAPHICS G1) ----------
    // Extrude the building footprints we sample (a wider, capped set in
    // buildRender) into chunky 2.5D blocks: ground shadow → shaded walls rising
    // toward a fixed top-left "sun" → lit roof + edge highlight. Drawn live each
    // frame on #build (under the cars), culled to on-screen + capped for 60fps.
    // (The offscreen-buffer trick can't fill a margin — the main map only returns
    // ON-screen footprints — so we redraw the visible set instead.)
    var buildCanvas, buildCtx, buildRender = [], bpx = new Float64Array(600), bpy = new Float64Array(600);
    function initBuild(){
      buildCanvas = document.getElementById("build"); if (!buildCanvas) return;
      buildCtx = buildCanvas.getContext("2d"); resizeBuild();
    }
    function resizeBuild(){ if (buildCanvas){ buildCanvas.width = window.innerWidth; buildCanvas.height = window.innerHeight; } }
    // hide MapLibre's flat building fill (opacity 0 keeps it queryable for
    // collision) so only our 3D extrusion shows; restore it on Graphics: LOW
    function setMapBuildings(show){
      for (var i=0;i<buildingLayers.length;i++){ try{ map.setPaintProperty(buildingLayers[i], "fill-opacity", show?1:0); }catch(_){} }
    }
    function refreshBuildings(){
      if (!buildingLayers.length) return;
      var feats; try { feats = map.queryRenderedFeatures({ layers: buildingLayers }); } catch(_){ return; }
      var out = [];
      for (var f=0; f<feats.length; f++){
        var g = feats[f].geometry; if (!g) continue;
        var polys = g.type==="Polygon" ? [g.coordinates] : g.type==="MultiPolygon" ? g.coordinates : null;
        if (!polys) continue;
        for (var p=0; p<polys.length; p++){
          var ring = polys[p][0]; if (!ring || ring.length < 4) continue;
          var flat = new Float64Array(ring.length*2);
          for (var c=0; c<ring.length; c++){ flat[c*2]=(ring[c][0]-ORIGIN.lng)*DEG_LNG; flat[c*2+1]=(ring[c][1]-ORIGIN.lat)*DEG_LAT; }
          out.push(flat);
        }
      }
      if (out.length > 140){     // keep the nearest ~140 footprints to the car
        out.sort(function(a,b){ return ((a[0]-car.x)*(a[0]-car.x)+(a[1]-car.y)*(a[1]-car.y)) - ((b[0]-car.x)*(b[0]-car.x)+(b[1]-car.y)*(b[1]-car.y)); });
        out.length = 140;
      }
      buildRender = out;
    }
    function drawBuilding(ctx, n, hx, hy, seed){
      var i, j, x, y;
      ctx.beginPath(); ctx.moveTo(bpx[0]+2, bpy[0]+3);                  // soft ground shadow (down-right)
      for (i=1;i<n;i++) ctx.lineTo(bpx[i]+2, bpy[i]+3); ctx.closePath();
      ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.fill();
      ctx.fillStyle = "#202840";                                       // walls (footprint → roof)
      for (i=0;i<n;i++){ j=(i+1)%n;
        ctx.beginPath(); ctx.moveTo(bpx[i],bpy[i]); ctx.lineTo(bpx[j],bpy[j]); ctx.lineTo(bpx[j]+hx,bpy[j]+hy); ctx.lineTo(bpx[i]+hx,bpy[i]+hy); ctx.closePath(); ctx.fill();
      }
      var rminx=1e9,rmaxx=-1e9,rminy=1e9,rmaxy=-1e9;                    // lit roof + edge highlight (+ track bbox)
      ctx.beginPath(); ctx.moveTo(bpx[0]+hx,bpy[0]+hy);
      for (i=0;i<n;i++){ x=bpx[i]+hx; y=bpy[i]+hy; if(i) ctx.lineTo(x,y); if(x<rminx)rminx=x; if(x>rmaxx)rmaxx=x; if(y<rminy)rminy=y; if(y>rmaxy)rmaxy=y; }
      ctx.closePath();
      ctx.fillStyle = "#2e3954"; ctx.fill();
      var nh = Math.sin(seed*0.7)*4096; nh -= Math.floor(nh);            // ~18% of buildings get a neon shopfront edge
      if (nh < 0.18){ ctx.strokeStyle = nh<0.06 ? "#ff5cae" : nh<0.12 ? "#41e0ff" : "#ffc94e"; ctx.lineWidth = 1.6; }
      else { ctx.strokeStyle = "#414f74"; ctx.lineWidth = 1; }
      ctx.stroke();
      // window lights on the roof — deterministic per building+cell so they never flicker
      var bw=rmaxx-rminx, bh=rmaxy-rminy;
      if (bw>11 && bh>11){
        var cols=Math.max(1,Math.min(4,(bw/10)|0)), rows=Math.max(1,Math.min(4,(bh/10)|0));
        var ds=Math.max(1.3, Math.min(2.4, bw/cols*0.16)), cxi, cyi, s;
        for (cyi=0;cyi<rows;cyi++) for (cxi=0;cxi<cols;cxi++){
          s = Math.sin(seed + cxi*12.9898 + cyi*78.233)*43758.5453; s -= Math.floor(s);
          if (s < 0.5) continue;                                       // ~half the windows are dark
          ctx.fillStyle = s>0.86 ? "rgba(176,206,255,0.85)" : "rgba(255,205,128,0.9)";   // mostly warm, a few cool
          ctx.fillRect(rminx + bw*(cxi+0.5)/cols - ds*0.5, rminy + bh*(cyi+0.5)/rows - ds*0.5, ds, ds);
        }
      }
    }
    function drawBuildings(ppm){
      if (!buildCtx) return;
      var W = buildCanvas.width, H = buildCanvas.height, cx = W*0.5, cy = H*0.5, mar = 30;
      buildCtx.clearRect(0,0,W,H);
      var rd = buildRender, b, n, i, minx, maxx, miny, maxy, sx, sy, r;
      for (b=0; b<rd.length; b++){
        r = rd[b]; n = r.length>>1; if (n < 3 || n > 300) continue;
        minx=1e9; maxx=-1e9; miny=1e9; maxy=-1e9;
        for (i=0;i<n;i++){
          sx = cx+(r[i*2]-car.x)*ppm; sy = cy-(r[i*2+1]-car.y)*ppm;
          bpx[i]=sx; bpy[i]=sy;
          if(sx<minx)minx=sx; if(sx>maxx)maxx=sx; if(sy<miny)miny=sy; if(sy>maxy)maxy=sy;
        }
        if (maxx<-mar||minx>W+mar||maxy<-mar||miny>H+mar) continue;     // cull off-screen
        var seed = r[0]*131.7 + r[1]*57.3;                             // stable per-building seed (from world coords)
        var hh = 5 + (Math.abs(seed|0) % 18);                          // deterministic per-building height
        var hp = Math.max(4, Math.min(22, hh*ppm*0.13));
        drawBuilding(buildCtx, n, -hp*0.45, -hp, seed);
      }
    }

    // ---------- night lighting (GRAPHICS G2): additive light layer ----------
    // Headlight cones + ground-glow pools for every car (player/traffic/cops) and
    // pulsing red/blue cop splashes, drawn additively on #light (under the cars) so
    // the dark night map lights up where vehicles are. Gated by the gfxHigh toggle.
    var lightCanvas, lightCtx;
    function initLight(){
      lightCanvas = document.getElementById("light"); if (!lightCanvas) return;
      lightCtx = lightCanvas.getContext("2d");
      resizeLight();
    }
    function resizeLight(){ if (lightCanvas){ lightCanvas.width = window.innerWidth; lightCanvas.height = window.innerHeight; } }
    function lcone(sx, sy, heading, len, half, col){          // forward-projecting headlight cone
      lightCtx.save(); lightCtx.translate(sx, sy); lightCtx.rotate(heading);
      var g = lightCtx.createRadialGradient(0, -len*0.15, 2, 0, -len*0.45, len);
      g.addColorStop(0, col); g.addColorStop(1, "rgba(0,0,0,0)");
      lightCtx.fillStyle = g;
      lightCtx.beginPath(); lightCtx.moveTo(0,-3); lightCtx.lineTo(-half,-len); lightCtx.lineTo(half,-len); lightCtx.closePath(); lightCtx.fill();
      lightCtx.restore();
    }
    function lpool(sx, sy, r, col){                            // soft radial glow
      var g = lightCtx.createRadialGradient(sx, sy, 1, sx, sy, r);
      g.addColorStop(0, col); g.addColorStop(1, "rgba(0,0,0,0)");
      lightCtx.fillStyle = g; lightCtx.beginPath(); lightCtx.arc(sx, sy, r, 0, 6.2832); lightCtx.fill();
    }
    function drawLights(ppm){
      if (!lightCtx) return;
      var W = lightCanvas.width, H = lightCanvas.height, cx = W*0.5, cy = H*0.5, mar = 70;
      lightCtx.clearRect(0,0,W,H);
      lightCtx.globalCompositeOperation = "lighter";
      var cl = ppm*30, ch = ppm*9, pr = ppm*7, i, e, sx, sy;
      lcone(cx, cy, car.heading, cl, ch, "rgba(255,238,196,0.22)");      // player headlights
      lpool(cx, cy, pr, "rgba(255,240,210,0.10)");
      for (i=0; i<traffic.length; i++){ e=traffic[i]; sx=cx+(e.x-car.x)*ppm; sy=cy-(e.y-car.y)*ppm;
        if (sx<-mar||sx>W+mar||sy<-mar||sy>H+mar) continue;
        lcone(sx, sy, e.heading, cl*0.8, ch*0.8, "rgba(245,235,200,0.15)");
        lpool(sx, sy, pr*0.8, "rgba(240,235,210,0.07)");
      }
      for (i=0; i<cops.length; i++){ e=cops[i]; sx=cx+(e.x-car.x)*ppm; sy=cy-(e.y-car.y)*ppm;
        if (sx<-mar||sx>W+mar||sy<-mar||sy>H+mar) continue;
        lcone(sx, sy, e.heading, cl*0.8, ch*0.8, "rgba(245,235,200,0.15)");
        var on = Math.sin(e.light*9) > 0;                                // pulsing red/blue splash
        lpool(sx-ppm*1.6, sy, pr*1.3, on?"rgba(255,40,40,0.24)":"rgba(40,70,255,0.10)");
        lpool(sx+ppm*1.6, sy, pr*1.3, on?"rgba(40,70,255,0.10)":"rgba(70,90,255,0.24)");
      }
      lightCtx.globalCompositeOperation = "source-over";
    }
    function setGfx(on){
      gfxHigh = on;
      var st = document.getElementById("gfxState"); if (st) st.textContent = on ? "HIGH" : "LOW";
      setMapBuildings(!on);    // hide MapLibre's flat fill when our 3D buildings are on
      if (!on){ if (lightCtx) lightCtx.clearRect(0,0,lightCanvas.width,lightCanvas.height); if (buildCtx) buildCtx.clearRect(0,0,buildCanvas.width,buildCanvas.height); if (roadCtx) roadCtx.clearRect(0,0,roadCanvas.width,roadCanvas.height); if (bloomCtx) bloomCtx.clearRect(0,0,bloomCanvas.width,bloomCanvas.height); }
    }

    // ---------- bloom (GRAPHICS G5): cheap glow on the emissive light layer ----------
    // Downscale the additive #light layer into a small buffer (that downscale IS
    // the blur), then composite it back upscaled + additive so headlights and cop
    // lights bloom into soft halos. Gated by gfxHigh.
    var bloomCanvas, bloomCtx, bloomBuf, bloomBufCtx;
    function initBloom(){
      bloomCanvas = document.getElementById("bloom"); if(!bloomCanvas) return;
      bloomCtx = bloomCanvas.getContext("2d");
      bloomBuf = document.createElement("canvas"); bloomBufCtx = bloomBuf.getContext("2d");
      resizeBloom();
    }
    function resizeBloom(){
      if(!bloomCanvas) return;
      bloomCanvas.width = window.innerWidth; bloomCanvas.height = window.innerHeight;
      bloomBuf.width = Math.max(1,(window.innerWidth/5)|0); bloomBuf.height = Math.max(1,(window.innerHeight/5)|0);
    }
    function drawBloom(){
      if(!bloomCtx || !lightCtx) return;
      var bw=bloomBuf.width, bh=bloomBuf.height, W=bloomCanvas.width, H=bloomCanvas.height;
      bloomBufCtx.clearRect(0,0,bw,bh);
      bloomBufCtx.drawImage(lightCanvas, 0,0,lightCanvas.width,lightCanvas.height, 0,0,bw,bh);     // downscale = blur
      bloomCtx.clearRect(0,0,W,H);
      bloomCtx.globalCompositeOperation="lighter"; bloomCtx.globalAlpha=0.7; bloomCtx.imageSmoothingEnabled=true;
      bloomCtx.drawImage(bloomBuf, 0,0,bw,bh, 0,0,W,H);                                            // upscale = soft glow
      bloomCtx.globalAlpha=1; bloomCtx.globalCompositeOperation="source-over";
    }

    // ---------- audio (WebAudio synth: engine, siren, crash thud) ----------
    // Pure synthesis (no asset files), created lazily on the first input because
    // autoplay rules need a gesture. Self-guards everywhere so a missing WebAudio
    // or a muted user never affects the game. Esc menu has a Sound toggle.
    var audio = null;
    function initAudio(){
      if (audio || !soundOn) return;
      try {
        var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        var ctx = new AC();
        var master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
        var eo = ctx.createOscillator(); eo.type = "sawtooth"; eo.frequency.value = 45;
        var ef = ctx.createBiquadFilter(); ef.type = "lowpass"; ef.frequency.value = 700;
        var eg = ctx.createGain(); eg.gain.value = 0; eo.connect(ef); ef.connect(eg); eg.connect(master); eo.start();
        var eo2 = ctx.createOscillator(); eo2.type = "square"; eo2.frequency.value = 22;
        var eg2 = ctx.createGain(); eg2.gain.value = 0; eo2.connect(eg2); eg2.connect(master); eo2.start();
        var so = ctx.createOscillator(); so.type = "sine"; so.frequency.value = 700;
        var sg = ctx.createGain(); sg.gain.value = 0; so.connect(sg); sg.connect(master); so.start();
        var nb = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), nd = nb.getChannelData(0);
        for (var ni=0; ni<nd.length; ni++) nd[ni] = Math.random()*2-1;            // 1s of white noise, looped
        var ns = ctx.createBufferSource(); ns.buffer = nb; ns.loop = true;
        var nf = ctx.createBiquadFilter(); nf.type = "bandpass"; nf.frequency.value = 2200; nf.Q.value = 1.2;
        var ng = ctx.createGain(); ng.gain.value = 0; ns.connect(nf); nf.connect(ng); ng.connect(master); ns.start();
        audio = { ctx:ctx, master:master, eo:eo, ef:ef, eg:eg, eo2:eo2, eg2:eg2, so:so, sg:sg, tyreF:nf, tyreG:ng, sirenPh:0, _f:45, _eg:0, _sg:0, _screech:0 };
        master.gain.setTargetAtTime(0.85, ctx.currentTime, 0.4);
      } catch(_){ audio = null; }
    }
    function resumeAudio(){ try { if (audio && audio.ctx.state === "suspended") audio.ctx.resume(); } catch(_){} }
    function updateAudio(dt){
      if (!audio) return;
      var ctx = audio.ctx, t = ctx.currentTime;
      var spd = Math.sqrt(car.vx*car.vx + car.vy*car.vy), s01 = Math.min(1, spd/CFG.maxSpeed);
      var f = 45 + s01*205, eg = 0.045 + s01*0.15, eg2 = 0.035 + s01*0.06;
      audio.eo.frequency.setTargetAtTime(f, t, 0.05);
      audio.eo2.frequency.setTargetAtTime(f*0.5, t, 0.05);
      audio.ef.frequency.setTargetAtTime(500 + s01*2600, t, 0.05);
      audio.eg.gain.setTargetAtTime(eg, t, 0.08);
      audio.eg2.gain.setTargetAtTime(eg2, t, 0.08);
      var sg = 0;
      if (wanted > 0 && cops.length){                                  // wailing siren when wanted
        audio.sirenPh += dt*1.9;
        var wail = 0.5 + 0.5*Math.sin(audio.sirenPh*6.2832);
        audio.so.frequency.setTargetAtTime(650 + wail*330, t, 0.02);
        var nd = 1e9; for (var i=0;i<cops.length;i++){ var dx=cops[i].x-car.x, dy=cops[i].y-car.y, d=dx*dx+dy*dy; if (d<nd) nd=d; }
        sg = 0.05 + Math.max(0, Math.min(1, 1 - Math.sqrt(nd)/280))*0.11;   // louder as a cruiser closes
      }
      audio.sg.gain.setTargetAtTime(sg, t, sg>0?0.1:0.25);
      // tyre screech while sliding — same lateral-slip signal that lays skidmarks
      var rx = Math.cos(car.heading), ry = -Math.sin(car.heading);
      var lat = Math.abs(car.vx*rx + car.vy*ry);
      var scr = (spd > 4 && lat > CFG.skidSlip) ? Math.min(0.13, 0.03 + (lat - CFG.skidSlip)/16*0.13) : 0;
      audio.tyreG.gain.setTargetAtTime(scr, t, scr>0 ? 0.03 : 0.12);
      audio.tyreF.frequency.setTargetAtTime(1800 + Math.min(1, lat/16)*1200, t, 0.05);
      audio._f = Math.round(f); audio._eg = +eg.toFixed(3); audio._sg = +sg.toFixed(3); audio._screech = +scr.toFixed(3);   // debug mirror
    }
    function playThud(intensity){
      if (!audio) return;
      try {
        var ctx = audio.ctx, dur = 0.28, n = (ctx.sampleRate*dur)|0;
        var buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
        for (var i=0; i<n; i++){ var e = 1 - i/n; d[i] = (Math.random()*2-1) * e*e; }   // decaying noise burst
        var src = ctx.createBufferSource(); src.buffer = buf;
        var f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 180 + intensity*260;
        var g = ctx.createGain(); g.gain.value = Math.min(0.85, 0.25 + intensity*0.55);
        src.connect(f); f.connect(g); g.connect(audio.master); src.start();
      } catch(_){}
    }
    function setSound(on){
      soundOn = on;
      var st = document.getElementById("sndState"); if (st) st.textContent = on ? "ON" : "OFF";
      if (on){ initAudio(); resumeAudio(); if (audio) audio.master.gain.setTargetAtTime(0.85, audio.ctx.currentTime, 0.3); }
      else if (audio){ audio.master.gain.setTargetAtTime(0, audio.ctx.currentTime, 0.2); }
    }

    // ---------- game loop ----------
    var last = 0, streetT = 0, qT = 0, lastQX = 1e9, lastQY = 1e9, miniT = 0;
    var shake = 0, prevSpeed = 0, peakShake = 0, mapEl = null;
    var carEl, kmhEl, gearEl, miniCarEl;
    var prev = { lng:ORIGIN.lng, lat:ORIGIN.lat, zoom:CFG.baseZoom, carT:"", kmh:-1, gear:"" };

    // one physics tick — arcade drift model. Velocity is a world vector; tyres
    // normally bite (sideways slide is killed fast) but the handbrake breaks the
    // rear loose so the car drifts, then grips again when released.
    function stepPhysics(k, dt){
      var sinH = Math.sin(car.heading), cosH = Math.cos(car.heading);
      var fx = sinH, fy = cosH;     // forward unit vector (heading 0 = north/up, +CW)
      var rx = cosH, ry = -sinH;    // rightward unit vector

      // split world velocity into forward + sideways components
      var fwd = car.vx*fx + car.vy*fy;
      var lat = car.vx*rx + car.vy*ry;

      // longitudinal: throttle / brake / reverse
      if (k.up)      fwd += CFG.accel * dt;
      else if (k.dn){
        if (fwd > 0.5) fwd -= CFG.brake * dt;            // braking
        else           fwd -= CFG.accel * 0.7 * dt;      // reverse
      }
      fwd -= fwd * CFG.drag * dt;                        // drag
      if (fwd > 0)      fwd = Math.max(0, fwd - CFG.roll*dt);   // roll to a stop
      else if (fwd < 0) fwd = Math.min(0, fwd + CFG.roll*dt);
      fwd = Math.max(-CFG.reverseMax, Math.min(CFG.maxSpeed, fwd));

      // lateral grip — the drift knob. Handbrake swaps in low grip so the back
      // end slides; it also scrubs a little forward speed (locked rears).
      var grip = k.hand ? CFG.gripSlide : CFG.gripRoad;
      lat *= Math.exp(-grip * dt);
      if (k.hand) fwd -= fwd * CFG.handDrag * dt;

      // rebuild world velocity from the (possibly slipping) components
      car.vx = fx*fwd + rx*lat;
      car.vy = fy*fwd + ry*lat;

      // steering: needs speed (can't pivot parked), eased at the top end, and
      // sharper on the handbrake to kick the tail out
      var spd = Math.sqrt(car.vx*car.vx + car.vy*car.vy);
      var eff = Math.max(-1, Math.min(1, fwd / CFG.grip));
      var hi  = 1 - 0.45 * Math.min(1, spd / CFG.maxSpeed);
      var hb  = k.hand ? CFG.handSteer : 1;
      var steer = (k.lf?-1:0) + (k.rt?1:0);
      car.heading += steer * CFG.turn * eff * hi * hb * dt;

      // integrate position, then resolve building collisions
      car.x += car.vx * dt;
      car.y += car.vy * dt;
      collide();
    }

    function loop(ts){
      requestAnimationFrame(loop);
      if (!last){ last = ts; return; }
      var rawMs = ts - last;
      var dt = Math.min(rawMs/1000, 0.05);
      last = ts;

      // FPS measurement: smoothed average + worst single frame in the last 0.5s
      emaMs = emaMs*0.9 + rawMs*0.1;
      if (rawMs > 0){ var ifps = 1000/rawMs; if (ifps < minFps) minFps = ifps; }
      fpsT += rawMs;
      if (fpsT >= 500){ if (showFps) updateFps(); minFps = 999; fpsT = 0; }

      if (!ready || paused || mapOpen) return;   // freeze the sim while paused or the GPS map is open

      var k = down();
      stepPhysics(k, dt);
      updateSkid(dt);

      // manual zoom only — the camera holds a tight chase zoom and never auto-pulls out
      if (k.zin)  zoomBias = Math.min(CFG.zoomMax-CFG.baseZoom, zoomBias + 1.2*dt);
      if (k.zout) zoomBias = Math.max(CFG.zoomMin-CFG.baseZoom, zoomBias - 1.2*dt);
      var targetZoom = CFG.baseZoom + zoomBias;
      viewZoom += (targetZoom - viewZoom) * Math.min(1, dt*6);
      var zoom = viewZoom;

      // drive the camera + sprite — only when something actually moved, so a
      // parked car stops hammering the GPU with redundant repaints every frame
      if (!carEl){ carEl=document.getElementById("car"); kmhEl=document.getElementById("kmh"); gearEl=document.getElementById("gear"); miniCarEl=document.getElementById("miniCar"); }
      var ll = toLngLat();
      if (Math.abs(ll[0]-prev.lng)>1e-7 || Math.abs(ll[1]-prev.lat)>1e-7 || Math.abs(zoom-prev.zoom)>1e-3){
        map.jumpTo({ center: ll, zoom: zoom, bearing: 0 });
        prev.lng=ll[0]; prev.lat=ll[1]; prev.zoom=zoom;
      }
      // sprite rotates with heading and shrinks a little when zoomed out, so it
      // stays a sensible marker in scout mode rather than a giant block
      var carScale = Math.max(0.5, Math.min(1, Math.pow(2, viewZoom - CFG.baseZoom)));
      var carT = "translate(-50%,-50%) rotate(" + (car.heading*180/Math.PI).toFixed(2) + "deg) scale(" + carScale.toFixed(3) + ")";
      if (carT !== prev.carT){ carEl.style.transform = carT; prev.carT = carT; }

      // GPS minimap follows the car (throttled ~10fps — it's an overview, not a 60fps view)
      miniT += dt;
      if (miniReady && miniOn && miniT > 0.1){
        miniT = 0;
        mini.jumpTo({ center: ll, zoom: CFG.miniZoom, bearing: 0 });
        if (miniCarEl) miniCarEl.style.transform = "translate(-50%,-50%) rotate(" + (car.heading*180/Math.PI).toFixed(1) + "deg)";
      }

      // HUD — speed is the velocity magnitude; gear from the forward component
      var speed = Math.sqrt(car.vx*car.vx + car.vy*car.vy);
      var fwdSpeed = car.vx*Math.sin(car.heading) + car.vy*Math.cos(car.heading);
      var kmh = Math.round(speed*3.6);
      if (kmh!==prev.kmh){ kmhEl.textContent=kmh; prev.kmh=kmh; }
      var gear = fwdSpeed < -0.5 ? "R" : "D";
      if (gear!==prev.gear){ gearEl.textContent=gear; prev.gear=gear; }

      // speed FX (fake motion blur) — only runs when moving quickly
      if (speed > CFG.fxMinSpeed) drawFx(speed, car.vx, car.vy);
      else if (fxActive){ clearFx(); fxActive = false; }

      // world entities — pedestrians + cops share the canvas + projection
      if (entCtx){
        entCtx.clearRect(0,0,entCanvas.width,entCanvas.height);
        var drawW = zoom >= CFG.entMinZoom, ppmE = drawW ? pxPerMetre(ll, zoom) : 0;
        if (drawW) drawMarks(ppmE);                                     // skidmarks under the cars
        if (pedsOn){ updatePeds(dt); if (drawW) drawPeds(ppmE); }
        if (trafficOn){ updateTraffic(dt); if (drawW) drawTraffic(ppmE); }
        if (copsOn){ updateCops(dt); if (drawW) drawCops(ppmE); }
        if (drawW && gfxHigh){ drawRoads(ppmE); drawBuildings(ppmE); drawLights(ppmE); drawBloom(); }
        else { if (lightCtx) lightCtx.clearRect(0,0,lightCanvas.width,lightCanvas.height); if (buildCtx) buildCtx.clearRect(0,0,buildCanvas.width,buildCanvas.height); if (roadCtx) roadCtx.clearRect(0,0,roadCanvas.width,roadCanvas.height); if (bloomCtx) bloomCtx.clearRect(0,0,bloomCanvas.width,bloomCanvas.height); }
      }

      // missions (timer + arrival / heat checks), then GPS guidance visuals
      if (job) updateJob(dt);
      if (dest) updateGuide();

      // street name (best-effort, throttled)
      streetT += dt;
      if (streetT > 0.35){ streetT = 0; updateStreet(); }

      // refresh nearby building obstacles for collision (throttled by time + distance)
      qT += dt;
      if (qT > 0.25 || Math.abs(car.x-lastQX)+Math.abs(car.y-lastQY) > 30){
        qT = 0; lastQX = car.x; lastQY = car.y; scheduleObstacles();
      }

      // crash feedback: a sharp one-frame speed drop = an impact → screen shake
      var sp2 = Math.sqrt(car.vx*car.vx + car.vy*car.vy);
      var dv = prevSpeed - sp2;
      if (dv > CFG.crashDV){ shake = Math.min(CFG.shakeMax, shake + (dv - CFG.crashDV)*0.6 + 4); playThud(Math.min(1, (dv - CFG.crashDV)/30)); }
      prevSpeed = sp2;
      applyShake(dt);
      updateAudio(dt);
    }

    var lastStreet = "";
    function updateStreet(){
      if (!roadLayers.length) return;
      var c = { x: window.innerWidth/2, y: window.innerHeight/2 };
      var box = [[c.x-6,c.y-6],[c.x+6,c.y+6]];
      var feats = [];
      try { feats = map.queryRenderedFeatures(box, { layers: roadLayers }); } catch(_){ return; }
      var name = "";
      for (var i=0;i<feats.length;i++){
        var p = feats[i].properties||{};
        if (p.name){ name = p.name; break; }
      }
      if (name && name !== lastStreet){
        lastStreet = name;
        var el = document.getElementById("street");
        el.textContent = name;
        el.style.opacity = 1;
      } else if (!name && lastStreet){
        document.getElementById("street").style.opacity = 0;
        lastStreet = "";
      }
    }

    // ---------- ui helpers ----------
    var noticeTimer;
    function flash(msg){
      var n = document.getElementById("notice");
      n.textContent = msg; n.style.opacity = 1;
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(function(){ n.style.opacity = 0; }, 2600);
    }
    function hideBoot(){
      var b = document.getElementById("boot");
      b.classList.add("hide");
      setTimeout(function(){ b.style.display="none"; }, 700);
    }

    // safety net: never let the boot screen hang forever
    setTimeout(function(){ if(!ready){ hideBoot(); } }, 9000);

    // DEV hook (harmless; strip before the final public push) — lets the dev
    // loop read state + poke heat to test the cops without committing crimes.
    try { window.__drive = {
      stats: function(){ return { kmh: Math.round(Math.sqrt(car.vx*car.vx+car.vy*car.vy)*3.6),
        heat: Math.round(heat*100)/100, wanted: wanted, cops: cops.length, peds: peds.length, traffic: traffic.length, roads: roads.length, marks: marks.length, shake: Math.round(shake*10)/10,
        paused: paused, mapOpen: mapOpen, origin: { lng:+ORIGIN.lng.toFixed(4), lat:+ORIGIN.lat.toFixed(4) },
        dest: dest ? { lng:+dest.lng.toFixed(4), lat:+dest.lat.toFixed(4), label:dest.label } : null,
        cash: cash, job: job ? { type:job.type, timeLeft:Math.round(job.timeLeft), reward:job.reward } : null }; },
      heat:    function(v){ heat = +v||0; return heat; },
      tp:      function(lng,lat){ teleportTo(lng, lat, "test"); return [ORIGIN.lng, ORIGIN.lat]; },
      setDest: function(lng,lat){ setDestination(lng, lat, "test"); return dest; },
      openMap: function(o){ if (o===false) closeMap(); else openMap(); return mapOpen; },
      startJob: function(){ startJob(); return window.__drive.stats().job; },
      win:      function(){ completeJob(); return cash; },
      fail:     function(){ failJob("debug"); return null; },
      warpToJob:function(){ if (job && job.tlng!=null){ car.x=(job.tlng-ORIGIN.lng)*DEG_LNG; car.y=(job.tlat-ORIGIN.lat)*DEG_LAT; } return job ? job.type : null; },
      roadCheck:function(){ var n=traffic.length, sum=0, mx=0, on=0; for (var i=0;i<n;i++){ var rf=roadField(traffic[i].x,traffic[i].y); var dd=rf?rf.dist:999; sum+=dd; if(dd>mx)mx=dd; if(dd<8)on++; } return { cars:n, onRoad:on, avgDist:n?Math.round(sum/n*10)/10:0, maxDist:Math.round(mx*10)/10, roads:roads.length }; },
      laneCheck:function(){ var n=traffic.length, left=0, sum=0, m=0; for (var i=0;i<n;i++){ var c=traffic[i], rf=roadField(c.x,c.y); if(!rf) continue; var hx=Math.sin(c.heading), hy=Math.cos(c.heading); var lat=(c.x-rf.qx)*(-hy)+(c.y-rf.qy)*hx; if(lat>0.3)left++; sum+=lat; m++; } return { cars:n, measured:m, onLeft:left, avgLateral:m?Math.round(sum/m*10)/10:0 }; },
      followCheck:function(){ var n=traffic.length, slow=0, best=null; for (var i=0;i<n;i++){ var c=traffic[i], fxx=Math.sin(c.heading),fyy=Math.cos(c.heading),rxx=Math.cos(c.heading),ryy=-Math.sin(c.heading), gap=CFG.followLook; var rax=car.x-c.x,ray=car.y-c.y,fdp=rax*fxx+ray*fyy,ldp=rax*rxx+ray*ryy; if(fdp>0&&fdp<gap&&Math.abs(ldp)<CFG.laneHalf)gap=fdp; for(var j=0;j<n;j++){ if(j===i)continue; var o=traffic[j],rox=o.x-c.x,roy=o.y-c.y,fdo=rox*fxx+roy*fyy,ldo=rox*rxx+roy*ryy; if(fdo>0&&fdo<gap&&Math.abs(ldo)<CFG.laneHalf)gap=fdo; } if(gap<CFG.followLook){ slow++; var spd=Math.sqrt(c.vx*c.vx+c.vy*c.vy); if(!best||gap<best.gap) best={gap:Math.round(gap*10)/10, spdKmh:Math.round(spd*3.6), cruiseKmh:Math.round(c.spd*3.6)}; } } return { cars:n, slowing:slow, tightest:best }; },
      pedCheck:function(){ var n=peds.length, near=0, sum=0, m=0; for (var i=0;i<n;i++){ var rf=roadField(peds[i].x,peds[i].y); if(!rf)continue; sum+=rf.dist; m++; if(rf.dist<10)near++; } return { peds:n, measured:m, nearRoad:near, avgDist:m?Math.round(sum/m*10)/10:0 }; },
      copCheck:function(){ var n=cops.length, far=0, on=0, sum=0; for (var i=0;i<n;i++){ var c=cops[i], dx=car.x-c.x, dy=car.y-c.y, d=Math.sqrt(dx*dx+dy*dy); if(d>CFG.copRoadR){ far++; var rf=roadField(c.x,c.y); var dd=rf?rf.dist:999; sum+=dd; if(dd<10)on++; } } return { cops:n, far:far, farOnRoad:on, farAvgDist:far?Math.round(sum/far*10)/10:0 }; },
      peakShake:function(){ var p=Math.round(peakShake*10)/10; peakShake=0; return p; },
      audioState:function(){ if(!audio) return {exists:false}; return { exists:true, state:audio.ctx.state, engHz:audio._f||0, engGain:audio._eg||0, sirenGain:audio._sg||0, screech:audio._screech||0, master:+audio.master.gain.value.toFixed(3) }; },
      sound:function(on){ setSound(on!==false); return soundOn; },
      lightPixels:function(){ if(!lightCtx) return -1; var d=lightCtx.getImageData(0,0,lightCanvas.width,lightCanvas.height).data, c=0; for(var i=3;i<d.length;i+=4){ if(d[i]>0) c++; } return c; },
      styleLayers:function(){ try{ var ls=map.getStyle().layers, out=[]; for(var i=0;i<ls.length;i++){ var L=ls[i], pat=null; try{ pat=map.getPaintProperty(L.id,"fill-pattern"); }catch(_){} out.push({ id:L.id, t:L.type, sl:L["source-layer"]||null, pat:pat||null, vis:(L.layout&&L.layout.visibility)||"visible" }); } return out; }catch(e){ return String(e); } }
    }; } catch(_){}
  })();
  </script>
</body>
