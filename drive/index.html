<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>ADELAIDE DRIVER</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  :root{
    --ink:#0b0e18;
    --hud:#0c1020cc;
    --line:#2a3350;
    --accent:#f2b134;
    --text:#dfe6f5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;
    font-family:"Segoe UI",system-ui,Arial,sans-serif;color:var(--text);
    -webkit-user-select:none;user-select:none;touch-action:none;}
  #map{position:absolute;inset:0;background:var(--ink);}
  .maplibregl-ctrl-attrib{font-size:10px;opacity:.7;}

  /* vignette for mood */
  #vignette{position:absolute;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%);}
  /* speed FX overlay (motion-blur streaks) — above the map, below the car so the car stays crisp */
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:8;}
  /* road surfaces (asphalt + lane markings) — just above the base map */
  #road{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;}
  /* pseudo-3D buildings — above the map/lighting, below FX/entities (cars in front) */
  #build{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:7;}
  /* bloom (glow post-pass) — above the game layers, below the HUD */
  #bloom{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:11;}
  /* night lighting (additive headlights/glows) — above the map, below FX/entities */
  #light{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6;}
  /* world entities (pedestrians, traffic, cops) — above the FX, below the player car */
  #ents{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:9;}

  /* the car, locked to screen centre */
  #car{position:absolute;left:50%;top:50%;z-index:10;pointer-events:none;
    transform:translate(-50%,-50%);
    filter:drop-shadow(0 6px 5px rgba(0,0,0,.6));
    will-change:transform;}

  /* HUD */
  .hud{position:absolute;z-index:20;background:var(--hud);border:1px solid var(--line);
    border-radius:10px;padding:8px 12px;backdrop-filter:blur(4px);
    box-shadow:0 4px 18px rgba(0,0,0,.45);}
  #speedo{left:16px;bottom:16px;min-width:118px;text-align:center;}
  #speedo .num{font-size:38px;font-weight:800;line-height:1;letter-spacing:-1px;
    font-variant-numeric:tabular-nums;color:#fff;}
  #speedo .unit{font-size:11px;opacity:.65;letter-spacing:2px;}
  #speedo .gear{margin-top:4px;font-size:12px;font-weight:700;color:var(--accent);letter-spacing:1px;}
  #help{right:16px;bottom:16px;font-size:12px;line-height:1.7;opacity:.92;max-width:230px;}
  #help b{color:var(--accent);font-weight:700;}
  #street{left:50%;top:16px;transform:translateX(-50%);font-size:14px;font-weight:700;
    letter-spacing:.5px;opacity:0;transition:opacity .25s;white-space:nowrap;}
  #notice{left:50%;top:54px;transform:translateX(-50%);font-size:13px;opacity:0;
    transition:opacity .4s;background:var(--accent);color:#1a1303;border:none;font-weight:700;}

  /* GPS minimap (top-right) */
  #minimap{position:absolute;top:16px;right:16px;width:208px;height:208px;z-index:20;
    border-radius:50%;overflow:hidden;border:3px solid #2a3350;
    box-shadow:0 6px 22px rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,255,255,.05);}
  #miniMap{position:absolute;inset:0;background:var(--ink);}
  #miniCar{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
    pointer-events:none;filter:drop-shadow(0 0 3px rgba(0,0,0,.85));}
  #miniLabel{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);z-index:3;
    font-size:9px;letter-spacing:2px;opacity:.55;pointer-events:none;}
  @media(max-width:600px){#minimap{width:132px;height:132px;}}

  /* debug FPS counter (top-left) */
  #fps{position:absolute;left:16px;top:16px;z-index:25;font-family:Consolas,"SF Mono",monospace;
    color:#9affc6;background:rgba(6,10,20,.72);border:1px solid var(--line);border-radius:8px;
    padding:5px 10px;pointer-events:none;line-height:1.15;}
  #fps b{font-size:20px;color:#fff;font-weight:800;}
  #fps span{display:block;opacity:.75;font-size:10px;letter-spacing:.5px;color:#cfe;}

  /* wanted level (cops) — top-left under the FPS box */
  #wanted{left:16px;top:64px;z-index:25;display:none;font-size:13px;font-weight:800;
    letter-spacing:1px;color:#e9eefb;}
  #wanted b{color:#ffd23f;letter-spacing:1px;}
  #wanted i{color:#574a1c;font-style:normal;letter-spacing:1px;}

  /* GPS destination guidance pill (under the minimap) + minimap dot */
  #gpsGuide{top:236px;right:16px;z-index:20;display:none;align-items:center;gap:9px;}
  #gpsGuide .arr{width:0;height:0;flex:none;border-left:7px solid transparent;border-right:7px solid transparent;
    border-bottom:13px solid var(--accent);transform-origin:50% 62%;}
  #gpsGuide .dst{font-weight:800;font-size:15px;color:#fff;line-height:1;font-variant-numeric:tabular-nums;}
  #gpsGuide .lbl{font-size:9px;letter-spacing:2px;opacity:.55;margin-top:2px;}
  @media(max-width:600px){#gpsGuide{top:160px;}}
  #miniDest{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;
    border-radius:50%;background:var(--accent);border:2px solid #1a1303;z-index:4;display:none;
    pointer-events:none;box-shadow:0 0 7px rgba(242,177,52,.85);}

  /* fullscreen GPS / travel map (key M) */
  #gps{position:absolute;inset:0;z-index:65;display:none;background:var(--ink);}
  #gpsMap{position:absolute;inset:0;}
  #gpsBar{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;gap:10px;
    padding:10px 12px;background:linear-gradient(180deg,rgba(6,9,16,.94),rgba(6,9,16,0));}
  #gpsBar .gtitle{font-weight:800;letter-spacing:1px;font-size:14px;color:#fff;white-space:nowrap;}
  #gpsCities{display:flex;flex-wrap:wrap;gap:6px;flex:1;}
  .gchip{background:#141a2ecc;border:1px solid var(--line);color:var(--text);border-radius:999px;
    padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;
    transition:background .12s,border-color .12s;}
  .gchip:hover{background:#1d2742;border-color:var(--accent);}
  #gpsClose{flex:none;width:34px;height:34px;font-size:16px;cursor:pointer;color:#fff;
    background:#141a2e;border:1px solid var(--line);border-radius:8px;font-family:inherit;}
  #gpsClose:hover{border-color:var(--accent);}
  #gpsFoot{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:center;gap:10px;
    padding:12px;background:linear-gradient(0deg,rgba(6,9,16,.94),rgba(6,9,16,0));}
  #gpsHint{flex:1;font-size:13px;opacity:.88;}
  .gbtn{background:var(--accent);color:#1a1303;border:none;border-radius:10px;padding:11px 16px;
    font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;}
  .gbtn.sec{background:#141a2e;color:var(--text);border:1px solid var(--line);}
  .gbtn[disabled]{opacity:.38;cursor:default;}

  /* missions — cash readout (bottom-left, above speedo) + job panel (bottom-centre) */
  #cash{left:16px;bottom:112px;z-index:20;font-weight:800;font-size:15px;color:#ffd23f;
    font-variant-numeric:tabular-nums;padding:6px 12px;}
  #job{left:50%;bottom:16px;transform:translateX(-50%);z-index:20;min-width:236px;max-width:74vw;text-align:center;}
  #job.idle{opacity:.62;}
  #job .jhint{font-size:12px;}
  #job .jhint b{color:var(--accent);}
  #job .jtitle{font-weight:800;font-size:14px;color:#fff;margin-bottom:6px;}
  #job .jbar{height:5px;background:#10141f;border:1px solid var(--line);border-radius:3px;overflow:hidden;}
  #job .jbar i{display:block;height:100%;width:100%;background:var(--accent);}
  #job .jmeta{display:flex;justify-content:space-between;gap:18px;font-size:12px;font-weight:700;
    margin-top:5px;font-variant-numeric:tabular-nums;}
  #job .jmeta span:last-child{color:#7fe0a8;}

  /* Esc menu */
  #menu{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    background:rgba(4,6,12,.72);backdrop-filter:blur(3px);}
  .menu-panel{background:rgba(12,16,32,.96);border:1px solid var(--line);border-radius:16px;
    padding:24px 22px;width:300px;max-width:86vw;box-shadow:0 18px 60px rgba(0,0,0,.6);text-align:center;}
  .menu-panel h2{margin:0;font-size:24px;font-weight:900;letter-spacing:1px;color:#fff;}
  .menu-panel .tag{font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:.5;margin:2px 0 16px;}
  .menu-item{display:flex;justify-content:space-between;align-items:center;width:100%;
    background:#141a2e;border:1px solid var(--line);color:var(--text);border-radius:10px;
    padding:11px 14px;margin:7px 0;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
    transition:background .12s,border-color .12s;}
  .menu-item:hover{background:#1d2742;border-color:var(--accent);}
  .menu-item span{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:1px;}
  .menu-hint{margin-top:12px;font-size:11px;opacity:.45;letter-spacing:1px;}

  /* loading / title screen */
  #boot{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;background:var(--ink);
    transition:opacity .6s;}
  #boot h1{margin:0;font-size:13vw;font-weight:900;letter-spacing:-4px;
    background:linear-gradient(180deg,#fff,var(--accent));-webkit-background-clip:text;
    background-clip:text;color:transparent;line-height:.9;}
  #boot .sub{font-size:14px;letter-spacing:6px;opacity:.7;text-transform:uppercase;}
  #boot .spin{width:34px;height:34px;border:3px solid #2a3350;border-top-color:var(--accent);
    border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #boot.hide{opacity:0;pointer-events:none;}
  @media(min-width:900px){#boot h1{font-size:120px;}}
</style>
</head>
<body>
  <div id="map"></div>
  <div id="vignette"></div>
  <canvas id="road"></canvas>
  <canvas id="fx"></canvas>
  <canvas id="light"></canvas>
  <canvas id="build"></canvas>
  <canvas id="ents"></canvas>
  <canvas id="bloom"></canvas>

  <!-- top-down car (front points up) -->
  <div id="car">
    <svg id="carSvg" viewBox="0 0 48 80" width="34" height="57" xmlns="http://www.w3.org/2000/svg">
      <rect x="2"  y="14" width="7" height="16" rx="3" fill="#0d0d10"/>
      <rect x="39" y="14" width="7" height="16" rx="3" fill="#0d0d10"/>
      <rect x="2"  y="50" width="7" height="16" rx="3" fill="#0d0d10"/>
      <rect x="39" y="50" width="7" height="16" rx="3" fill="#0d0d10"/>
      <rect x="7"  y="3"  width="34" height="74" rx="12" fill="#e23b2e" stroke="#5e130d" stroke-width="2"/>
      <rect x="11" y="27" width="26" height="28" rx="7" fill="#b62b20"/>
      <path d="M12 27 Q24 19 36 27 L34 34 Q24 30 14 34 Z" fill="#cdecff" opacity="0.92"/>
      <path d="M14 49 Q24 45 34 49 L36 56 Q24 60 12 56 Z" fill="#a9d6f2" opacity="0.85"/>
      <rect x="11" y="3.5"  width="6" height="4" rx="2" fill="#fff3b0"/>
      <rect x="31" y="3.5"  width="6" height="4" rx="2" fill="#fff3b0"/>
      <rect x="11" y="72.5" width="6" height="4" rx="2" fill="#ff5a4d"/>
      <rect x="31" y="72.5" width="6" height="4" rx="2" fill="#ff5a4d"/>
    </svg>
  </div>

  <!-- HUD -->
  <div id="street" class="hud"></div>
  <div id="notice" class="hud"></div>
  <div id="speedo" class="hud">
    <div class="num" id="kmh">0</div>
    <div class="unit">KM/H</div>
    <div class="gear" id="gear">D</div>
  </div>
  <div id="help" class="hud">
    <b>&uarr; / W</b> accelerate<br>
    <b>&darr; / S</b> brake &middot; reverse<br>
    <b>&larr; &rarr; / A D</b> steer<br>
    <b>SPACE / SHIFT</b> handbrake &middot; drift<br>
    <b>+ / &minus;</b> zoom &middot; <b>R</b> reset<br>
    <b>M</b> map &middot; GPS &middot; <b>J</b> job<br>
    <b>ESC</b> menu
  </div>

  <!-- mission HUD: cash + job panel -->
  <div id="cash" class="hud">$0</div>
  <div id="job" class="hud idle"></div>

  <!-- GPS minimap -->
  <div id="minimap">
    <div id="miniMap"></div>
    <div id="miniCar">
      <svg viewBox="0 0 24 24" width="22" height="22" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2 L20 21 L12 16 L4 21 Z" fill="#39e0ff" stroke="#062430" stroke-width="1.3"/>
      </svg>
    </div>
    <div id="miniLabel">GPS</div>
    <div id="miniDest"></div>
  </div>

  <!-- debug FPS counter -->
  <div id="fps"></div>

  <!-- wanted level -->
  <div id="wanted" class="hud"></div>

  <!-- GPS destination guidance -->
  <div id="gpsGuide" class="hud">
    <div class="arr"></div>
    <div><div class="dst">0 m</div><div class="lbl">GPS</div></div>
  </div>

  <!-- fullscreen GPS / travel map -->
  <div id="gps">
    <div id="gpsMap"></div>
    <div id="gpsBar">
      <div class="gtitle">&#128506; GPS</div>
      <div id="gpsCities"></div>
      <button id="gpsClose" title="Close (Esc)">&times;</button>
    </div>
    <div id="gpsFoot">
      <div id="gpsHint">Tap the map, or pick a city, then Drive there</div>
      <button id="gpsSet" class="gbtn sec" disabled>Set destination</button>
      <button id="gpsGo" class="gbtn" disabled>Drive here &#9656;</button>
    </div>
  </div>

  <!-- Esc menu -->
  <div id="menu">
    <div class="menu-panel">
      <h2>PAUSED</h2>
      <div class="tag">Adelaide Driver</div>
      <button class="menu-item" data-act="resume">Resume <span>ESC</span></button>
      <button class="menu-item" data-act="fps">FPS counter <span id="fpsState">ON</span></button>
      <button class="menu-item" data-act="mini">Minimap <span id="miniState">ON</span></button>
      <button class="menu-item" data-act="peds">Pedestrians <span id="pedState">ON</span></button>
      <button class="menu-item" data-act="cops">Police <span id="copState">ON</span></button>
      <button class="menu-item" data-act="traffic">Traffic <span id="trafState">ON</span></button>
      <button class="menu-item" data-act="snd">Sound <span id="sndState">ON</span></button>
      <button class="menu-item" data-act="gfx">Graphics <span id="gfxState">HIGH</span></button>
      <button class="menu-item" data-act="map">Map / GPS <span>M</span></button>
      <button class="menu-item" data-act="abandon">Abandon job <span></span></button>
      <button class="menu-item" data-act="reset">Reset to start <span>R</span></button>
      <div class="menu-hint">Esc to resume</div>
    </div>
  </div>

  <div id="boot">
    <h1>ADELAIDE</h1>
    <div class="sub">Driver</div>
    <div class="spin"></div>
    <div class="sub" id="bootmsg" style="letter-spacing:2px;font-size:11px;">loading the streets&hellip;</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <script>
  (function(){
    "use strict";

    /* =====================================================================
       ADELAIDE DRIVER — DEV ROADMAP  (advancing toward a GTA-lite sandbox)
       GOALS: 1 fun driving · 2 flee cops · 3 pedestrians · 4 in-game GPS
              waypoint map · 5 all of Australia · 6 mission loop (keep the
              free-roam open world) · 7 don't restyle graphics, only optimise ·
              8 systematic road realism — traffic (and ideally peds) respect the
              road network; cars drive ON roads, not across blocks/buildings.

       PROGRESS LOG (newest first):
       - [iter23] NEON SHOPFRONTS (G4 polish) + LOOP PAUSED. ~18% of buildings now
         get a coloured neon roof-edge (pink/cyan/amber, deterministic) for shop
         life. Loads clean (no console errors); not screenshot-verified — the
         fresh preview tab had rAF paused (backgrounded, env limit) — but it's a
         trivial conditional on the verified building draw. *** GRAPHICS OVERHAUL
         COMPLETE: G1-G5 core (iter16-21) + polish (hatch-flatten 19, shadows 22,
         neon 23). The /loop cron (efeda084) had STACKED ~40 fires (saturated) and
         its goal is met, so it was DELETED — the loop is OFF. Re-run /loop to
         resume optional polish (wet roads/rain, day-night grade) or the backlog. ***
       - [iter22] UNIFIED SHADOWS (GRAPHICS G5 polish). Traffic, cops & peds now
         cast a soft ground-shadow ellipse (offset down-right to match the
         buildings' top-left "sun"), drawn under each body on #ents — so the
         moving entities sit on the road instead of floating. (The player car
         already had its DOM drop-shadow.) Verified: shadows under cars, 60fps,
         no errors.
       - [iter21] BLOOM (GRAPHICS G5 — the glow finish). New #bloom canvas (z11,
         over the game, under the HUD): the additive #light layer is downscaled
         1/5 (that IS the blur) then composited back upscaled + additive @0.7, so
         headlights and the red/blue cop lights bloom into soft halos. Gated by
         gfxHigh; shakes with the world. Verified: ~34k bloom px, glowing cop
         lights, 60fps, no errors. *** This completes the CORE of all 5 graphics
         layers (G1 buildings · G2 lighting · G3 roads · G4 window-lights · G5
         bloom). What's left in the overhaul is OPTIONAL polish only. ***
       - [iter20] WINDOW LIGHTS (GRAPHICS G4 — living city). Building roofs now
         carry lit-window dots: a per-building+cell hash (seeded from world coords)
         decides lit vs dark (~half lit), mostly warm with the odd cool-blue,
         drawn in drawBuilding. Stable across frames → no flicker. The dense
         Melbourne CBD lights right up. Verified: 572k building px in a dense grid
         still 60fps, no errors. (G4 polish remaining: neon shopfronts, parks/water.)
       - [iter19] FLATTEN HATCHED PLAZAS (graphics cleanup). The fake diagonal-
         hatch blocks were `road_area_pattern` (pedestrian-plaza polygons with a
         `pedestrian_polygon` fill-pattern) + a wetland hachure. darkenStyle now
         hides ANY fill layer that carries a fill-pattern (visibility none) so
         those areas read as plain dark ground — much cleaner against the night
         palette. DEV: __drive.styleLayers() dumps the style layers (used to find
         it). Verified: hatch gone, roads/buildings/lights intact, 60fps, no errors.
       - [iter18] ROAD SURFACES (GRAPHICS G3 — "roads look like roads"). New #road
         canvas (z2, just above the base map): asphalt ribbons (width by class —
         majors wider) + dashed yellow centre-line lane markings, drawn from the
         WIDE road-centreline sample. Rendered to an OFFSCREEN buffer (screen +
         256px margin) re-drawn only when the camera moves > ~RM px / zoom changes
         / fresh roads arrive, then blit+offset each frame; bbox-culled per
         polyline. `roads` is now {pts,major}; roadField reads .pts. Verified:
         ~178k road px, 60fps parked AND mid-drive @122 km/h (buffer covers the
         screen continuously), no errors.
       - [iter17] PSEUDO-3D BUILDINGS (GRAPHICS G1). New #build canvas (z7, under
         the cars): building footprints (a wider, 140-nearest-capped set in
         buildRender, queried in idle) are extruded into 2.5D blocks — ground
         shadow + walls rising to a fixed top-left "sun" + lit roof + edge
         highlight, per-building deterministic height. MapLibre's flat building
         fill is hidden via fill-opacity 0 (STILL queryable → collision intact)
         so only the 3D version shows. Direct-draw (culled to on-screen), not an
         offscreen buffer — the main map can't return off-screen footprints to
         fill a margin. Verified: ~102k px drawn, 60fps, collision still works.
         KNOWN: big diagonal-hatched LANDUSE/plaza fills remain (a separate non-
         building layer) — flatten them in darkenStyle (next).
       - [iter16] NIGHT LIGHTING (GRAPHICS G2 — first of the 5-part overhaul).
         New additive #light canvas (z6, under the cars): warm headlight CONES
         projecting forward from every car (player/traffic/cops) + soft ground-
         glow POOLS + pulsing red/blue cop light SPLASHES, all `lighter`-blended
         so the dark map lights up where cars are. Gated by the new "Graphics:
         HIGH/LOW" menu toggle (gfxHigh); the layer shakes with the world on
         impact. Verified: ~31k lit px parked (player cone), ~63k with cops
         (splashes visible), LOW→0 cleared, 60fps, no errors. DEV: lightPixels().
         NEXT graphics: G1 pseudo-3D extruded buildings.
       - [iter15] MISSION PERSISTENCE + STREAK (goal 6 depth). Cash, totalJobs &
         bestStreak persist to localStorage ("drive_save", loaded on start, saved
         on job complete) so progress survives reloads; consecutive completes
         build a streak that multiplies the payout (×1 → ×1.2 → … capped ×3),
         shown as "$N ×k" in the cash readout; a fail resets the streak. Verified:
         a job paid $500 → saved → restored as $500 after reload, no errors.
         (User STOPPED the loop here mid-iteration; left undone — purely cosmetic:
         a green-streak CSS rule for #cash b, and a `streak` field in debug stats.)
       - [iter14] TYRE SCREECH (goal 1 feel/juice). A looping band-passed
         white-noise voice added to the audio graph whose gain tracks the lateral
         slip (the SAME signal that lays the skidmarks) — so a handbrake drift /
         hard corner now screeches while it leaves rubber, the filter pitch
         rising with slip. Silent (gain 0) when gripping. DEV: audioState() now
         mirrors `screech`.
       - [iter13] AUDIO (goal 1 feel/juice) — pure WebAudio synth, no asset files.
         Lazily created on the first key/pointer input (autoplay needs a gesture);
         all self-guarded so a missing API / muted user never affects the game.
         ENGINE: sawtooth+square through a lowpass, pitch + gain + cutoff track
         speed. SIREN: a wailing sine that fades in with wanted level + nearest-cop
         proximity. CRASH THUD: a decaying filtered-noise burst on impact (same
         dv>crashDV trigger as the shake), scaled to severity. Esc "Sound" toggle.
         DEV: __drive.audioState() mirrors engHz/engGain/sirenGain (sim-driven even

    // ---- Adelaide CBD spawn (King William St / Victoria Square) ----
    var ORIGIN = { lng: 138.6005, lat: -34.9290 };
    var DEG_LAT = 110540;                                   // metres per degree latitude
    var DEG_LNG = 111320 * Math.cos(ORIGIN.lat*Math.PI/180); // metres per degree longitude here

    // ---- arcade physics (metres, seconds) ----
    var CFG = {
      accel:       52,    // throttle acceleration  m/s^2 — big OOMPH off the line
      brake:       55,    // braking deceleration
      reverseMax:  9,     // top reverse speed  m/s  (~32 km/h)
      maxSpeed:    139,   // hard speed cap  m/s  (~500 km/h), reached in ~4s
      drag:        0.22,  // longitudinal coast-down (per second, proportional)
      roll:        2.0,   // rolling resistance (settles the car to a full stop)
      turn:        1.8,   // max steering rate  rad/s
      grip:        7.5,   // forward speed (m/s) at which steering is fully effective
      gripRoad:    6.0,   // lateral traction — how fast tyres kill a sideways slide
      gripSlide:   0.9,   // lateral traction with the handbrake on (low = big drift)
      handDrag:    0.5,   // extra forward scrub while handbraking
      handSteer:   1.8,   // steering multiplier on the handbrake (kick the tail out)
      carRadius:   6,     // collision disc radius (m) — ~half the car's on-screen width
      carLong:     4,     // collision discs sit this far fore/aft of centre (gives it length)
      baseZoom:    18.5,  // START fully zoomed in (tightest) — this is the default
      zoomMin:     15,    // player can pull the camera out this far with  -
      zoomMax:     18.5,  // can't zoom in past the default
      miniZoom:    14,    // GPS minimap zoom — wider overview (top-right)
      fxMinSpeed:  22,    // m/s (~80 km/h) where the speed FX (motion-blur streaks) fades in
      // --- world entities (pedestrians now; traffic/cops to come) ---
      maxPeds:     34,    // ambient pedestrian pool size
      pedRing0:    35,    // spawn no closer to the car than this (m)
      pedRing1:    150,   // ... and no farther than this (m)
      pedCull:     200,   // despawn beyond this (m), then respawn in the ring
      pedFleeR:    11,    // pedestrians bolt from the car within this (m)
      pedHitR:     2.6,   // "clipped a pedestrian" radius (m)
      pedRoadR:    22,    // peds stroll along a road/footpath found within this (m)
      pedWalk:     5.5,   // footpath offset from the road centreline (m — outside the car lane)
      pedTurn:     2.0,   // how fast peds turn to follow the footpath (rad/s)
      entMinZoom:  15.6,  // skip drawing entities when zoomed out past this
      // --- cops / wanted (goal 2: run from the cops) ---
      copMax:      5,     // most cruisers on screen at once
      copSpawnR:   175,   // cruisers arrive from this far out (m), biased behind you
      copSightR:   130,   // within this (m) a cop is "on you" → heat won't cool
      copRoadR:    70,    // beyond this (m) a cop chases along ROADS; closer = direct pursuit / takedown
      copDespawnR: 360,   // give-up / cull distance (m)
      copAccel:    46,    // cruiser acceleration m/s^2
      copMaxSpeed: 80,    // cruiser top speed m/s (~288 km/h) — below yours, so you can run
      copTurn:     2.1,   // cruiser turn rate rad/s
      heatPerPed:  0.85,  // wanted heat gained per pedestrian clipped
      heatDecay:   0.07,  // heat lost per second while out of police sight
      loseTime:    7,     // seconds out of police sight to drop a wanted level
      // --- ambient traffic (civilian cars to dodge) ---
      maxTraffic:  10,    // civilian car pool size
      trafRing0:   45,    // spawn ring inner (m)
      trafRing1:   170,   // spawn ring outer (m)
      trafCull:    260,   // cull civilian cars beyond this (m)
      trafMinSpd:  6,     // slowest cruise (m/s ~22 km/h)
      trafMaxSpd:  16,    // fastest cruise (m/s ~58 km/h)
      trafTurn:    0.5,   // gentle wander turn rate (rad/s, only when off-road)
      trafSteer:   2.6,   // how fast traffic turns to follow the road (rad/s)
      roadSnapR:   55,    // traffic follows a road centreline found within this (m)
      laneOffset:  2.6,   // keep-left (AU): how far left of the centreline a lane sits (m)
      followLook:  20,    // car-following: look this far ahead (m) for a car/player in my lane
      followStop:  8,     // ... and ease to a full stop by this gap (m)
      laneHalf:    3.2,   // lateral half-width that counts as "ahead in my lane" (m)
      // --- missions (goal 6) ---
      jobArriveR:  30,   // delivery drop-off arrival radius (m)
      // --- feel / juice (goal 1) ---
      skidSlip:    3.5,  // lateral slip (m/s) above which the tyres leave skidmarks
      markLife:    7,    // seconds a skidmark lingers before fading out
      maxMarks:    420,  // cap on skidmark segments (ring buffer)
      crashDV:     8,    // single-frame speed drop (m/s) that counts as an impact → screen shake
      shakeMax:    16,   // max screen-shake amplitude (px)
      shakeDecay:  11    // screen-shake decay rate (higher = snappier)
    };

    var car = { x:0, y:0, heading:0, vx:0, vy:0 };  // heading rad (0=N, +CW); vx/vy = world velocity m/s
    var zoomBias = 0;
    var viewZoom = CFG.baseZoom;                 // eased camera zoom (smooth manual zoom)
    var keys = Object.create(null);
    var ready = false;

    function toLngLat(){
      return [ ORIGIN.lng + car.x/DEG_LNG, ORIGIN.lat + car.y/DEG_LAT ];
    }

    // ---------- map ----------
    var map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: [ORIGIN.lng, ORIGIN.lat],
      zoom: CFG.baseZoom,
      bearing: 0,
      pitch: 0,
      interactive: false,        // the game owns the camera
      attributionControl: false, // added explicitly below so OSM credit is guaranteed
      fadeDuration: 0
    });

    // Map data is OpenStreetMap, served via OpenFreeMap/OpenMapTiles — credit required.
    map.addControl(new maplibregl.AttributionControl({
      compact: true,
      customAttribution: '© OpenStreetMap contributors · © OpenMapTiles · OpenFreeMap'
    }));

    var roadLayers = [];
    var buildingLayers = [], obstacles = [];   // building footprints near the car, in local metres
    var roads = [];                            // drivable road centrelines near the car (polylines, local metres)

    var started = false, styleWatch;
    function start(){
      if (started) return;
      started = true;
      clearInterval(styleWatch);
      darkenStyle();
      ready = true;
      hideBoot();
      flash("G'day — you're cruising Adelaide CBD");
      setFps(showFps);
      setMini(miniOn);
      initFx();
      initEnts();
      initLight();
      initRoad();
      initBuild();
      if (gfxHigh) setMapBuildings(false);
      initBloom();
      initGps();
      loadSave(); renderCash(); renderJob();
      requestAnimationFrame(loop);
    }
    // Start as soon as the style is parsed instead of waiting for the first
    // paint — a backgrounded tab may never paint, and we don't need tiles drawn
    // to begin driving. Whichever trigger fires first wins (guarded by `started`).
    map.on("load", start);
    map.on("styledata", function(){ if (map.isStyleLoaded()) start(); });
    styleWatch = setInterval(function(){
      var s = map.getStyle();
      if (s && s.layers && s.layers.length) start();
    }, 200);
    map.on("error", function(e){
      var m = document.getElementById("bootmsg");
      if(m) m.textContent = "map tiles failed to load — check your connection";
      console.warn("map error", e && e.error);
    });

    // ---------- GPS minimap: a second, zoomed-out map in the top-right ----------
    var mini = new maplibregl.Map({
      container: "miniMap",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: [ORIGIN.lng, ORIGIN.lat],
      zoom: CFG.miniZoom,
      bearing: 0, pitch: 0,
      interactive: false, attributionControl: false, fadeDuration: 0
    });
    var miniReady = false, miniStyled = false;
    // Pare the minimap down to a clean roads-only GPS look (no buildings/labels) —
    // clearer at a glance and cheap to re-render.
    function styleMini(){
      if (miniStyled) return;
      var layers = (mini.getStyle() && mini.getStyle().layers) || [];
      if (!layers.length) return;
      miniStyled = true;
      layers.forEach(function(L){
        var id=L.id, sl=L["source-layer"], t=L.type;
        try{
          if (t==="background"){ mini.setPaintProperty(id,"background-color","#0b0e18"); return; }
          if (t==="symbol" || sl==="building" || sl==="poi" || sl==="housenumber"){
            mini.setLayoutProperty(id,"visibility","none"); return;
          }
          if (t==="fill"){ mini.setPaintProperty(id,"fill-color", sl==="water" ? "#0c1a2e" : "#10141f"); return; }
          if (t==="line"){
            if (sl==="transportation"){
              var c = /casing|outline/.test(id) ? "#05070d"
                    : /motorway|trunk|primary/.test(id) ? "#f2b134"
                    : /secondary|tertiary/.test(id) ? "#8893b0"
                    : "#525d7a";
              mini.setPaintProperty(id,"line-color",c);
            } else { mini.setPaintProperty(id,"line-color","#161b27"); }
          }
        }catch(_){}
      });
    }
    mini.on("load", function(){ styleMini(); miniReady = true; });
    mini.on("styledata", function(){ if (mini.isStyleLoaded()){ styleMini(); miniReady = true; } });
    mini.on("error", function(){ /* minimap is non-critical — ignore tile errors */ });

    // Recolour the (light) Liberty style into a GTA-night palette.
    function darkenStyle(){
      var layers = (map.getStyle() && map.getStyle().layers) || [];
      layers.forEach(function(L){
        var id = L.id, sl = L["source-layer"], t = L.type;
        if (sl === "building") buildingLayers.push(id);   // remember these for collision queries
        try {
          // drop hatched/patterned fills (pedestrian-plaza & wetland hachures) —
          // they read as fake diagonal lines against our dark GTA-night palette
          if (t === "fill" && L.paint && L.paint["fill-pattern"]){ map.setLayoutProperty(id,"visibility","none"); return; }
          if (t === "background"){ map.setPaintProperty(id,"background-color","#0b0e18"); return; }

          if (sl === "poi" || sl === "housenumber" || sl === "aerodrome_label"){
            map.setLayoutProperty(id,"visibility","none"); return;
          }

          // drop 3D building extrusions — expensive to render and pointless at pitch 0
          if (t === "fill-extrusion"){ map.setLayoutProperty(id,"visibility","none"); return; }

          if (t === "fill"){
            if (sl === "water")            map.setPaintProperty(id,"fill-color","#0c1a2e");
            else if (sl === "building"){
              map.setPaintProperty(id,"fill-color","#1b2133");
              try{ map.setPaintProperty(id,"fill-opacity",1); }catch(_){}
              try{ map.setLayerZoomRange(id, 12, 24); }catch(_){}   // keep the flat (dark) buildings drawn at high zoom — visuals + collision
            }
            else if (sl === "park" || /park|grass|wood|forest|golf/.test(id))
                                           map.setPaintProperty(id,"fill-color","#0f1a14");
            else                           map.setPaintProperty(id,"fill-color","#10141f");
            return;
          }

          if (t === "line"){
            if (sl === "transportation"){
              roadLayers.push(id);
              var c;
              if (/casing|outline/.test(id))             c = "#05070d";
              else if (/motorway|trunk/.test(id))        c = "#f2b134";
              else if (/primary/.test(id))               c = "#d6932f";
              else if (/secondary|tertiary/.test(id))    c = "#5b6686";
              else if (/path|pedestrian|track|cycle/.test(id)) c = "#2a3140";
              else                                       c = "#3a445e";
              map.setPaintProperty(id,"line-color",c);
            } else if (sl === "waterway"){
              map.setPaintProperty(id,"line-color","#0c1a2e");
            } else if (sl === "boundary"){
              map.setPaintProperty(id,"line-color","#283050");
            } else {
              map.setPaintProperty(id,"line-color","#1c2230");
            }
            return;
          }

          if (t === "symbol"){
            // keep only street-name labels (cheap-ish); hiding the rest cuts the
            // label-placement cost MapLibre pays on every camera move
            if (sl !== "transportation_name"){ map.setLayoutProperty(id,"visibility","none"); return; }
            map.setPaintProperty(id,"text-color","#c9d2e6");
            map.setPaintProperty(id,"text-halo-color","#05070d");
            map.setPaintProperty(id,"text-halo-width",1.4);
          }
        } catch(_){ /* layer doesn't support this prop; skip */ }
      });
    }

    // ---------- collision (buildings are solid) ----------
    // Grab the building footprints currently on screen and cache their rings in
    // local metres. Called (throttled) from the loop — needs the map painted, so
    // it quietly returns nothing on a backgrounded/headless tab.
    function refreshObstacles(){
      if (!buildingLayers.length) return;
      var feats, Q = 220, cx = window.innerWidth/2, cy = window.innerHeight/2;   // scan only near the car
      try { feats = map.queryRenderedFeatures([[cx-Q,cy-Q],[cx+Q,cy+Q]], { layers: buildingLayers }); } catch(_){ return; }
      var out = [];
      for (var f=0; f<feats.length; f++){
        var g = feats[f].geometry; if(!g) continue;
        var polys = g.type==="Polygon" ? [g.coordinates]
                  : g.type==="MultiPolygon" ? g.coordinates : null;
        if(!polys) continue;
        for (var p=0; p<polys.length; p++){
          var ring = polys[p][0]; if(!ring || ring.length<4) continue;
          var flat = new Float64Array(ring.length*2);   // flat [x,y,x,y,…] — far fewer objects for the GC than {x,y} per vertex
          for (var c=0; c<ring.length; c++){
            flat[c*2]   = (ring[c][0]-ORIGIN.lng)*DEG_LNG;
            flat[c*2+1] = (ring[c][1]-ORIGIN.lat)*DEG_LAT;
          }
          out.push(flat);
        }
      }
      obstacles = out;
    }

    // ---------- road network sampler (goal 8: traffic drives ON roads) ----------
    // Pull drivable road centrelines from the WIDE minimap (it shows ~hundreds
    // of metres, vs the tight main view that only covers ~70 m) and cache them
    // as polylines in local metres. Traffic steers to follow the nearest one.
    var DRIVE_CLASS = /^(motorway|trunk|primary|secondary|tertiary|residential|living_street|service|unclassified|road)(_link)?$/;
    function refreshRoads(){
      if (!miniReady) return;
      var feats;
      try { feats = mini.queryRenderedFeatures(); } catch(_){ return; }
      var out = [];
      for (var f=0; f<feats.length; f++){
        var ft = feats[f];
        if (ft.sourceLayer !== "transportation") continue;
        var cls = ft.properties && ft.properties["class"];
        if (cls && !DRIVE_CLASS.test(cls)) continue;            // skip footways/paths/cycleways/steps
        var g = ft.geometry; if (!g) continue;
        var lines = g.type==="LineString" ? [g.coordinates] : g.type==="MultiLineString" ? g.coordinates : null;
        if (!lines) continue;
        for (var li=0; li<lines.length; li++){
          var ring = lines[li]; if (!ring || ring.length < 2) continue;
          var flat = new Float64Array(ring.length*2);
          for (var c=0; c<ring.length; c++){ flat[c*2]=(ring[c][0]-ORIGIN.lng)*DEG_LNG; flat[c*2+1]=(ring[c][1]-ORIGIN.lat)*DEG_LAT; }
          out.push({ pts:flat, major: /^(motorway|trunk|primary|secondary)/.test(cls||"") });
        }
      }
      if (out.length){ roads = out;    // keep the last good set if a mid-pan query returns nothing
        if (roadBufCount === 0 || Math.abs(car.x-roadBufOX)+Math.abs(car.y-roadBufOY) > 18) roadBufReady = false;
      }
    }

    // nearest point on the road network to (x,y), plus the road's tangent there
    function roadField(x, y){
      var rd = roads; if (!rd.length) return null;
      var bestD2 = Infinity, qx=0, qy=0, tx=0, ty=0, found=false;
      for (var b=0; b<rd.length; b++){
        var r = rd[b].pts, n = r.length>>1;
        for (var i=0; i<n-1; i++){
          var ax=r[i*2], ay=r[i*2+1], bx=r[(i+1)*2], by=r[(i+1)*2+1];
          var dx=bx-ax, dy=by-ay, len2=dx*dx+dy*dy;
          var t = len2>1e-6 ? ((x-ax)*dx+(y-ay)*dy)/len2 : 0;
          if (t<0) t=0; else if (t>1) t=1;
          var px=ax+t*dx, py=ay+t*dy, ex=x-px, ey=y-py, dd=ex*ex+ey*ey;
          if (dd<bestD2){ bestD2=dd; qx=px; qy=py; var L=Math.sqrt(len2)||1; tx=dx/L; ty=dy/L; found=true; }
        }
      }
      if (!found) return null;
      return { qx:qx, qy:qy, tx:tx, ty:ty, dist:Math.sqrt(bestD2) };
    }

    var obstaclePending = false;
    function scheduleObstacles(){   // run the (heavy) building query off the animation frame, in idle time
      if (obstaclePending) return;
      obstaclePending = true;
      var run = function(){ obstaclePending = false; refreshObstacles(); refreshRoads(); if (gfxHigh) refreshBuildings(); };
      if (window.requestIdleCallback) requestIdleCallback(run, { timeout: 180 });
      else setTimeout(run, 1);
    }

    // Model the car as two discs along its length; shove them out of any building
    // they overlap and cancel only the velocity heading into the wall, so the car
    // scrapes/slides along buildings rather than stopping dead.
    function collide(){
      var ob = obstacles; if(!ob.length) return;
      var R = CFG.carRadius, off = CFG.carLong;
      for (var pass=0; pass<3; pass++){
        var s = Math.sin(car.heading), co = Math.cos(car.heading);
        var hit = false;
        for (var di=0; di<2; di++){
          var sgn = di===0 ? 1 : -1;
          var px = car.x + s*off*sgn, py = car.y + co*off*sgn;   // this disc's centre
          for (var b=0; b<ob.length; b++){
            var r = ob[b], n = r.length>>1; if (n < 3) continue;   // r = flat [x,y,…], n vertices
            var bestD2 = Infinity, bqx = 0, bqy = 0, inside = false;
            for (var i=0, j=n-1; i<n; j=i++){
              var ix=r[i*2], iy=r[i*2+1], jx=r[j*2], jy=r[j*2+1];
              if (((iy>py)!==(jy>py)) && (px < (jx-ix)*(py-iy)/(jy-iy)+ix)) inside = !inside;
              var dx=ix-jx, dy=iy-jy, len2=dx*dx+dy*dy;
              var t = len2>1e-6 ? ((px-jx)*dx+(py-jy)*dy)/len2 : 0;
              if(t<0)t=0; else if(t>1)t=1;
              var qx=jx+t*dx, qy=jy+t*dy, ex=px-qx, ey=py-qy, dd=ex*ex+ey*ey;
              if(dd<bestD2){ bestD2=dd; bqx=qx; bqy=qy; }
            }
            var d = Math.sqrt(bestD2) || 1e-4, nx, ny, pen;
            if (inside){ nx=(bqx-px)/d; ny=(bqy-py)/d; pen=d+R; }       // eject to nearest wall + R
            else if (d < R){ nx=(px-bqx)/d; ny=(py-bqy)/d; pen=R-d; }   // push out to the wall
            else continue;
            car.x += nx*pen; car.y += ny*pen;     // translate the whole car
            px += nx*pen; py += ny*pen;           // keep this disc current for the next building
            var vn = car.vx*nx + car.vy*ny;       // velocity component heading into the wall
            if (vn < 0){ car.vx -= vn*nx; car.vy -= vn*ny; }
            hit = true;
          }
        }
        if (!hit) break;
      }
    }

    // ---------- input ----------
    var BLOCK = {ArrowUp:1,ArrowDown:1,ArrowLeft:1,ArrowRight:1," ":1};
    window.addEventListener("keydown", function(e){
      initAudio(); resumeAudio();                                       // first key = the gesture that starts audio
      if (e.key === "Escape"){ e.preventDefault(); if (!e.repeat){ if (mapOpen) closeMap(); else toggleMenu(); } return; }
      if (e.key.toLowerCase() === "m"){ e.preventDefault(); if (!e.repeat) toggleMap(); return; }
      if (e.key.toLowerCase() === "j"){ e.preventDefault(); if (!e.repeat && !mapOpen && !paused) jobKey(); return; }
      keys[e.key.toLowerCase()] = true;
      if (BLOCK[e.key]) e.preventDefault();
      if (!mapOpen && e.key.toLowerCase() === "r") resetCar();
    }, {passive:false});
    window.addEventListener("keyup", function(e){ keys[e.key.toLowerCase()] = false; });
    window.addEventListener("pointerdown", function(){ initAudio(); resumeAudio(); });   // mouse/touch also starts audio
    window.addEventListener("blur", function(){ keys = Object.create(null); });
    window.addEventListener("resize", function(){ map.resize(); resizeFx(); resizeEnts(); resizeLight(); resizeRoad(); resizeBuild(); resizeBloom(); if (gpsMap) gpsMap.resize(); });

    function resetCar(){
      car.x=0; car.y=0; car.heading=0; car.vx=0; car.vy=0; zoomBias=0;
      if (typeof peds !== "undefined" && peds){ peds.length = 0; cops.length = 0; traffic.length = 0; heat = 0; setWanted(0); marks.length = 0; lastSkid = null; }
      if (typeof job !== "undefined"){ job = null; dest = null; renderJob(); updateGuide(); }
      clearShake();
      flash("Back to Victoria Square");
    }

    var INPUT = {};   // reused each frame so the loop allocates nothing here (less GC churn)
    function down(){
      INPUT.up   = keys["arrowup"]||keys["w"];
      INPUT.dn   = keys["arrowdown"]||keys["s"];
      INPUT.lf   = keys["arrowleft"]||keys["a"];
      INPUT.rt   = keys["arrowright"]||keys["d"];
      INPUT.hand = keys[" "]||keys["spacebar"]||keys["shift"];
      INPUT.zin  = keys["="]||keys["+"]||keys["add"];
      INPUT.zout = keys["-"]||keys["_"]||keys["subtract"];
      return INPUT;
    }

    // ---------- FPS counter + Esc menu ----------
    var paused = false, showFps = true, miniOn = true, pedsOn = true, copsOn = true, trafficOn = true, soundOn = true, gfxHigh = true;
    var emaMs = 1000/120, minFps = 999, fpsT = 0;
    var fpsEl, menuEl, fpsStateEl;

    function updateFps(){
      if (!fpsEl) fpsEl = document.getElementById("fps");
      if (fpsEl) fpsEl.innerHTML =
        "<b>" + Math.round(1000/emaMs) + "</b> FPS<span>min " + Math.round(minFps) + " · " + emaMs.toFixed(1) + " ms</span>";
    }
    function setFps(on){
      showFps = on;
      if (!fpsEl) fpsEl = document.getElementById("fps");

      if (!fpsStateEl) fpsStateEl = document.getElementById("fpsState");
      if (fpsStateEl) fpsStateEl.textContent = on ? "ON" : "OFF";
    }
    function setMini(on){
      miniOn = on;
      var el = document.getElementById("minimap"); if (el) el.style.display = on ? "block" : "none";
      var st = document.getElementById("miniState"); if (st) st.textContent = on ? "ON" : "OFF";
    }
    function setPeds(on){
      pedsOn = on;
      var st = document.getElementById("pedState"); if (st) st.textContent = on ? "ON" : "OFF";
      if (!on){ peds.length = 0; if (entCtx) entCtx.clearRect(0,0,entCanvas.width,entCanvas.height); }
    }
    function setCops(on){
      copsOn = on;
      var st = document.getElementById("copState"); if (st) st.textContent = on ? "ON" : "OFF";

    }
    function setTraffic(on){
      trafficOn = on;
      var st = document.getElementById("trafState"); if (st) st.textContent = on ? "ON" : "OFF";
      if (!on) traffic.length = 0;
    }
    function toggleMenu(open){
      if (!menuEl) menuEl = document.getElementById("menu");
      paused = (open === undefined) ? !paused : open;
      if (menuEl) menuEl.style.display = paused ? "flex" : "none";
      if (paused) keys = Object.create(null);   // forget held keys so we don't lurch on resume
    }
    document.getElementById("menu").addEventListener("click", function(e){
      var btn = e.target.closest && e.target.closest("[data-act]"); if (!btn) return;
      var act = btn.getAttribute("data-act");
      if (act === "resume") toggleMenu(false);
      else if (act === "fps") setFps(!showFps);
      else if (act === "mini") setMini(!miniOn);
      else if (act === "peds") setPeds(!pedsOn);
      else if (act === "cops") setCops(!copsOn);
      else if (act === "traffic") setTraffic(!trafficOn);
      else if (act === "snd") setSound(!soundOn);
      else if (act === "gfx") setGfx(!gfxHigh);
      else if (act === "map"){ toggleMenu(false); openMap(); }
      else if (act === "abandon"){ if (job) failJob("abandoned"); toggleMenu(false); }
      else if (act === "reset"){ resetCar(); toggleMenu(false); }
    });

    // ---------- speed FX: a cheap "motion blur" — velocity-aligned streaks + a
    // tunnel vignette that fade in with speed, to mask the strobing of fast motion ----------
    var fxCanvas, fxCtx, fxSeeds, fxActive = false;
    function resizeFx(){ if (fxCanvas){ fxCanvas.width = window.innerWidth; fxCanvas.height = window.innerHeight; } } // dpr 1 = cheap to clear
    function initFx(){
      fxCanvas = document.getElementById("fx"); if (!fxCanvas) return;
      fxCtx = fxCanvas.getContext("2d");
      resizeFx();
      fxSeeds = [];   // fixed streak anchor points (edge-biased, centre kept clear) so streaks don't flicker
      for (var i=0;i<64;i++){
        var ang = Math.random()*6.2832, rad = 0.42 + Math.random()*0.58;
        fxSeeds.push({ x:0.5 + Math.cos(ang)*rad*0.6, y:0.5 + Math.sin(ang)*rad*0.6 });
      }
    }
    function clearFx(){ if (fxCtx) fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height); }
    function drawFx(speed, vx, vy){
      if (!fxCtx) return;
      fxActive = true;
      var W=fxCanvas.width, H=fxCanvas.height;
      fxCtx.clearRect(0,0,W,H);
      var t = (speed - CFG.fxMinSpeed) / (CFG.maxSpeed - CFG.fxMinSpeed);
      if (t < 0) t = 0; else if (t > 1) t = 1;
      // tunnel vignette — darken the edges more the faster you go
      var g = fxCtx.createRadialGradient(W/2,H/2, Math.min(W,H)*0.30, W/2,H/2, Math.max(W,H)*0.62);
      g.addColorStop(0,"rgba(0,0,0,0)");
      g.addColorStop(1,"rgba(0,0,0,"+(0.40*t).toFixed(3)+")");
      fxCtx.fillStyle = g; fxCtx.fillRect(0,0,W,H);
      // streaks along the travel axis (north-up: world +y maps to screen up)
      var sp = Math.sqrt(vx*vx+vy*vy) || 1, dx = vx/sp, dy = -vy/sp, len = 16 + 95*t;
      fxCtx.strokeStyle = "rgba(205,232,255,"+(0.05 + 0.16*t).toFixed(3)+")";
      fxCtx.lineWidth = 1.2;
      fxCtx.beginPath();
      for (var i=0;i<fxSeeds.length;i++){
        var sx=fxSeeds[i].x*W, sy=fxSeeds[i].y*H;
        fxCtx.moveTo(sx, sy); fxCtx.lineTo(sx - dx*len, sy - dy*len);
      }
      fxCtx.stroke();
    }

    // ---------- world entities: pedestrians (ambient street life) ----------
    // Cheap canvas-drawn NPCs living in the SAME local-metre frame as the car.
    // A small pool wanders, scatters from a fast car, and culls/respawns in a
    // ring so the count stays bounded. This layer + projection is the shared
    // groundwork for traffic and cops next.
    var entCanvas, entCtx, peds = [], cops = [], traffic = [], heat = 0, wanted = 0, copLoseT = 0, copSpawnT = 0, marks = [], lastSkid = null;
    var PED_COLS = ["#c9d2e6","#9aa7c7","#b58b6a","#8d759e","#7e8aa6","#cdb48a"];
    var ppmCache = 5.8, ppmZoom = -1;   // pixels per local-metre; only re-measured when zoom changes

    function initEnts(){
      entCanvas = document.getElementById("ents"); if (!entCanvas) return;
      entCtx = entCanvas.getContext("2d");
      resizeEnts();
    }
    function resizeEnts(){ if (entCanvas){ entCanvas.width = window.innerWidth; entCanvas.height = window.innerHeight; } }

    // px per local-metre straight from the live map transform (no tile-size
    // guesswork). Mercator is conformal, so one scale serves both axes; we only
    // re-measure on a zoom change, so it's ~free per frame.
    function pxPerMetre(ll, zoom){
      if (Math.abs(zoom - ppmZoom) < 1e-3) return ppmCache;
      try {
        var a = map.project(ll), b = map.project([ll[0], ll[1] + 0.0009]);
        var dpx = Math.sqrt((b.x-a.x)*(b.x-a.x) + (b.y-a.y)*(b.y-a.y));
        var v = dpx / (0.0009 * DEG_LAT);
        if (v > 0.05 && v < 200){ ppmCache = v; ppmZoom = zoom; }
      } catch(_){}
      return ppmCache;
    }

    function spawnPed(){
      var ang = Math.random()*6.2832;
      var dist = CFG.pedRing0 + Math.random()*(CFG.pedRing1-CFG.pedRing0);
      var x = car.x + Math.cos(ang)*dist, y = car.y + Math.sin(ang)*dist;
      var side = Math.random() < 0.5 ? 1 : -1, dir = Math.random()*6.2832;
      var rf = roadField(x, y);                              // start on a footpath beside the nearest road
      if (rf && rf.dist < 120){
        var tx = rf.tx, ty = rf.ty; if (Math.random() < 0.5){ tx = -tx; ty = -ty; }
        x = rf.qx - ty*side*CFG.pedWalk; y = rf.qy + tx*side*CFG.pedWalk; dir = Math.atan2(ty, tx);
      }
      peds.push({
        x:x, y:y, dir:dir,
        spd: 0.6 + Math.random()*0.9,     // m/s stroll
        t:   0.5 + Math.random()*3,       // seconds until the next wander wobble (off-road only)
        flee:0,                           // >0 = fleeing the car (seconds left)
        col: PED_COLS[(Math.random()*PED_COLS.length)|0],
        ph:  Math.random()*6.2832,        // walk-bob phase
        side:side, rt:Math.random()*0.3, rdir:dir, onRoad:0   // footpath side + throttled road-lookup state
      });
    }

    function updatePeds(dt){
      var carSpd = Math.sqrt(car.vx*car.vx + car.vy*car.vy);
      while (peds.length < CFG.maxPeds) spawnPed();
      var cull2 = CFG.pedCull*CFG.pedCull, fleeR2 = CFG.pedFleeR*CFG.pedFleeR, hitR2 = CFG.pedHitR*CFG.pedHitR;
      for (var i=peds.length-1; i>=0; i--){
        var p = peds[i];
        var dx = p.x-car.x, dy = p.y-car.y, d2 = dx*dx+dy*dy;
        if (d2 > cull2){ peds.splice(i,1); continue; }                       // gone — the while above respawns it
        if (carSpd > 4 && d2 < fleeR2){ p.dir = Math.atan2(dy,dx); p.flee = 1.1; }  // bolt directly away from the car
        if (carSpd > 7 && d2 < hitR2){ flash("Hey! Watch it!"); heat += CFG.heatPerPed; peds.splice(i,1); continue; }  // clipped → wanted heat
        if (p.flee > 0){ p.flee -= dt; }                                    // panic: keep bolting from the car
        else {
          // stroll along the nearest footpath; refresh the road lookup only a
          // few times a second (peds are slow) to keep it cheap
          p.rt -= dt;
          if (p.rt <= 0){
            p.rt = 0.3;
            var rf = roadField(p.x, p.y);                                   // nearest road at any distance
            if (rf){
              var dvx = Math.cos(p.dir), dvy = Math.sin(p.dir), tx = rf.tx, ty = rf.ty;
              if (dvx*tx + dvy*ty < 0){ tx = -tx; ty = -ty; }               // walk the way we face
              var fx2 = rf.qx - ty*p.side*CFG.pedWalk, fy2 = rf.qy + tx*p.side*CFG.pedWalk;  // footpath point
              var ox = fx2-p.x, oy = fy2-p.y, ol = Math.sqrt(ox*ox+oy*oy);
              if (ol > 0.5){ var kp = Math.min(1.4, ol/4); tx += ox/ol*kp; ty += oy/ol*kp; }  // off the path → head to it; on it → stroll
              p.rdir = Math.atan2(ty, tx); p.onRoad = 1;
              if (Math.random() < 0.04) p.side = -p.side;                   // occasionally cross the street
            } else p.onRoad = 0;
          }
          if (p.onRoad){
            var dp = angDiff(p.rdir, p.dir), mp = CFG.pedTurn*dt;
            p.dir += Math.max(-mp, Math.min(mp, dp));
          } else { p.t -= dt; if (p.t <= 0){ p.dir += (Math.random()-0.5)*1.6; p.t = 1 + Math.random()*3; } }
        }
        var spd = p.spd * (p.flee > 0 ? 4.5 : 1);
        p.x += Math.cos(p.dir)*spd*dt;
        p.y += Math.sin(p.dir)*spd*dt;
        p.ph += spd*dt*3;
      }
    }

    function drawPeds(ppm){
      var W = entCanvas.width, H = entCanvas.height, cx = W*0.5, cy = H*0.5;
      var r = Math.max(2, ppm*0.45), mar = 24;
      entCtx.lineWidth = 1; entCtx.strokeStyle = "rgba(5,7,13,.85)";
      for (var i=0; i<peds.length; i++){
        var p = peds[i];
        var sx = cx + (p.x-car.x)*ppm, sy = cy - (p.y-car.y)*ppm;
        if (sx < -mar || sx > W+mar || sy < -mar || sy > H+mar) continue;
        var bob = Math.sin(p.ph)*r*0.18;
        entCtx.beginPath(); entCtx.ellipse(sx+ppm*0.3, sy+ppm*0.45+bob, r*1.05, r*0.7, 0, 0, 6.2832); entCtx.fillStyle="rgba(0,0,0,0.30)"; entCtx.fill();   // little ped shadow
        entCtx.beginPath(); entCtx.arc(sx, sy+bob, r, 0, 6.2832);
        entCtx.fillStyle = p.col; entCtx.fill(); entCtx.stroke();
      }
    }

    // ---------- cops + wanted/heat (goal 2: run from the cops) ----------
    // Heat rises with crimes (clipping pedestrians for now) → a 0–5 star wanted
    // level. Each star spawns a cruiser (rate-limited, biased behind you) that
    // homes in with simple arcade pursuit: turn toward you, gas it, tyre-grip
    // cornering, shove out of buildings. Their top speed is below yours, so you
    // CAN outrun them; break line-of-sight long enough and the heat cools.
    function wantedFromHeat(h){ return h<0.6?0 : h<1.6?1 : h<3?2 : h<4.6?3 : h<6.5?4 : 5; }
    function angDiff(a,b){ var d=(a-b)%6.2832; if(d>3.1416)d-=6.2832; else if(d<-3.1416)d+=6.2832; return d; }

    function spawnCop(carSpd){
      var ang = carSpd > 5 ? Math.atan2(-car.vy, -car.vx) + (Math.random()-0.5)*1.4   // behind your travel
                           : Math.random()*6.2832;
      var d = CFG.copSpawnR + Math.random()*60;
      var x = car.x + Math.cos(ang)*d, y = car.y + Math.sin(ang)*d;
      cops.push({ x:x, y:y, heading: Math.atan2(car.x-x, car.y-y), vx:0, vy:0, light: Math.random()*6.28, bust:0 });
    }

    // shove one disc-shaped entity out of building footprints (cop version of
    // the car's collide(); a single pass is plenty for a pursuer)
    function collideDisc(e, R){
      var ob = obstacles; if (!ob.length) return;
      for (var b=0; b<ob.length; b++){
        var r = ob[b], n = r.length>>1; if (n < 3) continue;
        var bestD2 = Infinity, bqx=0, bqy=0, inside=false, px=e.x, py=e.y;
        for (var i=0, j=n-1; i<n; j=i++){
          var ix=r[i*2], iy=r[i*2+1], jx=r[j*2], jy=r[j*2+1];
          if (((iy>py)!==(jy>py)) && (px < (jx-ix)*(py-iy)/(jy-iy)+ix)) inside = !inside;
          var dx=ix-jx, dy=iy-jy, len2=dx*dx+dy*dy;
          var t = len2>1e-6 ? ((px-jx)*dx+(py-jy)*dy)/len2 : 0;
          if(t<0)t=0; else if(t>1)t=1;
          var qx=jx+t*dx, qy=jy+t*dy, ex=px-qx, ey=py-qy, dd=ex*ex+ey*ey;
          if(dd<bestD2){ bestD2=dd; bqx=qx; bqy=qy; }
        }
        var d=Math.sqrt(bestD2)||1e-4, nx, ny, pen;
        if (inside){ nx=(bqx-px)/d; ny=(bqy-py)/d; pen=d+R; }
        else if (d < R){ nx=(px-bqx)/d; ny=(py-bqy)/d; pen=R-d; }
        else continue;
        e.x+=nx*pen; e.y+=ny*pen;
        var vn=e.vx*nx+e.vy*ny; if(vn<0){ e.vx-=vn*nx; e.vy-=vn*ny; }
      }
    }

    function updateCops(dt){
      var carSpd = Math.sqrt(car.vx*car.vx + car.vy*car.vy);
      var stars = wantedFromHeat(heat);
      copSpawnT -= dt;
      if (stars > 0 && cops.length < Math.min(stars, CFG.copMax) && copSpawnT <= 0){ spawnCop(carSpd); copSpawnT = 1.3; }
      var anyClose = false, busted = false;
      for (var i=cops.length-1; i>=0; i--){
        var c = cops[i];
        var dx = car.x-c.x, dy = car.y-c.y, dist = Math.sqrt(dx*dx+dy*dy);
        if (stars === 0 || dist > CFG.copDespawnR*1.4){ cops.splice(i,1); continue; }   // gave up / way off
        if (dist < CFG.copSightR) anyClose = true;
        // pursue: weave along roads toward you when far (real-chase feel), then
        // go straight at you for the takedown once close
        var desired;
        var rfc = (dist > CFG.copRoadR) ? roadField(c.x, c.y) : null;
        if (rfc){
          var ctx = rfc.tx, cty = rfc.ty;
          if (ctx*dx + cty*dy < 0){ ctx = -ctx; cty = -cty; }                       // head along the road toward you
          var cox = rfc.qx-c.x, coy = rfc.qy-c.y, col = Math.sqrt(cox*cox+coy*coy);
          if (col > 2){ var ck = Math.min(0.8, col/8); ctx += cox/col*ck; cty += coy/col*ck; }   // stay on the road
          var dl = dist||1; ctx += (dx/dl)*0.35; cty += (dy/dl)*0.35;               // bias toward you (cut at junctions)
          desired = Math.atan2(ctx, cty);
        } else {
          desired = Math.atan2(dx, dy);                                             // close → straight at you
        }
        var mt = CFG.copTurn*dt, da = angDiff(desired, c.heading);
        c.heading += Math.max(-mt, Math.min(mt, da));
        var fxx = Math.sin(c.heading), fyy = Math.cos(c.heading), rxx = Math.cos(c.heading), ryy = -Math.sin(c.heading);
        c.vx += fxx*CFG.copAccel*dt; c.vy += fyy*CFG.copAccel*dt;
        var fwd = c.vx*fxx + c.vy*fyy, lat = c.vx*rxx + c.vy*ryy;
        lat *= Math.exp(-6*dt);                                   // tyre grip — corner like a car, not a hovercraft
        c.vx = fxx*fwd + rxx*lat; c.vy = fyy*fwd + ryy*lat;
        var sp = Math.sqrt(c.vx*c.vx + c.vy*c.vy);
        if (sp > CFG.copMaxSpeed){ var kk = CFG.copMaxSpeed/sp; c.vx*=kk; c.vy*=kk; }
        c.x += c.vx*dt; c.y += c.vy*dt;
        collideDisc(c, CFG.carRadius);
        c.light += dt;
        if (dist < 7.5){                                         // solid contact — cops can ram / box you in
          var nx = dx/(dist||1), ny = dy/(dist||1), ov = (7.5-dist)*0.5;
          car.x += nx*ov; car.y += ny*ov; c.x -= nx*ov; c.y -= ny*ov;
        }
        if (dist < 7 && carSpd < 4){ c.bust += dt; if (c.bust > 2.5) busted = true; } else c.bust = 0;
      }
      // heat cools only while out of police sight
      if (anyClose){ copLoseT = 0; }
      else {
        copLoseT += dt;
        heat = Math.max(0, heat - CFG.heatDecay*dt);
        if (copLoseT > CFG.loseTime && heat > 0){
          heat = Math.max(0, heat - 0.9); copLoseT = 0;
          flash(wantedFromHeat(heat) <= 0 ? "You lost the cops!" : "You're shaking them…");
        }
      }
      if (busted){ flash("BUSTED!"); heat = 0; cops.length = 0; }
      setWanted(wantedFromHeat(heat));
    }

    function drawCops(ppm){
      var W = entCanvas.width, H = entCanvas.height, cx = W*0.5, cy = H*0.5, mar = 48;
      var w = ppm*4.6, l = ppm*9, rr = Math.max(1.5, ppm*1.1);
      for (var i=0; i<cops.length; i++){
        var c = cops[i];
        var sx = cx + (c.x-car.x)*ppm, sy = cy - (c.y-car.y)*ppm;
        if (sx < -mar || sx > W+mar || sy < -mar || sy > H+mar) continue;
        entCtx.beginPath(); entCtx.ellipse(sx+ppm*0.5, sy+ppm*0.9, w*0.6, l*0.55, c.heading, 0, 6.2832); entCtx.fillStyle="rgba(0,0,0,0.33)"; entCtx.fill();   // ground shadow
        entCtx.save(); entCtx.translate(sx, sy); entCtx.rotate(c.heading);
        roundRectPath(entCtx, -w/2, -l/2, w, l, rr);
        entCtx.fillStyle = "#11151f"; entCtx.fill();
        entCtx.lineWidth = 1; entCtx.strokeStyle = "#05070d"; entCtx.stroke();
        entCtx.fillStyle = "#e8edf7"; entCtx.fillRect(-w/2, -l*0.12, w, l*0.24);    // police door panel
        var on = Math.sin(c.light*9) > 0;                                           // flashing roof bar
        entCtx.fillStyle = on ? "#ff3b3b" : "#243154"; entCtx.fillRect(-w*0.40, -l*0.07, w*0.36, l*0.14);
        entCtx.fillStyle = on ? "#243154" : "#3b7bff"; entCtx.fillRect(w*0.04,  -l*0.07, w*0.36, l*0.14);
        entCtx.restore();
      }
    }
    function roundRectPath(ctx, x, y, w, h, r){
      ctx.beginPath(); ctx.moveTo(x+r, y);
      ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
      ctx.arcTo(x, y+h, x, y, r);     ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
    }

    var wantedEl, prevStars = -1;
    function repeatCh(ch, n){ var s=""; for (var i=0;i<n;i++) s+=ch; return s; }
    function setWanted(stars){
      wanted = stars;
      if (stars === prevStars) return;
      if (stars > prevStars && stars > 0) flash("WANTED " + repeatCh("★", stars));
      prevStars = stars;
      if (!wantedEl) wantedEl = document.getElementById("wanted");
      if (!wantedEl) return;
      wantedEl.style.display = stars > 0 ? "block" : "none";
      wantedEl.innerHTML = stars > 0 ? ("WANTED <b>" + repeatCh("★", stars) + "</b><i>" + repeatCh("☆", 5-stars) + "</i>") : "";
    }

    // ---------- ambient traffic (civilian cars to dodge) ----------
    // Cars that cruise + gently wander and are SOLID against you and buildings.
    // They reuse collideDisc for walls and a ram-impulse against the player, so
    // weaving through them at speed actually matters. Shoved out of buildings,
    // they naturally flow down the street gaps — cheap, road-ish behaviour with
    // no road graph (street-following is a later polish step).
    var TRAF_COLS = ["#3a4a6b","#6b3a3a","#3a6b52","#6b5f3a","#52426b","#4a4a4a","#7088a8","#8a8f9c"];
    function spawnTraffic(){
      var ang = Math.random()*6.2832, d = CFG.trafRing0 + Math.random()*(CFG.trafRing1-CFG.trafRing0);
      var x = car.x + Math.cos(ang)*d, y = car.y + Math.sin(ang)*d, heading = Math.random()*6.2832;
      var rf = roadField(x, y);                                   // start in the LEFT lane, facing along the road
      if (rf && rf.dist < 45){
        var stx = rf.tx, sty = rf.ty;
        if (Math.random() < 0.5){ stx = -stx; sty = -sty; }      // random direction along the road
        x = rf.qx - sty*CFG.laneOffset; y = rf.qy + stx*CFG.laneOffset;   // sit half a lane to the left
        heading = Math.atan2(stx, sty);
      }
      traffic.push({
        x:x, y:y, heading:heading, vx:0, vy:0,
        spd: CFG.trafMinSpd + Math.random()*(CFG.trafMaxSpd-CFG.trafMinSpd),
        turn: (Math.random()-0.5)*CFG.trafTurn, tt: 1+Math.random()*3, stuck: 0,
        col: TRAF_COLS[(Math.random()*TRAF_COLS.length)|0]
      });
    }
    function updateTraffic(dt){
      while (traffic.length < CFG.maxTraffic) spawnTraffic();
      var cull2 = CFG.trafCull*CFG.trafCull;
      for (var i=traffic.length-1; i>=0; i--){
        var c = traffic[i];
        var dx = car.x-c.x, dy = car.y-c.y, d2 = dx*dx+dy*dy;
        if (d2 > cull2){ traffic.splice(i,1); continue; }      // out of range — respawn via the while above
        // steer to follow the nearest road (the way we're already facing) + a
        // pull toward its centreline; gentle wander only when no road is near
        var rf = roadField(c.x, c.y);
        if (rf && rf.dist < CFG.roadSnapR){
          var hx = Math.sin(c.heading), hy = Math.cos(c.heading);
          var tgx = rf.tx, tgy = rf.ty;
          if (hx*tgx + hy*tgy < 0){ tgx = -tgx; tgy = -tgy; }            // travel the way we face
          // keep LEFT (AU): aim half a lane to the left of the centreline (left-normal of travel)
          var laneX = rf.qx - tgy*CFG.laneOffset, laneY = rf.qy + tgx*CFG.laneOffset;
          var offx = laneX-c.x, offy = laneY-c.y, off = Math.sqrt(offx*offx+offy*offy);
          if (off > 1){ var kk = Math.min(0.8, off/7); tgx += offx/off*kk; tgy += offy/off*kk; }          // pull into the left lane
          var da = angDiff(Math.atan2(tgx, tgy), c.heading), mt = CFG.trafSteer*dt;
          c.heading += Math.max(-mt, Math.min(mt, da));
          c.stuck = 0;
        } else {
          c.tt -= dt; if (c.tt <= 0){ c.turn = (Math.random()-0.5)*CFG.trafTurn; c.tt = 1+Math.random()*3; }
          c.heading += c.turn*dt;
        }
        var fxx = Math.sin(c.heading), fyy = Math.cos(c.heading), rxx = Math.cos(c.heading), ryy = -Math.sin(c.heading);
        // car-following: ease off for the nearest car / player ahead in my lane
        var gap = CFG.followLook;
        var rax = car.x-c.x, ray = car.y-c.y, fdp = rax*fxx+ray*fyy, ldp = rax*rxx+ray*ryy;
        if (fdp > 0 && fdp < gap && Math.abs(ldp) < CFG.laneHalf) gap = fdp;          // the player ahead
        for (var j=0; j<traffic.length; j++){
          if (j === i) continue; var o = traffic[j];
          var rox = o.x-c.x, roy = o.y-c.y, fdo = rox*fxx+roy*fyy, ldo = rox*rxx+roy*ryy;
          if (fdo > 0 && fdo < gap && Math.abs(ldo) < CFG.laneHalf) gap = fdo;        // another car ahead
        }
        var slowing = gap < CFG.followLook;
        var targetSpd = slowing ? c.spd * Math.max(0, Math.min(1, (gap-CFG.followStop)/(CFG.followLook-CFG.followStop))) : c.spd;
        var fwd = c.vx*fxx + c.vy*fyy, lat = c.vx*rxx + c.vy*ryy;
        fwd += (targetSpd - fwd) * Math.min(1, dt*(targetSpd < fwd ? 3.2 : 1.5));     // brake faster than we accelerate            // ease toward cruise speed
        lat *= Math.exp(-7*dt);                                // tyre grip
        c.vx = fxx*fwd + rxx*lat; c.vy = fyy*fwd + ryy*lat;
        var preX = c.x, preY = c.y;
        c.x += c.vx*dt; c.y += c.vy*dt;
        collideDisc(c, CFG.carRadius);
        // if shoved to a near-stop against a wall, turn away and try again
        if (!slowing && Math.abs(c.x-preX)+Math.abs(c.y-preY) < c.spd*dt*0.3){ c.stuck += dt; if (c.stuck > 0.7){ c.heading += 2 + Math.random(); c.stuck = 0; } }
        else c.stuck = 0;
        // solid against the player — bump apart + a ram impulse so hits matter
        if (d2 < 64){
          var dist = Math.sqrt(d2) || 1, nx = dx/dist, ny = dy/dist, ov = (8-dist)*0.5;
          car.x += nx*ov; car.y += ny*ov; c.x -= nx*ov; c.y -= ny*ov;
          var vn = car.vx*nx + car.vy*ny;                      // player's speed along the contact normal
          if (vn < 0){                                         // player driving into the car
            car.vx -= nx*vn*0.5; car.vy -= ny*vn*0.5;          // bleed half (a jolt)
            c.vx   += nx*vn*0.9; c.vy   += ny*vn*0.9;          // shove the civvy along the hit
          }
        }
      }
    }
    function drawTraffic(ppm){
      var W = entCanvas.width, H = entCanvas.height, cx = W*0.5, cy = H*0.5, mar = 48;
      var w = ppm*4.4, l = ppm*8.6, rr = Math.max(1.5, ppm*1.0);
      for (var i=0; i<traffic.length; i++){
        var c = traffic[i];
        var sx = cx + (c.x-car.x)*ppm, sy = cy - (c.y-car.y)*ppm;
        if (sx < -mar || sx > W+mar || sy < -mar || sy > H+mar) continue;
        entCtx.beginPath(); entCtx.ellipse(sx+ppm*0.5, sy+ppm*0.9, w*0.6, l*0.55, c.heading, 0, 6.2832); entCtx.fillStyle="rgba(0,0,0,0.33)"; entCtx.fill();   // ground shadow
        entCtx.save(); entCtx.translate(sx, sy); entCtx.rotate(c.heading);
        roundRectPath(entCtx, -w/2, -l/2, w, l, rr);
        entCtx.fillStyle = c.col; entCtx.fill();
        entCtx.lineWidth = 1; entCtx.strokeStyle = "#05070d"; entCtx.stroke();
        entCtx.fillStyle = "rgba(184,214,242,.32)"; entCtx.fillRect(-w*0.32, -l*0.34, w*0.64, l*0.22);  // windshield
        entCtx.restore();
      }
    }

    // ---------- GPS / travel map (goals 4 & 5: in-game GPS + all of Australia) ----------
    // Open with M: a 3rd, interactive MapLibre instance (lazy-created) you can
    // pan around the whole country. Pick a city chip or tap the map, then either
    // SET a destination (HUD arrow + distance + minimap dot guide you there) or
    // DRIVE there — which rebases the local ORIGIN to that point so you can play
    // anywhere in Australia while the flat-earth metre frame stays valid.
    var dest = null, mapOpen = false, gpsMap = null, gpsMarker = null, gpsStyled = false, pick = null;
    var AU_CITIES = [
      {n:"Adelaide",     lng:138.6007, lat:-34.9285},
      {n:"Melbourne",    lng:144.9631, lat:-37.8136},
      {n:"Sydney",       lng:151.2093, lat:-33.8688},
      {n:"Brisbane",     lng:153.0251, lat:-27.4698},
      {n:"Perth",        lng:115.8605, lat:-31.9523},
      {n:"Canberra",     lng:149.1300, lat:-35.2809},
      {n:"Hobart",       lng:147.3257, lat:-42.8821},
      {n:"Darwin",       lng:130.8456, lat:-12.4634},
      {n:"Gold Coast",   lng:153.4000, lat:-28.0167},
      {n:"Alice Springs",lng:133.8807, lat:-23.6980}
    ];

    function initGps(){
      var box = document.getElementById("gpsCities");
      if (box){
        for (var i=0;i<AU_CITIES.length;i++){
          (function(ct){
            var b = document.createElement("button");
            b.className = "gchip"; b.textContent = ct.n;
            b.addEventListener("click", function(){ gotoCity(ct); });
            box.appendChild(b);
          })(AU_CITIES[i]);
        }
      }
      var go = document.getElementById("gpsGo"), set = document.getElementById("gpsSet"), cl = document.getElementById("gpsClose");
      if (go)  go.addEventListener("click",  function(){ if (pick){ teleportTo(pick.lng, pick.lat, pick.label); closeMap(); } });
      if (set) set.addEventListener("click", function(){ if (pick){ setDestination(pick.lng, pick.lat, pick.label); closeMap(); } });
      if (cl)  cl.addEventListener("click",  closeMap);
