<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>ADELAIDE DRIVER</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  :root{
    --ink:#0b0e18;
    --hud:#0c1020cc;
    --line:#2a3350;
    --accent:#f2b134;
    --text:#dfe6f5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;
    font-family:"Segoe UI",system-ui,Arial,sans-serif;color:var(--text);
    -webkit-user-select:none;user-select:none;touch-action:none;}
  #map{position:absolute;inset:0;background:var(--ink);}
  .maplibregl-ctrl-attrib{font-size:10px;opacity:.7;}

  /* vignette for mood */
  #vignette{position:absolute;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%);}
  /* speed FX overlay (motion-blur streaks) — above the map, below the car so the car stays crisp */
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:8;}

  /* the car, locked to screen centre */
  #car{position:absolute;left:50%;top:50%;z-index:10;pointer-events:none;
    transform:translate(-50%,-50%);
    filter:drop-shadow(0 6px 5px rgba(0,0,0,.6));
    will-change:transform;}

  /* HUD */
  .hud{position:absolute;z-index:20;background:var(--hud);border:1px solid var(--line);
    border-radius:10px;padding:8px 12px;backdrop-filter:blur(4px);
    box-shadow:0 4px 18px rgba(0,0,0,.45);}
  #speedo{left:16px;bottom:16px;min-width:118px;text-align:center;}
  #speedo .num{font-size:38px;font-weight:800;line-height:1;letter-spacing:-1px;
    font-variant-numeric:tabular-nums;color:#fff;}
  #speedo .unit{font-size:11px;opacity:.65;letter-spacing:2px;}
  #speedo .gear{margin-top:4px;font-size:12px;font-weight:700;color:var(--accent);letter-spacing:1px;}
  #help{right:16px;bottom:16px;font-size:12px;line-height:1.7;opacity:.92;max-width:230px;}
  #help b{color:var(--accent);font-weight:700;}
  #street{left:50%;top:16px;transform:translateX(-50%);font-size:14px;font-weight:700;
    letter-spacing:.5px;opacity:0;transition:opacity .25s;white-space:nowrap;}
  #notice{left:50%;top:54px;transform:translateX(-50%);font-size:13px;opacity:0;
    transition:opacity .4s;background:var(--accent);color:#1a1303;border:none;font-weight:700;}

  /* GPS minimap (top-right) */
  #minimap{position:absolute;top:16px;right:16px;width:208px;height:208px;z-index:20;
    border-radius:50%;overflow:hidden;border:3px solid #2a3350;
    box-shadow:0 6px 22px rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,255,255,.05);}
  #miniMap{position:absolute;inset:0;background:var(--ink);}
  #miniCar{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
    pointer-events:none;filter:drop-shadow(0 0 3px rgba(0,0,0,.85));}
  #miniLabel{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);z-index:3;
    font-size:9px;letter-spacing:2px;opacity:.55;pointer-events:none;}
  @media(max-width:600px){#minimap{width:132px;height:132px;}}

  /* debug FPS counter (top-left) */
  #fps{position:absolute;left:16px;top:16px;z-index:25;font-family:Consolas,"SF Mono",monospace;
    color:#9affc6;background:rgba(6,10,20,.72);border:1px solid var(--line);border-radius:8px;
    padding:5px 10px;pointer-events:none;line-height:1.15;}
  #fps b{font-size:20px;color:#fff;font-weight:800;}
  #fps span{display:block;opacity:.75;font-size:10px;letter-spacing:.5px;color:#cfe;}

  /* Esc menu */
  #menu{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    background:rgba(4,6,12,.72);backdrop-filter:blur(3px);}
  .menu-panel{background:rgba(12,16,32,.96);border:1px solid var(--line);border-radius:16px;
    padding:24px 22px;width:300px;max-width:86vw;box-shadow:0 18px 60px rgba(0,0,0,.6);text-align:center;}
  .menu-panel h2{margin:0;font-size:24px;font-weight:900;letter-spacing:1px;color:#fff;}
  .menu-panel .tag{font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:.5;margin:2px 0 16px;}
  .menu-item{display:flex;justify-content:space-between;align-items:center;width:100%;
    background:#141a2e;border:1px solid var(--line);color:var(--text);border-radius:10px;
    padding:11px 14px;margin:7px 0;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
    transition:background .12s,border-color .12s;}
  .menu-item:hover{background:#1d2742;border-color:var(--accent);}
  .menu-item span{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:1px;}
  .menu-hint{margin-top:12px;font-size:11px;opacity:.45;letter-spacing:1px;}

  /* loading / title screen */
  #boot{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;background:var(--ink);
    transition:opacity .6s;}
  #boot h1{margin:0;font-size:13vw;font-weight:900;letter-spacing:-4px;
    background:linear-gradient(180deg,#fff,var(--accent));-webkit-background-clip:text;
    background-clip:text;color:transparent;line-height:.9;}
  #boot .sub{font-size:14px;letter-spacing:6px;opacity:.7;text-transform:uppercase;}
  #boot .spin{width:34px;height:34px;border:3px solid #2a3350;border-top-color:var(--accent);
    border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #boot.hide{opacity:0;pointer-events:none;}
  @media(min-width:900px){#boot h1{font-size:120px;}}
</style>
</head>
<body>
  <div id="map"></div>
  <div id="vignette"></div>
  <canvas id="fx"></canvas>

  <!-- top-down car (front points up) -->
  <div id="car">
    <svg id="carSvg" viewBox="0 0 48 80" width="34" height="57" xmlns="http://www.w3.org/2000/svg">
      <rect x="2"  y="14" width="7" height="16" rx="3" fill="#0d0d10"/>
      <rect x="39" y="14" width="7" height="16" rx="3" fill="#0d0d10"/>
      <rect x="2"  y="50" width="7" height="16" rx="3" fill="#0d0d10"/>
      <rect x="39" y="50" width="7" height="16" rx="3" fill="#0d0d10"/>
      <rect x="7"  y="3"  width="34" height="74" rx="12" fill="#e23b2e" stroke="#5e130d" stroke-width="2"/>
      <rect x="11" y="27" width="26" height="28" rx="7" fill="#b62b20"/>
      <path d="M12 27 Q24 19 36 27 L34 34 Q24 30 14 34 Z" fill="#cdecff" opacity="0.92"/>
      <path d="M14 49 Q24 45 34 49 L36 56 Q24 60 12 56 Z" fill="#a9d6f2" opacity="0.85"/>
      <rect x="11" y="3.5"  width="6" height="4" rx="2" fill="#fff3b0"/>
      <rect x="31" y="3.5"  width="6" height="4" rx="2" fill="#fff3b0"/>
      <rect x="11" y="72.5" width="6" height="4" rx="2" fill="#ff5a4d"/>
      <rect x="31" y="72.5" width="6" height="4" rx="2" fill="#ff5a4d"/>
    </svg>
  </div>

  <!-- HUD -->
  <div id="street" class="hud"></div>
  <div id="notice" class="hud"></div>
  <div id="speedo" class="hud">
    <div class="num" id="kmh">0</div>
    <div class="unit">KM/H</div>
    <div class="gear" id="gear">D</div>
  </div>
  <div id="help" class="hud">
    <b>&uarr; / W</b> accelerate<br>
    <b>&darr; / S</b> brake &middot; reverse<br>
    <b>&larr; &rarr; / A D</b> steer<br>
    <b>SPACE / SHIFT</b> handbrake &middot; drift<br>
    <b>+ / &minus;</b> zoom &middot; <b>R</b> reset<br>
    <b>ESC</b> menu
  </div>

  <!-- GPS minimap -->
  <div id="minimap">
    <div id="miniMap"></div>
    <div id="miniCar">
      <svg viewBox="0 0 24 24" width="22" height="22" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2 L20 21 L12 16 L4 21 Z" fill="#39e0ff" stroke="#062430" stroke-width="1.3"/>
      </svg>
    </div>
    <div id="miniLabel">GPS</div>
  </div>

  <!-- debug FPS counter -->
  <div id="fps"></div>

  <!-- Esc menu -->
  <div id="menu">
    <div class="menu-panel">
      <h2>PAUSED</h2>
      <div class="tag">Adelaide Driver</div>
      <button class="menu-item" data-act="resume">Resume <span>ESC</span></button>
      <button class="menu-item" data-act="fps">FPS counter <span id="fpsState">ON</span></button>
      <button class="menu-item" data-act="mini">Minimap <span id="miniState">ON</span></button>
      <button class="menu-item" data-act="reset">Reset to start <span>R</span></button>
      <div class="menu-hint">Esc to resume</div>
    </div>
  </div>

  <div id="boot">
    <h1>ADELAIDE</h1>
    <div class="sub">Driver</div>
    <div class="spin"></div>
    <div class="sub" id="bootmsg" style="letter-spacing:2px;font-size:11px;">loading the streets&hellip;</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <script>
  (function(){
    "use strict";

    // ---- Adelaide CBD spawn (King William St / Victoria Square) ----
    var ORIGIN = { lng: 138.6005, lat: -34.9290 };
    var DEG_LAT = 110540;                                   // metres per degree latitude
    var DEG_LNG = 111320 * Math.cos(ORIGIN.lat*Math.PI/180); // metres per degree longitude here

    // ---- arcade physics (metres, seconds) ----
    var CFG = {
      accel:       52,    // throttle acceleration  m/s^2 — big OOMPH off the line
      brake:       55,    // braking deceleration
      reverseMax:  9,     // top reverse speed  m/s  (~32 km/h)
      maxSpeed:    139,   // hard speed cap  m/s  (~500 km/h), reached in ~4s
      drag:        0.22,  // longitudinal coast-down (per second, proportional)
      roll:        2.0,   // rolling resistance (settles the car to a full stop)
      turn:        1.8,   // max steering rate  rad/s
      grip:        7.5,   // forward speed (m/s) at which steering is fully effective
      gripRoad:    6.0,   // lateral traction — how fast tyres kill a sideways slide
      gripSlide:   0.9,   // lateral traction with the handbrake on (low = big drift)
      handDrag:    0.5,   // extra forward scrub while handbraking
      handSteer:   1.8,   // steering multiplier on the handbrake (kick the tail out)
      carRadius:   6,     // collision disc radius (m) — ~half the car's on-screen width
      carLong:     4,     // collision discs sit this far fore/aft of centre (gives it length)
      baseZoom:    18.5,  // START fully zoomed in (tightest) — this is the default
      zoomMin:     15,    // player can pull the camera out this far with  -
      zoomMax:     18.5,  // can't zoom in past the default
      miniZoom:    14,    // GPS minimap zoom — wider overview (top-right)
      fxMinSpeed:  22     // m/s (~80 km/h) where the speed FX (motion-blur streaks) fades in
    };

    var car = { x:0, y:0, heading:0, vx:0, vy:0 };  // heading rad (0=N, +CW); vx/vy = world velocity m/s
    var zoomBias = 0;
    var viewZoom = CFG.baseZoom;                 // eased camera zoom (smooth manual zoom)
    var keys = Object.create(null);
    var ready = false;

    function toLngLat(){
      return [ ORIGIN.lng + car.x/DEG_LNG, ORIGIN.lat + car.y/DEG_LAT ];
    }

    // ---------- map ----------
    var map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: [ORIGIN.lng, ORIGIN.lat],
      zoom: CFG.baseZoom,
      bearing: 0,
      pitch: 0,
      interactive: false,        // the game owns the camera
      attributionControl: false, // added explicitly below so OSM credit is guaranteed
      fadeDuration: 0
    });

    // Map data is OpenStreetMap, served via OpenFreeMap/OpenMapTiles — credit required.
    map.addControl(new maplibregl.AttributionControl({
      compact: true,
      customAttribution: '© OpenStreetMap contributors · © OpenMapTiles · OpenFreeMap'
    }));

    var roadLayers = [];
    var buildingLayers = [], obstacles = [];   // building footprints near the car, in local metres

    var started = false, styleWatch;
    function start(){
      if (started) return;
      started = true;
      clearInterval(styleWatch);
      darkenStyle();
      ready = true;
      hideBoot();
      flash("G'day — you're cruising Adelaide CBD");
      setFps(showFps);
      setMini(miniOn);
      initFx();
      requestAnimationFrame(loop);
    }
    // Start as soon as the style is parsed instead of waiting for the first
    // paint — a backgrounded tab may never paint, and we don't need tiles drawn
    // to begin driving. Whichever trigger fires first wins (guarded by `started`).
    map.on("load", start);
    map.on("styledata", function(){ if (map.isStyleLoaded()) start(); });
    styleWatch = setInterval(function(){
      var s = map.getStyle();
      if (s && s.layers && s.layers.length) start();
    }, 200);
    map.on("error", function(e){
      var m = document.getElementById("bootmsg");
      if(m) m.textContent = "map tiles failed to load — check your connection";
      console.warn("map error", e && e.error);
    });

    // ---------- GPS minimap: a second, zoomed-out map in the top-right ----------
    var mini = new maplibregl.Map({
      container: "miniMap",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: [ORIGIN.lng, ORIGIN.lat],
      zoom: CFG.miniZoom,
      bearing: 0, pitch: 0,
      interactive: false, attributionControl: false, fadeDuration: 0
    });
    var miniReady = false, miniStyled = false;
    // Pare the minimap down to a clean roads-only GPS look (no buildings/labels) —
    // clearer at a glance and cheap to re-render.
    function styleMini(){
      if (miniStyled) return;
      var layers = (mini.getStyle() && mini.getStyle().layers) || [];
      if (!layers.length) return;
      miniStyled = true;
      layers.forEach(function(L){
        var id=L.id, sl=L["source-layer"], t=L.type;
        try{
          if (t==="background"){ mini.setPaintProperty(id,"background-color","#0b0e18"); return; }
          if (t==="symbol" || sl==="building" || sl==="poi" || sl==="housenumber"){
            mini.setLayoutProperty(id,"visibility","none"); return;
          }
          if (t==="fill"){ mini.setPaintProperty(id,"fill-color", sl==="water" ? "#0c1a2e" : "#10141f"); return; }
          if (t==="line"){
            if (sl==="transportation"){
              var c = /casing|outline/.test(id) ? "#05070d"
                    : /motorway|trunk|primary/.test(id) ? "#f2b134"
                    : /secondary|tertiary/.test(id) ? "#8893b0"
                    : "#525d7a";
              mini.setPaintProperty(id,"line-color",c);
            } else { mini.setPaintProperty(id,"line-color","#161b27"); }
          }
        }catch(_){}
      });
    }
    mini.on("load", function(){ styleMini(); miniReady = true; });
    mini.on("styledata", function(){ if (mini.isStyleLoaded()){ styleMini(); miniReady = true; } });
    mini.on("error", function(){ /* minimap is non-critical — ignore tile errors */ });

    // Recolour the (light) Liberty style into a GTA-night palette.
    function darkenStyle(){
      var layers = (map.getStyle() && map.getStyle().layers) || [];
      layers.forEach(function(L){
        var id = L.id, sl = L["source-layer"], t = L.type;
        if (sl === "building") buildingLayers.push(id);   // remember these for collision queries
        try {
          if (t === "background"){ map.setPaintProperty(id,"background-color","#0b0e18"); return; }

          if (sl === "poi" || sl === "housenumber" || sl === "aerodrome_label"){
            map.setLayoutProperty(id,"visibility","none"); return;
          }

          // drop 3D building extrusions — expensive to render and pointless at pitch 0
          if (t === "fill-extrusion"){ map.setLayoutProperty(id,"visibility","none"); return; }

          if (t === "fill"){
            if (sl === "water")            map.setPaintProperty(id,"fill-color","#0c1a2e");
            else if (sl === "building"){
              map.setPaintProperty(id,"fill-color","#1b2133");
              try{ map.setPaintProperty(id,"fill-opacity",1); }catch(_){}
              try{ map.setLayerZoomRange(id, 12, 24); }catch(_){}   // keep the flat (dark) buildings drawn at high zoom — visuals + collision
            }
            else if (sl === "park" || /park|grass|wood|forest|golf/.test(id))
                                           map.setPaintProperty(id,"fill-color","#0f1a14");
            else                           map.setPaintProperty(id,"fill-color","#10141f");
            return;
          }

          if (t === "line"){
            if (sl === "transportation"){
              roadLayers.push(id);
              var c;
              if (/casing|outline/.test(id))             c = "#05070d";
              else if (/motorway|trunk/.test(id))        c = "#f2b134";
              else if (/primary/.test(id))               c = "#d6932f";
              else if (/secondary|tertiary/.test(id))    c = "#5b6686";
              else if (/path|pedestrian|track|cycle/.test(id)) c = "#2a3140";
              else                                       c = "#3a445e";
              map.setPaintProperty(id,"line-color",c);
            } else if (sl === "waterway"){
              map.setPaintProperty(id,"line-color","#0c1a2e");
            } else if (sl === "boundary"){
              map.setPaintProperty(id,"line-color","#283050");
            } else {
              map.setPaintProperty(id,"line-color","#1c2230");
            }
            return;
          }

          if (t === "symbol"){
            // keep only street-name labels (cheap-ish); hiding the rest cuts the
            // label-placement cost MapLibre pays on every camera move
            if (sl !== "transportation_name"){ map.setLayoutProperty(id,"visibility","none"); return; }
            map.setPaintProperty(id,"text-color","#c9d2e6");
            map.setPaintProperty(id,"text-halo-color","#05070d");
            map.setPaintProperty(id,"text-halo-width",1.4);
          }
        } catch(_){ /* layer doesn't support this prop; skip */ }
      });
    }

    // ---------- collision (buildings are solid) ----------
    // Grab the building footprints currently on screen and cache their rings in
    // local metres. Called (throttled) from the loop — needs the map painted, so
    // it quietly returns nothing on a backgrounded/headless tab.
    function refreshObstacles(){
      if (!buildingLayers.length) return;
      var feats, Q = 220, cx = window.innerWidth/2, cy = window.innerHeight/2;   // scan only near the car
      try { feats = map.queryRenderedFeatures([[cx-Q,cy-Q],[cx+Q,cy+Q]], { layers: buildingLayers }); } catch(_){ return; }
      var out = [];
      for (var f=0; f<feats.length; f++){
        var g = feats[f].geometry; if(!g) continue;
        var polys = g.type==="Polygon" ? [g.coordinates]
                  : g.type==="MultiPolygon" ? g.coordinates : null;
        if(!polys) continue;
        for (var p=0; p<polys.length; p++){
          var ring = polys[p][0]; if(!ring || ring.length<4) continue;
          var flat = new Float64Array(ring.length*2);   // flat [x,y,x,y,…] — far fewer objects for the GC than {x,y} per vertex
          for (var c=0; c<ring.length; c++){
            flat[c*2]   = (ring[c][0]-ORIGIN.lng)*DEG_LNG;
            flat[c*2+1] = (ring[c][1]-ORIGIN.lat)*DEG_LAT;
          }
          out.push(flat);
        }
      }
      obstacles = out;
    }
    var obstaclePending = false;
    function scheduleObstacles(){   // run the (heavy) building query off the animation frame, in idle time
      if (obstaclePending) return;
      obstaclePending = true;
      var run = function(){ obstaclePending = false; refreshObstacles(); };
      if (window.requestIdleCallback) requestIdleCallback(run, { timeout: 180 });
      else setTimeout(run, 1);
    }

    // Model the car as two discs along its length; shove them out of any building
    // they overlap and cancel only the velocity heading into the wall, so the car
    // scrapes/slides along buildings rather than stopping dead.
    function collide(){
      var ob = obstacles; if(!ob.length) return;
      var R = CFG.carRadius, off = CFG.carLong;
      for (var pass=0; pass<3; pass++){
        var s = Math.sin(car.heading), co = Math.cos(car.heading);
        var hit = false;
        for (var di=0; di<2; di++){
          var sgn = di===0 ? 1 : -1;
          var px = car.x + s*off*sgn, py = car.y + co*off*sgn;   // this disc's centre
          for (var b=0; b<ob.length; b++){
            var r = ob[b], n = r.length>>1; if (n < 3) continue;   // r = flat [x,y,…], n vertices
            var bestD2 = Infinity, bqx = 0, bqy = 0, inside = false;
            for (var i=0, j=n-1; i<n; j=i++){
              var ix=r[i*2], iy=r[i*2+1], jx=r[j*2], jy=r[j*2+1];
              if (((iy>py)!==(jy>py)) && (px < (jx-ix)*(py-iy)/(jy-iy)+ix)) inside = !inside;
              var dx=ix-jx, dy=iy-jy, len2=dx*dx+dy*dy;
              var t = len2>1e-6 ? ((px-jx)*dx+(py-jy)*dy)/len2 : 0;
              if(t<0)t=0; else if(t>1)t=1;
              var qx=jx+t*dx, qy=jy+t*dy, ex=px-qx, ey=py-qy, dd=ex*ex+ey*ey;
              if(dd<bestD2){ bestD2=dd; bqx=qx; bqy=qy; }
            }
            var d = Math.sqrt(bestD2) || 1e-4, nx, ny, pen;
            if (inside){ nx=(bqx-px)/d; ny=(bqy-py)/d; pen=d+R; }       // eject to nearest wall + R
            else if (d < R){ nx=(px-bqx)/d; ny=(py-bqy)/d; pen=R-d; }   // push out to the wall
            else continue;
            car.x += nx*pen; car.y += ny*pen;     // translate the whole car
            px += nx*pen; py += ny*pen;           // keep this disc current for the next building
            var vn = car.vx*nx + car.vy*ny;       // velocity component heading into the wall
            if (vn < 0){ car.vx -= vn*nx; car.vy -= vn*ny; }
            hit = true;
          }
        }
        if (!hit) break;
      }
    }

    // ---------- input ----------
    var BLOCK = {ArrowUp:1,ArrowDown:1,ArrowLeft:1,ArrowRight:1," ":1};
    window.addEventListener("keydown", function(e){
      if (e.key === "Escape"){ e.preventDefault(); if (!e.repeat) toggleMenu(); return; }
      keys[e.key.toLowerCase()] = true;
      if (BLOCK[e.key]) e.preventDefault();
      if (e.key.toLowerCase() === "r") resetCar();
    }, {passive:false});
    window.addEventListener("keyup", function(e){ keys[e.key.toLowerCase()] = false; });
    window.addEventListener("blur", function(){ keys = Object.create(null); });
    window.addEventListener("resize", function(){ map.resize(); resizeFx(); });

    function resetCar(){
      car.x=0; car.y=0; car.heading=0; car.vx=0; car.vy=0; zoomBias=0;
      flash("Back to Victoria Square");
    }

    var INPUT = {};   // reused each frame so the loop allocates nothing here (less GC churn)
    function down(){
      INPUT.up   = keys["arrowup"]||keys["w"];
      INPUT.dn   = keys["arrowdown"]||keys["s"];
      INPUT.lf   = keys["arrowleft"]||keys["a"];
      INPUT.rt   = keys["arrowright"]||keys["d"];
      INPUT.hand = keys[" "]||keys["spacebar"]||keys["shift"];
      INPUT.zin  = keys["="]||keys["+"]||keys["add"];
      INPUT.zout = keys["-"]||keys["_"]||keys["subtract"];
      return INPUT;
    }

    // ---------- FPS counter + Esc menu ----------
    var paused = false, showFps = true, miniOn = true;
    var emaMs = 1000/120, minFps = 999, fpsT = 0;
    var fpsEl, menuEl, fpsStateEl;

    function updateFps(){
      if (!fpsEl) fpsEl = document.getElementById("fps");
      if (fpsEl) fpsEl.innerHTML =
        "<b>" + Math.round(1000/emaMs) + "</b> FPS<span>min " + Math.round(minFps) + " · " + emaMs.toFixed(1) + " ms</span>";
    }
    function setFps(on){
      showFps = on;
      if (!fpsEl) fpsEl = document.getElementById("fps");
      if (fpsEl) fpsEl.style.display = on ? "block" : "none";
      if (!fpsStateEl) fpsStateEl = document.getElementById("fpsState");
      if (fpsStateEl) fpsStateEl.textContent = on ? "ON" : "OFF";
    }
    function setMini(on){
      miniOn = on;
      var el = document.getElementById("minimap"); if (el) el.style.display = on ? "block" : "none";
      var st = document.getElementById("miniState"); if (st) st.textContent = on ? "ON" : "OFF";
    }
    function toggleMenu(open){
      if (!menuEl) menuEl = document.getElementById("menu");
      paused = (open === undefined) ? !paused : open;
      if (menuEl) menuEl.style.display = paused ? "flex" : "none";
      if (paused) keys = Object.create(null);   // forget held keys so we don't lurch on resume
    }
    document.getElementById("menu").addEventListener("click", function(e){
      var btn = e.target.closest && e.target.closest("[data-act]"); if (!btn) return;
      var act = btn.getAttribute("data-act");
      if (act === "resume") toggleMenu(false);
      else if (act === "fps") setFps(!showFps);
      else if (act === "mini") setMini(!miniOn);
      else if (act === "reset"){ resetCar(); toggleMenu(false); }
    });

    // ---------- speed FX: a cheap "motion blur" — velocity-aligned streaks + a
    // tunnel vignette that fade in with speed, to mask the strobing of fast motion ----------
    var fxCanvas, fxCtx, fxSeeds, fxActive = false;
    function resizeFx(){ if (fxCanvas){ fxCanvas.width = window.innerWidth; fxCanvas.height = window.innerHeight; } } // dpr 1 = cheap to clear
    function initFx(){
      fxCanvas = document.getElementById("fx"); if (!fxCanvas) return;
      fxCtx = fxCanvas.getContext("2d");
      resizeFx();
      fxSeeds = [];   // fixed streak anchor points (edge-biased, centre kept clear) so streaks don't flicker
      for (var i=0;i<64;i++){
        var ang = Math.random()*6.2832, rad = 0.42 + Math.random()*0.58;
        fxSeeds.push({ x:0.5 + Math.cos(ang)*rad*0.6, y:0.5 + Math.sin(ang)*rad*0.6 });
      }
    }
    function clearFx(){ if (fxCtx) fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height); }
    function drawFx(speed, vx, vy){
      if (!fxCtx) return;
      fxActive = true;
      var W=fxCanvas.width, H=fxCanvas.height;
      fxCtx.clearRect(0,0,W,H);
      var t = (speed - CFG.fxMinSpeed) / (CFG.maxSpeed - CFG.fxMinSpeed);
      if (t < 0) t = 0; else if (t > 1) t = 1;
      // tunnel vignette — darken the edges more the faster you go
      var g = fxCtx.createRadialGradient(W/2,H/2, Math.min(W,H)*0.30, W/2,H/2, Math.max(W,H)*0.62);
      g.addColorStop(0,"rgba(0,0,0,0)");
      g.addColorStop(1,"rgba(0,0,0,"+(0.40*t).toFixed(3)+")");
      fxCtx.fillStyle = g; fxCtx.fillRect(0,0,W,H);
      // streaks along the travel axis (north-up: world +y maps to screen up)
      var sp = Math.sqrt(vx*vx+vy*vy) || 1, dx = vx/sp, dy = -vy/sp, len = 16 + 95*t;
      fxCtx.strokeStyle = "rgba(205,232,255,"+(0.05 + 0.16*t).toFixed(3)+")";
      fxCtx.lineWidth = 1.2;
      fxCtx.beginPath();
      for (var i=0;i<fxSeeds.length;i++){
        var sx=fxSeeds[i].x*W, sy=fxSeeds[i].y*H;
        fxCtx.moveTo(sx, sy); fxCtx.lineTo(sx - dx*len, sy - dy*len);
      }
      fxCtx.stroke();
    }

    // ---------- game loop ----------
    var last = 0, streetT = 0, qT = 0, lastQX = 1e9, lastQY = 1e9, miniT = 0;
    var carEl, kmhEl, gearEl, miniCarEl;
    var prev = { lng:ORIGIN.lng, lat:ORIGIN.lat, zoom:CFG.baseZoom, carT:"", kmh:-1, gear:"" };

    // one physics tick — arcade drift model. Velocity is a world vector; tyres
    // normally bite (sideways slide is killed fast) but the handbrake breaks the
    // rear loose so the car drifts, then grips again when released.
    function stepPhysics(k, dt){
      var sinH = Math.sin(car.heading), cosH = Math.cos(car.heading);
      var fx = sinH, fy = cosH;     // forward unit vector (heading 0 = north/up, +CW)
      var rx = cosH, ry = -sinH;    // rightward unit vector

      // split world velocity into forward + sideways components
      var fwd = car.vx*fx + car.vy*fy;
      var lat = car.vx*rx + car.vy*ry;

      // longitudinal: throttle / brake / reverse
      if (k.up)      fwd += CFG.accel * dt;
      else if (k.dn){
        if (fwd > 0.5) fwd -= CFG.brake * dt;            // braking
        else           fwd -= CFG.accel * 0.7 * dt;      // reverse
      }
      fwd -= fwd * CFG.drag * dt;                        // drag
      if (fwd > 0)      fwd = Math.max(0, fwd - CFG.roll*dt);   // roll to a stop
      else if (fwd < 0) fwd = Math.min(0, fwd + CFG.roll*dt);
      fwd = Math.max(-CFG.reverseMax, Math.min(CFG.maxSpeed, fwd));

      // lateral grip — the drift knob. Handbrake swaps in low grip so the back
      // end slides; it also scrubs a little forward speed (locked rears).
      var grip = k.hand ? CFG.gripSlide : CFG.gripRoad;
      lat *= Math.exp(-grip * dt);
      if (k.hand) fwd -= fwd * CFG.handDrag * dt;

      // rebuild world velocity from the (possibly slipping) components
      car.vx = fx*fwd + rx*lat;
      car.vy = fy*fwd + ry*lat;

      // steering: needs speed (can't pivot parked), eased at the top end, and
      // sharper on the handbrake to kick the tail out
      var spd = Math.sqrt(car.vx*car.vx + car.vy*car.vy);
      var eff = Math.max(-1, Math.min(1, fwd / CFG.grip));
      var hi  = 1 - 0.45 * Math.min(1, spd / CFG.maxSpeed);
      var hb  = k.hand ? CFG.handSteer : 1;
      var steer = (k.lf?-1:0) + (k.rt?1:0);
      car.heading += steer * CFG.turn * eff * hi * hb * dt;

      // integrate position, then resolve building collisions
      car.x += car.vx * dt;
      car.y += car.vy * dt;
      collide();
    }

    function loop(ts){
      requestAnimationFrame(loop);
      if (!last){ last = ts; return; }
      var rawMs = ts - last;
      var dt = Math.min(rawMs/1000, 0.05);
      last = ts;

      // FPS measurement: smoothed average + worst single frame in the last 0.5s
      emaMs = emaMs*0.9 + rawMs*0.1;
      if (rawMs > 0){ var ifps = 1000/rawMs; if (ifps < minFps) minFps = ifps; }
      fpsT += rawMs;
      if (fpsT >= 500){ if (showFps) updateFps(); minFps = 999; fpsT = 0; }

      if (!ready || paused) return;   // paused: freeze the sim but keep rAF + the counter alive

      var k = down();
      stepPhysics(k, dt);

      // manual zoom only — the camera holds a tight chase zoom and never auto-pulls out
      if (k.zin)  zoomBias = Math.min(CFG.zoomMax-CFG.baseZoom, zoomBias + 1.2*dt);
      if (k.zout) zoomBias = Math.max(CFG.zoomMin-CFG.baseZoom, zoomBias - 1.2*dt);
      var targetZoom = CFG.baseZoom + zoomBias;
      viewZoom += (targetZoom - viewZoom) * Math.min(1, dt*6);
      var zoom = viewZoom;

      // drive the camera + sprite — only when something actually moved, so a
      // parked car stops hammering the GPU with redundant repaints every frame
      if (!carEl){ carEl=document.getElementById("car"); kmhEl=document.getElementById("kmh"); gearEl=document.getElementById("gear"); miniCarEl=document.getElementById("miniCar"); }
      var ll = toLngLat();
      if (Math.abs(ll[0]-prev.lng)>1e-7 || Math.abs(ll[1]-prev.lat)>1e-7 || Math.abs(zoom-prev.zoom)>1e-3){
        map.jumpTo({ center: ll, zoom: zoom, bearing: 0 });
        prev.lng=ll[0]; prev.lat=ll[1]; prev.zoom=zoom;
      }
      // sprite rotates with heading and shrinks a little when zoomed out, so it
      // stays a sensible marker in scout mode rather than a giant block
      var carScale = Math.max(0.5, Math.min(1, Math.pow(2, viewZoom - CFG.baseZoom)));
      var carT = "translate(-50%,-50%) rotate(" + (car.heading*180/Math.PI).toFixed(2) + "deg) scale(" + carScale.toFixed(3) + ")";
      if (carT !== prev.carT){ carEl.style.transform = carT; prev.carT = carT; }

      // GPS minimap follows the car (throttled ~10fps — it's an overview, not a 60fps view)
      miniT += dt;
      if (miniReady && miniOn && miniT > 0.1){
        miniT = 0;
        mini.jumpTo({ center: ll, zoom: CFG.miniZoom, bearing: 0 });
        if (miniCarEl) miniCarEl.style.transform = "translate(-50%,-50%) rotate(" + (car.heading*180/Math.PI).toFixed(1) + "deg)";
      }

      // HUD — speed is the velocity magnitude; gear from the forward component
      var speed = Math.sqrt(car.vx*car.vx + car.vy*car.vy);
      var fwdSpeed = car.vx*Math.sin(car.heading) + car.vy*Math.cos(car.heading);
      var kmh = Math.round(speed*3.6);
      if (kmh!==prev.kmh){ kmhEl.textContent=kmh; prev.kmh=kmh; }
      var gear = fwdSpeed < -0.5 ? "R" : "D";
      if (gear!==prev.gear){ gearEl.textContent=gear; prev.gear=gear; }

      // speed FX (fake motion blur) — only runs when moving quickly
      if (speed > CFG.fxMinSpeed) drawFx(speed, car.vx, car.vy);
      else if (fxActive){ clearFx(); fxActive = false; }

      // street name (best-effort, throttled)
      streetT += dt;
      if (streetT > 0.35){ streetT = 0; updateStreet(); }

      // refresh nearby building obstacles for collision (throttled by time + distance)
      qT += dt;
      if (qT > 0.25 || Math.abs(car.x-lastQX)+Math.abs(car.y-lastQY) > 30){
        qT = 0; lastQX = car.x; lastQY = car.y; scheduleObstacles();
      }
    }

    var lastStreet = "";
    function updateStreet(){
      if (!roadLayers.length) return;
      var c = { x: window.innerWidth/2, y: window.innerHeight/2 };
      var box = [[c.x-6,c.y-6],[c.x+6,c.y+6]];
      var feats = [];
      try { feats = map.queryRenderedFeatures(box, { layers: roadLayers }); } catch(_){ return; }
      var name = "";
      for (var i=0;i<feats.length;i++){
        var p = feats[i].properties||{};
        if (p.name){ name = p.name; break; }
      }
      if (name && name !== lastStreet){
        lastStreet = name;
        var el = document.getElementById("street");
        el.textContent = name;
        el.style.opacity = 1;
      } else if (!name && lastStreet){
        document.getElementById("street").style.opacity = 0;
        lastStreet = "";
      }
    }

    // ---------- ui helpers ----------
    var noticeTimer;
    function flash(msg){
      var n = document.getElementById("notice");
      n.textContent = msg; n.style.opacity = 1;
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(function(){ n.style.opacity = 0; }, 2600);
    }
    function hideBoot(){
      var b = document.getElementById("boot");
      b.classList.add("hide");
      setTimeout(function(){ b.style.display="none"; }, 700);
    }

    // safety net: never let the boot screen hang forever
    setTimeout(function(){ if(!ready){ hideBoot(); } }, 9000);
  })();
  </script>
</body>
</html>
